// SyncDeviceGroupV1 maps `models.OCSFGroup` (`groups[]`).
message SyncDeviceGroupV1 {
  // Group UID (`uid`).
  string uid = 1;
  // Group name (`name`).
  string name = 2;
  // Group type (`type`).
  string type = 3;
  // Group description (`desc`).
  string desc = 4;
