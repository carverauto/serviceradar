syntax = "proto3";

package serviceradar.edge.v1;

option go_package = "github.com/carverauto/serviceradar/proto/edge/v1;edgev1";

// WorkloadIdentitySnapshotV1 mirrors Snapshot in
// rust/workload-identity/src/bin/workload-identity.rs, forwarded by
// go/pkg/agent/push_loop_workload_identity.go (service_name and service_type
// "workload-identity") and ingested by ServiceRadar.WorkloadIdentity
// (elixir/serviceradar_core/lib/serviceradar/workload_identity.ex).
message WorkloadIdentitySnapshotV1 {
  int64 observed_at_unix_nano = 1;
  bool enabled = 2;
  WorkloadIdentitySnapshotEndpointV1 endpoint = 3;
  uint32 count = 4;
  repeated WorkloadIdentityContainerLookupV1 identities = 5;
  string degradation_reason = 6;
  string context_name = 7;
  string cluster_id = 8;
  string cluster_name = 9;
}

// WorkloadIdentitySnapshotEndpointV1 mirrors SnapshotEndpoint in
// rust/workload-identity/src/bin/workload-identity.rs together with
// CriEndpoint / DockerEndpoint in rust/workload-identity/src/lib.rs.
// In JSON, SnapshotEndpoint is tagged by "type" ("Cri" or "Docker") with
// content "endpoint" carrying "path" and "source" ("Explicit", "CommonPath",
// or {"ConfigFile": "<config_file_path>"}).
message WorkloadIdentitySnapshotEndpointV1 {
  string type = 1;
  string path = 2;
  string source = 3;
  string config_file_path = 4;
}

// WorkloadIdentityContainerLookupV1 mirrors CriContainerLookup in
// rust/workload-identity/src/lib.rs and row_from_lookup/8 in
// ServiceRadar.WorkloadIdentity.
message WorkloadIdentityContainerLookupV1 {
  string container_id = 1;
  WorkloadIdentityRecordV1 identity = 2;
}

// WorkloadIdentityRecordV1 mirrors WorkloadIdentity in
// rust/workload-identity/src/lib.rs and row_from_lookup/8 in
// ServiceRadar.WorkloadIdentity.
message WorkloadIdentityRecordV1 {
  string pod_sandbox_id = 1;
  string pod_name = 2;
  string pod_namespace = 3;
  string pod_uid = 4;
  string container_id = 5;
  string container_name = 6;
  string image = 7;
  string image_ref = 8;
  uint32 runtime_pid = 9;
  bool has_runtime_pid = 10;
  string cgroup_path = 11;
  map<string, string> labels = 12;
  map<string, string> annotations = 13;
  string runtime_source = 14;
  string confidence = 15;
  string degradation_reason = 16;
}
