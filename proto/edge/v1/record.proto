syntax = "proto3";

// Producer-neutral durable edge record plane (unify-sweep-results-proto).
//
// EdgeRecordV1 is the immutable semantic record the trusted agent sink encodes
// once from a producer's canonical domain body. EdgeDeliveryFrameV1 is an
// edge-only wrapper carrying mutable spool/delivery coordinates and the exact,
// unchanged EdgeRecordV1 bytes (record_bytes). JetStream stores those exact
// bytes; the gateway never publishes only the inner domain payload and never
// reconstructs semantic/authorization/cost identity as NATS headers.
//
// The record plane is NOT sweep-specific: framing/lifecycle is a bounded payload
// family, and semantic type + projection come from the exact output-contract
// bundle. Topology (route profile, traffic class, lane) is finite and platform-
// owned; it never grows with payload kind, package, plugin, or contract.
package serviceradar.edge.v1;

option go_package = "github.com/carverauto/serviceradar/proto/edge/v1;edgev1";

// ---------------------------------------------------------------------------
// Framing, routing, and authority enums (finite, platform-owned)
// ---------------------------------------------------------------------------

// EdgeRecordPayloadFamily is framing/lifecycle only. Adding a third-party output
// contract does NOT add an enum value here; semantic type comes from the bundle.
enum EdgeRecordPayloadFamily {
  EDGE_RECORD_PAYLOAD_FAMILY_UNSPECIFIED = 0;
  EDGE_RECORD_PAYLOAD_FAMILY_RECORD_BATCH_V1 = 1;
  EDGE_RECORD_PAYLOAD_FAMILY_RUN_EVENT_V1 = 2;
  EDGE_RECORD_PAYLOAD_FAMILY_SNAPSHOT_PAGE_V1 = 3;
  EDGE_RECORD_PAYLOAD_FAMILY_SNAPSHOT_TERMINAL_V1 = 4;
  EDGE_RECORD_PAYLOAD_FAMILY_RECOVERY_CONTROL_V1 = 5;
}

enum EdgeRecordCompression {
  EDGE_RECORD_COMPRESSION_UNSPECIFIED = 0;
  EDGE_RECORD_COMPRESSION_NONE = 1;
  EDGE_RECORD_COMPRESSION_ZSTD = 2;
}

// EdgeRecordTrafficClass comes from an effective control-plane grant. It is not
// caller-selected and is not sweep-specific.
enum EdgeRecordTrafficClass {
  EDGE_RECORD_TRAFFIC_CLASS_UNSPECIFIED = 0;
  EDGE_RECORD_TRAFFIC_CLASS_BULK = 1;
  EDGE_RECORD_TRAFFIC_CLASS_INTERACTIVE = 2;
}

// EdgeRecordRouteProfile is a finite platform deployment value, never a
// package-defined semantic type. V1 begins with DURABLE_RECORDS_V1; another
// profile requires an explicit benchmarked platform change.
enum EdgeRecordRouteProfile {
  EDGE_RECORD_ROUTE_PROFILE_UNSPECIFIED = 0;
  EDGE_RECORD_ROUTE_PROFILE_DURABLE_RECORDS_V1 = 1;
  EDGE_RECORD_ROUTE_PROFILE_CONTINUOUS_V1 = 2;
  EDGE_RECORD_ROUTE_PROFILE_RECOVERY_CONTROL_V1 = 3;
}

// EdgeOriginKind is the ingress-attested origin of a record, never caller truth.
enum EdgeOriginKind {
  EDGE_ORIGIN_KIND_UNSPECIFIED = 0;
  EDGE_ORIGIN_KIND_AGENT = 1;
  EDGE_ORIGIN_KIND_CLUSTER_SERVICE = 2;
}

// EdgeSourceAuthorizationKind names the kind of a source action whose authority
// a record carries. It mirrors the producing SweepExecutionSource plus the
// non-sweep integration/recovery actions. A passive producer-assignment record
// has NO source authorization; its absence is explicit (the optional
// source_authorization field is unset).
enum EdgeSourceAuthorizationKind {
  EDGE_SOURCE_AUTHORIZATION_KIND_UNSPECIFIED = 0;
  EDGE_SOURCE_AUTHORIZATION_KIND_SCHEDULED_SWEEP = 1;
  EDGE_SOURCE_AUTHORIZATION_KIND_SWEEP_PROFILE = 2;
  EDGE_SOURCE_AUTHORIZATION_KIND_SCHEDULED_CHECK = 3;
  EDGE_SOURCE_AUTHORIZATION_KIND_AD_HOC = 4;
  EDGE_SOURCE_AUTHORIZATION_KIND_ON_DEMAND = 5;
  EDGE_SOURCE_AUTHORIZATION_KIND_INTEGRATION_RUN = 6;
  EDGE_SOURCE_AUTHORIZATION_KIND_RECOVERY_CONTROL = 7;
}

// ---------------------------------------------------------------------------
// Signed capability envelope: domain-separated, typed, role-bound claims
// ---------------------------------------------------------------------------

// Typed claim bodies. Each capability carries exactly one, and its variant is
// the capability's role (purpose) -- so a production grant can never be replayed
// as source or delivery authority. The signature covers the role tag + claims.

// EdgeProductionClaimsV1 authorizes a specific attested producer to emit a
// specific output contract at a bounded cost. Every field here is compared to
// the record's attested producer_context / output_contract by
// validateProductionCapability, so a grant issued for one assignment, instance,
// run, fence epoch, package, or cost ceiling cannot be replayed with another.
message EdgeProductionClaimsV1 {
  string contract_id = 1;
  uint32 contract_version = 2;
  bytes contract_bundle_sha256 = 3;
  uint64 registry_epoch = 4;
  bytes network_scope_id = 5;
  bytes producer_assignment_id = 6;
  EdgeRecordTrafficClass traffic_class = 7;
  EdgeRecordRouteProfile route_profile = 8;
  // Attested producer identity the grant is bound to (== producer_context).
  EdgeOriginKind origin_kind = 9;
  bytes origin_principal_id = 10;
  bytes producer_instance_id = 11;
  bytes run_id = 12;
  uint32 run_shard = 13;
  uint64 authority_epoch = 14;              // fence generation; monotonic
  bytes scope_id = 15;
  bytes scope_sha256 = 16;
  bytes package_sha256 = 17;
  // Bundle-registry snapshot the grant was computed against (== output_contract).
  bytes registry_snapshot_sha256 = 18;
  bytes effective_grant_sha256 = 19;
  // Conservative cost ceiling; record projected_* MUST NOT exceed these.
  uint32 max_projected_row_count = 20;
  uint64 max_projected_write_bytes = 21;
  uint32 cost_model_version = 22;           // MUST equal the record's
  string package_id = 23;                   // == producer_context.package_id
}

// EdgeSourceClaimsV1 authorizes a specific attested producer to run a source
// action (scan/check/command/run/recovery) over a bound context and coverage
// scope for a collection window. The agent/assignment/run/shard/epoch and
// traffic class are bound so collection authority cannot be moved to another
// producer or lane; plan/range digests bind the authorized work.
message EdgeSourceClaimsV1 {
  EdgeSourceAuthorizationKind kind = 1;
  bytes context_id = 2;                    // UUID: check/command/run/recovery id
  bytes scope_id = 3;                      // target/coverage scope id (UUID)
  bytes scope_sha256 = 4;                  // digest of the authorized scope/range
  bytes network_scope_id = 5;
  int64 collection_not_before_unix_nano = 6;
  int64 collection_expires_unix_nano = 7;  // MUST be > not_before
  // Attested producer identity the collection authority is bound to.
  bytes origin_principal_id = 8;
  bytes producer_instance_id = 9;
  bytes producer_assignment_id = 10;
  bytes run_id = 11;
  uint32 run_shard = 12;
  uint64 authority_epoch = 13;
  EdgeRecordTrafficClass traffic_class = 14;
  EdgeRecordRouteProfile route_profile = 15;
  bytes execution_plan_sha256 = 16;        // authorized plan (empty if N/A)
  bytes target_range_sha256 = 17;          // authorized range (empty if N/A)
  EdgeOriginKind origin_kind = 18;         // == producer_context.origin_kind
}

// EdgeDeliveryClaimsV1 authorizes draining one immutable record's bytes on an
// exact delivery coordinate. It is event/checksum bound so it cannot relax the
// original collection-time decision. The transition oneof distinguishes the two
// legitimate reasons a delivery grant is re-issued: an ordinary same-spool
// RENEWAL (a collection lease expired before publication) versus a spool
// ROLLOVER after loss. A renewal cannot masquerade as a rollover or vice versa.
message EdgeDeliveryClaimsV1 {
  bytes event_id = 1;                      // exact record it may deliver
  bytes record_sha256 = 2;                 // exact record bytes it may deliver
  bytes spool_id = 3;                      // spool it drains on (== frame spool_id)
  uint64 sequence = 4;                     // exact sequence (== frame sequence)
  oneof transition {
    EdgeDeliveryRenewalV1 renewal = 5;     // same-spool lease renewal
    EdgeDeliveryRolloverV1 rollover = 6;   // recovery rollover to a new spool
  }
}

// EdgeDeliveryRenewalV1 is an ordinary same-spool reauthorization (e.g. the
// original collection lease expired before the record was published). The spool
// and sequence are unchanged; no rollover coordinate exists.
message EdgeDeliveryRenewalV1 {
  int64 renewed_not_before_unix_nano = 1;
  int64 renewed_expires_unix_nano = 2;     // MUST be > not_before
}

// EdgeDeliveryRolloverV1 binds the COMPLETE old and new coordinate of a recovery
// rollover: the recovery id, the prior spool, and the prior sequence the record
// occupied on it.
message EdgeDeliveryRolloverV1 {
  bytes recovery_id = 1;                   // rollover this drain belongs to
  bytes prior_spool_id = 2;                // old spool being recovered from
  uint64 prior_sequence = 3;               // old sequence on the prior spool
}

// EdgeCapabilityPurpose is the role a capability may fill. It equals the set
// claims variant and is bound into the signing input.
enum EdgeCapabilityPurpose {
  EDGE_CAPABILITY_PURPOSE_UNSPECIFIED = 0;
  EDGE_CAPABILITY_PURPOSE_PRODUCTION = 1;
  EDGE_CAPABILITY_PURPOSE_SOURCE = 2;
  EDGE_CAPABILITY_PURPOSE_DELIVERY = 3;
}

// EdgeSignedCapabilityV1 is the shared wire format for every load-bearing signed
// capability. The signature covers a field-framed signing preimage: domain ||
// version || issuer_id || issuer_key_id || algorithm || purpose || not_before ||
// expires || a u64 claims-oneof discriminant (the set member's field number) ||
// that claim framed field-by-field. Every field is length-prefixed or fixed-width
// in a frozen order; NO protobuf serialization appears in the preimage at any depth
// (protobuf has no canonical wire form). The typed claims oneof both carries the
// authorized values AND fixes the capability's role, so a production grant can never
// be presented in a source or delivery position.
message EdgeSignedCapabilityV1 {
  uint32 capability_version = 1;       // MUST be a known version (>= 1)
  bytes issuer_id = 2;                 // issuer identity (distinct from key id)
  bytes issuer_key_id = 3;             // selects the verifying key (rotation)
  string algorithm = 4;               // verifier rejects an unknown algorithm
  int64 not_before_unix_nano = 5;      // MUST be <= expires
  int64 expires_at_unix_nano = 6;      // MUST be > not_before
  oneof claims {
    EdgeProductionClaimsV1 production = 7;
    EdgeSourceClaimsV1 source = 8;
    EdgeDeliveryClaimsV1 delivery = 9;
  }
  bytes signature = 10;               // over the canonical signing bytes
}

// EdgeSourceAuthorizationV1 is the explicit typed authority for a source action.
// Its outer kind/context/scope MUST equal the values inside its signed source
// claims, so no unsigned outer value can widen authority. A passive
// producer-assignment record omits this entirely.
message EdgeSourceAuthorizationV1 {
  EdgeSourceAuthorizationKind kind = 1;
  EdgeSignedCapabilityV1 capability = 2;   // MUST carry EdgeSourceClaimsV1
  bytes context_id = 3;                    // MUST equal source claims context_id
  bytes scope_id = 4;                      // MUST equal source claims scope_id
  bytes scope_sha256 = 5;                  // MUST equal source claims scope_sha256
}

// ---------------------------------------------------------------------------
// Output contract reference and producer context
// ---------------------------------------------------------------------------

// EdgeOutputContractRef binds a record to a complete immutable contract bundle.
// EventWriter dispatches by exact (contract_id, contract_version,
// contract_bundle_sha256, registry_epoch); a package cannot choose subjects,
// streams, consumers, tables, or processors.
message EdgeOutputContractRef {
  string contract_id = 1;            // globally namespaced, approval-owned
  uint32 contract_version = 2;       // MUST be >= 1
  bytes contract_bundle_sha256 = 3;  // full immutable semantic/processing bundle
  uint64 registry_epoch = 4;         // MUST be >= 1
  bytes registry_snapshot_sha256 = 5;
  bytes effective_grant_sha256 = 6;
}

// EdgeProducerContext is the host-attested producer provenance. Caller-selected
// identifiers never create identity/capability/routing/quota namespaces.
message EdgeProducerContext {
  EdgeOriginKind origin_kind = 1;    // MUST NOT be UNSPECIFIED
  bytes origin_principal_id = 2;     // gateway/direct-ingress attested
  bytes producer_instance_id = 3;
  bytes producer_assignment_id = 4;
  bytes run_id = 5;
  uint32 run_shard = 6;
  optional uint64 authority_epoch = 7;  // presence distinguishes absent from 0
  bytes scope_id = 8;
  bytes scope_sha256 = 9;
  string package_id = 10;
  bytes package_sha256 = 11;
}

// ---------------------------------------------------------------------------
// Immutable semantic record
// ---------------------------------------------------------------------------

// EdgeRecordV1 is the immutable semantic record. The sink encodes it once with
// deterministic marshaling and its exact bytes are what JetStream stores.
// semantic_envelope_sha256 covers every semantic/trust field plus the exact
// payload digest, EXCLUDING itself and all delivery state.
message EdgeRecordV1 {
  bytes event_id = 1;                  // stable UUIDv7 across every semantic retry
  EdgeRecordPayloadFamily payload_family = 2;
  EdgeRecordCompression compression = 3;
  uint32 encoded_size = 4;             // MUST equal len(payload)
  uint32 uncompressed_size = 5;        // NONE: == encoded_size; ZSTD: decoded size
  bytes payload_sha256 = 6;            // SHA-256 of exact encoded body (payload)
  EdgeOutputContractRef output_contract = 7;
  EdgeProducerContext producer_context = 8;
  EdgeRecordRouteProfile route_profile = 9;
  EdgeRecordTrafficClass traffic_class = 10;
  bytes network_scope_id = 11;         // authoritative signed site/address namespace
  EdgeSignedCapabilityV1 production_capability = 12; // signed effective output grant
  optional EdgeSourceAuthorizationV1 source_authorization = 13; // absent = passive output
  uint32 projected_row_count = 14;     // trusted conservative upper bound
  uint64 projected_write_bytes = 15;   // trusted SQL/index/WAL upper bound
  uint32 cost_model_version = 16;      // MUST be >= 1
  bytes semantic_envelope_sha256 = 17; // excludes this field and all delivery state
  bytes payload = 18;                  // exact canonical contract bytes
}

// ---------------------------------------------------------------------------
// Delivery wrapper (mutable spool/delivery state, unchanged record_bytes)
// ---------------------------------------------------------------------------

// EdgeDeliveryFrameV1 is the edge-only wrapper. Recovery/reauthorization creates
// a NEW frame around the SAME record_bytes: only these coordinates and the
// optional renewable delivery_capability change. Route profile and traffic class
// are NOT duplicated here as mutable wrapper authority -- they live in the record
// and the lane is negotiated by the RPC session.
message EdgeDeliveryFrameV1 {
  bytes spool_id = 1;                  // persistent UUIDv7 for one delivery lane
  uint64 sequence = 2;                 // persistent, strictly increasing per lane
  bytes record_sha256 = 3;             // SHA-256 of the exact record_bytes below
  optional EdgeSignedCapabilityV1 delivery_capability = 4; // renewable drain authority
  bytes record_bytes = 5;              // exact deterministic EdgeRecordV1 bytes
}

// ---------------------------------------------------------------------------
// Dispositions and cumulative acknowledgement
// ---------------------------------------------------------------------------

// EdgeRecordDispositionKind is the terminal outcome the gateway reports per
// sequence. FOUR kinds RESOLVE the spool slot (each only after its required
// destination PubAck): accepted-authoritative (primary stream), accepted-audit-only
// (audit stream), accepted-quarantine (quarantine DLQ), and rejected-permanent
// (reject-audit DLQ). ONLY rejected-retryable stays unresolved and MUST NOT advance
// the resolved prefix. Spool-resolution eligibility derives from `kind` ALONE.
enum EdgeRecordDispositionKind {
  EDGE_RECORD_DISPOSITION_KIND_UNSPECIFIED = 0;
  EDGE_RECORD_DISPOSITION_KIND_ACCEPTED_AUTHORITATIVE = 1; // primary stream; resolves
  EDGE_RECORD_DISPOSITION_KIND_ACCEPTED_AUDIT_ONLY = 2;    // audit stream; resolves
  EDGE_RECORD_DISPOSITION_KIND_ACCEPTED_QUARANTINE = 3;    // quarantine DLQ; resolves
  EDGE_RECORD_DISPOSITION_KIND_REJECTED_PERMANENT = 4;     // reject-audit DLQ; resolves
  EDGE_RECORD_DISPOSITION_KIND_REJECTED_RETRYABLE = 5;     // transient; NEVER resolves
}

message EdgeRecordDisposition {
  uint64 sequence = 1;
  // The event this disposition resolves. Present (16-byte UUID, == the transmitted
  // event) for any accept and for a rejection made AFTER decode. MAY be absent ONLY
  // for a rejection the gateway made BEFORE record decode (oversize/undecodable
  // frame), which cannot read the inner id -- that disposition binds solely to the
  // authenticated session/spool/sequence.
  bytes event_id = 2;
  EdgeRecordDispositionKind kind = 3; // spool-resolution eligibility derives from kind ALONE
  string rejection_code = 4;          // human/audit annotation only; never keys watermark logic
}

// EdgeDeliveryAckV1 is the cumulative gateway->agent disposition report over one
// lane. resolved_through_sequence advances only across a contiguous run whose
// members each earned an authoritative PubAck (primary or audit/DLQ).
// session_nonce and spool_id bind the ack; the agent ignores an ack whose nonce
// or spool does not match its active session.
message EdgeDeliveryAckV1 {
  bytes spool_id = 1;
  uint64 resolved_through_sequence = 2;
  repeated EdgeRecordDisposition dispositions = 3;
  bytes session_nonce = 4;
}

// ---------------------------------------------------------------------------
// Generic lane/session handshake (route-profile + class, not payload kind)
// ---------------------------------------------------------------------------

// EdgeRecordLaneOpen is the agent's opening handshake for a delivery lane. A lane
// is one (route_profile, traffic_class) pair -- never keyed by output contract,
// payload kind, or package. session_nonce fences this sender session. Every
// record delivered on this lane MUST declare the same route_profile and
// traffic_class (enforced by ValidateFrameForSession).
message EdgeRecordLaneOpen {
  EdgeRecordRouteProfile route_profile = 1;
  EdgeRecordTrafficClass traffic_class = 2;
  bytes spool_id = 3;
  uint64 sequence_base = 4;               // MUST be 1
  uint64 first_unresolved_sequence = 5;
  bytes session_nonce = 6;                // fresh random per session
  uint64 requested_byte_credits = 7;
  uint32 requested_frame_credits = 8;
}

message EdgeRecordLaneOpenAck {
  bytes spool_id = 1;
  bytes session_nonce = 2;                // echoes EdgeRecordLaneOpen.session_nonce
  uint64 granted_byte_credits = 3;
  uint32 granted_frame_credits = 4;
  EdgeRecordRouteProfile route_profile = 5;
  EdgeRecordTrafficClass traffic_class = 6;
}

// ---------------------------------------------------------------------------
// Bounded recovery / spool-loss contracts
// ---------------------------------------------------------------------------

// EdgeLostRangeV1 is one contiguous run of lost spool sequences, inclusive
// (from_sequence <= through_sequence). Ranges within a page are ordered and
// non-overlapping.
message EdgeLostRangeV1 {
  uint64 from_sequence = 1;
  uint64 through_sequence = 2;
}

// EdgeAffectedScopeV1 binds a covered lost sequence interval to the semantic
// work it carried, so the recovery consumer can partialize/fence/reschedule the
// exact assignments, runs, shards, and ranges -- a finite lane interleaves many
// producers/executions, so a delivery interval alone is not enough. When exact
// detail exceeds the hard manifest budget, coarsened=true marks a conservative
// superset scope.
message EdgeAffectedScopeV1 {
  uint64 from_sequence = 1;
  uint64 through_sequence = 2;
  bytes contract_bundle_sha256 = 3;
  bytes producer_assignment_id = 4;
  bytes run_id = 5;
  uint32 run_shard = 6;
  uint64 authority_epoch = 7;
  bytes scope_sha256 = 8;
  bytes range_sha256 = 9;
  bool coarsened = 10;
}

// EdgeLossManifestPageV1 is one bounded, chained page of a spool-loss manifest.
// page_sha256 is the canonical digest over EVERY field of this message except
// page_sha256 itself (recovery id, index/count, predecessor hash, terminal +
// coarsened state, digest version, lost ranges, and affected scopes), so a
// contradictory page cannot masquerade as a valid one. Pages chain via
// prev_page_sha256 (empty on page 0) and compose into the ordered manifest root.
message EdgeLossManifestPageV1 {
  bytes recovery_id = 1;             // UUIDv7, matches the tombstone
  uint32 page_index = 2;             // 0-based, < page_count
  uint32 page_count = 3;
  bytes prev_page_sha256 = 4;        // chain to the prior page; empty on page 0
  bytes page_sha256 = 5;             // canonical digest over all other fields
  bool terminal = 6;                 // MUST be true iff page_index == page_count-1
  bool coarsened = 7;
  uint32 digest_version = 8;         // canonical page/root digest algorithm version
  repeated EdgeLostRangeV1 lost_ranges = 9;   // bounded, ordered, non-overlapping
  repeated EdgeAffectedScopeV1 affected = 10; // bounded affected semantic scope
}

// SpoolLossTombstoneV1 is the signed, hard-size-bounded record that a contiguous
// range of a prior spool generation was lost and re-enqueued under a new
// generation. It carries the ordered manifest root and page count, never an
// inline outage-sized tail. It is a RECOVERY_CONTROL payload on the reserved
// recovery lane and MUST carry recovery source authorization.
message SpoolLossTombstoneV1 {
  bytes recovery_id = 1;             // UUIDv7, immutably binds the rollover
  bytes prior_spool_id = 2;
  uint64 lost_from_sequence = 3;
  uint64 lost_through_sequence = 4;
  bytes new_spool_id = 5;
  bytes manifest_root_sha256 = 6;    // ordered root over the chained manifest pages
  uint32 manifest_page_count = 7;
  bool coarsened = 8;                // manifest coarsened to a conservative scope
  int64 detected_at_unix_nano = 9;
  string reason = 10;                // corruption / torn-tail / enospc / etc.
  uint32 digest_version = 11;        // canonical page/root digest algorithm version
}

// EdgeRecoveryControlPayloadV1 is the canonical inner payload of a
// RECOVERY_CONTROL record: exactly one recovery body. The composed
// ValidateRecoveryControl decodes the record's payload as this message and binds
// the carried body's recovery_id to the record's signed recovery source context,
// so a recovery record cannot ship a body for an unrelated recovery operation.
message EdgeRecoveryControlPayloadV1 {
  oneof body {
    SpoolLossTombstoneV1 tombstone = 1;
    EdgeLossManifestPageV1 manifest_page = 2;
    RecoveryResolvedV1 resolved = 3;
  }
}

// RecoveryResolvedV1 is the scheduler's signed confirmation that a recovery
// manifest was applied. The agent retains its recovery journal until this (or an
// idempotent query result) is durable locally; a recovery PubAck alone does NOT
// authorize journal garbage collection.
message RecoveryResolvedV1 {
  bytes recovery_id = 1;
  bytes manifest_root_sha256 = 2;
  uint64 applied_through_sequence = 3;
  int64 resolved_at_unix_nano = 4;
}

// ---------------------------------------------------------------------------
// Bidirectional record-ingest transport
// ---------------------------------------------------------------------------

// EdgeRecordClientMessage is one agent->gateway message on a lane: the opening
// handshake (first message) followed by delivery frames.
message EdgeRecordClientMessage {
  oneof payload {
    EdgeRecordLaneOpen lane_open = 1;
    EdgeDeliveryFrameV1 delivery_frame = 2;
  }
}

// EdgeRecordServerMessage is one gateway->agent message on a lane: the handshake
// ack (first message) followed by cumulative dispositions.
message EdgeRecordServerMessage {
  oneof payload {
    EdgeRecordLaneOpenAck lane_open_ack = 1;
    EdgeDeliveryAckV1 ack = 2;
  }
}

service EdgeRecordIngestService {
  // Stream carries one delivery lane. gRPC provides authenticated, flow-
  // controlled transport only; durable acceptance is the JetStream PubAck the
  // gateway reports inside an EdgeDeliveryAckV1, never RPC success or EOF. The
  // client/server messages are shared streaming oneof envelopes (lane-open
  // handshake + frames/dispositions), not per-rpc request/response wrappers.
  rpc Stream(stream EdgeRecordClientMessage) returns (stream EdgeRecordServerMessage) {}
}
