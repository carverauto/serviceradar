# BuildBuddy CI workflow. Details and gotchas: k8s/buildbuddy/README.md ("Workflows").
actions:
  - name: "Build, test and publish all containers"
    # Run the runner on the org's own executors. `pool: ""` is required because
    # without it the run queues against an empty pool. See the README.
    self_hosted: true
    pool: ""
    triggers:
      push:
        branches:
          - "staging"
          #- "no_run" # Disables CI i.e. when testing the custom RBE image.
    steps:
      - run: "bazel run -c opt //:buildbuddy_setup_docker_auth --verbose_failures"
      # --config=remote is what turns RBE on; workflows do not enable it by default.
      - run: "bazel build -c opt //... --config=remote"
      - run: "bazel test -c opt //... --config=remote --test_tag_filters=-integration_test,-acceptance_test"
