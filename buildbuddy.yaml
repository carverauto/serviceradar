actions:
  - name: "BazelCI"
    # Both fields are required together. `self_hosted: true` alone defaults the pool to the
    # name "workflows", and //k8s/buildbuddy/values.yaml sets no poolName, so these executors
    # sit in the default pool. `pool: ""` does NOT express that: an empty string reads as unset
    # and falls straight back to "workflows", failing with
    #   No registered executors in pool "workflows" with os "linux" with arch "amd64"
    # The README lists the three files to change together if `default` turns out to be wrong.
    #
    # `self_hosted` is also load-bearing for the database tier below, well beyond pool
    # selection -- see the comment on that step.
    # Static environment. Secrets are NOT declared here: BuildBuddy exposes anything configured
    # in the app's secret store as an environment variable automatically.
    #
    # OCI_REGISTRY is required and its absence is silent. buildbuddy_setup_docker_auth.sh does
    #   oci_registry="${OCI_REGISTRY:-ghcr.io}"
    # so without it every credential is written into ~/.docker/config.json under the `ghcr.io`
    # key. Harbor then gets no entry at all and rules_oci's repository fetch fails during the
    # LOADING phase, which surfaces as a package error on targets that have nothing to do with
    # containers:
    #
    #   GET .../v2/mirror/cloudnative-pg/postgresql/manifests/sha256:... returned 401 Unauthorized
    #   ERROR: no such package '@@rules_oci++oci+cloudnativepg_postgresql_18_linux_amd64//'
    #
    # Every oci.pull in MODULE.bazel now resolves to registry.carverauto.dev, so this is the
    # only registry that matters. GHCR and Docker Hub are no longer pulled from.
    env:
      OCI_REGISTRY: "registry.carverauto.dev"

    self_hosted: true
    # The dedicated workflow fleet in //k8s/buildbuddy/values-workflows.yaml, NOT the three
    # build executors in values.yaml. Those advertise 16Gi and this runner wants ~32GB, so it
    # could never be placed there; and sizing them up would reserve it on all three and let one
    # runner squeeze out the remote-execution fan-out it is itself driving.
    #
    # The two must be changed together: this string is matched against the executor's
    # `poolName`. If the fleet is not deployed yet, this fails before any step runs with
    #   no registered executors in pool "workflows" with os "linux" with arch "amd64"
    pool: "workflows"
    triggers:
      push:
        branches:
          - "staging"

    # Runner sizing. Values are byte counts or numeric strings with an IEC abbreviation; cpu
    # also accepts an `m` suffix for thousandths of a core ("8000m" = 8 cores).
    #
    # UNITS: `GB` HERE MEANS GiB, NOT 10^9. Established twice, the hard way:
    #
    #   "14GB" -> BuildBuddy reported the VM as "15.03GB total"  (14 GiB = 15,032,385,536)
    #   "28GB" -> reported "30.06GB total"                       (28 GiB = 30,064,771,072)
    #   "32GB" -> scheduler asked for memory_bytes=34359738368   (= 32 GiB exactly)
    #
    # So compare this number against the executor's advertisement in GiB. Do not convert.
    #
    # THE CEILING IS THE EXECUTOR'S `limits` MINUS A FLAT 10 GB -- not its `requests`, which is
    # only what the kube scheduler reserves. Read off the executor's own startup line:
    #
    #   Initialized task scheduler: Memory: 0 of 32,949,672,960 bytes allocated
    #   (at the time, //k8s/buildbuddy/values-workflows.yaml limits.memory was 40Gi
    #    = 42,949,672,960, i.e. exactly 10,000,000,000 more)
    #
    # That rule explains every scheduling failure in this file's history. Build fleet:
    # 32Gi - 10e9 = 22.7 GiB assignable, so 24 GiB was rejected there while 14 GiB fit. Workflow
    # fleet at 40Gi: 30.69 GiB assignable, so 32 GiB was rejected by ~1.3 GiB.
    #
    # At the current 48Gi the fleet advertises 41,539,607,552 (38.7 GiB), leaving ~7 GB above
    # this request.
    #
    # TO GO HIGHER, RAISE `limits.memory` THERE -- assignable tracks limits, so trimming this
    # number is the wrong lever once it approaches the cap. Deploy that change BEFORE pushing a
    # matching bump here; the action's size is read from the repo at push time, so a request the
    # fleet cannot yet satisfy fails the run outright. Confirm the new figure afterwards:
    #   kubectl logs -n buildbuddy <workflow-pod> | grep "Initialized task scheduler"
    #
    # THE FLOOR IS MEASURED, not chosen. Each size below survived without being OOM-killed
    # while reporting usage well over its cgroup limit, which means the excess is reclaimable
    # page cache -- disk-cache writes and --jobs=100 input uploads -- rather than resident
    # demand. That is why this wants headroom rather than a tight fit:
    #
    #   14 GiB -> "31.24GB used of 15.03GB total"   far too tight
    #   28 GiB -> "35.31GB used of 30.06GB total"   still short
    #   32 GiB -> current
    resource_requests:
      memory: "32GB"
      disk: "40GB"

    steps:
      # Guarded, because buildbuddy_setup_docker_auth.sh FAILS SILENTLY in exactly the state
      # this workflow starts in. Its first branch is:
      #
      #   if [[ -f "${config_path}" && -z "${OCI_USERNAME:-}" && -z "${OCI_TOKEN:-}" && ... ]];
      #     echo "Docker config already present ...; nothing to do." >&2; exit 0
      #
      # The BuildBuddy runner image ships a ~/.docker/config.json, so with no credentials in
      # the environment the script writes nothing and exits 0. The run then continues for three
      # more minutes and dies in the LOADING phase of the next step, on a target that has
      # nothing to do with containers:
      #
      #   401 Unauthorized ... no such package '@@rules_oci++oci+cloudnativepg_postgresql_18...'
      #
      # The assertion below turns that into a five-second failure naming the missing secret. The
      # grep afterwards is the other half: it proves the entry landed under OCI_REGISTRY rather
      # than under the script's `ghcr.io` default, which is a separate way to get the same 401.
      - run: |
          set -euo pipefail

          if [[ -z "${HARBOR_USERNAME:-}" || -z "${HARBOR_TOKEN:-}" ]]; then
            echo "No credentials for ${OCI_REGISTRY} in the environment." >&2
            echo "HARBOR_USERNAME and HARBOR_TOKEN must exist in the BuildBuddy secret store;" >&2
            echo "BuildBuddy exposes configured secrets to workflows as environment variables." >&2
            exit 1
          fi

          # NAME BRIDGE. The secret store holds HARBOR_*, buildbuddy_setup_docker_auth.sh reads
          # OCI_* -- the script's "primary / push registry" pair, whose host comes from
          # OCI_REGISTRY above. Mapped here rather than in the action's `env:` block because
          # that takes static values only and cannot interpolate a secret; inside a step the
          # secrets are already ordinary environment variables.
          #
          # Do NOT rename the secrets to OCI_* instead. The Forgejo workflows read
          # HARBOR_ROBOT_USERNAME/HARBOR_ROBOT_SECRET from their own store and map the same
          # way, so the credential keeps one name per store and the mapping stays visible at
          # the point of use.
          export OCI_USERNAME="${HARBOR_USERNAME}"
          export OCI_TOKEN="${HARBOR_TOKEN}"

          # Cleared explicitly: the script prefers OCI_DOCKER_AUTH over the pair above when it
          # is non-empty, so a value inherited from anywhere else would silently shadow these.
          export OCI_DOCKER_AUTH=""

          bazel run -c opt --config=ci //:buildbuddy_setup_docker_auth --verbose_failures

          if ! grep -q "${OCI_REGISTRY}" "${HOME}/.docker/config.json"; then
            echo "~/.docker/config.json has no ${OCI_REGISTRY} entry after setup." >&2
            echo "OCI_REGISTRY is probably unset, so credentials went under ghcr.io." >&2
            exit 1
          fi

      - run: "bazel build -c opt --config=ci //..."

      # This sweep runs with the fixture secrets in scope, and that is safe only because it was
      # fixed in Bazel rather than worked around here.
      #
      # //elixir/serviceradar_core:unit_tests_* are directory-named groups, not tag-derived, so
      # `unit_tests_integration` and `unit_tests_external` are selected by this filter and carry
      # no tags at all. Each project's test_helper.exs branches on whether a database URL is
      # merely PRESENT, which made a green unit tier depend on a variable being absent --
      # something no target could guarantee while //.bazelrc forwards all four valuelessly.
      # //build/elixir_tests.bzl now pins the four to "" on every generated unit target, and both
      # test_helper.exs files treat blank as absent. Do not "simplify" either half: Bazel can set
      # a variable for an action but never unset one, so "" is the only lever, and without
      # blank-means-absent the pinning forces the wrong branch instead of preventing it.
      - run: "bazel test -c opt --config=ci //... --test_tag_filters=-integration_test,-acceptance_test"

      # A different configuration from the sweep above (race on, pure off), so it shares no
      # cached actions with it -- but it does share the loading and analysis phase, which is
      # exactly why it belongs in this action rather than its own.
      # --flaky_test_attempts=1 overrides the repo default of 2; a flake hunt that retries is not
      # a flake hunt.
      - run: >-
          bazel test -c opt --config=ci //go/...
          --@io_bazel_rules_go//go/config:pure=false
          --@io_bazel_rules_go//go/config:race
          --test_tag_filters=-integration_test,-acceptance_test
          --test_timeout=600
          --flaky_test_attempts=1
          --test_arg=-test.count=10
          --test_arg=-test.short
          --test_arg=-test.shuffle=on

      # Named explicitly because no wildcard reaches them: //integration_tests/srql is tagged
      # `manual`, which removes a target from //... expansion before tag filters are considered,
      # and the empty --test_tag_filters= clears the repo default so a manual target named on the
      # command line is not filtered back out.
      #
      # Outside the fixture window, and no --//build:enable_integration_tests: these carry no
      # requires_shared_fixture() guard and never read SRQL_TEST_*. Their `data` includes
      # //docker/images:cnpg_image_amd64_tar, so each brings its own Postgres. `no-remote-exec`
      # runs them on this runner.
      - run: >-
          bazel test -c opt --config=ci
          --test_tag_filters=
          //integration_tests/srql:srql_api_test
          //integration_tests/srql:srql_comprehensive_test

      # The database lifecycle, deliberately ONE step.
      #
      # It cannot be split. Steps do not share an environment, so the needs_migration handoff
      # between prepare_template and migrate_template would be lost. And BuildBuddy has no
      # `if: always()`, so the only way to guarantee teardown after a red suite is a trap in the
      # same shell that provisioned.
      #
      # This executes on the runner, not an executor, which is what makes `self_hosted: true`
      # load-bearing beyond pool selection: every target here is `no-remote-exec`, and only an
      # in-cluster runner resolves srql-fixture-rw.srql-fixtures.svc.cluster.local. A
      # BuildBuddy-hosted runner fails these four while the 8 remote shards succeed, and the
      # shards then connect to databases nothing provisioned.
      #
      # --//build:enable_integration_tests on every call, and all of them need it: every target
      # carries target_compatible_with = requires_shared_fixture(), which resolves to
      # @platforms//:incompatible without it. A wildcard skips such a target; naming one
      # explicitly exits 1. It must NOT move to .bazelrc -- the guard exists precisely because
      # these run DDL against a fixture concurrent branches share.
      #
      # prepare_template is `bazel run`, not `bazel test`: it reports needs_migration by
      # appending to $GITHUB_OUTPUT, and under --config=ci a test executes on a remote executor
      # with no access to this filesystem. `bazel run` builds remotely and runs locally, and it
      # takes --build_tag_filters because it is a rust_binary. $GITHUB_OUTPUT is a GitHub Actions
      # concept BuildBuddy does not set, so this points it at a temp file and reads it back,
      # reusing the existing mechanism rather than changing the Rust.
      - run: |
          set -euo pipefail

          FLAG=--//build:enable_integration_tests
          export GITHUB_OUTPUT="$(mktemp)"

          # Collect databases leaked by cancelled runs, before this one adds to the fixture.
          bazel test -c opt --config=ci "$FLAG" --test_tag_filters= \
            //rust/integration-db:sweep_stale_dbs

          # Drop the per-run database even when the suite is red. A cancelled run never reaches
          # this at all, which is what the sweep above exists for.
          teardown() {
            bazel test -c opt --config=ci "$FLAG" --test_tag_filters= \
              //rust/integration-db:teardown_db || true
          }
          trap teardown EXIT

          # Creates sr_core_template if absent -- with extensions, AGE graphs and grants -- and
          # reports whether it is behind the migrations on disk.
          bazel run -c opt --config=ci "$FLAG" --build_tag_filters= \
            //rust/integration-db:prepare_template

          # The one step that needs the BEAM, and the reason the previous one exists: on a
          # branch adding no migrations nothing starts an Erlang VM. Running it against a
          # current template is a documented no-op, so this is an optimisation rather than a
          # correctness requirement.
          if grep -q '^needs_migration=true$' "$GITHUB_OUTPUT"; then
            bazel test -c opt --config=ci "$FLAG" --test_tag_filters= \
              //elixir/serviceradar_core:migrate_template
          fi

          # Clones a per-run database from the template. Re-checks the pending set itself, so a
          # wrong skip above fails here rather than silently testing against a stale schema.
          bazel test -c opt --config=ci "$FLAG" --test_tag_filters= \
            //rust/integration-db:provision_db

          # The suites. Selects //elixir/serviceradar_core:integration_tests_s0..s7 and nothing
          # else: `manual` keeps banner_grab and //integration_tests/srql out of //... expansion
          # whatever the tag filter says.
          bazel test -c opt --config=ci "$FLAG" \
            --test_tag_filters=integration_test,-acceptance_test //...

      # Largely a cache hit from the //... build above; kept explicit so an image assembly
      # failure is attributable without reading a sweep log.
      - run: "bazel build -c opt --config=ci //:images"

      # //:push is rules_multirun over the per-image push targets. The //.bazelrc note about it
      # failing on macOS does not apply; this runner is Linux.
      - run: "bazel run -c opt --config=ci //:push"
