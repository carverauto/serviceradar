remote_execution:
  enabled: true
  endpoint: "grpcs://remote.buildbuddy.io"

remote_cache:
  enabled: true
  endpoint: "grpcs://remote.buildbuddy.io"
  compression_enabled: true
  upload_enabled: true
  download_enabled: true
  max_size_gb: 100
  ttl_hours: 168

build_event_streaming:
  enabled: true
  endpoint: "grpcs://events.buildbuddy.io"

execution_config:
  platform_properties:
    container-image: "docker://registry.carverauto.dev/serviceradar/rbe-executor:v1.0.24.1"
    OSFamily: "linux"
    Arch: "amd64"
  max_execution_timeout_seconds: 3600
  default_exec_properties:
    dockerNetwork: "host"
    Pool: "default"

# BuildBuddy CI workflow. Details and gotchas: k8s/buildbuddy/README.md ("Workflows").
actions:
  - name: "Build, test and publish containers"
    self_hosted: true
    pool: "default"
    triggers:
      push:
        branches:
          - "staging"
    steps:
      - run: "bazel run -c opt //:buildbuddy_setup_docker_auth --verbose_failures"
      # --config=remote is what turns RBE on; workflows do not enable it by default.
      - run: "bazel build -c opt //... --config=remote"
      - run: "bazel test -c opt //... --config=remote --test_tag_filters=-integration_test,-acceptance_test"

    # Runner sizing. Defaults are 2 CPU / 8 GB / 20 GB,
    # Values are byte counts or numeric strings with an IEC abbreviation; cpu also accepts
    # an `m` suffix for thousandths of a core ("8000m" = 8 cores).
    resource_requests:
      memory: "24GB"
      disk: "40GB"