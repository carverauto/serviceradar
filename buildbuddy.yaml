actions:
  # Explicit API dispatch only, after verifying the reaper namespace protection.
  # No push/PR/scheduled trigger: this mutates isolated fixture generations.
  - name: "SchemaTemplateQualification"
    triggers: {}
    env:
      OCI_REGISTRY: "registry.carverauto.dev"
      OCI_AUTH_REQUIRED: "1"
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    resource_requests:
      memory: "50GB"
      disk: "40GB"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: >-
          bazel run -c opt --config=ci --//build:enable_integration_tests //:buildbuddy_setup_docker_auth
      - run: |
          set -euo pipefail
          umask 077
          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci
          # An explicit dispatch may recover its own interrupted synthetic run.
          # Rust revalidates identity and refuses live connections before rebuild.
          RUN_ID="${SCHEMA_TEMPLATE_QUALIFICATION_RUN_ID:-$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')}"
          [[ "$RUN_ID" =~ ^[a-z0-9]{8,32}$ ]] || { echo "Invalid qualification run ID" >&2; exit 1; }
          export RUN_ID
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-template-qualification.XXXXXX")"
          export SERVICERADAR_FIXTURE_ENV_FILE
          trap 'rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"' EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          echo "Schema template synthetic qualification run: $RUN_ID"
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_env=SERVICERADAR_ENV=ci --flaky_test_attempts=1
             --test_output=errors --nocache_test_results --noremote_upload_local_results
             --test_env=SERVICERADAR_SECRET_DATABASE_PASSWORD
             --test_env=SERVICERADAR_SECRET_DATABASE_ADMIN_PASSWORD
             $SERVICERADAR_TEST_ENV_FLAGS"
          bazel test $FLAGS //rust/integration-db:generation_lifecycle_test

  # SRQL StarRocks-vs-CNPG parity harness, database tier
  # (//integration_tests/srql_parity:parity_test; openspec change
  # extend-starrocks-to-all-telemetry, tasks 1.4-1.6).
  #
  # Explicit API dispatch only, for a branch that changes an SRQL dialect or the inventory:
  #
  #   curl -fsS https://carverauto.buildbuddy.io/api/v1/ExecuteWorkflow \
  #     -H "x-buildbuddy-api-key: <org API key>" -H 'Content-Type: application/json' \
  #     -d '{"repo_url":"https://github.com/carverauto/serviceradar","branch":"<branch>",
  #          "action_names":["SrqlParity"], "env":{"SRQL_PARITY_ONLY":"<optional id substring>"}}'
  #
  # It creates srql_parity_<stamp>_<pid> on the srql-fixtures CNPG and fills the fixed
  # database srql_parity_ci on the StarRocks warehouse of whichever cluster's executor
  # picks up the dispatch (carverauto or farm01; both are provisioned identically -- see
  # k8s/starrocks/README.md), seeds both with the same synthetic rows, runs every inventory
  # entry through both dialects, then drops the CNPG database and empties srql_parity_ci.
  # A second dispatch while one is running is refused (the harness's
  # FIXED_DATABASE_BUSY_MINUTES guard), not interleaved.
  #
  # Reachability: lab-fe-service is a ClusterIP, admitted by executor.task_allowed_private_ips
  # (//k8s/buildbuddy/values.yaml) and by k8s/starrocks/network-policy.yaml only because the
  # buildbuddy namespace carries serviceradar.carverauto.dev/starrocks-client=true (see
  # k8s/starrocks/README.md, "Network policy").
  #
  # Credentials: the CNPG side is the ordinary fixture identity from
  # //:buildbuddy_setup_fixture_env. The StarRocks side is the `srql_parity` user, which holds
  # every privilege on srql_parity_ci and its tables and materialized views and nothing else --
  # not CREATE DATABASE, because StarRocks grants a creator nothing on what it creates and the
  # grant that would is warehouse-wide. Its password is the BuildBuddy secret
  # SRQL_PARITY_STARROCKS_PASSWORD. `--strategy=TestRunner=local` keeps both credentials on
  # this runner: a remote action ships its environment to the executor.
  - name: "SrqlParity"
    triggers: {}
    env:
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    resource_requests:
      memory: "32GB"
      disk: "40GB"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: |
          set -euo pipefail
          umask 077
          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci
          # printenv, never a $-reference: see the note at SRQL_PARITY_CNPG_ADMIN_URL below.
          if [ -z "$(printenv SRQL_PARITY_STARROCKS_PASSWORD)" ]; then
            echo "the BuildBuddy secret SRQL_PARITY_STARROCKS_PASSWORD is not set" >&2
            exit 1
          fi
          RUN_ID="$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')"
          export RUN_ID
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-srql-parity.XXXXXX")"
          export SERVICERADAR_FIXTURE_ENV_FILE
          trap 'rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"' EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          # Read these at shell runtime with printenv. The runner's bazel wrapper expands $VAR
          # in this file from the runner environment before parsing it, so a $-reference to a
          # credential-bearing variable copies its value into the wrapper's config (and a
          # multiline PEM breaks the YAML).
          export SRQL_PARITY_CNPG_ADMIN_URL="$(printenv SRQL_TEST_ADMIN_URL)"
          export SRQL_PARITY_CNPG_CA_PEM="$(printenv SRQL_TEST_DATABASE_CA_CERT)"
          export SRQL_PARITY_CNPG_SERVER_NAME="$(printenv SRQL_TEST_DATABASE_SERVER_NAME)"
          export SRQL_PARITY_STARROCKS_HOST="lab-fe-service.starrocks.svc.cluster.local"
          export SRQL_PARITY_STARROCKS_PORT=9030
          export SRQL_PARITY_STARROCKS_USER=srql_parity
          export SRQL_PARITY_STARROCKS_DATABASE=srql_parity_ci
          echo "SRQL parity run: $RUN_ID"
          # Pre-flight, informational: which runner this is and which StarRocks FE endpoints it can
          # open TCP 9030 to. A lost handshake shows up as a timeout much later in the harness;
          # this names the runner and the endpoint when it happens.
          echo "SRQL parity runner: $(hostname)"
          for target in lab-fe-service.starrocks.svc.cluster.local $(getent ahostsv4 lab-fe-search.starrocks.svc.cluster.local | awk '{print $1}' | sort -u); do
            if timeout 5 bash -c "exec 3<>/dev/tcp/${target}/9030" 2>/dev/null; then
              echo "  ${target}:9030 reachable"
            else
              echo "  ${target}:9030 NOT reachable"
            fi
          done
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_tag_filters= --flaky_test_attempts=1
             --test_output=all --test_arg=--nocapture --nocache_test_results
             --noremote_upload_local_results --test_env=SRQL_PARITY_CNPG_ADMIN_URL --test_env=SRQL_PARITY_CNPG_CA_PEM
             --test_env=SRQL_PARITY_CNPG_SERVER_NAME --test_env=SRQL_PARITY_STARROCKS_HOST
             --test_env=SRQL_PARITY_STARROCKS_PORT --test_env=SRQL_PARITY_STARROCKS_USER
             --test_env=SRQL_PARITY_STARROCKS_PASSWORD --test_env=SRQL_PARITY_STARROCKS_DATABASE"
          # Optional: an entry-id substring, to run one family of entries.
          if [ -n "${SRQL_PARITY_ONLY:-}" ]; then
            export SRQL_PARITY_ONLY
            FLAGS="$FLAGS --test_env=SRQL_PARITY_ONLY"
          fi
          bazel test $FLAGS //integration_tests/srql_parity:parity_test
          # Reader-level MTR parity (extend-starrocks 3.4.6): the Elixir tier the Rust
          # harness cannot reach. Same environment, same credentials; the test seeds its
          # own scratch databases and drops the CNPG one.
          bazel test $FLAGS //elixir/web-ng:mtr_reader_parity_test

  # God View browser acceptance, OUT of BazelCI and explicit-only (`triggers: {}`), like
  # SrqlParity. These three targets drive a real WebGPU renderer in the digest-pinned Playwright
  # executor and were the source of repeated intermittent BazelCI reds unrelated to the PR under
  # test, while gating only one area. Dispatch it (BuildBuddy ExecuteWorkflow, action
  # "GodViewAcceptance") when changing God View rendering; screenshots and traces land in
  # TEST_UNDECLARED_OUTPUTS_DIR.
  - name: "GodViewAcceptance"
    triggers: {}
    env:
      OCI_REGISTRY: "registry.carverauto.dev"
      OCI_AUTH_REQUIRED: "1"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    resource_requests:
      memory: "32GB"
      disk: "40GB"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: >-
          bazel run -c opt --config=ci //:buildbuddy_setup_docker_auth --verbose_failures
      - run: >-
          bazel test -c opt --config=ci
          //elixir/web-ng/test/playwright:god_view_elk_scene_acceptance
          //elixir/web-ng/test/playwright:world_gpu_test
          //elixir/web-ng/assets:million_world_browser_test
          --test_output=errors --nocache_test_results --flaky_test_attempts=1

  # Dispatch-only web-ng DB diagnostic: the entire existing
  # //elixir/web-ng:networks_live_db_test target on one disposable serial_0
  # srql-fixtures clone, under the canonical typed-ci generation lifecycle.
  # Explicit API dispatch only (`triggers: {}`), like SrqlParity:
  #
  #   curl -fsS https://carverauto.buildbuddy.io/api/v1/ExecuteWorkflow \
  #     -H "x-buildbuddy-api-key: <org API key>" -H 'Content-Type: application/json' \
  #     -d '{"repo_url":"https://github.com/carverauto/serviceradar","branch":"<branch>",
  #          "action_names":["WebNgDbDiagnostic"]}'
  #
  # Required BazelCI is unchanged; this never gates a PR. `--strategy=TestRunner=local`
  # keeps the fixture secrets on this runner: a remote action ships its environment
  # to the executor.
  - name: "WebNgDbDiagnostic"
    triggers: {}
    env:
      OCI_REGISTRY: "registry.carverauto.dev"
      OCI_AUTH_REQUIRED: "1"
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    resource_requests:
      memory: "40GB"
      disk: "40GB"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: >-
          bazel run -c opt --config=ci --//build:enable_integration_tests //:buildbuddy_setup_docker_auth --verbose_failures
      - run: |
          set -euo pipefail
          umask 077

          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci

          RUN_ID="$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')"
          export RUN_ID
          RUN_DATABASE="sr_core_test_$RUN_ID"
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-fixture-env.XXXXXX")"
          chmod 600 "$SERVICERADAR_FIXTURE_ENV_FILE"
          export SERVICERADAR_FIXTURE_ENV_FILE
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_env=SERVICERADAR_ENV=ci --flaky_test_attempts=1
             --test_output=errors
             --nocache_test_results --noremote_upload_local_results
             --test_env=SERVICERADAR_SECRET_DATABASE_PASSWORD
             --test_env=SERVICERADAR_SECRET_DATABASE_ADMIN_PASSWORD
             --test_env=SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD
             --test_env=DGRAPH_TEST_STRATEGY=existing
             --test_env=DGRAPH_TEST_HOST=dgraph-dgraph-alpha.dgraph-ci.svc.cluster.local
             --test_env=DGRAPH_TEST_PORT=9080
             --test_env=DGRAPH_TEST_SSLMODE=verify-ca
             --test_env=DGRAPH_TEST_CA_BUNDLE_URL=https://dgraph-ci-ca.carverauto.dev/ca.crt
             --test_env=DGRAPH_ADMIN_PASSWORD"

          OBSERVER_DIR="$(mktemp -d "${TMPDIR:-/tmp}/serviceradar-observer.XXXXXX")"
          READY_FILE="$OBSERVER_DIR/ready"
          SUITE_COMPLETE_FILE="$OBSERVER_DIR/suite-complete"
          QUIESCENT_FILE="$OBSERVER_DIR/quiescent"
          STOP_FILE="$OBSERVER_DIR/stop"
          test ! -e "$READY_FILE"
          test ! -e "$SUITE_COMPLETE_FILE"
          test ! -e "$QUIESCENT_FILE"
          test ! -e "$STOP_FILE"
          OBSERVER_PID=""
          SUITE_STATUS=0
          OBSERVER_STATUS=0
          TEARDOWN_STATUS=0
          RELEASE_STATUS=0
          GENERATION_LEASED=0
          GENERATION_DIGEST=""
          GENERATION_DATABASE=""
          START_NS=0

          validate_cleanup_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          if not isinstance(value,list) or any(not isinstance(item,str) or re.fullmatch(r"sr_tpl_[0-9a-f]{48}",item) is None for item in value):
              raise SystemExit("invalid generation cleanup response")'
          }

          parse_prepare_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          digest=value.get("digest") if isinstance(value,dict) else None
          valid=(isinstance(value,dict) and set(value)=={"builder_token","database","digest","status"}
              and value["status"] in {"ready","needs_migration"}
              and isinstance(digest,str) and re.fullmatch(r"[0-9a-f]{64}",digest) is not None
              and value["database"]=="sr_tpl_"+digest[:48]
              and type(value["builder_token"]) is int and value["builder_token"]>0)
          if not valid:
              raise SystemExit("invalid generation preparation response")
          print(value["status"],value["digest"],value["database"],sep="\t")'
          }

          validate_ready_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          if not isinstance(value,dict) or value.get("status")!="ready" or value.get("digest")!=sys.argv[1] or value.get("database")!=sys.argv[2]:
              raise SystemExit("generation did not become ready with its pinned identity")' "$1" "$2"
          }

          validate_lifecycle_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          expected={"digest":sys.argv[2],"lease_id":sys.argv[3],"status":sys.argv[1]}
          if not isinstance(value,dict) or set(value)!={"digest","lease_id","status"} or value!=expected:
              raise SystemExit("invalid generation lifecycle response")' "$1" "$2" "$3"
          }

          wait_for_marker() {
            marker="$1"
            limit="$2"
            elapsed=0
            while [ ! -e "$marker" ] && [ "$elapsed" -lt "$limit" ]; do
              sleep 1
              elapsed=$((elapsed + 1))
            done
            [ -e "$marker" ]
          }

          wait_for_observer_ready() {
            limit="$1"
            elapsed=0
            while [ ! -e "$READY_FILE" ] && [ "$elapsed" -lt "$limit" ]; do
              if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
                set +e
                wait "$OBSERVER_PID"
                OBSERVER_STATUS=$?
                set -e
                OBSERVER_PID=""
                echo "observer exited before readiness with status $OBSERVER_STATUS" >&2
                return 1
              fi
              sleep 1
              elapsed=$((elapsed + 1))
            done
            if [ ! -e "$READY_FILE" ]; then
              echo "observer did not become ready within ${limit}s" >&2
              return 1
            fi
            if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
              set +e
              wait "$OBSERVER_PID"
              OBSERVER_STATUS=$?
              set -e
              OBSERVER_PID=""
              echo "observer exited immediately after readiness with status $OBSERVER_STATUS" >&2
              return 1
            fi
          }

          cleanup() {
            ORIGINAL_STATUS=$?
            trap - EXIT
            set +e
            if [ "$ORIGINAL_STATUS" -ne 0 ] && [ "$SUITE_STATUS" -eq 0 ]; then
              SUITE_STATUS=$ORIGINAL_STATUS
            fi
            if [ -n "$OBSERVER_PID" ]; then
              touch "$SUITE_COMPLETE_FILE"
              if ! wait_for_marker "$QUIESCENT_FILE" 30; then
                if [ "$OBSERVER_STATUS" -eq 0 ]; then
                  OBSERVER_STATUS=1
                fi
              fi
            fi
            bazel test $FLAGS //rust/integration-db:teardown_db
            TEARDOWN_STATUS=$?
            if [ "$GENERATION_LEASED" -eq 1 ]; then
              RELEASE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:release_generation)"
              RELEASE_STATUS=$?
              echo "$RELEASE_JSON"
              if [ "$RELEASE_STATUS" -eq 0 ]; then
                validate_lifecycle_json released "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$RELEASE_JSON" || RELEASE_STATUS=1
              fi
            fi
            END_NS="$(date +%s%N)"
            if [ -n "$OBSERVER_PID" ]; then
              touch "$STOP_FILE"
              wait "$OBSERVER_PID"
              OBSERVER_PROCESS_STATUS=$?
              if [ "$OBSERVER_PROCESS_STATUS" -ne 0 ] && [ "$OBSERVER_STATUS" -eq 0 ]; then
                OBSERVER_STATUS=$OBSERVER_PROCESS_STATUS
              fi
            fi
            if [ "$START_NS" -eq 0 ]; then
              LIFECYCLE_NS=0
            else
              LIFECYCLE_NS=$((END_NS - START_NS))
            fi
            echo "SERVICERADAR_WEB_NG_DB_DIAGNOSTIC_LIFECYCLE start_ns=$START_NS end_ns=$END_NS lifecycle_ns=$LIFECYCLE_NS suite_status=$SUITE_STATUS observer_status=$OBSERVER_STATUS teardown_status=$TEARDOWN_STATUS release_status=$RELEASE_STATUS"
            rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"
            rm -rf "$OBSERVER_DIR"
            if [ "$SUITE_STATUS" -ne 0 ]; then
              exit "$SUITE_STATUS"
            elif [ "$OBSERVER_STATUS" -ne 0 ]; then
              exit "$OBSERVER_STATUS"
            elif [ "$TEARDOWN_STATUS" -ne 0 ]; then
              exit "$TEARDOWN_STATUS"
            elif [ "$RELEASE_STATUS" -ne 0 ]; then
              exit "$RELEASE_STATUS"
            fi
            exit "$ORIGINAL_STATUS"
          }

          trap cleanup EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          export DGRAPH_ADMIN_PASSWORD="${SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD:-}"
          FLAGS="$FLAGS $SERVICERADAR_TEST_ENV_FLAGS"

          bazel test $FLAGS //rust/integration-db:sweep_stale_dbs
          CLEANUP_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:cleanup_generations)"
          echo "$CLEANUP_JSON"
          validate_cleanup_json <<<"$CLEANUP_JSON"

          PREPARE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          GENERATION_LEASED=1
          echo "$PREPARE_JSON"
          IFS=$'\t' read -r GENERATION_STATUS GENERATION_DIGEST GENERATION_DATABASE < <(parse_prepare_json <<<"$PREPARE_JSON")
          GENERATION_MIGRATOR_STARTED=0
          if [ "$GENERATION_STATUS" = "needs_migration" ]; then
            GENERATION_MIGRATOR_STARTED=1
            bazel test $FLAGS //elixir/serviceradar_core:migrate_generation
          fi

          READY_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          echo "$READY_JSON"
          parse_prepare_json <<<"$READY_JSON" >/dev/null
          validate_ready_json "$GENERATION_DIGEST" "$GENERATION_DATABASE" <<<"$READY_JSON"
          echo "SERVICERADAR_SCHEMA_GENERATION_PREFLIGHT status=ready digest=$GENERATION_DIGEST migrator_started=$GENERATION_MIGRATOR_STARTED"

          START_NS="$(date +%s%N)"
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:observe_connections -- --ready-file "$READY_FILE" --suite-complete-file "$SUITE_COMPLETE_FILE" --quiescent-file "$QUIESCENT_FILE" --stop-file "$STOP_FILE" --max-seconds 1800 --required-pool-slots 15 &
          OBSERVER_PID=$!
          wait_for_observer_ready 30 || exit 1

          PROVISION_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:provision_generation_serial_0)"
          echo "$PROVISION_JSON"
          validate_lifecycle_json cloned "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$PROVISION_JSON"
          bazel test $FLAGS //elixir/web-ng:networks_live_db_test
          bazel test $FLAGS //elixir/web-ng:plugin_config_cli_db_test

  - name: "BazelCI"
    env:
      OCI_REGISTRY: "registry.carverauto.dev"
      OCI_AUTH_REQUIRED: "1"

      # Cert server. in cluster.
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"

      GIT_BASE_BRANCH: "staging"

    # Redirects work to pods in the self hosted cluster.
    self_hosted: true

    # The dedicated workflow fleet is defined in //k8s/buildbuddy/values-workflows.yaml;
    # Matched against the executor's `poolName`, so the two must match at all times.
    pool: "workflows"

    # OWN PATCH LINE (v1.0.24.x), NOT in lockstep with rbe-executor (v1.0.25.x since the
    # hermetic-LLVM migration). //docker/images/Dockerfile.workflow-runner records the policy.
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"

    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      # Under `oci` isolation this is a BOOLEAN in disguise. ociruntime.go reduces the property
      # to `networkEnabled: networkMode != "off"`
      dockerNetwork: "bridge"

    triggers:
      pull_request:
        branches:
          - "staging"

    # cpu also accepts an `m` suffix for thousandths of a core ("8000m" = 8 cores).
    # UNITS: `GB` HERE MEANS GiB, NOT 10^9.
    # 40GB: at 36GB the runner VM ran at ~37.95/38.65GB (~98% of 36GiB,
    # BuildBuddy low-memory warning). GB here means GiB and the workflows
    # executors advertise the full 80Gi limit with max_runner_count 2, so two
    # concurrent 40GB runs exactly fill 80GiB while each run gains ~4GiB headroom.
    resource_requests:
      memory: "40GB"
      disk: "40GB"

    steps:
      - run: python3 build/ci/detect_docs_only.py
      - run: >-
          scripts/ci/unless_docs_only.sh bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: scripts/ci/unless_docs_only.sh bazel run -c opt --config=ci //build/ci:git_checkout_regression
      # Put Harbor credentials into ~/.docker/config.json, for rules_oci's registry fetches.
      # See buildbuddy_setup_docker_auth.sh for details
      - run: >-
          scripts/ci/unless_docs_only.sh bazel run -c opt --config=ci --//build:enable_integration_tests //:buildbuddy_setup_docker_auth --verbose_failures

      # The one full //... invocation. Unit tests run here. Integration and
      # acceptance tests are filtered out of execution. Their compile happens
      # later, inside the database step, before a clone.
      #
      # `--//build:enable_integration_tests` is here for CONFIGURATION and CACHE CONTINUITY
      - run: >-
          scripts/ci/unless_docs_only.sh bazel test -c opt --config=ci --//build:enable_integration_tests
          //... --test_tag_filters=-integration_test,-acceptance_test,-benchmark

      # The database lifecycle. ONE step: the invocations share a shell, and BuildBuddy has no
      # `if: always()`, so a trap is the only way to guarantee teardown after a red suite.
      #
      # `--//build:enable_integration_tests` on every call: these targets are
      # target_compatible_with = requires_shared_fixture(), and the guard stays explicit because
      # they run DDL against a fixture concurrent branches share.
      #
      # `--strategy=TestRunner=local` moves ONLY the test action to the runner. NOT for
      # routing -- a cluster executor reaches the fixture too, which is what makes the
      # throwaway-password probe in .agents/skills/srql-fixtures-db-tests possible. It is for
      # the CREDENTIAL: a remote action ships its environment to the executor and BuildBuddy
      # records action metadata, so the two SERVICERADAR_SECRET_* values below stay on this
      # runner and out of the remote action.
      #
      # $SERVICERADAR_TEST_ENV_FLAGS is materialized by //:buildbuddy_setup_fixture_env.
      - run: |
          set -euo pipefail
          umask 077

          [ -e "${DOCS_ONLY_MARKER:-/tmp/serviceradar-docs-only-marker}" ] && { echo "docs-only change: BazelCI database lifecycle skipped"; exit 0; }

          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci

          # Every checkout selects an immutable generation from declared schema inputs. The
          # same run id owns its lease before and during the measured lifecycle; there is no
          # branch name in the identity and no fallback to sr_core_template.

          RUN_ID="$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')"
          export RUN_ID
          RUN_DATABASE="sr_core_test_$RUN_ID"
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-fixture-env.XXXXXX")"
          chmod 600 "$SERVICERADAR_FIXTURE_ENV_FILE"
          export SERVICERADAR_FIXTURE_ENV_FILE
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_env=SERVICERADAR_ENV=ci --flaky_test_attempts=1
             --test_output=errors
             --nocache_test_results --noremote_upload_local_results
             --test_env=SERVICERADAR_SECRET_DATABASE_PASSWORD
             --test_env=SERVICERADAR_SECRET_DATABASE_ADMIN_PASSWORD
             --test_env=SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD
             --test_env=DGRAPH_TEST_STRATEGY=existing
             --test_env=DGRAPH_TEST_HOST=dgraph-dgraph-alpha.dgraph-ci.svc.cluster.local
             --test_env=DGRAPH_TEST_PORT=9080
             --test_env=DGRAPH_TEST_SSLMODE=verify-ca
             --test_env=DGRAPH_TEST_CA_BUNDLE_URL=https://dgraph-ci-ca.carverauto.dev/ca.crt
             --test_env=DGRAPH_ADMIN_PASSWORD"

          OBSERVER_DIR="$(mktemp -d "${TMPDIR:-/tmp}/serviceradar-observer.XXXXXX")"
          READY_FILE="$OBSERVER_DIR/ready"
          SUITE_COMPLETE_FILE="$OBSERVER_DIR/suite-complete"
          QUIESCENT_FILE="$OBSERVER_DIR/quiescent"
          STOP_FILE="$OBSERVER_DIR/stop"
          test ! -e "$READY_FILE"
          test ! -e "$SUITE_COMPLETE_FILE"
          test ! -e "$QUIESCENT_FILE"
          test ! -e "$STOP_FILE"
          OBSERVER_PID=""
          SUITE_STATUS=0
          OBSERVER_STATUS=0
          TEARDOWN_STATUS=0
          RELEASE_STATUS=0
          GENERATION_LEASED=0
          GENERATION_DIGEST=""
          GENERATION_DATABASE=""
          START_NS=0

          validate_cleanup_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          if not isinstance(value,list) or any(not isinstance(item,str) or re.fullmatch(r"sr_tpl_[0-9a-f]{48}",item) is None for item in value):
              raise SystemExit("invalid generation cleanup response")'
          }

          parse_prepare_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          digest=value.get("digest") if isinstance(value,dict) else None
          valid=(isinstance(value,dict) and set(value)=={"builder_token","database","digest","status"}
              and value["status"] in {"ready","needs_migration"}
              and isinstance(digest,str) and re.fullmatch(r"[0-9a-f]{64}",digest) is not None
              and value["database"]=="sr_tpl_"+digest[:48]
              and type(value["builder_token"]) is int and value["builder_token"]>0)
          if not valid:
              raise SystemExit("invalid generation preparation response")
          print(value["status"],value["digest"],value["database"],sep="\t")'
          }

          validate_ready_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          if not isinstance(value,dict) or value.get("status")!="ready" or value.get("digest")!=sys.argv[1] or value.get("database")!=sys.argv[2]:
              raise SystemExit("generation did not become ready with its pinned identity")' "$1" "$2"
          }

          validate_lifecycle_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          expected={"digest":sys.argv[2],"lease_id":sys.argv[3],"status":sys.argv[1]}
          if not isinstance(value,dict) or set(value)!={"digest","lease_id","status"} or value!=expected:
              raise SystemExit("invalid generation lifecycle response")' "$1" "$2" "$3"
          }

          wait_for_marker() {
            marker="$1"
            limit="$2"
            elapsed=0
            while [ ! -e "$marker" ] && [ "$elapsed" -lt "$limit" ]; do
              sleep 1
              elapsed=$((elapsed + 1))
            done
            [ -e "$marker" ]
          }

          wait_for_observer_ready() {
            limit="$1"
            elapsed=0
            while [ ! -e "$READY_FILE" ] && [ "$elapsed" -lt "$limit" ]; do
              if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
                set +e
                wait "$OBSERVER_PID"
                OBSERVER_STATUS=$?
                set -e
                OBSERVER_PID=""
                echo "observer exited before readiness with status $OBSERVER_STATUS" >&2
                return 1
              fi
              sleep 1
              elapsed=$((elapsed + 1))
            done
            if [ ! -e "$READY_FILE" ]; then
              echo "observer did not become ready within ${limit}s" >&2
              return 1
            fi
            if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
              set +e
              wait "$OBSERVER_PID"
              OBSERVER_STATUS=$?
              set -e
              OBSERVER_PID=""
              echo "observer exited immediately after readiness with status $OBSERVER_STATUS" >&2
              return 1
            fi
          }

          cleanup() {
            ORIGINAL_STATUS=$?
            trap - EXIT
            set +e
            if [ "$ORIGINAL_STATUS" -ne 0 ] && [ "$SUITE_STATUS" -eq 0 ]; then
              SUITE_STATUS=$ORIGINAL_STATUS
            fi
            if [ -n "$OBSERVER_PID" ]; then
              touch "$SUITE_COMPLETE_FILE"
              if ! wait_for_marker "$QUIESCENT_FILE" 30; then
                if [ "$OBSERVER_STATUS" -eq 0 ]; then
                  OBSERVER_STATUS=1
                fi
              fi
            fi
            bazel test $FLAGS //rust/integration-db:teardown_db
            TEARDOWN_STATUS=$?
            if [ "$GENERATION_LEASED" -eq 1 ]; then
              RELEASE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:release_generation)"
              RELEASE_STATUS=$?
              echo "$RELEASE_JSON"
              if [ "$RELEASE_STATUS" -eq 0 ]; then
                validate_lifecycle_json released "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$RELEASE_JSON" || RELEASE_STATUS=1
              fi
            fi
            END_NS="$(date +%s%N)"
            if [ -n "$OBSERVER_PID" ]; then
              touch "$STOP_FILE"
              wait "$OBSERVER_PID"
              OBSERVER_PROCESS_STATUS=$?
              if [ "$OBSERVER_PROCESS_STATUS" -ne 0 ] && [ "$OBSERVER_STATUS" -eq 0 ]; then
                OBSERVER_STATUS=$OBSERVER_PROCESS_STATUS
              fi
            fi
            if [ "$START_NS" -eq 0 ]; then
              LIFECYCLE_NS=0
            else
              LIFECYCLE_NS=$((END_NS - START_NS))
            fi
            echo "SERVICERADAR_BAZEL_CI_LIFECYCLE start_ns=$START_NS end_ns=$END_NS lifecycle_ns=$LIFECYCLE_NS suite_status=$SUITE_STATUS observer_status=$OBSERVER_STATUS teardown_status=$TEARDOWN_STATUS release_status=$RELEASE_STATUS"
            rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"
            rm -rf "$OBSERVER_DIR"
            if [ "$SUITE_STATUS" -ne 0 ]; then
              exit "$SUITE_STATUS"
            elif [ "$OBSERVER_STATUS" -ne 0 ]; then
              exit "$OBSERVER_STATUS"
            elif [ "$TEARDOWN_STATUS" -ne 0 ]; then
              exit "$TEARDOWN_STATUS"
            elif [ "$RELEASE_STATUS" -ne 0 ]; then
              exit "$RELEASE_STATUS"
            fi
            exit "$ORIGINAL_STATUS"
          }

          trap cleanup EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          export DGRAPH_ADMIN_PASSWORD="${SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD:-}"
          FLAGS="$FLAGS $SERVICERADAR_TEST_ENV_FLAGS"

          bazel test $FLAGS //rust/integration-db:sweep_stale_dbs
          CLEANUP_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:cleanup_generations)"
          echo "$CLEANUP_JSON"
          validate_cleanup_json <<<"$CLEANUP_JSON"

          PREPARE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          GENERATION_LEASED=1
          echo "$PREPARE_JSON"
          IFS=$'\t' read -r GENERATION_STATUS GENERATION_DIGEST GENERATION_DATABASE < <(parse_prepare_json <<<"$PREPARE_JSON")
          GENERATION_MIGRATOR_STARTED=0
          if [ "$GENERATION_STATUS" = "needs_migration" ]; then
            GENERATION_MIGRATOR_STARTED=1
            bazel test $FLAGS //elixir/serviceradar_core:migrate_generation
          fi

          READY_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          echo "$READY_JSON"
          parse_prepare_json <<<"$READY_JSON" >/dev/null
          validate_ready_json "$GENERATION_DIGEST" "$GENERATION_DATABASE" <<<"$READY_JSON"
          echo "SERVICERADAR_SCHEMA_GENERATION_PREFLIGHT status=ready digest=$GENERATION_DIGEST migrator_started=$GENERATION_MIGRATOR_STARTED"

          # Compile integration tests before cloning a database, and before the
          # measured clock. The same --//build:run_id keeps this analysis cache
          # for the suite below. --build_tests_only and the tag filter select
          # tests and leave packages and images out. requires_shared_fixture()
          # targets stay incompatible unless --//build:enable_integration_tests
          # is set, so a wildcard skips them and a compile error survives until
          # the suite selects the target after a fixture is provisioned. That is
          # how //integration_tests/srql failed with `no external crate
          # serviceradar_integration_db`. //rust/netprobe:loaded_tcp_attribution_test
          # is manual, so the wildcard does not select it; name it so it stays
          # compiled. This runner cannot grant its Linux capabilities, so the
          # suite does not execute it. Leave $FLAGS off this command: those
          # options are test-only and bazel build rejects them.
          bazel build -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID --build_tests_only --build_tag_filters=integration_test,-large_ingestion_test,-acceptance_test //... //rust/netprobe:loaded_tcp_attribution_test

          START_NS="$(date +%s%N)"
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:observe_connections -- --ready-file "$READY_FILE" --suite-complete-file "$SUITE_COMPLETE_FILE" --quiescent-file "$QUIESCENT_FILE" --stop-file "$STOP_FILE" --max-seconds 1800 --required-pool-slots 114 &
          OBSERVER_PID=$!
          wait_for_observer_ready 30 || exit 1

          PROVISION_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:provision_generation)"
          echo "$PROVISION_JSON"
          validate_lifecycle_json cloned "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$PROVISION_JSON"
          # test_tag_filters controls execution, not every top-level target Bazel builds from
          # //.... Keep build selection identical so packages and images stay out of this wave.
          bazel test $FLAGS --build_tests_only --build_tag_filters=integration_test,-large_ingestion_test,-acceptance_test --test_tag_filters=integration_test,-large_ingestion_test,-acceptance_test //...
          # web-ng's database-free unit allow-list excludes the focused shared-fixture DB cases.
          # Reuse the now-quiescent serial_0 database before cleanup; the manual target cannot be
          # selected by the wildcard.
          bazel test $FLAGS //elixir/web-ng:networks_live_db_test
          bazel test $FLAGS //elixir/web-ng:plugin_config_cli_db_test
          bazel test $FLAGS //elixir/web-ng:topology_atlas_db_test
          # Dgraph owns a separate scratch namespace and verifies its deletion.
          bazel test $FLAGS //rust/dgraph-topology:schema_lifecycle_test

      # BENCHMARKS. Run so they cannot rot; NOT gated on a threshold.
      #
      # These exist because `bazel test` compiles a Go Benchmark* function and then skips it --
      # benchmarks need -test.bench, and nothing passed it. The first run of these targets found
      # BenchmarkNetworkSweeper_OptimizedTCPScan already broken on two gomock expectations that
      # runSweep gained after it was written, and fastsum's benchmarks sitting in no target at
      # all. A benchmark nobody runs still passes review and still looks like coverage.
      #
      # NO THRESHOLD, deliberately. A benchmark on a shared runner is noisy, and a threshold set
      # before that variance is measured produces failures that are not regressions -- the
      # predictable response is to mute the check, and a muted gate still looks like protection.
      # Gating is a later decision, argued from the numbers these runs collect.
      #
      # Cheap, and before the race step on purpose: the runner defaults to -test.benchtime=1x,
      # so this proves the benchmarks still execute rather than producing numbers stable enough
      # to compare.
      # `--//build:enable_integration_tests` is here for the same reason the unit sweep carries
      # it: CONFIGURATION and CACHE CONTINUITY. It is not that this step runs integration tests
      # -- the tag filter selects `benchmark` alone. It is that a build setting is part of the
      # configuration key, so omitting it makes `//...` a SECOND configuration and rebuilds the
      # repo from scratch rather than reusing what the earlier steps just built. This step
      # therefore matches the unit sweep's flags exactly.
      - run: >-
          scripts/ci/unless_docs_only.sh bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=benchmark
          --test_output=errors
          //...

      # Go race tests (race on, pure off). --flaky_test_attempts=1 overrides the repo default of 2.
      #
      # Private output base on purpose. pure and race change the configuration key,
      # and ci_runner parks the default Bazel server (startup --max_idle_secs=0,
      # startup --output_base under the runner workspace). Leaving those flags on
      # that server makes the next pull request discard the analysis cache and
      # reanalyze //... . The command-line --output_base overrides the rc and
      # starts a second server. shutdown stops that JVM so a parked runner does
      # not keep two servers resident; the output base stays on the runner rootfs
      # for the next race step. /home/buildbuddy is uid 1001's home and sits
      # outside the workspace recycle limit, same as the per-runner disk cache.
      - run: |
          set -euo pipefail
          [ -e "${DOCS_ONLY_MARKER:-/tmp/serviceradar-docs-only-marker}" ] && { echo "docs-only change: BazelCI Go race tests skipped"; exit 0; }
          race_output_base=/home/buildbuddy/output-base-race
          set +e
          bazel --output_base="$race_output_base" test -c opt --config=ci //go/... \
            --@io_bazel_rules_go//go/config:pure=false \
            --@io_bazel_rules_go//go/config:race \
            --test_tag_filters=-integration_test,-acceptance_test,-benchmark \
            --test_timeout=600 \
            --flaky_test_attempts=1 \
            --test_arg=-test.count=5 \
            --test_arg=-test.short \
            --test_arg=-test.shuffle=on
          status=$?
          set -e
          bazel --output_base="$race_output_base" shutdown
          exit "$status"

  - name: "LargeIngestionGate"
    env:
      OCI_REGISTRY: "registry.carverauto.dev"
      OCI_AUTH_REQUIRED: "1"
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    # Dedicated single-replica executor (carverauto-cluster release `buildbuddy-workflows-lig`,
    # see //k8s/buildbuddy/values-workflows-lig.yaml). Sharing "workflows" with BazelCI made
    # the two evict each other's warm runner, so ~45% of runs started cold. Not on farm01: its
    # LAN path to the srql-fixtures DB timed the gate out on every run. Everything else stays
    # on "workflows".
    pool: "workflows-lig"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    triggers:
      push:
        branches:
          - "staging"
      schedule:
        crons:
          - "0 2 * * *"
    resource_requests:
      memory: "36GB"
      disk: "40GB"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: >-
          bazel run -c opt --config=ci --//build:enable_integration_tests //:buildbuddy_setup_docker_auth --verbose_failures

      # Warm the exact integration-enabled configuration while leaving the test selection focused.
      - run: >-
          bazel build -c opt --config=ci --//build:enable_integration_tests //...

      - run: |
          set -euo pipefail
          umask 077

          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci

          # Trunk and branch callers use the same immutable generation protocol. The legacy
          # singleton remains protected for rollback but is never migrated or cloned here.

          RUN_ID="$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')"
          export RUN_ID
          RUN_DATABASE="sr_core_test_$RUN_ID"
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-fixture-env.XXXXXX")"
          chmod 600 "$SERVICERADAR_FIXTURE_ENV_FILE"
          export SERVICERADAR_FIXTURE_ENV_FILE
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_env=SERVICERADAR_ENV=ci --flaky_test_attempts=1
             --test_output=errors
             --nocache_test_results --noremote_upload_local_results
             --test_env=SERVICERADAR_SECRET_DATABASE_PASSWORD
             --test_env=SERVICERADAR_SECRET_DATABASE_ADMIN_PASSWORD
             --test_env=SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD
             --test_env=DGRAPH_TEST_STRATEGY=existing
             --test_env=DGRAPH_TEST_HOST=dgraph-dgraph-alpha.dgraph-ci.svc.cluster.local
             --test_env=DGRAPH_TEST_PORT=9080
             --test_env=DGRAPH_TEST_SSLMODE=verify-ca
             --test_env=DGRAPH_TEST_CA_BUNDLE_URL=https://dgraph-ci-ca.carverauto.dev/ca.crt
             --test_env=DGRAPH_ADMIN_PASSWORD"

          OBSERVER_DIR="$(mktemp -d "${TMPDIR:-/tmp}/serviceradar-observer.XXXXXX")"
          READY_FILE="$OBSERVER_DIR/ready"
          SUITE_COMPLETE_FILE="$OBSERVER_DIR/suite-complete"
          QUIESCENT_FILE="$OBSERVER_DIR/quiescent"
          STOP_FILE="$OBSERVER_DIR/stop"
          test ! -e "$READY_FILE"
          test ! -e "$SUITE_COMPLETE_FILE"
          test ! -e "$QUIESCENT_FILE"
          test ! -e "$STOP_FILE"
          OBSERVER_PID=""
          SUITE_STATUS=0
          OBSERVER_STATUS=0
          TEARDOWN_STATUS=0
          RELEASE_STATUS=0
          GENERATION_LEASED=0
          GENERATION_DIGEST=""
          GENERATION_DATABASE=""
          START_NS=0

          validate_cleanup_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          if not isinstance(value,list) or any(not isinstance(item,str) or re.fullmatch(r"sr_tpl_[0-9a-f]{48}",item) is None for item in value):
              raise SystemExit("invalid generation cleanup response")'
          }

          parse_prepare_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          digest=value.get("digest") if isinstance(value,dict) else None
          valid=(isinstance(value,dict) and set(value)=={"builder_token","database","digest","status"}
              and value["status"] in {"ready","needs_migration"}
              and isinstance(digest,str) and re.fullmatch(r"[0-9a-f]{64}",digest) is not None
              and value["database"]=="sr_tpl_"+digest[:48]
              and type(value["builder_token"]) is int and value["builder_token"]>0)
          if not valid:
              raise SystemExit("invalid generation preparation response")
          print(value["status"],value["digest"],value["database"],sep="\t")'
          }

          validate_ready_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          if not isinstance(value,dict) or value.get("status")!="ready" or value.get("digest")!=sys.argv[1] or value.get("database")!=sys.argv[2]:
              raise SystemExit("generation did not become ready with its pinned identity")' "$1" "$2"
          }

          validate_lifecycle_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          expected={"digest":sys.argv[2],"lease_id":sys.argv[3],"status":sys.argv[1]}
          if not isinstance(value,dict) or set(value)!={"digest","lease_id","status"} or value!=expected:
              raise SystemExit("invalid generation lifecycle response")' "$1" "$2" "$3"
          }

          wait_for_marker() {
            marker="$1"
            limit="$2"
            elapsed=0
            while [ ! -e "$marker" ] && [ "$elapsed" -lt "$limit" ]; do
              sleep 1
              elapsed=$((elapsed + 1))
            done
            [ -e "$marker" ]
          }

          wait_for_observer_ready() {
            limit="$1"
            elapsed=0
            while [ ! -e "$READY_FILE" ] && [ "$elapsed" -lt "$limit" ]; do
              if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
                set +e
                wait "$OBSERVER_PID"
                OBSERVER_STATUS=$?
                set -e
                OBSERVER_PID=""
                echo "observer exited before readiness with status $OBSERVER_STATUS" >&2
                return 1
              fi
              sleep 1
              elapsed=$((elapsed + 1))
            done
            if [ ! -e "$READY_FILE" ]; then
              echo "observer did not become ready within ${limit}s" >&2
              return 1
            fi
            if ! kill -0 "$OBSERVER_PID" 2>/dev/null; then
              set +e
              wait "$OBSERVER_PID"
              OBSERVER_STATUS=$?
              set -e
              OBSERVER_PID=""
              echo "observer exited immediately after readiness with status $OBSERVER_STATUS" >&2
              return 1
            fi
          }

          cleanup() {
            ORIGINAL_STATUS=$?
            trap - EXIT
            set +e
            if [ "$ORIGINAL_STATUS" -ne 0 ] && [ "$SUITE_STATUS" -eq 0 ]; then
              SUITE_STATUS=$ORIGINAL_STATUS
            fi
            if [ -n "$OBSERVER_PID" ]; then
              touch "$SUITE_COMPLETE_FILE"
              if ! wait_for_marker "$QUIESCENT_FILE" 30; then
                if [ "$OBSERVER_STATUS" -eq 0 ]; then
                  OBSERVER_STATUS=1
                fi
              fi
            fi
            bazel test $FLAGS //rust/integration-db:teardown_db
            TEARDOWN_STATUS=$?
            if [ "$GENERATION_LEASED" -eq 1 ]; then
              RELEASE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:release_generation)"
              RELEASE_STATUS=$?
              echo "$RELEASE_JSON"
              if [ "$RELEASE_STATUS" -eq 0 ]; then
                validate_lifecycle_json released "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$RELEASE_JSON" || RELEASE_STATUS=1
              fi
            fi
            END_NS="$(date +%s%N)"
            if [ -n "$OBSERVER_PID" ]; then
              touch "$STOP_FILE"
              wait "$OBSERVER_PID"
              OBSERVER_PROCESS_STATUS=$?
              if [ "$OBSERVER_PROCESS_STATUS" -ne 0 ] && [ "$OBSERVER_STATUS" -eq 0 ]; then
                OBSERVER_STATUS=$OBSERVER_PROCESS_STATUS
              fi
            fi
            if [ "$START_NS" -eq 0 ]; then
              LIFECYCLE_NS=0
            else
              LIFECYCLE_NS=$((END_NS - START_NS))
            fi
            echo "SERVICERADAR_LARGE_INGESTION_LIFECYCLE start_ns=$START_NS end_ns=$END_NS lifecycle_ns=$LIFECYCLE_NS suite_status=$SUITE_STATUS observer_status=$OBSERVER_STATUS teardown_status=$TEARDOWN_STATUS release_status=$RELEASE_STATUS"
            rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"
            rm -rf "$OBSERVER_DIR"
            if [ "$SUITE_STATUS" -ne 0 ]; then
              exit "$SUITE_STATUS"
            elif [ "$OBSERVER_STATUS" -ne 0 ]; then
              exit "$OBSERVER_STATUS"
            elif [ "$TEARDOWN_STATUS" -ne 0 ]; then
              exit "$TEARDOWN_STATUS"
            elif [ "$RELEASE_STATUS" -ne 0 ]; then
              exit "$RELEASE_STATUS"
            fi
            exit "$ORIGINAL_STATUS"
          }

          trap cleanup EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          export DGRAPH_ADMIN_PASSWORD="${SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD:-}"
          FLAGS="$FLAGS $SERVICERADAR_TEST_ENV_FLAGS"

          bazel test $FLAGS //rust/integration-db:sweep_stale_dbs
          CLEANUP_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:cleanup_generations)"
          echo "$CLEANUP_JSON"
          validate_cleanup_json <<<"$CLEANUP_JSON"

          PREPARE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          GENERATION_LEASED=1
          echo "$PREPARE_JSON"
          IFS=$'\t' read -r GENERATION_STATUS GENERATION_DIGEST GENERATION_DATABASE < <(parse_prepare_json <<<"$PREPARE_JSON")
          GENERATION_MIGRATOR_STARTED=0
          if [ "$GENERATION_STATUS" = "needs_migration" ]; then
            GENERATION_MIGRATOR_STARTED=1
            bazel test $FLAGS //elixir/serviceradar_core:migrate_generation
          fi

          READY_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          echo "$READY_JSON"
          parse_prepare_json <<<"$READY_JSON" >/dev/null
          validate_ready_json "$GENERATION_DIGEST" "$GENERATION_DATABASE" <<<"$READY_JSON"
          echo "SERVICERADAR_SCHEMA_GENERATION_PREFLIGHT status=ready digest=$GENERATION_DIGEST migrator_started=$GENERATION_MIGRATOR_STARTED"

          START_NS="$(date +%s%N)"
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:observe_connections -- --ready-file "$READY_FILE" --suite-complete-file "$SUITE_COMPLETE_FILE" --quiescent-file "$QUIESCENT_FILE" --stop-file "$STOP_FILE" --max-seconds 1800 --required-pool-slots 15 &
          OBSERVER_PID=$!
          wait_for_observer_ready 30 || exit 1

          PROVISION_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:provision_generation_large_ingestion)"
          echo "$PROVISION_JSON"
          validate_lifecycle_json cloned "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$PROVISION_JSON"
          bazel test $FLAGS //elixir/serviceradar_core:large_ingestion_release_gate

  # This is deliberately a branch-only measurement action, not a pull-request gate. Its
  # command block is hashed by //build/contracts:integration_benchmark_harness_hash and stays identical
  # between the before and after revisions of the parallelization benchmark.
  - name: "IntegrationBenchmark"
    env:
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    triggers:
      push:
        branches:
          - "benchmark/parallel-core-integration"
    resource_requests:
      memory: "50GB"
      disk: "40GB"
    steps: &integration_benchmark_steps
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      # Refuse a synthetic or stale checkout before spending any build capacity.
      - run: |
          set -euo pipefail
          : "${SERVICERADAR_BENCHMARK_EXPECTED_SHA:?SERVICERADAR_BENCHMARK_EXPECTED_SHA is required}"
          EFFECTIVE_HEAD="$(git rev-parse HEAD)"
          [ "$SERVICERADAR_BENCHMARK_EXPECTED_SHA" = "$EFFECTIVE_HEAD" ] || {
            echo "benchmark requested $SERVICERADAR_BENCHMARK_EXPECTED_SHA but checked out $EFFECTIVE_HEAD" >&2
            exit 1
          }

      # Warm only the ordinary integration targets selected by the measured wildcard. Their
      # transitive compile/runtime dependencies are still built, but unrelated packages, release
      # archives, OCI images, and push targets stay out of this integration-only action.
      - run: >-
          bazel build -c opt --config=ci --//build:enable_integration_tests
          --build_tag_filters=integration_test,-large_ingestion_test,-acceptance_test //...

      # Warm every manual keyed-lifecycle target. Generation preparation itself remains outside
      # the measured clock; provisioning and teardown remain inside it.
      - run: >-
          bazel build -c opt --config=ci --//build:enable_integration_tests
          --build_tag_filters=
          //rust/integration-db:observe_connections
          //rust/integration-db:sweep_stale_dbs
          //rust/integration-db:cleanup_generations
          //rust/integration-db:prepare_generation
          //rust/integration-db:provision_generation
          //rust/integration-db:release_generation
          //rust/integration-db:teardown_db
          //elixir/serviceradar_core:migrate_generation

      - run: |
          set -euo pipefail
          umask 077

          export SERVICERADAR_ENV=ci
          export BAZEL_PROFILE=ci

          # Keyed preparation is outside the benchmark clock. Provisioning clones the exact
          # pinned digest and never consults the legacy singleton.

          RUN_ID="$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')"
          export RUN_ID
          RUN_DATABASE="sr_core_test_$RUN_ID"
          SERVICERADAR_FIXTURE_ENV_FILE="$(mktemp "${TMPDIR:-/tmp}/serviceradar-fixture-env.XXXXXX")"
          chmod 600 "$SERVICERADAR_FIXTURE_ENV_FILE"
          export SERVICERADAR_FIXTURE_ENV_FILE
          FLAGS="-c opt --config=ci --strategy=TestRunner=local --//build:enable_integration_tests
             --//build:run_id=$RUN_ID --test_env=SERVICERADAR_ENV=ci --flaky_test_attempts=1
             --test_output=all
             --nocache_test_results --noremote_upload_local_results
             --test_env=SERVICERADAR_SECRET_DATABASE_PASSWORD
             --test_env=SERVICERADAR_SECRET_DATABASE_ADMIN_PASSWORD
             --test_env=SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD
             --test_env=DGRAPH_TEST_STRATEGY=existing
             --test_env=DGRAPH_TEST_HOST=dgraph-dgraph-alpha.dgraph-ci.svc.cluster.local
             --test_env=DGRAPH_TEST_PORT=9080
             --test_env=DGRAPH_TEST_SSLMODE=verify-ca
             --test_env=DGRAPH_TEST_CA_BUNDLE_URL=https://dgraph-ci-ca.carverauto.dev/ca.crt
             --test_env=DGRAPH_ADMIN_PASSWORD"

          OBSERVER_DIR="$(mktemp -d)"
          READY_FILE="$OBSERVER_DIR/ready"
          SUITE_COMPLETE_FILE="$OBSERVER_DIR/suite-complete"
          QUIESCENT_FILE="$OBSERVER_DIR/quiescent"
          STOP_FILE="$OBSERVER_DIR/stop"
          [ ! -e "${READY_FILE}" ] && [ ! -e "${SUITE_COMPLETE_FILE}" ] && [ ! -e "${QUIESCENT_FILE}" ] && [ ! -e "${STOP_FILE}" ]
          OBSERVER_PID=""
          SUITE_STATUS=0
          OBSERVER_STATUS=0
          TEARDOWN_STATUS=0
          RELEASE_STATUS=0
          GENERATION_LEASED=0
          GENERATION_DIGEST=""
          GENERATION_DATABASE=""
          START_NS=0

          validate_cleanup_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          if not isinstance(value,list) or any(not isinstance(item,str) or re.fullmatch(r"sr_tpl_[0-9a-f]{48}",item) is None for item in value):
              raise SystemExit("invalid generation cleanup response")'
          }

          parse_prepare_json() {
            python3 -c 'import json,re,sys
          value=json.load(sys.stdin)
          digest=value.get("digest") if isinstance(value,dict) else None
          valid=(isinstance(value,dict) and set(value)=={"builder_token","database","digest","status"}
              and value["status"] in {"ready","needs_migration"}
              and isinstance(digest,str) and re.fullmatch(r"[0-9a-f]{64}",digest) is not None
              and value["database"]=="sr_tpl_"+digest[:48]
              and type(value["builder_token"]) is int and value["builder_token"]>0)
          if not valid:
              raise SystemExit("invalid generation preparation response")
          print(value["status"],value["digest"],value["database"],sep="\t")'
          }

          validate_ready_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          if not isinstance(value,dict) or value.get("status")!="ready" or value.get("digest")!=sys.argv[1] or value.get("database")!=sys.argv[2]:
              raise SystemExit("generation did not become ready with its pinned identity")' "$1" "$2"
          }

          validate_lifecycle_json() {
            python3 -c 'import json,sys
          value=json.load(sys.stdin)
          expected={"digest":sys.argv[2],"lease_id":sys.argv[3],"status":sys.argv[1]}
          if not isinstance(value,dict) or set(value)!={"digest","lease_id","status"} or value!=expected:
              raise SystemExit("invalid generation lifecycle response")' "$1" "$2" "$3"
          }

          wait_for_marker() {
            marker="$1"
            limit="$2"
            elapsed=0
            while [ ! -e "$marker" ] && [ "$elapsed" -lt "$limit" ]; do
              sleep 1
              elapsed=$((elapsed + 1))
            done
            [ -e "$marker" ]
          }

          cleanup() {
            ORIGINAL_STATUS=$?
            trap - EXIT
            set +e
            if [ "$ORIGINAL_STATUS" -ne 0 ] && [ "$SUITE_STATUS" -eq 0 ]; then
              SUITE_STATUS=$ORIGINAL_STATUS
            fi
            if [ -n "$OBSERVER_PID" ]; then
              touch "$SUITE_COMPLETE_FILE"
              wait_for_marker "$QUIESCENT_FILE" 30 || OBSERVER_STATUS=1
            fi
            bazel test $FLAGS //rust/integration-db:teardown_db
            TEARDOWN_STATUS=$?
            if [ "$GENERATION_LEASED" -eq 1 ]; then
              RELEASE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:release_generation)"
              RELEASE_STATUS=$?
              echo "$RELEASE_JSON"
              if [ "$RELEASE_STATUS" -eq 0 ]; then
                validate_lifecycle_json released "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$RELEASE_JSON" || RELEASE_STATUS=1
              fi
            fi
            END_NS="$(date +%s%N)"
            if [ -n "$OBSERVER_PID" ]; then
              touch "$STOP_FILE"
              wait "$OBSERVER_PID"
              OBSERVER_PROCESS_STATUS=$?
              if [ "$OBSERVER_PROCESS_STATUS" -ne 0 ] && [ "$OBSERVER_STATUS" -eq 0 ]; then
                OBSERVER_STATUS=$OBSERVER_PROCESS_STATUS
              fi
            fi
            if [ "$START_NS" -eq 0 ]; then
              LIFECYCLE_NS=0
            else
              LIFECYCLE_NS=$((END_NS - START_NS))
            fi
            echo "SERVICERADAR_INTEGRATION_BENCHMARK start_ns=$START_NS end_ns=$END_NS lifecycle_ns=$LIFECYCLE_NS suite_status=$SUITE_STATUS observer_status=$OBSERVER_STATUS teardown_status=$TEARDOWN_STATUS release_status=$RELEASE_STATUS"
            rm -f "$SERVICERADAR_FIXTURE_ENV_FILE"
            rm -rf "$OBSERVER_DIR"
            if [ "$SUITE_STATUS" -ne 0 ]; then
              exit "$SUITE_STATUS"
            elif [ "$OBSERVER_STATUS" -ne 0 ]; then
              exit "$OBSERVER_STATUS"
            elif [ "$TEARDOWN_STATUS" -ne 0 ]; then
              exit "$TEARDOWN_STATUS"
            elif [ "$RELEASE_STATUS" -ne 0 ]; then
              exit "$RELEASE_STATUS"
            fi
            exit "$ORIGINAL_STATUS"
          }

          trap cleanup EXIT
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //:buildbuddy_setup_fixture_env
          set -a; . "$SERVICERADAR_FIXTURE_ENV_FILE"; set +a
          export DGRAPH_ADMIN_PASSWORD="${SERVICERADAR_SECRET_DGRAPH_ADMIN_PASSWORD:-}"
          FLAGS="$FLAGS $SERVICERADAR_TEST_ENV_FLAGS"

          bazel test $FLAGS //rust/integration-db:sweep_stale_dbs
          CLEANUP_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:cleanup_generations)"
          echo "$CLEANUP_JSON"
          validate_cleanup_json <<<"$CLEANUP_JSON"

          PREPARE_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          GENERATION_LEASED=1
          echo "$PREPARE_JSON"
          IFS=$'\t' read -r GENERATION_STATUS GENERATION_DIGEST GENERATION_DATABASE < <(parse_prepare_json <<<"$PREPARE_JSON")
          GENERATION_MIGRATOR_STARTED=0
          if [ "$GENERATION_STATUS" = "needs_migration" ]; then
            GENERATION_MIGRATOR_STARTED=1
            bazel test $FLAGS //elixir/serviceradar_core:migrate_generation
          fi

          READY_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:prepare_generation)"
          echo "$READY_JSON"
          parse_prepare_json <<<"$READY_JSON" >/dev/null
          validate_ready_json "$GENERATION_DIGEST" "$GENERATION_DATABASE" <<<"$READY_JSON"
          echo "SERVICERADAR_SCHEMA_GENERATION_PREFLIGHT status=ready digest=$GENERATION_DIGEST migrator_started=$GENERATION_MIGRATOR_STARTED"

          START_NS="$(date +%s%N)"
          bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:observe_connections -- --ready-file "$READY_FILE" --suite-complete-file "$SUITE_COMPLETE_FILE" --quiescent-file "$QUIESCENT_FILE" --stop-file "$STOP_FILE" --max-seconds 1800 --required-pool-slots 114 &
          OBSERVER_PID=$!
          wait_for_marker "$READY_FILE" 30 || { echo "observer did not become ready" >&2; exit 1; }

          PROVISION_JSON="$(bazel run -c opt --config=ci --//build:enable_integration_tests --//build:run_id=$RUN_ID //rust/integration-db:provision_generation)"
          echo "$PROVISION_JSON"
          validate_lifecycle_json cloned "$GENERATION_DIGEST" "$RUN_DATABASE" <<<"$PROVISION_JSON"
          # test_tag_filters controls execution, not every top-level target Bazel builds from
          # //.... Keep build selection identical so packages and images stay out of the clock.
          bazel test $FLAGS --build_tests_only --build_tag_filters=integration_test,-large_ingestion_test,-acceptance_test --test_tag_filters=integration_test,-large_ingestion_test,-acceptance_test //...

  # Same exact benchmark steps, with only the workflow CPU allocation changed. These actions are
  # explicit diagnostics: five alternating attempts per arm select the one CPU request later
  # applied to BazelCI and both accepted before/after cohorts.
  - name: "IntegrationBenchmarkCPU2"
    env:
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    triggers:
      push:
        branches:
          - "benchmark/parallel-core-integration-cpu2"
    resource_requests:
      cpu: "2"
      memory: "50GB"
      disk: "40GB"
    steps: *integration_benchmark_steps

  - name: "IntegrationBenchmarkCPU12"
    env:
      SRQL_FIXTURE_CA_URL: "https://srql-fixture-ca.carverauto.dev/ca.crt"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    triggers:
      push:
        branches:
          - "benchmark/parallel-core-integration-cpu12"
    resource_requests:
      cpu: "12"
      memory: "50GB"
      disk: "40GB"
    steps: *integration_benchmark_steps

  # Full Mix analyzer contract (compile --warnings-as-errors, xref, Credo,
  # hex/deps audit, Sobelow, OpenAPI dump). Not a PR gate: those steps compile
  # each project's Mix closure and were the bulk of the old 18m+ Elixir Quality
  # required check. PRs keep mix format + mix credo --strict in
  # .github/workflows/elixir-quality.yml; BazelCI above already compiles and
  # tests the Elixir tree.
  #
  # --skip-nif: the workflow-runner image has no gcc/cargo (by design; C/Rust
  # link is RBE). BazelCI already builds the NIFs. Mix still type-checks the
  # Rustler stub modules.
  #
  # Same pool as BazelCI (one replica). 07:00 UTC is chosen so a weekday run
  # usually misses US-hours PR traffic; if both are queued, one waits.
  - name: "Elixir Quality (daily)"
    self_hosted: true
    pool: "workflows"
    container_image: "docker://registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5"
    platform_properties:
      OSFamily: "linux"
      Arch: "amd64"
      dockerNetwork: "bridge"
    triggers:
      schedule:
        crons:
          - "0 7 * * *"
    timeout: 3h
    resource_requests:
      memory: "32GB"
      disk: "40GB"
    env:
      HEX_HTTP_CONCURRENCY: "1"
      HEX_HTTP_TIMEOUT: "120"
    steps:
      - run: >-
          bazel run -c opt --config=ci //build/ci:verify_git_metadata --
          --expected-commit "$(git rev-parse HEAD)"
      - run: |
          set -euo pipefail

          OTP_VERSION="28.3"
          ELIXIR_VERSION="1.19.4"
          prefix="${HOME}/.serviceradar-beam"
          otp_dir="${prefix}/otp-${OTP_VERSION}"
          elixir_dir="${prefix}/elixir-${ELIXIR_VERSION}-otp-28"

          mkdir -p "${prefix}"

          if [[ ! -x "${otp_dir}/bin/erl" ]]; then
            rm -rf "${otp_dir}"
            tmpdir="$(mktemp -d)"
            curl -fsSL "https://builds.hex.pm/builds/otp/amd64/ubuntu-24.04/OTP-${OTP_VERSION}.tar.gz" \
              | tar -xz -C "${tmpdir}"
            mv "${tmpdir}/OTP-${OTP_VERSION}" "${otp_dir}"
            rm -rf "${tmpdir}"
            (cd "${otp_dir}" && ./Install -sasl "${otp_dir}")
            test -x "${otp_dir}/bin/erl"
          fi

          if [[ ! -x "${elixir_dir}/bin/mix" ]]; then
            rm -rf "${elixir_dir}"
            mkdir -p "${elixir_dir}"
            curl -fsSL "https://builds.hex.pm/builds/elixir/v${ELIXIR_VERSION}-otp-28.zip" \
              -o /tmp/elixir.zip
            unzip -q /tmp/elixir.zip -d "${elixir_dir}"
            rm -f /tmp/elixir.zip
          fi

          export PATH="${elixir_dir}/bin:${otp_dir}/bin:${PATH}"
          erl -eval 'io:format("~s~n", [erlang:system_info(otp_release)]), halt().' -noshell
          elixir --version
          mix --version

          mix local.hex --force
          mix local.rebar --force

          ./scripts/elixir_quality.sh --all --skip-dialyzer --skip-nif

          (cd elixir/web-ng && mix serviceradar.openapi.dump --check)
