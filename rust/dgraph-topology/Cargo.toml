[package]
name = "dgraph-topology"
version = "0.1.0"
description = "ServiceRadar topology schema and typed Dgraph operations. Schema string is a parameter to dgraph-migrate; SMDB schema stays in scrith."
edition = "2024"
license = "Apache-2.0"
autotests = false

[lib]
name = "dgraph_topology"
path = "src/lib.rs"

[[test]]
name = "lib_tests"
path = "tests/lib_tests.rs"

[[test]]
name = "schema_lifecycle"
path = "tests/schema_lifecycle.rs"
required-features = ["integration-tests"]

[[bin]]
name = "dgraph-migrate"
path = "src/bin/dgraph-migrate.rs"

[[test]]
name = "world_worker"
path = "tests/world_worker.rs"
required-features = ["integration-tests"]

[features]
default = []
integration-tests = [
    "dgraph_client/test-utils",
    "dgraph-migrate/integration-tests",
]

[dependencies]
chrono = { workspace = true }
dgraph-migrate = { path = "../dgraph-migrate" }
dgraph_client = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["process", "signal"] }
proto_dgraph = { workspace = true }
runfiles = { workspace = true }
serviceradar-config-manager = { path = "../../config/manager_config/rust" }
serviceradar-config-schema = { path = "../../config/proto_bindings/rust" }
serviceradar-secret-manager = { path = "../../config/manager_secret/rust" }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
urlencoding = { workspace = true }
