[package]
name = "serviceradar-rperf-checker"
version = "1.0.30"
description = "gRPC plugin for rperf network performance testing tool"
authors = ["Michael Freeman <mfreeman451@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config-bootstrap = { path = "../config-bootstrap" }
env_logger = { workspace = true }
log = { workspace = true }
pem = { workspace = true }
prost = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serviceradar-metric-proto = { path = "../metric-proto" }
spiffe = { workspace = true, features = ["x509-source"] }
tokio = { workspace = true}
tonic = { workspace = true }
tonic-health ={ workspace = true }
tonic-reflection =  { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
which = { workspace = true }
