[package]
name = "addon-sdk"
version = "0.1.0"
description = "Rust helper for ServiceRadar native agent add-ons: HashiCorp go-plugin handshake + AutoMTLS + the agent/addon gRPC contract served over a Unix-domain socket."
edition = "2024"
license = "Apache-2.0"

[lib]
name = "addon_sdk"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "serviceradar-rust-sample-addon"
path = "src/bin/rust_sample_addon.rs"

[dependencies]
anyhow = { workspace = true }
async-trait ={ workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
rcgen = { workspace = true }
rustls = {workspace = true, features = ["aws-lc-rs", "std"] }
rustls-pemfile = { workspace = true }
serviceradar-metric-proto = { path = "../metric-proto" }
sha2 ={ workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws-lc-rs"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tonic = { workspace = true, features = ["transport", "tls", "gzip", "zstd"] }
tonic-health = { workspace = true }

[dev-dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
tempfile = { workspace = true }
tower = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
