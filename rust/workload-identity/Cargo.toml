[package]
name = "serviceradar-workload-identity"
version = "0.1.5"
description = "Node-local workload identity enrichment for ServiceRadar"
authors = ["ServiceRadar Team"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_workload_identity"
path = "src/lib.rs"

[[bin]]
name = "serviceradar-workload-identity-check"
path = "src/bin/workload-identity-check.rs"

[[bin]]
name = "serviceradar-workload-identity"
path = "src/bin/workload-identity.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
cri-api = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true, features = ["tls"] }
tower = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
