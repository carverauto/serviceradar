[package]
name = "dgraph-client"
version = "0.1.0"
description = "Rust client for DGraph DB"
edition = "2024"
license = "Apache-2.0"


[dependencies]
# In-repo protobuf bindings. Internal dependency only: no generated type appears in a
# public signature of this crate, so regenerating the bindings is not a breaking change for consumers.
proto_dgraph = { path = "../../proto/dgraph" }
# tls-ring provides ClientTlsConfig; tls-native-roots provides the system trust store used
# by sslmode=verify-ca. Enabled per-crate rather than in [workspace.dependencies], matching
# rust/kvutil, rust/otel, rust/flowgger and rust/rperf-client.
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
# tonic 0.14 moved the prost codec into its own crate; the generated service stubs call
# tonic_prost::ProstCodec, so this is a real dependency of the code we link.
tonic-prost = { workspace = true }
# Needed only for the sslmode=require certificate verifier. `ring` matches the tls-ring
# feature above, keeping one crypto provider and no OpenSSL anywhere in the tree.
rustls = { workspace = true, features = ["ring"] }
prost = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
# Starts a throwaway dgraph/standalone container for the integration suite.
docker_utils = { workspace = true }
# No "macros": the acceptance test is a plain #[test] driving one explicit runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
pretty_assertions = { workspace = true }
