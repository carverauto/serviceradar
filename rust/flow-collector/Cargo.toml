[package]
name = "serviceradar-flow-collector"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "serviceradar-flow-collector"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
flowparser-sflow = { workspace = true }
log = { workspace = true }
netflow_parser = { workspace = true, features = ["parse_unknown_fields"] }
prost = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
sha2 = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
