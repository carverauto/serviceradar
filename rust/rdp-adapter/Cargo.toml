[package]
name = "serviceradar-rdp-adapter"
version = "0.1.0"
edition = "2021"
authors = ["ServiceRadar Team"]
description = "ServiceRadar RDP helper adapter"
license = "Apache-2.0"

[features]
default = []
ironrdp-backend = ["dep:ironrdp-core", "dep:ironrdp-pdu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(serviceradar_rdp_connector_link_probe)'] }

[dependencies]
# audited 2026-05-18, RUSTSEC-clean in root lock for the RDP adapter path.
ironrdp-core = { version = "=0.1.5", default-features = false, features = ["alloc"], optional = true }
# audited 2026-05-18, RUSTSEC-clean in root lock for the RDP adapter path; pulls md-5 0.10.6 transitively for RDP crypto parsing.
ironrdp-pdu = { version = "=0.7.0", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
