[package]
name = "serviceradar-bmp-collector"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1"
arancini-lib = "0.7.1"
async-nats = "0.49"
# parser only: we decode in-memory BMP frames and never fetch remote MRT files, so
# bgpkit-parser's default "rustls" feature (which drags in the whole oneio HTTP/S3
# stack) is dead weight. Currently has no effect -- arancini-lib 0.7.2 depends on
# bgpkit-parser with default features, so oneio is linked anyway.
bgpkit-parser = { version = "0.15", default-features = false, features = ["parser"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[[bin]]
name = "serviceradar-bmp-collector"
path = "src/main.rs"
