[package]
name = "causal-engine"
version = "0.1.0"
edition = "2021"
description = "ServiceRadar DeepCausality causal engine (OpenSpec: add-causal-engine)"

# NOTE (add-causal-engine): heavier integration deps are added in the increment
# that first uses them, to keep the crate_universe repin scoped:
#   - srql (path) + async-nats .......... task 1.2 (hydrator: EmbeddedSrql + JetStream)
#   - ultragraph 0.9 .................... task 1.3 (reasoner: CsmGraph + Gap G algos)
#   - deep_causality{,_sparse,_tensor,_topology} 0.13/... task 1.3 (CausaloidGraph)
[dependencies]
anyhow = "1"
async-trait = "0.1"
envy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
