[package]
name = "causal-engine"
version = "0.1.0"
edition = "2024"
description = "ServiceRadar DeepCausality causal engine (OpenSpec: add-causal-engine)"

[dependencies]
anyhow = "1"
async-nats = "0.48"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
deep_causality = "0.13.10"
envy = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srql = { path = "../srql" }
thiserror = "1"
# task 1.3/1.4.2 (Gap G already upstream in ultragraph 0.9): the graph
# causaloids C5/C5b/C9/C10 build a DeepCausality CausaloidGraph over the
# CONNECTS_TO fabric and use the frozen backing graph for structural queries.
ultragraph = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
