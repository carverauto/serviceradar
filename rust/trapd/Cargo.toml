[package]
name = "serviceradar-trapd"
version = "0.1.0"
description = "SNMP Trap receiver for ServiceRadar"
authors = ["ServiceRadar Team"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
async-nats = "0.49"
clap = { version = "4.3", features = ["derive", "env"] }
config-bootstrap = { path = "../../rust/config-bootstrap" }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
pem = "3"
prost = { workspace = true }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snmp2 = { version = "0.5", features = ["tokio"] }
spiffe = { version = "0.16", default-features = false, features = ["x509-source"] }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }

[dev-dependencies]
rcgen = "0.12"

[build-dependencies]
tonic-build = { workspace = true }
