[package]
name = "correlation-engine"
version = "0.1.0"
description = "ServiceRadar signal-correlation engine — rule + dependency-graph reasoning over anomaly/BMP/topology signals (OpenSpec: add-causal-engine)"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
deep_causality = { workspace = true }
envy = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serviceradar-metric-proto = { path = "../metric-proto" }
srql = { path = "../srql" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ultragraph = { workspace = true }

[dev-dependencies]
