[package]
name = "correlation-engine"
version = "0.1.0"
description = "ServiceRadar signal-correlation engine — rule + dependency-graph reasoning over anomaly/BMP/topology signals (OpenSpec: add-causal-engine)"
edition = "2024"

[dependencies]
anyhow = "1"
async-nats = "0.49"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
deep_causality = "0.13"
envy = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serviceradar-metric-proto = { path = "../metric-proto" }
srql = { path = "../srql" }
thiserror = "2"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ultragraph = "0.9"

[dev-dependencies]
