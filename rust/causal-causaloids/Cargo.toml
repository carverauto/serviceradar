[package]
name = "serviceradar-causal-causaloids"
version = "0.1.0"
edition = "2024"

description = "Causal security engine — the detection code (security causaloid library S1-S7 + kill-chain graph topology). Scaffold only in Phase 0; the causaloids are authored by add-causal-security-detections. (OpenSpec: add-causal-security-foundation)."
license = "Apache-2.0"

[lib]
name = "serviceradar_causal_causaloids"
path = "src/lib.rs"

[dependencies]
serviceradar-causal-model = { path = "../causal-model" }
serviceradar-causal-ports = { path = "../causal-ports" }
serviceradar-causal-context = { path = "../causal-context" }
