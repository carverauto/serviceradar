[package]
name = "serviceradar-netprobe"
version = "0.2.23"
description = "Host network visibility sidecar for ServiceRadar agents"
authors = ["ServiceRadar Team"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_netprobe"
path = "src/lib.rs"

[[bin]]
name = "serviceradar-netprobe"
path = "src/main.rs"

[[bench]]
name = "af_xdp_cpu"
harness = false

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
env_logger = "0.11"
etherparse = "0.20.1"
log = "0.4"
nix = { version = "0.31", features = ["signal", "process", "user"] }
pcap = { version = "2.4.0", optional = true }
phf = "0.14"
prometheus = "0.14"
prost = { workspace = true }
quick-xml = "0.41"
regex-automata = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
aya-build = "0.1.3"
phf_codegen = "0.11"
prost-build = "0.13"
quick-xml = "0.38"

[features]
default = []
remote-capture = ["dep:pcap"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13.1", features = ["tokio"] }
aya-log = "0.3"
libc = "0.2"
procfs = "0.18"

[target.'cfg(target_arch = "bpf")'.dependencies]
aya-ebpf = "0.1.1"
