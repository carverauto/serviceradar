[package]
name = "serviceradar-log-collector"
version = "0.1.0"
description = "Unified log collector for ServiceRadar — syslog/GELF (via Flowgger) and OpenTelemetry gRPC"
edition = "2024"

[[bin]]
name = "serviceradar-log-collector"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config-bootstrap = { path = "../config-bootstrap" }
env_logger = { workspace = true }
kvutil = { path = "../kvutil" }
flowgger = { package = "serviceradar-flowgger", path = "../flowgger", default-features = false }
log = { workspace = true }
otel = { path = "../otel", optional = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serviceradar-zen-normalize = { path = "../zen-normalize" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
rcgen = { workspace = true }
runfiles = { workspace = true }
serviceradar-metric-proto = { path = "../metric-proto" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["syslog", "otel"]
syslog = ["flowgger/syslog", "flowgger/tls", "flowgger/gelf", "flowgger/nats-output"]
otel = ["dep:otel"]
