[package]
name = "serviceradar-media-core"
version = "0.1.0"
description = "Pure-Rust media vision primitives: two-tier frame-change/motion gate, Apache-2.0 YOLOX detector interface, HSV sub-crop attributes, trackforge multi-object tracker, and bounded JPEG keyframe thumbnail encoder"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_media_core"
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
trackforge = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
