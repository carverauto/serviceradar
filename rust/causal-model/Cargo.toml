[package]
name = "serviceradar-causal-model"
version = "0.1.0"
description = "Causal security engine — shared vocabulary (tier 0): the SecVerdict lawful Verdict lattice, the deterministic ConfidenceSummary, and the Observation model consumed by the reasoning layer. Carries no IO. Phase 0 (OpenSpec: add-causal-security-foundation)."
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_causal_model"
path = "src/lib.rs"

[dependencies]
# The lawful bounded-lattice Verdict trait SecVerdict implements. Sourced from crates.io (in sync
# with the ctx working tree); never a path dep.
deep_causality_algebra = { workspace = true }
uuid = { workspace = true }
