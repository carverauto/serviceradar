[package]
name = "serviceradar-causal-context"
version = "0.1.0"
edition = "2024"

description = "Causal security engine — L2 Context (the DeepCausality world model). Scaffold only in Phase 0; the Contextoid hypergraph (asset criticality, IOC Symboids, topology reachability) is filled by add-causal-security-detections. (OpenSpec: add-causal-security-foundation)."
license = "Apache-2.0"

[lib]
name = "serviceradar_causal_context"
path = "src/lib.rs"

[dependencies]
serviceradar-causal-model = { path = "../causal-model" }
serviceradar-causal-ports = { path = "../causal-ports" }
