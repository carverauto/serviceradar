[package]
name = "otel"
version = "0.1.0"
edition = "2024"

[lib]
name = "otel"
path = "src/lib.rs"
doctest = false

[dependencies]
addon-sdk = { path = "../addon-sdk" }
anyhow = { workspace = true }
async-nats = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["full"] }
lazy_static = { workspace = true }
log = { workspace = true }
prometheus = { workspace = true, features = ["process"] }
prost = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serviceradar-metric-proto = { path = "../metric-proto" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

# Free-disk floor for the relay spool: statvfs without unsafe. rustix is
# already in the workspace dependency graph (tempfile et al.), so this pins
# no new crate version.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
