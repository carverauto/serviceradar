[package]
name = "serviceradar-metrics-delta-writer"
version = "0.1.0"
description = "ServiceRadar metrics Delta lakehouse writer (OpenSpec: add-delta-metrics-lakehouse). Consumes the metrics JetStream durable, decodes MetricBatch protobuf, and batch-writes raw points to a Delta table on object storage."
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_metrics_delta_writer"
path = "src/lib.rs"

[[bin]]
name = "metrics-delta-writer"
path = "src/main.rs"

[[bin]]
name = "metrics-protobuf-bench"
path = "src/bin/metrics_protobuf_bench.rs"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
envy = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serviceradar-metric-proto = { path = "../metric-proto" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# TODO(add-delta-metrics-lakehouse task 3.1): wire the real Delta sink. The
# `deltalake` crate pulls in arrow + object_store and must be added to the
# workspace Cargo.lock and the bazel crate-universe (repin) before it builds.
# Until then `sink::LoggingSink` is the placeholder so this crate compiles and
# the NATS->decode->row pipeline can be exercised end to end.
# deltalake = { version = "0.x", features = ["s3", "datafusion"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
