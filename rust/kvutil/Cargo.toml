[package]
name = "kvutil"
version = "0.1.0"
edition = "2024"


[lib]
name = "kvutil"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
pem = "3"
prost = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spiffe = { version = "0.16", default-features = false, features = ["x509-source"] }
thiserror = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
toml = "1"
tonic = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
