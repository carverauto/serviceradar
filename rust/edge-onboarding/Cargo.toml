[package]
name = "edge-onboarding"
version = "0.1.0"
description = "Edge onboarding library for ServiceRadar Rust checkers (mirrors Go pkg/edgeonboarding)"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "edge_onboarding"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "3"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
