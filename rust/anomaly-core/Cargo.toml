[package]
name = "serviceradar-anomaly-core"
version = "0.1.0"
edition = "2024"

description = "Shared per-series anomaly detector (Welford z-score + DeepCausality rolling/seasonal/trend signals) used by the edge anomaly add-on (OpenSpec: move-anomaly-detection-to-edge)."
license = "Apache-2.0"

[lib]
name = "serviceradar_anomaly_core"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
deep_causality_core = "0.11"
deep_causality_data_structures = "0.10.14"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
