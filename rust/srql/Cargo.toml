[package]
name = "srql"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = { workspace = true }
serviceradar-config-manager = { path = "../../config/manager_config/rust" }
serviceradar-config-schema = { path = "../../config/proto_bindings/rust" }
serviceradar-secret-manager = { path = "../../config/manager_secret/rust" }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros"] }
base64 = { workspace = true }
bb8 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
diesel = { workspace = true, features = ["postgres", "chrono", "serde_json", "uuid", "64-column-tables"] }
diesel-async = { workspace = true, features = ["postgres", "tokio", "bb8"] }
envy = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
kvutil = { path = "../kvutil" }
once_cell = { workspace = true }
# No "vendored" here: see the [features] table at the bottom of this file.
openssl-sys = { workspace = true }
parking_lot = { workspace = true }
pq-sys = { workspace = true, features = ["bundled"] }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# BLOCKED: cannot use the workspace sha2 (0.11). pagination.rs builds Hmac<Sha256>, and
# hmac 0.12 is implemented against digest 0.10 while sha2 0.11 moved to digest 0.11 -- the
# trait bounds do not meet across that boundary. Unblocking needs hmac on digest 0.11
# (unreleased) or moving the cursor MAC off hmac. Until then sha2 builds twice.
sha2 = "0.11.0"
thiserror = { workspace = true }
tokio = { workspace = true}
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serial_test = { workspace = true }

[features]
# OFF by default, and it must stay off. Enabling it puts openssl-src -- the entire OpenSSL
# source tree -- back in the dependency graph, and the Bazel build would then compile a
# second OpenSSL alongside the @openssl one it links (//MODULE.bazel). Bazel builds default
# features only, so `default = []` is what keeps that from happening.
#
# It exists for `cargo test` on a machine with no system OpenSSL, since libpq (pq-sys
# "bundled") needs OpenSSL headers whichever way they arrive:
#
#     cargo test --features vendored-openssl
#
# Only Bazel builds shipped artifacts, so this never affects a release.
default = []
vendored-openssl = ["openssl-sys/vendored"]
