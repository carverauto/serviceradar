[package]
name = "srql"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
diesel = { version = "2.2.2", default-features = false, features = ["postgres", "chrono", "serde_json", "uuid", "64-column-tables"] }
diesel-async = { version = "0.7.1", features = ["postgres", "tokio", "bb8"] }
envy = "0.4.2"
http = "1.1.0"
hmac = "0.12.1"
kvutil = { path = "../kvutil" }
once_cell = "1.20.2"
parking_lot = "0.12.3"
# Exact-pinned: these two anchor the from-source C builds (bundled libpq + vendored
# OpenSSL) that scripts/vendor.sh patches. A routine `cargo update` must not move them
# -- see the version asserts in that script. Note the pin does NOT reach their build
# deps: pq-sys declares pq-src ">=0.2, <0.4" and openssl-sys declares openssl-src
# "300.2.0", so pq-src/openssl-src can still slide; vendor.sh fails loudly if they do.
pq-sys = { version = "=0.7.5", features = ["bundled"] }
# Force a from-source (vendored) OpenSSL so bundled libpq static-links it instead of
# depending on system OpenSSL paths. Makes the build portable (macOS/Alpine/CI) and
# removes reliance on the OPENSSL_LIB_DIR overrides. See openspec migrate-bazel-rust-crate-vendoring.
openssl-sys = { version = "=0.9.116", features = ["vendored"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.41.0", features = ["full"] }
tower = "0.5.1"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
bb8 = "0.8"
tokio-postgres = "0.7.15"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
serial_test = "3.2"
