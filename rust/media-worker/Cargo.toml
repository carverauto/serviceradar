[package]
name = "serviceradar-media-worker"
version = "0.1.0"
description = "Standalone stateless GPU media worker for NVR visual keyframe indexing and semantic clip search"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "serviceradar_media_worker"
path = "src/lib.rs"

[[bin]]
name = "serviceradar-media-worker"
path = "src/main.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
futures = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
longshore_s3 = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
regex-automata = { workspace = true, features = ["meta", "unicode"] }
rustls = { workspace = true }
rusty_h264-decoder = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serviceradar-cert-policy = { path = "../cert-policy" }
serviceradar-media-core = { path = "../media-core" }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ureq = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
rusty_h264-common = { workspace = true }
rusty_h264-encoder = { workspace = true }
tempfile = { workspace = true }
