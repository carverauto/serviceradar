[package]
name = "serviceradar-causal-emit"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Causal security engine — verdict emitter (SecVerdict -> signals.analytics.predictions.*). Scaffold only in Phase 0; the JetStream producer is wired in add-causal-security-detections. (OpenSpec: add-causal-security-foundation)."
license = "Apache-2.0"

[lib]
name = "serviceradar_causal_emit"
path = "src/lib.rs"

[dependencies]
serviceradar-causal-model = { path = "../causal-model" }
serviceradar-causal-ports = { path = "../causal-ports" }
