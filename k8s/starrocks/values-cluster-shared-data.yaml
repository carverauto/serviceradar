# Shared-data overlay on values-cluster.yaml: compute nodes (CN) with a local
# cache over an object-storage bucket. See README.md. Always layer both files.
#
# As committed it points at ServiceRadar's carverauto development bucket
# (serviceradar-demo-analytics on us-ord-10.linodeobjects.com, prefix
# starrocks/); point the storage volume at your own bucket. Never use the
# CNPG Barman destination.
#
# Credentials stay in Kubernetes Secret serviceradar-analytics-object-store
# (keys access_key_id / secret_access_key). The FE config does not embed
# them; helm/serviceradar CREATE STORAGE VOLUME job reads the secret.
#
# initPassword is inherited from values-cluster.yaml (always layer both files):
# the CN pods receive the same MYSQL_PWD as FE/BE, so the root-password Secret
# must exist before the install and equal the live root password.
# Existing clusters: use docs/starrocks-upgrade.md to roll CNs before FEs.
#
# run_mode cannot change on an existing cluster. Recreate starrocks-lab:
#   helm uninstall starrocks-lab -n starrocks
#   kubectl -n starrocks delete pvc -l app.starrocks.io/role=fe
#   kubectl -n starrocks delete pvc -l app.starrocks.io/role=be
#   helm upgrade --install starrocks-lab starrocks/starrocks \
#     --namespace starrocks --version 1.11.7 \
#     -f k8s/starrocks/values-cluster.yaml \
#     -f k8s/starrocks/values-cluster-shared-data.yaml

starrocksCluster:
  enabledBe: false
  enabledCn: true

starrocksFESpec:
  # As for the compute nodes below: carverauto runs the JDBC fetch with BusyBox wget, as it was installed.
  # carverauto has IPv6 egress, so wget works here; values-cluster.yaml keeps
  # curl for every other cluster (see README.md). Keeping the live form means
  # re-applying these files does not restart pods for an init-container edit.
  initContainers:
    - name: postgresql-jdbc
      image: alpine:3.21.3
      command:
        - sh
        - -c
        - |
          set -eu
          dest=/opt/starrocks/jdbc/postgresql.jar
          want=6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93
          if [ -f "$dest" ] && echo "$want  $dest" | sha256sum -c; then
            exit 0
          fi
          url="https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.13/postgresql-42.7.13.jar"
          i=0
          while [ "$i" -lt 5 ]; do
            if wget -T 30 -O "$dest" "$url"; then
              break
            fi
            i=$((i + 1))
            sleep 2
          done
          echo "$want  $dest" | sha256sum -c
      volumeMounts:
        - name: jdbc
          mountPath: /opt/starrocks/jdbc
  # enable_online_optimize_table: StarRocks 4.1.6 made online optimize opt-in
  # (default false). A bucket rewrite (ALTER TABLE ... DISTRIBUTED BY ...
  # BUCKETS n) that runs while EventWriter keeps loading needs the online
  # path: the fallback job blocks writes, and a load that lands during it
  # cancels the job. 4.1.3 defaulted to true; 3.5 and 4.0 default to false.
  config: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx6g -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    min_graceful_exit_time_second = 25
    run_mode = shared_data
    cloud_native_meta_port = 6090
    cloud_native_storage_type = S3
    enable_load_volume_from_conf = false


    # Re-enable online optimize (4.1.6 made it opt-in); needed for non-blocking bucket rewrites (#6360).
    enable_online_optimize_table = true

starrocksCnSpec:
  replicas: 3
  image:
    repository: starrocks/cn-ubuntu
    tag: "4.1.7"
  imagePullPolicy: IfNotPresent
  runAsNonRoot: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "unlimited"
      memory: 10Gi
  storageSpec:
    name: cn
    storageClassName: local-path
    storageSize: 50Gi
    logStorageSize: 5Gi
  emptyDirs:
    - name: jdbc
      mountPath: /opt/starrocks/jdbc
  # carverauto runs the JDBC fetch with BusyBox wget, as it was installed.
  # carverauto has IPv6 egress, so wget works here; values-cluster.yaml keeps
  # curl for every other cluster (see README.md). Keeping the live form means
  # re-applying these files does not restart pods for an init-container edit.
  initContainers:
    - name: postgresql-jdbc
      image: alpine:3.21.3
      command:
        - sh
        - -c
        - |
          set -eu
          dest=/opt/starrocks/jdbc/postgresql.jar
          want=6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93
          if [ -f "$dest" ] && echo "$want  $dest" | sha256sum -c; then
            exit 0
          fi
          url="https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.13/postgresql-42.7.13.jar"
          i=0
          while [ "$i" -lt 5 ]; do
            if wget -T 30 -O "$dest" "$url"; then
              break
            fi
            i=$((i + 1))
            sleep 2
          done
          echo "$want  $dest" | sha256sum -c
      volumeMounts:
        - name: jdbc
          mountPath: /opt/starrocks/jdbc
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.starrocks.io/component: cn
  # Memory: the 10Gi limit minus a fixed 3 GiB reserve (README.md, "Memory
  # sizing"), written as the percentage 70% so core can derive the reserve
  # it reports. The CN detects its 10 GiB cgroup limit and caps its process
  # at 90% of mem_limit: 6.3 GiB, leaving 3.7 GiB under the pod limit for
  # the ~1.4 GB StarRocks allocates outside its memory tracker. At 60% only
  # ~1 GB was left for queries and loads once caches were resident, so a
  # device page burst or a table rebuild pushed Stream Loads into "Memory of
  # process exceed limit". Change the pod limit and mem_limit together.
  # Core converges the three settings below at runtime on every warehouse
  # (README.md, "What core does"); they are set here too so a restarted CN
  # starts with them, and because StarRocks 4.1.7 cannot change
  # update_memory_limit_percent at runtime.
  # datacache_mem_size 10%: the memory tier sat at its full 20% cap while
  # reads are served by the disk datacache; halving it returns ~0.55 GB.
  # update_memory_limit_percent 30: primary-key index memory peaked at
  # ~0.77 GB, and the 60% default let it grow into query headroom.
  # lake_metadata_cache_limit: the "unattributed" CN memory was the lake
  # metadata cache, an LRU that only evicts under pressure and is not
  # reported by mem_tracker. At its 2 GiB default it held each CN at ~75% of
  # mem_limit and left too little for queries and loads (MEM_LIMIT_EXCEEDED
  # under a schema rewrite). After the #6360 bucket resize (~2,400 tablets),
  # 512 MiB is enough: measured on the lab, each CN dropped from ~75% to
  # ~44% of mem_limit with no load or query errors.
  config: |
    sys_log_level = INFO
    thrift_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    mem_limit = 70%
    lake_metadata_cache_limit = 536870912
    datacache_mem_size = 10%
    update_memory_limit_percent = 30
    storage_root_path = /opt/starrocks/cn/storage
