apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serviceradar-demo-prod
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/git-branch: staging
    argocd-image-updater.argoproj.io/image-list: webng=registry.carverauto.dev/serviceradar/serviceradar-web-ng
    argocd-image-updater.argoproj.io/webng.allow-tags: regexp:^sha-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/webng.helm.image-tag: global.imageTag
    argocd-image-updater.argoproj.io/webng.pull-secret: pullsecret:demo/registry-carverauto-dev-cred
    argocd-image-updater.argoproj.io/webng.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/serviceradar-forgejo-repo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.carverauto.dev/carverauto/serviceradar.git
    targetRevision: staging
    path: helm/serviceradar
    helm:
      releaseName: serviceradar
      # IMPORTANT: values-demo.yaml contains environment-specific overrides
      # including the CNPG cluster name. Never change clusterName without
      # migrating data first!
      valueFiles:
        - values-demo.yaml
      parameters:
        - name: global.imageTag
          value: sha-bc3dd677bc4b85ec3132265e9570a01fca418ca1

  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /status
    # Ignore CNPG cluster spec changes to prevent accidental data loss
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/instances
        - /spec/storage/size
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      # Prevent deletion of CNPG clusters during sync
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
