# Publishes only the fixture CA certificate (ca.crt) at
# https://srql-fixture-ca.serviceradar.cloud/ca.crt so runners without
# kubeconfig can fetch the current CA. Do not store that PEM in a CI secret.
#
# Public HTTPS is the shared Envoy gateway (23.138.124.5, wildcard
# *.serviceradar.cloud). A dedicated MetalLB Service on 23.138.124.18:443 is
# not reachable from workstations, so it cannot be the publish path.
# In-cluster ARC and the BuildBuddy workflow pool use the ClusterIP HTTP Service.
#
# Gateway TLS is the shared wildcard, not the fixture CA — otherwise fetching
# the CA would require the CA. The fixture CA private key is not in any volume
# here. The publisher is HTTP-only; Envoy terminates TLS. Do not put nginx
# back on this path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srql-fixture-ca-bundle-caddy
  namespace: srql-fixtures
  labels:
    app: srql-fixture
    app.kubernetes.io/component: fixture-ca-bundle
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
    }

    :8080 {
      header {
        -Server
        X-Content-Type-Options nosniff
      }

      handle /ca.crt {
        root * /var/lib/srql-fixture-ca
        file_server
        header Content-Type application/x-pem-file
        header Cache-Control "public, max-age=300"
      }

      handle {
        respond 404
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srql-fixture-ca-bundle
  namespace: srql-fixtures
  labels:
    app: srql-fixture
    app.kubernetes.io/component: fixture-ca-bundle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srql-fixture-ca-bundle
  template:
    metadata:
      labels:
        app: srql-fixture-ca-bundle
        app.kubernetes.io/component: fixture-ca-bundle
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-cp3-worker3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          imagePullPolicy: IfNotPresent
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ca.crt
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ca.crt
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # Binary is file-capped with cap_net_bind_service. Drop-only
              # makes `exec /usr/bin/caddy` fail with EPERM (same as
              # forgejo / powerdns-admin / plausible).
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: fixture-ca
              mountPath: /var/lib/srql-fixture-ca
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddy-config
          configMap:
            name: srql-fixture-ca-bundle-caddy
        - name: fixture-ca
          secret:
            secretName: srql-fixture-server-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Public path for runners without kubeconfig or cluster DNS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: srql-fixture-ca-bundle
  namespace: srql-fixtures
  labels:
    app: srql-fixture
    app.kubernetes.io/component: fixture-ca-bundle
  annotations:
    external-dns.alpha.kubernetes.io/hostname: srql-fixture-ca.serviceradar.cloud
spec:
  hostnames:
    - srql-fixture-ca.serviceradar.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serviceradar-shared-gateway
      namespace: serviceradar-system
      sectionName: https-web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serviceradar-shared-gateway
      namespace: serviceradar-system
      sectionName: http-web
  rules:
    - matches:
        - path:
            type: Exact
            value: /ca.crt
      backendRefs:
        - name: srql-fixture-ca-incluster
          port: 80
---
# In-cluster only. GitHub ARC runners in the carverauto cluster fetch the public
# CA here so they do not need kubectl or a path to the public VIP.
apiVersion: v1
kind: Service
metadata:
  name: srql-fixture-ca-incluster
  namespace: srql-fixtures
  labels:
    app: srql-fixture
    app.kubernetes.io/component: fixture-ca-bundle
spec:
  type: ClusterIP
  selector:
    app: srql-fixture-ca-bundle
  ports:
    - name: http
      port: 80
      targetPort: http
