apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: srql-fixture
  namespace: srql-fixtures
spec:
  description: Shared CNPG instance for SRQL API tests (Timescale + Apache AGE + PostGIS + pgvector)
  instances: 2
  # Always pin by digest as well as tag. A tag alone is mutable: 18.3.0-sr5 was
  # overwritten in place once, and Harbor then garbage-collected the manifest this
  # cluster was running, which is what caused the ImagePullBackOff outage.
  #
  # Deliberately NOT moved to 18.4.0-sr1. That image was built from
  # //docker/images:cnpg_image_amd64 and its timescaledb.so / age.so require
  # GLIBC_2.38, which the bookworm runtime (2.36) cannot provide -- Postgres dies
  # with "could not load library". See docker/images/cnpg_image.bzl for why, and
  # do not repin this cluster until an image built from that target actually starts.
  imageName: registry.carverauto.dev/serviceradar/serviceradar-cnpg:18.3.0-sr5@sha256:c349a1d34aef056f818630e0766501b5c98fa7598bdeee38d59d677a94cb18c9
  imagePullSecrets:
    - name: registry-carverauto-dev-cred

  storage:
    size: 20Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: srql_fixture
      owner: srql
      secret:
        name: srql-test-db-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE EXTENSION IF NOT EXISTS age;
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  postgresql:
    shared_preload_libraries:
      - timescaledb
      - age
      - pg_stat_statements
    pg_hba:
      - "hostnossl all all all reject"
      - "hostssl all all all scram-sha-256"
    parameters:
      max_connections: "200"
      shared_buffers: 512MB

  certificates:
    serverAltDNSNames:
      - srql-fixture.serviceradar.cloud

  managed:
    roles:
      - name: srql
        ensure: present
        login: true
        passwordSecret:
          name: srql-test-db-credentials
      - name: srql_hydra
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: srql-test-admin-credentials

  monitoring:
    enablePodMonitor: true
