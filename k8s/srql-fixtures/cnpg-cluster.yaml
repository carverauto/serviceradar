apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: srql-fixture
  namespace: srql-fixtures
spec:
  description: Shared CNPG instance for SRQL API tests (Timescale + Apache AGE + PostGIS + pgvector)
  instances: 2
  # Always pin by digest as well as tag. A tag alone is mutable: 18.3.0-sr5 was
  # overwritten in place once, and Harbor then garbage-collected the manifest this
  # cluster was running, which is what caused the ImagePullBackOff outage.
  #
  # sr1..sr3 are skipped deliberately. sr1 and sr2 do not start at all -- their
  # extensions were linked against the RBE executor's glibc (GLIBC_2.38 / an
  # unresolved __isoc23_strtoul). sr3 starts but its base was the bullseye 
  # tag, so PostGIS cannot load: libldap-2.5.so.0 is missing. sr4 is the first build
  # on the bookworm base with the extensions compiled under a sysroot from it.
  imageName: registry.carverauto.dev/serviceradar/serviceradar-cnpg:18.4.0-sr4@sha256:59e442dec59fac3149e3a3c49ba0cc2987bfb052bca1a0ea8c01b4bb31427d1d
  # Harbor has GC'd this digest before. IfNotPresent lets a TLS reload reuse the
  # node cache instead of taking the only primary down on a registry 404.
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: registry-carverauto-dev-cred

  # Postgres-role nodes only (k8s-cp2-cnpg1 / k8s-cp3-cnpg1), the same placement the other
  # dedicated CNPG clusters use: nodeSelector + toleration for the `cnpg.io/dedicated` taint,
  # storage on `local-path-cnpg` (/mnt/cnpg; the root disk there is small). Core Integration
  # lanes used to stall for seconds while the primary shared an oversubscribed worker VM with
  # an RBE executor and a workflow runner; the postgres-role VMs see almost no CPU steal.
  # With two instances and preferred anti-affinity, one instance lands on each node.
  #
  # Moving an existing cluster here does not happen by itself: local-path volumes are pinned
  # to their node, so a re-created pod stays Pending. Replace one instance at a time (destroy
  # the replica, let CNPG rebuild it here, switch over to it, then destroy the old primary),
  # and only while no CI run holds fixture connections.
  affinity:
    nodeSelector:
      cnpg.io/dedicated: "true"
    tolerations:
      - key: cnpg.io/dedicated
        operator: Equal
        value: "true"
        effect: NoSchedule

  # Sized from 7 days of use (2026-11-15) on the primary: CPU p95 2.7 cores, 5-minute peak
  # 6.5, 1-minute peak 13; memory RSS peak 7.3 GiB, working set peak 10.2 GiB. The request
  # reserves a share under contention; no CPU limit, because CFS throttling would bring back
  # the stalls this placement removes. The memory limit protects the other databases on these
  # nodes (30 GiB each).
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      memory: 16Gi

  storage:
    size: 20Gi
    storageClass: local-path-cnpg

  bootstrap:
    initdb:
      database: srql_fixture
      owner: srql
      secret:
        name: srql-test-db-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE EXTENSION IF NOT EXISTS age;
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  postgresql:
    shared_preload_libraries:
      - timescaledb
      - age
      - pg_stat_statements
    pg_hba:
      - "hostnossl all all all reject"
      - "hostssl all all all scram-sha-256"
    parameters:
      # Sized for concurrent CI. A full integration run (BazelCI, LargeIngestionGate) reserves
      # 114 pool slots (buildbuddy.yaml --required-pool-slots), and the connection observer
      # checks each run against this limit alone, not against slots other runs hold. At 200
      # (197 usable) two overlapping runs would need ~228 and fail with "too many clients".
      # 600 fits five concurrent full runs with the observer's 10% headroom. Changing it
      # restarts both instances (CNPG rolling restart with switchover), so apply it when no
      # CI run holds fixture connections.
      max_connections: "600"
      shared_buffers: 512MB

  # User-provided server TLS from cert-manager (cert-manager.yaml). Distinct
  # secret names so the operator never fights cert-manager for srql-fixture-ca
  # / srql-fixture-server. Client / streaming_replica certs stay operator-managed.
  certificates:
    serverCASecret: srql-fixture-server-ca
    serverTLSSecret: srql-fixture-server-tls

  managed:
    roles:
      - name: srql
        ensure: present
        login: true
        passwordSecret:
          name: srql-test-db-credentials
      - name: srql_hydra
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: srql-test-admin-credentials

  monitoring:
    enablePodMonitor: true
