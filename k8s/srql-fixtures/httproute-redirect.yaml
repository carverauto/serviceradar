apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: srql-fixture-ca-http-redirect
  namespace: srql-fixtures
  labels:
    app: srql-fixture
    app.kubernetes.io/component: fixture-ca-bundle
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-shared-gateway
      namespace: lan-edge
      sectionName: http-carverauto
  hostnames:
    - srql-fixture-ca.carverauto.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
