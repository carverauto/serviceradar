# Grafana picks this up from any namespace: the kiwigrid sidecar watches for
# ConfigMaps labelled grafana_dashboard=1 cluster-wide, so the dashboard ships
# next to Dgraph instead of in the monitoring namespace.
#
# Generated -- do not hand-edit. Change gen_dashboard.py and re-run:
#   python3 k8s/dgraph/demo/gen_dashboard.py
#   python3 k8s/dgraph/demo/render_configmap.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dgraph
  namespace: demo
  labels:
    grafana_dashboard: "1"
    app: dgraph
    app.kubernetes.io/managed-by: serviceradar
  annotations:
    grafana_folder: Dgraph
    k8s-sidecar-target-directory: /tmp/dashboards/Dgraph
data:
  dgraph.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Cluster",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Data nodes. Each group needs a quorum of its replicas. Matches on `endpoint` because `up` is synthesised by Prometheus and keeps the Service-derived job name that metricRelabelings rewrite everywhere else.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(up{namespace=\"demo\",endpoint=\"http-alpha\"} == 1)",
              "legendFormat": "alpha",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Alphas up",
          "type": "stat",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Cluster managers: membership, tablet placement, timestamps. Losing zero quorum stops new transactions even if alphas are fine.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "id": 3,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(up{namespace=\"demo\",endpoint=\"http-zero\"} == 1)",
              "legendFormat": "zero",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Zeros up",
          "type": "stat",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Any group without a leader cannot serve writes for its tablets.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "id": 4,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(count by (group) (dgraph_raft_has_leader{job=\"dgraph-alpha\"} == 1))",
              "legendFormat": "groups",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Groups with a leader",
          "type": "stat",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Steady state is exactly one leader per group and a flat leader-change rate. Churn here usually means the node is under memory or disk pressure.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 15,
            "x": 9,
            "y": 1
          },
          "id": 5,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (group) (dgraph_raft_is_leader{job=\"dgraph-alpha\"})",
              "legendFormat": "alpha group {{group}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (group) (dgraph_raft_is_leader{job=\"dgraph-zero\"})",
              "legendFormat": "zero group {{group}}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(dgraph_raft_leader_changes_total{job=\"dgraph-alpha\"}[15m]))",
              "legendFormat": "alpha leader changes/s",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Raft leadership",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 6,
          "panels": [],
          "title": "Queries and mutations",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Server.Query and Server.Mutate are the client-facing ones.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "id": 7,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (method) (rate(dgraph_num_queries_total{job=\"dgraph-alpha\"}[5m]))",
              "legendFormat": "{{method}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate by method",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Most dgraph_latency series carry empty method/status labels, so this is aggregate request latency rather than a per-method split.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "id": 8,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(dgraph_latency_bucket{job=\"dgraph-alpha\"}[5m])))",
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(dgraph_latency_bucket{job=\"dgraph-alpha\"}[5m])))",
              "legendFormat": "p95",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(dgraph_latency_bucket{job=\"dgraph-alpha\"}[5m])))",
              "legendFormat": "p99",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Latency quantiles",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Pending proposals climbing while mutations stay flat means raft is the bottleneck, not the client.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "id": 9,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(dgraph_pending_queries_total{job=\"dgraph-alpha\"})",
              "legendFormat": "pending queries",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(dgraph_active_mutations_total{job=\"dgraph-alpha\"})",
              "legendFormat": "active mutations",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(dgraph_pending_proposals_total{job=\"dgraph-alpha\"})",
              "legendFormat": "pending raft proposals",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "In flight",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 10,
          "panels": [],
          "title": "Transactions and cache",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "A rising abort rate is contention: concurrent transactions touching the same predicates.",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "id": 11,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(dgraph_txn_commits_total{job=\"dgraph-alpha\"}[5m]))",
              "legendFormat": "commits/s",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(dgraph_txn_aborts_total{job=\"dgraph-alpha\"}[5m]))",
              "legendFormat": "aborts/s",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Transaction outcomes",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Low posting-cache hit ratio with healthy disk usually just means the working set does not fit in the cache.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "id": 12,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "avg(dgraph_hit_ratio_posting_cache{job=\"dgraph-alpha\"})",
              "legendFormat": "posting cache",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "avg(dgraph_hit_ratio_postings_block{job=\"dgraph-alpha\"})",
              "legendFormat": "postings block",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "avg(dgraph_hit_ratio_postings_index{job=\"dgraph-alpha\"})",
              "legendFormat": "postings index",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Cache hit ratios",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "max_assigned_ts should always be moving forward; a flat line with active mutations means zero is not handing out timestamps.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "id": 13,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(dgraph_num_edges_total{job=\"dgraph-alpha\"}[5m]))",
              "legendFormat": "edges/s",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max(dgraph_max_assigned_ts{job=\"dgraph-alpha\"})",
              "legendFormat": "max assigned ts",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Edges and timestamps",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "id": 14,
          "panels": [],
          "title": "Storage and resources",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The storage engine under each alpha. A vlog much larger than the LSM tree means value-log GC is behind.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 25
          },
          "id": 15,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (badger_size_bytes_lsm{job=\"dgraph-alpha\"})",
              "legendFormat": "{{pod}} LSM",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (badger_size_bytes_vlog{job=\"dgraph-alpha\"})",
              "legendFormat": "{{pod}} vlog",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Badger store size",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Dgraph refuses writes long before the volume is completely full.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 25
          },
          "id": 16,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "dgraph_disk_used_bytes{job=\"dgraph-alpha\"}",
              "legendFormat": "{{pod}} used",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "dgraph_disk_free_bytes{job=\"dgraph-alpha\"}",
              "legendFormat": "{{pod}} free",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Disk used",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Process RSS well above in-use is Go holding freed memory; sustained growth in in-use is the one to worry about.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 25
          },
          "id": 17,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "dgraph_memory_inuse_bytes{job=\"dgraph-alpha\"}",
              "legendFormat": "{{pod}} in use",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "dgraph_memory_proc_bytes{job=\"dgraph-alpha\"}",
              "legendFormat": "{{pod}} process",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "dgraph_memory_alloc_bytes{job=\"dgraph-alpha\"}",
              "legendFormat": "{{pod}} alloc",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Memory",
          "type": "timeseries",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "dgraph",
        "demo",
        "serviceradar"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Dgraph (demo)",
      "uid": "dgraph-demo",
      "version": 1
    }
