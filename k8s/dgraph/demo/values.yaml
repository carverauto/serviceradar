# Dgraph for the demo deployment -- the "HA Cluster" pattern from
# https://docs.dgraph.io/installation/deployment-patterns : 3 Zeros, 3 Alphas, replication 3,
# ONE group. Deliberately not the multi-group "Distributed HA" pattern; see README, "Scaling".
#
# Deploy: ./deploy-dgraph.sh demo

image:
  # Harbor mirror, not Docker Hub: the cluster pulls locally, which removes the Hub rate limit
  # from the critical path and keeps image pulls working when egress does not.
  # Re-mirror with ./deploy-dgraph.sh mirror after bumping the tag.
  registry: registry.carverauto.dev
  repository: mirror/dgraph/dgraph
  tag: v25.4.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: dgraph

zero:
  # 3 for quorum: an odd count that tolerates one loss. 2 would tolerate none -- it needs both
  # to reach majority -- and 4 tolerates the same one failure as 3 while adding a round trip.
  replicaCount: 3
  # Replication factor: each group is served by 3 Alphas, tolerating 1 failure. Odd on purpose,
  # same quorum arithmetic as above. Chart default is 5, which would demand 5 Alphas per group.
  shardReplicaCount: 3

  antiAffinity: soft

  persistence:
    enabled: true
    size: 32Gi

  # Zero holds membership and tablet metadata, not graph data, so it stays small.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

alpha:
  # 3 Alphas = exactly one group at replication 3. Adding a 4th or 5th does NOT add capacity:
  # a group's size is fixed by shardReplicaCount, so growth comes in whole groups of 3.
  replicaCount: 3

  antiAffinity: soft

  persistence:
    enabled: true
    size: 250Gi

  # Sized against "Small Production" in the deployment-patterns guide (8 cores / 16GB / 250GB
  # SSD), and biased toward cores on purpose: write throughput scales with cores per node and
  # degrades with nodes per group (README, "Scaling").
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi

  # SERVER TLS WITH REAL VERIFICATION.
  #
  # The certificate comes from cert-manager (./certificate.yaml) via `carverauto-issuer`, an
  # ACME/Let's Encrypt issuer. That matters for the client, not for Dgraph: the chain ends at a
  # public root that is ALREADY in every container's trust store, so rust/dgraph-client's
  # `sslmode=verify-ca` -- which can only use system roots -- authenticates the server with no
  # CA plumbing at all. A privately-issued certificate would not, however correct it is.
  tls:
    enabled: true
    # EMPTY ON PURPOSE. templates/alpha/secret-tls.yaml only creates the secret when this is
    # non-empty, while the StatefulSet mounts it either way -- so leaving it empty hands
    # ownership to cert-manager (./certificate.yaml) and renewal reaches the pod with no copy
    # step and no operator. Filling it in would put the private key in this file and freeze it.
    files: {}

  configFile:
    config.yaml:
      security:
        # The demo namespace is the trust boundary; the gRPC endpoint is what is exposed.
        whitelist: 10.42.0.0/16,10.43.0.0/16

  # Dgraph looks for ca.crt/node.crt/node.key; cert-manager writes ca.crt/tls.crt/tls.key and
  # its key names are not configurable. Pointing Dgraph at the paths it actually has is what
  # removes the rename -- and with it a copy job that would have to re-run on every renewal.
  extraFlags: >-
    --tls "ca-cert=/dgraph/tls/ca.crt; server-cert=/dgraph/tls/tls.crt;
    server-key=/dgraph/tls/tls.key; internal-port=true"

  # gRPC ingress for external clients. The host must match the certificate SAN in
  # ./certificate.yaml, and rust/dgraph-client must dial that same name -- verification is
  # against the name it dialed, not the address it reached.
  ingress_grpc:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: GRPCS
      external-dns.alpha.kubernetes.io/hostname: dgraph.serviceradar.cloud
    hosts:
      - host: dgraph.serviceradar.cloud
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dgraph-alpha-tls
        hosts:
          - dgraph.serviceradar.cloud

ratel:
  enabled: false

backups:
  full:
    enabled: false
  incremental:
    enabled: false
