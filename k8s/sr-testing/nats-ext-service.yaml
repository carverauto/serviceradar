apiVersion: v1
kind: Service
metadata:
  name: sr-testing-nats-ext
  labels:
    app: sr-testing-nats
  annotations:
    # LAN-only MetalLB pool (192.168.6.80/28). Not a public edge VIP.
    metallb.universe.tf/address-pool: k3s-lan-pool
    metallb.io/address-pool: k3s-lan-pool
    external-dns.alpha.kubernetes.io/hostname: sr-testing-nats.serviceradar.cloud.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.6.90
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges:
    - 10.0.0.0/8
    - 192.168.0.0/16
    - 172.16.0.0/12
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  selector:
    app: sr-testing-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
