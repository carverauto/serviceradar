image:
  repository: gcr.io/flame-public/buildbuddy-executor-enterprise
  # Do not go back below v2.290.0 without reading openspec/notes/UPSTREAM_BB.md.
  #
  # v2.206.0 carried a 12 KB VM log tail buffer. When guest init dies -- for example
  # because the action image has no `docker` binary and `init-dockerd` was requested --
  # it kills PID 1, which panics the kernel, and the panic dump evicts the one "die: "
  # line that explains the failure before the executor can read it. The operator is left
  # with "failed to connect to VM: context deadline exceeded" and no cause.
  #
  # Upstream ecf5e118 (#11901, 2026-04-16) raised that buffer to 128 KB in v2.290.0 ,
  # which is what makes the real error survive.
  tag: enterprise-v2.290.0
  imagePullPolicy: IfNotPresent

replicas: 3

autoscaler:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  averageQueueLength: 5

resources:
  requests:
    cpu: "8"
    memory: "16Gi"
    ephemeral-storage: "45Gi"
  limits:
    cpu: "16"
    memory: "32Gi"
    ephemeral-storage: "50Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - k8s-cp3-worker3

extraVolumes:
  - name: cache-volume
    hostPath:
      path: /var/lib/buildbuddy/cache
      type: DirectoryOrCreate
  # Mount a Docker config with auth (secret must be created separately, e.g.
  # kubectl -n buildbuddy create secret docker-registry dockerhub-auth ...).
  - name: dockerhub-auth
    secret:
      secretName: dockerhub-auth
      items:
        - key: .dockerconfigjson
          path: config.json

extraVolumeMounts:
  - name: cache-volume
    mountPath: /cache
  - name: dockerhub-auth
    mountPath: /root/.docker
    readOnly: true

config:
  executor:
    # Makes goinit pass -enable_rootfs, so the guest mounts a single ext4 root
    # instead of overlayfs-over-ext4. Required for Docker-in-Firecracker: on an
    # overlayfs root, docker's overlay2 driver is nested and cannot set
    # trusted.overlay.opaque, so any image with an opaque dir fails to extract
    # ("failed to convert whiteout file ... operation not supported").
    enable_local_snapshot_sharing: true
    app_target: grpcs://remote.buildbuddy.io:443
    enable_oci: true
    default_isolation_type: oci
    enable_firecracker: true
    firecracker_debug_stream_vm_logs: true
    # Floor for VM sizing; without it predicted sizes are used verbatim and a
    # Firecracker VM can end up too small to unpack its own 49 MB initrd
    # ("Initramfs unpacking failed" -> "No working init found" panic).
    #
    # estimated_memory_bytes is an int64 COUNT OF BYTES (scheduler.proto TaskSize),
    # not a k8s quantity. "2Gi" here does not parse. That syntax belongs to the
    # separate EstimatedMemory exec_property in the Bazel platform definitions.
    default_task_size:
      estimated_milli_cpu: 2000
      estimated_memory_bytes: 2147483648 # 2 GiB
    image_pull_timeout: 15m
    startup_warmup_max_wait_secs: 300
    warmup_timeout_secs: 300
    warmup_additional_images:
      - registry.carverauto.dev/serviceradar/rbe-executor:v1.0.24.1
    oci:
      mounts:
        - source: /cache
          destination: /cache
          type: bind
          options:
            - rbind
            - rw
    local_cache_directory: /cache
    local_cache_size_bytes: 50000000000
    root_directory: /cache/remotebuilds/
    api_key: ""
