image:
  repository: gcr.io/flame-public/buildbuddy-executor-enterprise
  tag: enterprise-v2.206.0
  imagePullPolicy: IfNotPresent

replicas: 3

autoscaler:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  averageQueueLength: 5

resources:
  requests:
    cpu: "8"
    memory: "16Gi"
    # Firecracker + init-dockerd needs room for container rootfs (~12Gi) plus
    # scratch. 25Gi was too small when default free-disk was 20Gi (Marvin).
    ephemeral-storage: "45Gi"
  limits:
    cpu: "16"
    memory: "32Gi"
    ephemeral-storage: "50Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - k8s-cp3-worker3

extraVolumes:
  - name: cache-volume
    hostPath:
      # Live cluster path (do not switch back to /var/lib without migrating).
      path: /mnt/buildbuddy/cache
      type: DirectoryOrCreate
  # Mount a Docker config with auth (secret must be created separately, e.g.
  # kubectl -n buildbuddy create secret docker-registry dockerhub-auth ...).
  - name: dockerhub-auth
    secret:
      secretName: dockerhub-auth
      items:
        - key: .dockerconfigjson
          path: config.json

extraVolumeMounts:
  - name: cache-volume
    mountPath: /cache
  - name: dockerhub-auth
    mountPath: /root/.docker
    readOnly: true

config:
  executor:
    app_target: grpcs://remote.buildbuddy.io:443
    enable_oci: true
    # Firecracker is the intended default for Docker-in-RBE (Dgraph/PG E2E).
    # OCI rollback (#4759) was temporary after invalid EstimatedMemory units
    # ("8GB") and undersized free-disk + 25Gi ephemeral caused VM init panics.
    default_isolation_type: firecracker
    enable_firecracker: true
    # Sizing for Firecracker microVMs when actions omit exec_properties.
    # Do NOT set estimated_free_disk_bytes here: BB default is ~100Mi, and each
    # additional VM only pays image size once. A 20Gi free-disk default plus
    # ~12Gi init-dockerd exceeded the old 25Gi pod ephemeral limit and produced
    # zero-size virtio disks + "Attempted to kill init" panics.
    # Request larger free disk only on docker/DB test targets via exec_properties.
    default_task_size:
      estimated_milli_cpu: 4000
      estimated_memory_bytes: 8589934592 # 8 GiB
    image_pull_timeout: 15m
    startup_warmup_max_wait_secs: 300
    warmup_timeout_secs: 300
    warmup_additional_images:
      - registry.carverauto.dev/serviceradar/rbe-executor:v1.0.23
    oci:
      mounts:
        - source: /cache
          destination: /cache
          type: bind
          options:
            - rbind
            - rw
    local_cache_directory: /cache
    local_cache_size_bytes: 50000000000
    root_directory: /cache/remotebuilds/
    api_key: ""
