image:
  repository: gcr.io/flame-public/buildbuddy-executor-enterprise
  # Do not go back below v2.290.0 without reading openspec/notes/UPSTREAM_BB.md.
  #
  # v2.206.0 carried a 12 KB VM log tail buffer. When guest init dies -- for example
  # because the action image has no `docker` binary and `init-dockerd` was requested --
  # it kills PID 1, which panics the kernel, and the panic dump evicts the one "die: "
  # line that explains the failure before the executor can read it. The operator is left
  # with "failed to connect to VM: context deadline exceeded" and no cause.
  #
  # Upstream ecf5e118 (#11901, 2026-04-16) raised that buffer to 128 KB in v2.290.0 ,
  # which is what makes the real error survive.
  tag: enterprise-v2.290.0
  imagePullPolicy: IfNotPresent

replicas: 3

# Disabled in favour of ./scaledobject.yaml (KEDA).
#
# The chart's HPA reads buildbuddy_remote_execution_queue_length as a Pods metric from
# custom.metrics.k8s.io, which is not registered on this cluster -- there is no
# prometheus-adapter. It therefore reported `<unknown>/5` and logged FailedGetPodsMetric
# 163,082 times over 28 days while the fleet sat pinned at minReplicas=3 and builds queued.
#
# KEDA is already installed and already serves external.metrics.k8s.io, so the scaler there
# reads the same series without adding another component. Leave this false: with both
# enabled, two controllers drive the same Deployment's replica count and fight.
#
# Scaling bounds now live in scaledobject.yaml (min 3 / max 10, unchanged).
autoscaler:
  enabled: false

resources:
  requests:
    cpu: "16"
    memory: "16Gi"
    ephemeral-storage: "45Gi"
  limits:
    cpu: "32"
    memory: "32Gi"
    ephemeral-storage: "50Gi"

# k8s-cp3-worker3 used to be NotIn here after the 2026-08-09 DiskPressure incident
# (BuildBuddy hostPath on /var/lib/buildbuddy filling the OS disk). That cache was
# purged and moved to /mnt/buildbuddy; on 2026-08-24 kubelet DiskPressure was False
# with 329G free of 589G on that node. Leaving it excluded only stranded a 1.2T
# cache disk. Do not put caches back on root.

extraVolumes:
  - name: cache-volume
    hostPath:
      # Dedicated BB disk on each worker (xfs /mnt/buildbuddy). Do not use /var/lib (root).
      path: /mnt/buildbuddy/cache
      type: DirectoryOrCreate
  # Bazel client caches (disk, repository, repo contents). Its own volume so a fresh runner
  # starts warm, and so the 100 GB of small files are not walked by the filecache startup scan.
  - name: bazel-cache-volume
    hostPath:
      path: /mnt/buildbuddy/bazel-caches
      type: DirectoryOrCreate
  - name: dockerhub-auth
    secret:
      secretName: dockerhub-auth
      items:
        - key: .dockerconfigjson
          path: config.json

extraVolumeMounts:
  - name: cache-volume
    mountPath: /cache
  - name: bazel-cache-volume
    mountPath: /bazel-caches
  - name: dockerhub-auth
    mountPath: /root/.docker
    readOnly: true

# Kept in step with ./values-workflows.yaml, which is the fleet that needs it: kubelet creates a
# `DirectoryOrCreate` hostPath as root:root 0755, and a non-root action container cannot write
# into the bind mount below. Action containers here run as root (//docker/Dockerfile.rbe sets no
# USER), so this fleet does not hit it today -- but the two files move together, and an image
# that ever gains a USER would fail exactly as the workflow runner did.
#
# Non-recursive on purpose: a `chown -R` would walk a 100 GB cache on every pod start.
extraInitContainers:
  - name: bazel-cache-perms
    # The executor's own image: already on the node under imagePullPolicy IfNotPresent, so this
    # costs no pull. Keep the tag in step with `image` above.
    image: gcr.io/flame-public/buildbuddy-executor-enterprise:enterprise-v2.290.0
    securityContext:
      # The image sets no USER so this is already true; explicit so a future base image that
      # adds one cannot silently turn the chown into a no-op failure.
      runAsUser: 0
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /bazel-caches/disk /bazel-caches/repo /bazel-caches/repo-contents
        chown 1001:1001 /bazel-caches /bazel-caches/disk /bazel-caches/repo /bazel-caches/repo-contents
    # The three names are //.bazelrc `build:ci --{disk,repository,repo_contents}_cache`. Nothing
    # checks the pairing: a rename there just makes Bazel create an unowned directory and fail.
    volumeMounts:
      - name: bazel-cache-volume
        mountPath: /bazel-caches

config:
  executor:
    # Firecracker guest rootfs / snapshot sharing: it made goinit pass -enable_rootfs so the
    # guest mounted a single ext4 root instead of overlayfs-over-ext4, which Docker-in-VM
    # needed (on an overlayfs root docker's overlay2 driver is nested and cannot set
    # trusted.overlay.opaque, so any image with an opaque dir fails to extract).
    #
    # Inert now that no fleet sets enable_firecracker. Kept because it costs nothing while
    # off and is the setting to restore alongside it.
    enable_local_snapshot_sharing: true
    # The org's own BuildBuddy instance, not BuildBuddy cloud.
    #
    # This is the executor's control AND data plane, not a reporting link: over it the
    # executor registers with the scheduler, receives task assignments, and reads action
    # inputs from / writes outputs to the CAS. `local_cache_directory` below is a local
    # cache OF that remote CAS.
    #
    # It therefore has to name the same instance the Bazel client talks to
    # (build:ci in //.bazelrc). Pointed at remote.buildbuddy.io -- BuildBuddy's cloud --
    # this fleet registers with a scheduler that CI never sends work to, so the executors
    # sit idle while builds run locally on the CI runner.
    app_target: grpcs://carverauto.buildbuddy.io:443

    # THE CACHE DATA PLANE, SPLIT OFF FROM app_target ABOVE.
    #
    # This is the setting that makes the in-cluster cache proxy do anything. Left unset,
    # `executor.cache_target` DEFAULTS TO app_target -- so a fully deployed, registered
    # proxy showing up in the Cache Proxy tab still carries zero traffic, because nothing
    # ever addressed it. That is the whole failure mode: nothing is misconfigured, nothing
    # logs an error, the proxies simply sit idle.
    #
    # WHAT MOVES: ByteStream, ContentAddressableStorage, ActionCache, Capabilities and the
    # OCI fetcher (see initializeCacheClientsOrDie in the executor). That is every action
    # input read and every action output write -- across 3-10 executors at --jobs=100, the
    # bulk of the WAN traffic this cluster generates.
    #
    # WHAT DOES NOT: scheduler registration, task assignment and execution status stay on
    # app_target. The proxy is a cache and hosts none of those, so the two targets are not
    # interchangeable and app_target must keep naming the app.
    #
    # RELATED FLAG, DELIBERATELY UNSET: executor.cache_target_traffic_percent. At its -1
    # default it means "100% to cache_target when one is set", which is what we want. Setting
    # it to anything between 1 and 99 splits reads across both backends via a conn pool
    # splitter -- useful for a canary, and a silent tax on hit rate if left behind.
    #
    # plaintext grpc:// on 1985: the chart exposes the TLS port only when
    # service.externalGRPCSPort is set, and it is not. Cluster-internal only.
    cache_target: grpc://bb-cache-proxy-buildbuddy-enterprise-cache-proxy.buildbuddy.svc.cluster.local:1985

    # IN-CLUSTER ACCESS FROM ACTIONS. Without this an action reaches the public internet and
    # NOTHING on the cluster network.
    #
    # BuildBuddy REJECTs every RFC1918 destination from an action's network namespace by
    # default -- server/util/networking/networking.go builds, per container network:
    #
    #   for allow in task_allowed_private_ips: -I FORWARD/INPUT -d <allow> -j ACCEPT
    #   for r in {10/8, 172.16/12, 192.168/16, 169.254/16}: -I FORWARD/INPUT -d <r> -j REJECT
    #
    # inserted so the allowlist sits above the rejects. That is SSRF protection, not a routing
    # accident, and REJECT (not DROP) is why the symptom is an instant "Connection refused"
    # rather than a timeout -- so it reads like a dead service instead of a firewall.
    #
    # BOTH CIDRs are required, and the pod one is the non-obvious half: kube-proxy DNATs a
    # ClusterIP to a pod IP in nat PREROUTING, which runs BEFORE the filter FORWARD chain, so
    # by the time these rules match, the destination is already 10.42.x.x. Allowing only the
    # service CIDR leaves every ClusterIP connection rejected at its rewritten address.
    #
    # Deliberately NOT 10.0.0.0/8, which would also expose the node subnet (10.0.2.0/24) and
    # everything else on it. 169.254/16 stays blocked -- that is cloud metadata.
    task_allowed_private_ips:
      - 10.42.0.0/16 # pod CIDR: what a ClusterIP is rewritten to
      - 10.43.0.0/16 # service CIDR: ClusterIPs, including CoreDNS
      # LAN shared-gateway VIP. CI fetches fixture CA bundles at
      # https://srql-fixture-ca.carverauto.dev/ca.crt and
      # https://dgraph-ci-ca.carverauto.dev/ca.crt, which resolve to this address.
      # Calico BGP keeps the dest IP as the VIP (no kube-proxy DNAT to 10.42), so
      # without this allow the HTTPS fetch is Connection refused and looks like a
      # dead publisher. /32 on purpose: do not widen to 192.168.0.0/16.
      - 192.168.6.87/32

    enable_oci: true
    default_isolation_type: oci
    # NO enable_firecracker ON EITHER FLEET.
    #
    # Exactly one target ever asked for it -- //rust/dgraph-client/tests:acceptance_tests,
    # via `test.workload-isolation-type: firecracker` and `test.init-dockerd: true` -- and
    # that target is tagged `manual` ("Disabled for the time being until a proper DGraph
    # instance is in the CI cluster"), so no wildcard pattern selects it and neither CI step
    # dispatches a firecracker task. Verify before assuming otherwise:
    #
    #   bazel query 'attr("tags", "manual", tests(//rust/dgraph-client/...))'
    #   grep -rn workload-isolation-type --include=*.bazel .
    #
    # Re-enabling that suite means restoring `enable_firecracker: true` and
    # `firecracker_debug_stream_vm_logs: true` HERE, on the default pool, because the target
    # names no pool. Do not restore it in ./values-workflows.yaml: a microVM has no route to
    # the service CIDR and no CoreDNS, which is what cost that pool its access to the
    # in-cluster CA bundle and the fixture database.
    # Floor for task sizing; without it a predicted size is used verbatim and can
    # under-reserve. Under Firecracker this also kept a VM from being too small to unpack
    # its own 49 MB initrd ("Initramfs unpacking failed" -> "No working init found" panic);
    # that failure mode is gone with the microVM, the floor is still wanted.
    #
    # estimated_memory_bytes is an int64 COUNT OF BYTES (scheduler.proto TaskSize),
    # not a k8s quantity. "2Gi" here does not parse. That syntax belongs to the
    # separate EstimatedMemory exec_property in the Bazel platform definitions.
    default_task_size:
      estimated_milli_cpu: 2000
      estimated_memory_bytes: 2147483648 # 2 GiB
    image_pull_timeout: 15m
    startup_warmup_max_wait_secs: 300
    warmup_timeout_secs: 300
    warmup_additional_images:
      - registry.carverauto.dev/serviceradar/rbe-executor:v1.0.24.3
    oci:
      # CoreDNS, by its ClusterIP -- reachable only because of task_allowed_private_ips above.
      #
      # `executor.oci.dns` defaults to "8.8.8.8", and the runtime writes a resolv.conf holding
      # that single nameserver into every action container, then bind-mounts it over
      # /etc/resolv.conf (ociruntime.go:642 and :1340). That is why *.svc.cluster.local came
      # back NXDOMAIN from a resolver that answered perfectly well.
      #
      # ONE nameserver serves both worlds: the Corefile ends in `forward . /etc/resolv.conf`,
      # so CoreDNS answers cluster.local authoritatively and forwards everything else upstream.
      dns: "10.43.0.10"

      # On Disk cache
      mounts:
        # A dedicated path, NOT /root: mounting over the runner's home broke `git init`.
        - source: /bazel-caches
          destination: /bazel-cache
          type: bind
          options:
            - rbind
            - rw
    local_cache_directory: /cache
    # Read-through cache OF the remote CAS named by app_target above. Every eviction here
    # becomes a re-fetch across the WAN, so this wants to be as large as the node disk
    # tolerates rather than as small as it can get away with.

    # Change it only while watching `kubectl get nodes` for DiskPressure, because
    # `root_directory` below shares this filesystem and is NOT counted against this budget --
    # concurrent action working dirs spike outside it.
    #
    # Plain int64 byte count, not a k8s quantity: "100Gi" does not parse here. It also does
    # NOT draw against the ephemeral-storage limit above, because /cache is a hostPath.
    local_cache_size_bytes: 100000000000
    root_directory: /cache/remotebuilds/
    api_key: ""
