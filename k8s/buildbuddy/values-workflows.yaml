# Executor fleet dedicated to BuildBuddy Workflow runners. Deployed as a SEPARATE helm
# release from ./values.yaml -- see "Two fleets" in ./README.md for the deploy command.
#
# THE RELEASE NAME AND THE `-f` MUST MATCH, AND NOTHING ENFORCES IT.
# `helm upgrade buildbuddy-workflows ... -f values.yaml` is accepted silently and turns this
# release into a second copy of the build fleet: no poolName (so it registers into the DEFAULT
# pool and `workflows` goes empty), replicas 3, and the build fleet's bazel-caches hostPath and
# cache budgets. No error at any
# layer -- the next staging push just fails with `no registered executors in pool "workflows"`,
# which reads like the fleet was never deployed. This has happened once. Check what is actually
# deployed rather than what the file says:
#
#   helm get values buildbuddy-workflows -n buildbuddy | grep -E 'poolName|replicas'
#
# WHY A SECOND FLEET RATHER THAN A BIGGER FIRST ONE.
#
# The workflow runner in //buildbuddy.yaml is one long-lived task that wants ~32GB: it holds a
# Bazel server over ~2,000 targets, uploads inputs for --jobs=100 concurrent remote actions
# over the WAN, and runs database-facing TestRunner actions locally against shared CNPG while
# their compile/link actions remain remote.
#
# Raising ./values.yaml to suit it would reserve that on all three build executors, because
# `requests` is what the kube scheduler holds, not what is used. It would also let one runner
# consume an executor that remote execution needs: the runner and the build fan-out would be
# competing for the same three pods, which is the problem this file exists to remove.
#
# So: one pod, sized for the runner, in its own pool. Build actions never land here and the
# runner never lands on a build executor.

# The whole point of the file. The chart puts this on the executor's own registration, and
# //buildbuddy.yaml names it as `pool: "workflows"`.
#
# TOP-LEVEL, a sibling of `image`/`replicas` -- NOT under `config.executor`. Nested there it is
# silently ignored, the executor registers into the default pool, and the workflow lands on a
# build executor exactly as before.
poolName: workflows

image:
  repository: gcr.io/flame-public/buildbuddy-executor-enterprise
  # Kept in lockstep with ./values.yaml. See the note there before moving either: below
  # v2.290.0 a 12 KB VM log tail buffer discards the one line explaining a guest-init death.
  tag: enterprise-v2.290.0
  imagePullPolicy: IfNotPresent

# One runner at a time. Neither action in //buildbuddy.yaml sets `allow_concurrent_runs`, so a
# second run (another PR's BazelCI, or the daily Elixir quality cron) queues rather than
# needing a second pod.
replicas: 1

# Both scalers off, deliberately and for different reasons.
#
# The chart's HPA is off for the same reason as in ./values.yaml: it reads a Pods metric from
# custom.metrics.k8s.io, which is not registered on this cluster.
#
# KEDA does not touch this fleet at all, and that is not something this file controls:
# ./scaledobject.yaml targets the Deployment `buildbuddy-buildbuddy-executor` by name. A
# second helm release produces a differently-named Deployment, so it falls outside that
# scaler. If this release is ever renamed to collide, KEDA would start driving it to
# minReplicaCount 3.
autoscaler:
  enabled: false

# Sized for ONE 40GB BazelCI run (//buildbuddy.yaml). limits.memory is 56Gi, matching farm01,
# which advertises that full limit (60,129,542,144 bytes, no 10 GB reserve). One 40GB task
# fits. Two 40GB tasks are 80GB and do not, so a second run is not placed on this pod while
# the first still holds its runner. A 50GB benchmark still fits alone. requests 40Gi reserves
# that one run. The 120Gi emptyDir holds one in-flight ~22G disk cache; a second runner here
# would put another beside it.
#
# 2026-09-27: a run's non-reclaimable memory (cgroup `anon` of this pod, which includes the runner
# containers) peaked at 31.2 GiB (~33.5 GB) over an hour of BazelCI/LargeIngestionGate runs; the
# rest is reclaimable page cache. Prometheus/cAdvisor cannot see it (the runner containers sit
# outside the executor process and it reports ~0.4 GiB).
#
# MEASURED 2026-09-27 at the previous 80Gi limit: the startup line read
# "Memory: 0 of 85,899,345,920 bytes allocated" -- the FULL limit, no reserve. That is why two
# 40GB runs fit an 80Gi pod and do not fit this 56Gi one.
# Re-check the startup line after any chart or image change rather than trusting either rule.
#
# THE TWO FIELDS DO DIFFERENT JOBS, AND IT IS `limits` THAT SIZES TASKS.
#
#   requests -> what the kube scheduler reserves on a node. Governs whether the POD schedules.
#   limits   -> what this fleet advertises as assignable, in full (no 10 GB reserve).
#               Governs whether a TASK can be placed on it.
#
# An earlier chart, at a 64Gi limit, did subtract a flat 10 GB:
#
#   Initialized task scheduler: CPU: 0 of 16,000 milliCPU allocated,
#   Memory: 0 of 58,719,476,736 bytes allocated
#
#   limits.memory 64Gi = 68,719,476,736
#   advertised         = 58,719,476,736   <- exactly 10,000,000,000 less
#   limits.cpu "16"   -> 16,000 milliCPU  <- CPU is the limit, not reduced
#
# That subtraction is still what ./values.yaml's build fleet shows (32Gi - 10e9 = 22.7 GiB),
# which is why a 24 GiB task was rejected there while 14 GiB fit. This fleet does not: the
# 2026-09-27 line at 80Gi was the full limit, and the 56Gi limit above is advertised whole.
# Do not subtract 10 GB from it.
#
# SIZING HISTORY -- every step measured, none guessed. Each quoted line is BuildBuddy's own
# low-memory notice, whose "total" is the ASSIGNABLE figure, not the cgroup limit:
#   14 GiB action, 24Gi limits -> "31.24GB used of 15.03GB total", survived, far too tight
#   28 GiB action, 40Gi limits -> "35.31GB used of 30.06GB total", survived, still short
#   32 GiB action, 48Gi limits -> 38.7 GiB assignable, only ~6 GB over that 35.31GB peak
#   32 GiB action, 64Gi limits -> that 64Gi configuration, 54.7 GiB assignable
#
# Surviving well over the cgroup limit each time means most of that usage is reclaimable page
# cache -- disk-cache writes and --jobs=100 input uploads -- rather than resident demand. That
# is why headroom matters more than an exact fit.
#
# ORDER OF OPERATIONS. Deploy this file FIRST, then push the matching //buildbuddy.yaml change.
# The action reads its size from the repo at push time, so raising it before the fleet has the
# capacity fails the run outright with "can fit a task with ...". After deploying, confirm the
# new advertisement rather than trusting the arithmetic:
#   kubectl logs -n buildbuddy -l app.kubernetes.io/instance=buildbuddy-workflows --tail=200 \
#     | grep "Initialized task scheduler"
#
# `requests` schedules comfortably at the value below: each cp2/cp3 worker has ~168 GiB
# allocatable and was 13-24% requested back when the request was 56Gi (now 40Gi, not
# re-measured). requests < limits makes this Burstable rather than
# Guaranteed QoS: if the kubelet ever evicts the runner under node pressure, raising requests
# is the fix -- but check node allocatable first, because a request nothing satisfies leaves
# the pod Pending and the workflow then fails exactly as if the fleet were absent:
#   kubectl get nodes -o custom-columns='NODE:.metadata.name,MEM:.status.allocatable.memory'
resources:
  requests:
    cpu: "12"
    memory: "40Gi"
    ephemeral-storage: "130Gi"
  limits:
    cpu: "16"
    memory: "56Gi"
    ephemeral-storage: "140Gi"

# k8s-cp3-worker3 is eligible again. Same story as ./values.yaml: the 2026-08-09
# DiskPressure pin was leftover after the cache moved to /mnt/buildbuddy. A second
# workflow replica still needs hostname anti-affinity against other workflow pods
# (shared bazel-caches-workflows hostPath), not an exclusion of this node.

extraVolumes:
  # Per-pod bounded emptyDir instead of a node-shared hostPath (/mnt/buildbuddy/cache-workflows).
  # Every executor pod instance creates its own <uuid> directory under /cache and never reclaims
  # prior pods' UUID directories when rescheduled (see ./values.yaml). Kubelet enforces sizeLimit
  # and deletes the volume when the pod leaves, and each pod has an isolated filecache directory
  # even if two executors ever share a node.
  - name: cache-volume
    emptyDir:
      sizeLimit: 120Gi
  # Bazel client REPO caches (repository, repo contents). Its own volume so a fresh runner
  # starts warm, and so the small files are not walked by the filecache startup scan. The
  # client DISK cache is deliberately NOT here: a paused runner keeps a resident Bazel server
  # beside the in-flight one, and Bazel's
  # per-server disk-cache GC races readers on a shared directory (Exit 34). It is also not
  # inside the runner workspace. `~` expands to /buildbuddy-execroot/.home, and that bind is
  # what max_runner_disk_size_bytes measures. build:ci --disk_cache is
  # /home/buildbuddy/bazel-disk-cache on each runner's own rootfs (the home useradd
  # --create-home already gave uid 1001), outside that measurement.
  # https://github.com/carverauto/serviceradar/issues/4863
  - name: bazel-cache-volume
    hostPath:
      path: /mnt/buildbuddy/bazel-caches-workflows
      type: DirectoryOrCreate
  - name: dockerhub-auth
    secret:
      secretName: dockerhub-auth
      items:
        - key: .dockerconfigjson
          path: config.json

extraVolumeMounts:
  - name: cache-volume
    mountPath: /cache
  - name: bazel-cache-volume
    mountPath: /bazel-caches
  - name: dockerhub-auth
    mountPath: /root/.docker
    readOnly: true

# THE BIND MOUNT BELOW IS ROOT-OWNED AND THE RUNNER IS NOT ROOT.
#
# kubelet creates a `DirectoryOrCreate` hostPath as root:root 0755, and BuildBuddy runs the
# workflow runner as the `buildbuddy` user -- uid 1001, from //docker/images/Dockerfile.workflow-runner
# -- so the Bazel client cannot create its own cache directories inside the mount:
#
#   ERROR: [unix_jni.cc:471] /bazel-cache/disk (Permission denied)
#   ERROR: could not acquire lock on repo contents cache
#
# That first error is from before the disk cache moved off this volume (issue 4863 above); it
# is kept as the recorded symptom of the ownership problem, which is unchanged for the two
# directories that remain. This ownership is also what broke `git init` when this volume was
# mounted at /root: the destination path was never the problem, and moving the mount only
# moved the symptom.
#
# Non-recursive on purpose: everything under these directories is written by uid 1001
# already, so a `chown -R` would walk a multi-gigabyte cache on every pod start for nothing.
extraInitContainers:
  - name: bazel-cache-perms
    # The executor's own image: already on the node under imagePullPolicy IfNotPresent, so this
    # costs no pull. Keep the tag in step with `image` above.
    image: gcr.io/flame-public/buildbuddy-executor-enterprise:enterprise-v2.290.0
    securityContext:
      # The image sets no USER so this is already true; explicit so a future base image that
      # adds one cannot silently turn the chown into a no-op failure.
      runAsUser: 0
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /bazel-caches/repo /bazel-caches/repo-contents
        chown 1001:1001 /bazel-caches /bazel-caches/repo /bazel-caches/repo-contents
        # Repair entries a root run left behind (issue 4855): a hosted-Bazel dispatch that ran
        # as root wrote root:root files into these shared caches and broke every later runner
        # with Permission denied. -xdev and ! -user keep this from becoming the blanket
        # `chown -R` the comment above rejects; on a healthy volume the find matches nothing.
        # Lands on every fleet deploying these values at its next executor rollout:
        # buildbuddy-workflows, buildbuddy-workflows-2, and farm01's workflow replicas.
        find /bazel-caches -xdev ! -user 1001 -exec chown -h 1001:1001 {} +
    # The two names are //.bazelrc `build:ci --{repository,repo_contents}_cache`. Nothing
    # checks the pairing: a rename there just makes Bazel create an unowned directory and
    # fail. The disk cache is not created here. It is /home/buildbuddy/bazel-disk-cache
    # on each runner's rootfs, a directory uid 1001 already owns, outside the workspace
    # bind this volume is not part of (see the bazel-cache-volume note above).
    volumeMounts:
      - name: bazel-cache-volume
        mountPath: /bazel-caches

# Drain instead of killing an in-flight workflow run on rollout, restart or node drain. The
# default 30s grace SIGKILLs a 10-30 minute run mid-flight (it did, 2026-09-27). The executor
# stops accepting work on SIGTERM and finishes what it holds; max_shutdown_duration (a top-level
# BuildBuddy option, NOT under config.executor) must stay a little under the grace period.
terminationGracePeriodSeconds: 3600

config:
  max_shutdown_duration: 3570s
  executor:
    # Inert on this fleet, and kept only because it costs nothing while off.
    enable_local_snapshot_sharing: true

    # Must match ./values.yaml and //.bazelrc `build:remote_base`. This is the control AND
    # data plane: the executor registers with the scheduler here and reads/writes the CAS
    # here. Pointed anywhere else, this pod registers with a scheduler that never sends it
    # the workflow, and the run fails as though the pool were empty.
    app_target: grpcs://carverauto.buildbuddy.io:443

    # Same split as ./values.yaml, and it must match: see the long note there for what moves
    # to the proxy and what stays on app_target.
    #
    # This pod's own cache traffic is small -- it runs the CI runner, which dispatches eligible
    # compilation actions to the default pool while database TestRunner actions stay runner-local.
    # It is not zero, so leaving it on app_target would send that traffic over the WAN while
    # everything around it goes through the proxy.
    #
    # Note this is the EXECUTOR's cache target, which is a different hop from the Bazel
    # CLIENT running inside the runner. The client used to hairpin through the public
    # TLS edge (`build:cache_only --remote_cache` via remote_base). That path RST_STREAMs
    # FindMissingBlobs on the shared Envoy+Coraza listener, so `build:ci` now overrides
    # --remote_cache to this same in-cluster h2c Service. Workstations keep the public
    # grpcs URL. Action-namespace DNS is a separate problem (`oci.dns` below); the
    # runner pod itself can resolve cluster DNS.
    cache_target: grpc://bb-cache-proxy-buildbuddy-enterprise-cache-proxy.buildbuddy.svc.cluster.local:1985

    # IN-CLUSTER ACCESS FROM ACTIONS. Same key and values as ./values.yaml -- see the long note
    # there for the mechanism. Short version: BuildBuddy REJECTs every RFC1918 destination from
    # an action's network namespace unless it is listed here, so without this a workflow step
    # can reach the public internet and nothing on the cluster network.
    #
    # This fleet is the one that needs it most: the database lifecycle runs its TestRunner
    # actions here (`--strategy=TestRunner=local` in //buildbuddy.yaml), so the fixture, the CA
    # bundle and anything else in-cluster is reached from inside one of these namespaces.
    task_allowed_private_ips:
      - 10.42.0.0/16 # pod CIDR: what a ClusterIP is rewritten to by kube-proxy DNAT
      - 10.43.0.0/16 # service CIDR: ClusterIPs, including CoreDNS
      # LAN shared-gateway VIP. Same reason as ./values.yaml: HTTPS CA fetches
      # resolve here, and BGP leaves the dest IP as the VIP.
      - 192.168.6.87/32

    enable_oci: true
    default_isolation_type: oci
    # Floor only. The runner's real size comes from resource_requests in //buildbuddy.yaml,
    # which is far above this; without a floor a predicted size is used verbatim and can
    # under-reserve a task.
    #
    # int64 byte count, not a k8s quantity: "2Gi" does not parse here.
    default_task_size:
      estimated_milli_cpu: 2000
      estimated_memory_bytes: 2147483648 # 2 GiB

    # RUNNER RECYCLING. Nothing here turns it on -- BuildBuddy's workflow service already stamps
    # `recycle-runner: true` and `preserve-workspace: true` onto every workflow action. What
    # stops it is the pool's own admission check, whose defaults are sized for short RBE actions
    # and are an order of magnitude below what a monorepo Bazel client uses. A rejected runner is
    # SILENT: the next run simply prints `git init` instead of `Syncing existing repo...` and
    # starts a cold Bazel server, which is what a cold run looks like from the log either way.
    #
    # Worth the tuning because a recycled runner keeps the Bazel SERVER, not just the disk: the
    # ci_runner writes `startup --max_idle_secs=0` specifically so the server survives between
    # runs, which is what carries the analysis cache and the ~4,900 extracted external repos in
    # the output base.
    runner_pool:
      # Default 2 GB against a runner whose measured peak is ~35 GB (see `resources` above).
      # -1 is not unbounded: the pool clamps it to this pod's allocatable RAM, so it tracks
      # `resources` instead of needing an edit whenever those move.
      max_runner_memory_usage_bytes: -1
      # Default 16 GB. Workspace.DiskUsageBytes walks only the runner workspace bind. Inside the
      # container that bind is /buildbuddy-execroot: the repo checkout, the sibling output-base,
      # and .home. A single real build clears the old 16GB default on checkout + output-base
      # alone. /home/buildbuddy/bazel-disk-cache is not under that bind (it is on the runner
      # rootfs, in the home directory uid 1001 already owns), so this 60GB does not include
      # the disk cache. That cache still sits on this volume: the runner rootfs overlay is
      # /cache/remotebuilds/executor/oci/run/<cid>/tmp/rootfs.upper inside the 120Gi emptyDir.
      # Its idle target is build:ci --experimental_disk_cache_gc_max_size=6G. GC does not
      # run until the server has been idle for 5 minutes, so the in-flight cache is larger.
      # The one retired off the shared hostPath was ~22G. 40GB filecache + 60GB workspace
      # leaves ~28.8GB of the 120Gi emptyDir, which holds that one cache and not a second.
      max_runner_disk_size_bytes: 60000000000 # 60 GB workspace bind; disk cache is outside it, on this volume
      # One paused slot, as on farm01 and in ./values-workflows-lig.yaml. BuildBuddy counts
      # this against paused runners, and the in-flight runner is extra. A second paused
      # runner would keep another disk cache on this emptyDir beside the ~22G in-flight one.
      max_runner_count: 1

    image_pull_timeout: 15m
    startup_warmup_max_wait_secs: 300
    warmup_timeout_secs: 300

    # Warms the WORKFLOW RUNNER image, and only that one.
    # KEEP THIS IN STEP WITH //buildbuddy.yaml. Warming a tag the workflow no longer names
    # is not an error, it is just a slower first run and a pointless pull -- so the two move
    # together or the warm silently stops helping. Those two, plus the pinned image strings in
    # //build/contracts/ci_heavy_gate_contract_test.py, are the blast radius of a runner-only
    # patch bump.
    #
    # OWN patch line (v1.0.24.x), not in lockstep with rbe-executor: the hermetic-LLVM migration
    # moved the executor to v1.0.25.1 without rebuilding this image, which hosts only the Bazel
    # client. //docker/images/Dockerfile.workflow-runner records the policy.
    warmup_additional_images:
      - registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5

    oci:
      # CoreDNS, by its ClusterIP -- reachable only because of task_allowed_private_ips above.
      # See ./values.yaml for why this is an explicit address rather than "".
      dns: "10.43.0.10"

      # Shared repo caches only. The per-runner disk cache is /home/buildbuddy/bazel-disk-cache
      # on the runner rootfs, not a second bind: one shared directory is the Exit 34 GC race,
      # and a path under the workspace bind is counted by max_runner_disk_size_bytes. uid 1001
      # already owns that home; a directory directly under / is not creatable by the runner.
      mounts:
        # A dedicated path, NOT /root: mounting over the runner's home broke `git init`.
        - source: /bazel-caches
          destination: /bazel-cache
          type: bind
          options:
            - rbind
            - rw
    local_cache_directory: /cache

    # Read-through cache OF the remote CAS. On the 120Gi /cache emptyDir this shares with
    # the workspace: 40GB + 60GB leaves ~28.8GB for the one in-flight runner disk cache.
    # Plain int64 byte count: "40Gi" does not parse.
    local_cache_size_bytes: 40000000000
    root_directory: /cache/remotebuilds/
    api_key: ""
