version: "2"

run:
  timeout: 5m

linters:
  enable:
    - asciicheck
    - bodyclose
    - dupl
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - copyloopvar
    # - funlen
    - gochecknoglobals
    - gochecknoinits
    # - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    # - gosec
    - govet
    - ineffassign
    # - lll
    - mirror
    - misspell
    # - mnd
    - nakedret
    # - nestif
    - noctx
    - nolintlint
    - prealloc
    # - revive
    - rowserrcheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  exclusions:
    paths:
      - go/pkg/bumblebee/upstream/.*
  settings:
    misspell:
      # RouterOS is MikroTik's product name; persisted metadata keys such as
      # routeros_version carry it verbatim.
      ignore-rules:
        - routeros
