    or `bazel` without `--config=remote`. If a check cannot run remotely, report
    it as untested instead of running it here.
    For a CI failure, read the BuildBuddy log (`bb view <invocation>`) and fix
    from the evidence; the PR's BazelCI rerun is the proof.
gates:
  # Test-routing contracts that otherwise fail only in BazelCI: every new
  # serviceradar_core test file needs a row in INTEGRATION_SOURCE_DISPOSITIONS.tsv,
  # and DB-backed ones must also appear in build/integration_test_dispositions.bzl.
  # Plain Python, no build; runs in seconds.
  - name: test-registration
    after: lint
    command: python3 -m unittest build/contracts/ci_heavy_gate_contract_test.py
  # Same checks as CI's "Elixir Quality (<project>)" jobs: mix format
  # --check-formatted and mix credo --strict for every linted Elixir project,
  # hermetic on RBE. A failure parks the run for a decision before push.
  - name: elixir-quality
    after: lint
    command: bazel test --config=remote //build/elixir_quality:quality_check
