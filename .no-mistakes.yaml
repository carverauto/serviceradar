# no-mistakes gate configuration. Read only from the trusted copy on staging.
commands:
  # Run worktrees start with tracked files only, so the gitignored Bazel rc
  # files that carry the BuildBuddy key and remote-execution settings are
  # missing and any `bazel` command there would build locally. Link them from
  # the operator's primary clone (override with SERVICERADAR_BAZELRC_DIR).
  prepare: >-
    src="${SERVICERADAR_BAZELRC_DIR:-$HOME/src/serviceradar}";
    for f in .bazelrc.remote .bazelrc.local; do
      if [ -e "$src/$f" ] && [ ! -e "$f" ] && [ ! -L "$f" ]; then ln -s "$src/$f" "$f"; fi;
    done;
    test -f .bazelrc.remote
  # Baseline: confirms the run worktree is wired for remote execution. It is
  # also what makes `prepare` run, since prepare only precedes a configured
  # command. The test agent still derives and drives its own targeted scenarios.
  test: test -f .bazelrc.remote
  # Format Elixir on the remote executors before the gate commits its own
  # fixes, so an agent fix can never introduce a Styler diff. Mix and Hex come
  # from Bazel; nothing depends on a local deps/ directory.
  format: bazel run --config=remote //build/elixir_quality:format
# The document step also runs the lint pass. Its agent once spent 35 minutes
# running `mix deps.get` and a cold compile of serviceradar_core's dependency
# tree on the operator's machine to re-check a two-line format change, because
# `mix format` failed in a run worktree with no deps/.
document:
  instructions: |
    REMOTE-ONLY RULE (this machine is a shared, overloaded laptop): every
    Bazel build, test and quality command uses `--config=remote`, so execution
    stays on BuildBuddy RBE. Local work is limited to source edits, Git
    operations and lightweight inspection (reading files, ripwire, grep, git
    diff/log). Never compile, fetch dependencies or run tests locally: no
    `mix compile`, `mix test`, `mix deps.get`, `mix format`, `mix credo`,
    `cargo build/check/test/clippy`, `go build/test/vet`, `npm`/`bun` builds,
    or `bazel` without `--config=remote`. If a check cannot run remotely, report
    it as untested instead of running it here.

    Never fetch dependencies or compile anything on this machine: no
    `mix deps.get`, `mix compile`, `mix format`, `mix credo`, `cargo build`,
    `cargo check` or `go build` in the run worktree. Run worktrees have no
    deps/ by design, so a local `mix` call fails or starts a cold compile.
    Elixir formatting is `commands.format`
    (`bazel run --config=remote //build/elixir_quality:format`), and Credo plus
    `mix format --check-formatted` run in the `elixir-quality` gate on RBE.
    Rely on them; do not reproduce them locally. When a formatting or lint
    question cannot be answered without a build, leave it to that gate and
    say so instead of building.
test:
  instructions: |
    REMOTE-ONLY RULE (this machine is a shared, overloaded laptop): every
    Bazel build, test and quality command uses `--config=remote`, so execution
    stays on BuildBuddy RBE. Local work is limited to source edits, Git
    operations and lightweight inspection (reading files, ripwire, grep, git
    diff/log). Never compile, fetch dependencies or run tests locally: no
    `mix compile`, `mix test`, `mix deps.get`, `mix format`, `mix credo`,
    `cargo build/check/test/clippy`, `go build/test/vet`, `npm`/`bun` builds,
    or `bazel` without `--config=remote`. If a check cannot run remotely, report
    it as untested instead of running it here.

    Bazel must run on the remote executors, never on this machine. Before any
    `bazel` command, make sure `.bazelrc.remote` exists in the run worktree; if
    it does not, link the gitignored rc files from the primary clone:
    `ln -s "${SERVICERADAR_BAZELRC_DIR:-$HOME/src/serviceradar}/.bazelrc.remote" .bazelrc.remote`
    (and `.bazelrc.local` the same way when the primary clone has one).
    Pass `--config=remote` to every `bazel build`, `bazel test` and `bazel run`.
    If `.bazelrc.remote` cannot be linked, do not run Bazel locally; report the
    Bazel checks as untested instead.
# Review, lint and CI fix rounds edit code too, and their agents have
# compiled locally to "verify" a fix, saturating the operator's machine.
