minimum_pre_commit_version: 3.5.0

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages:
          - pre-commit

  - repo: local
    hooks:
      # `mix format --check-formatted` gates every Elixir change in CI, and it fails
      # the whole run for a single unformatted line -- long after the edit, on a
      # machine that then has to be round-tripped. Formatting at commit time keeps
      # that from reaching a PR at all.
      #
      # Each file is formatted from ITS OWN mix project, because .formatter.exs is
      # what decides the result: it does `import_deps` and loads the Styler plugin,
      # and those differ per project. Running from the repo root would format with
      # the wrong config, or none.
      #
      # A project whose deps are not fetched is skipped rather than failed. Missing
      # deps make `mix format` error out, and -- worse -- a DIFFERENT Styler version
      # silently reformats lines the commit never touched, which turns a one-line
      # change into an unreviewable diff. Run `mix deps.get` in that project to turn
      # the hook on for it.
      - id: mix-format
        name: mix format (Elixir)
        language: system
        files: '\.exs?$'
        stages:
          - pre-commit
        entry: >-
          bash -c 'for f in "$@"; do d=${f%/*};
          while [ -n "$d" ] && [ "$d" != "$f" ] && [ ! -f "$d/mix.exs" ]; do
          case "$d" in */*) d=${d%/*} ;; *) d="" ;; esac; done;
          [ -n "$d" ] && [ -f "$d/mix.exs" ] && [ -d "$d/deps/styler" ] &&
          (cd "$d" && mix format "${f#"$d"/}") || true; done' --
