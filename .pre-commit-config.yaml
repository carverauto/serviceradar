minimum_pre_commit_version: 3.5.0

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages:
          - pre-commit

  # Elixir formatting lives in .githooks/pre-commit, not here. pre-commit
  # treats a hook that rewrites files as a failure and does not re-stage them,
  # and running it twice would invoke the hermetic formatter twice. The git
  # hook formats staged .ex/.exs/.heex files and `git add`s the result before
  # this gitleaks hook runs.
