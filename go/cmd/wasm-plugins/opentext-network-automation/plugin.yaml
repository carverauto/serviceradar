id: opentext-network-automation-inventory
name: OpenText Network Automation Inventory
version: 0.1.0
description: Collects bounded OpenText Network Automation device inventory for DIRE reconciliation
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - http_request
  - producer-schedule:v1
  - action-result-ingest:v1
  - action-only:v1
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 443
resources:
  requested_memory_mb: 256
  requested_cpu_ms: 120000
  max_open_connections: 2
producer_schedules:
  - schedule_id: opentext-network-automation.inventory.refresh
    label: Refresh OpenText Network Automation inventory
    description: Collects one complete OpenText Network Automation inventory snapshot.
    action_id: opentext-network-automation.inventory.refresh
    command_type: plugin.run_action
    schedule_type: interval
    default_cadence_seconds: 86400
    min_cadence_seconds: 3600
    max_cadence_seconds: 2592000
    jitter_seconds: 900
    timeout_seconds: 900
    dispatch_scope: assignment
    settings_schema:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - token_url
        - api_url
      properties:
        instance_id:
          type: string
        token_url:
          type: string
          format: uri
        api_url:
          type: string
          format: uri
        queries:
          type: array
        page_size:
          type: integer
          default: 1000
        max_rows:
          type: integer
          default: 25000
        max_result_bytes:
          type: integer
          default: 10485760
        request_timeout_seconds:
          type: integer
          default: 30
        max_retries:
          type: integer
          default: 2
    credential_requirements:
      network_automation_service_account:
        required: true
        resolution_location: agent
        grants:
          - name: inventory
            grant_type: oauth2_password_bearer
            purpose: device_inventory
            allow:
              methods:
                - POST
              url_param: api_url
            inject:
              type: oauth2_password_bearer
              url_param: api_url
              token_url_param: token_url
              token_method: POST
              field_username: username
              field_password: password
              fixed_grant_type: password
    payload_template:
      mode: complete_snapshot
    redaction:
      fields:
        - credential_brokers
        - authorization
        - access_token
integrations:
  documentation:
    title: OpenText Network Automation inventory configuration
    path: docs/configuration.md
    url: https://code.carverauto.dev/carverauto/serviceradar/src/branch/staging/go/cmd/wasm-plugins/opentext-network-automation/docs/configuration.md
  credential_profiles:
    - provider: opentext-network-automation
      label: OpenText Network Automation
      description: Collect device inventory through an OpenText Network Automation wrapper.
      auth_methods:
        - id: username_password
          label: Username and password
          credential_kind: username_password
          fields:
            - id: username
              label: Username
              control: text
              required: true
              secret: false
              public: true
            - id: password
              label: Password
              control: password
              required: true
              secret: true
      purposes:
        - device_inventory
      scope_types:
        - agent
      provisioning:
        mode: producer_schedule
        schedule_id: opentext-network-automation.inventory.refresh
        credential_requirement: network_automation_service_account
  inventory_sources:
    - source: opentext-network-automation
      label: OpenText Network Automation
      description: Devices collected from OpenText Network Automation.
      metadata_fields:
        - key: instance_id
          label: Instance
        - key: partition
          label: Partition
        - key: management_status
          label: Management status
        - key: exclude_from_poll
          label: Excluded from polling
          format: boolean
        - key: collection_id
          label: Collection
        - key: last_observed_at
          label: Last observed
          format: timestamp
