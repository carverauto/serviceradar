id: http-synthetic-journey
name: HTTP Synthetic Journey
version: 0.1.0
description: Executes multi-step HTTP synthetic user journeys with phase waterfall timings, TLS inspection, scoped cookie handling, and redacted extractors
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - emit_telemetry
  - http_request
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 80
    - 443
    - 8080
    - 8443
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 10000
  max_open_connections: 2
