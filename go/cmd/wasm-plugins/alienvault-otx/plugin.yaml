id: alienvault-otx-threat-intel
name: AlienVault OTX Threat Intel
version: 0.3.1
description: Collects AlienVault OTX export pages and emits normalized threat-intel indicators
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
# Cadence: OTX threat-intel does not need frequent pulls. Assign this plugin a
# daily check interval (~86400s). The plugin also self-throttles: a completed
# pull is repeated at most once per `min_pull_interval_ms` (default ~24h), so a
# tighter agent interval returns a fast healthy no-op instead of hammering OTX.
recommended_interval_seconds: 86400
capabilities:
  - get_config
  - log
  - submit_result
  - http_request
permissions:
  allowed_domains:
    - otx.alienvault.com
  allowed_ports:
    - 443
resources:
  # Raised 64->128: the deployed crashing 0.3.0 carries the same bounded
  # fetchOTXExportPageAdaptive code as staging (the crash stack names that fn,
  # which only exists in 0.2.0+), so the OOM is 64MB being genuinely tight for
  # the demo OTX corpus (a 4MB JSON page parses into many x that in indicator
  # structs, held across depth-2 adaptive recursion). Give real headroom.
  requested_memory_mb: 128
  requested_cpu_ms: 15000
  max_open_connections: 2
