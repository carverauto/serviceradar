id: unifi-protect-camera
name: UniFi Protect Camera
version: 0.1.1
description: Collects UniFi Protect camera inventory and stream metadata
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - emit_telemetry
  - http_request
  - websocket_connect
  - websocket_recv
  - websocket_close
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 80
    - 443
    - 7447
    - 7441
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 2000
  max_open_connections: 2
signal_schemas:
  - id: com.carverauto.unifi_protect.camera_event
    version: 1.0.0
    signal_type: event
    payload_kind: ocsf_event
    payload_schema: schemas/ocsf_event_log_activity.schema.json
    display_contract: display/camera_event.display.json
    display_contract_id: com.carverauto.unifi_protect.camera_event.display
    display_contract_version: 1.0.0
    ocsf_schema_version: 1.5.0
    class_uid: 1008
    type_uid: 100801
