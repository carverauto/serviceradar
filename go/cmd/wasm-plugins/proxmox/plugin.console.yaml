id: proxmox-console
name: Proxmox Console
version: 0.1.4
description: Streams Proxmox PVE, VM, and LXC console sessions through the ServiceRadar console bridge
entrypoint: run_console
runtime: wasi-preview1
outputs: serviceradar.proxmox_console.v1
capabilities:
  - get_config
  - log
  - http_request
  - proxmox_console_stream
  - websocket_connect
  - websocket_send
  - websocket_recv
  - websocket_close
permissions:
  # Destinations are supplied only by the agent's exact host-authority
  # binding. The untrusted module receives no static domain authority.
  allowed_domains: []
  allowed_ports:
    - 22
    - 8006
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 2000
  max_open_connections: 2
