id: awx
name: AWX / AAP Bridge
version: 0.1.1
description: >
  Network bridge between ServiceRadar core and an AWX/AAP controller in the
  customer's network. Dispatches per-call REST verbs (ping, list inventories /
  hosts / projects / templates, fetch / launch / cancel / fetch-events-for-jobs)
  for Elixir's AwxClient via AgentCommandBus, and emits a DeviceDiscovery
  aggregate from a scheduled `inventory_sync` invocation. Holds no per-controller
  state; each request carries its own credential broker grant.
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - http_request
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 80
    - 443
    - 8080
    - 8443
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 10000
  max_open_connections: 4
