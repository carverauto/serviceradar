id: awx-inventory-sync
name: AWX Inventory Sync
version: 0.1.0
description: >
  Scheduled assignment that walks an AWX/AAP controller's inventories and
  hosts and emits a DeviceDiscovery aggregate (discovery_source=awx) into
  the existing agent → gateway → DIRE pipeline. One assignment per
  AnsibleController; the assignment's config carries the controller's
  resolved API token. Mirrors the proxmox-inventory plugin's pattern.
entrypoint: inventory_sync
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - http_request
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 80
    - 443
    - 8080
    - 8443
resources:
  requested_memory_mb: 96
  requested_cpu_ms: 30000
  max_open_connections: 4
