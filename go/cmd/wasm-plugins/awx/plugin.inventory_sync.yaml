id: awx-inventory-sync
name: AWX Inventory Sync
version: 0.1.6
description: >
  Scheduled assignment that walks one or more AWX/AAP controllers' inventories
  and hosts and emits DeviceDiscovery aggregates (discovery_source=awx) into
  the existing agent -> gateway -> DIRE pipeline. One assignment per reachable
  agent carries that agent's controller list and resolved API tokens.
entrypoint: inventory_sync
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - http_request
permissions:
  allowed_domains:
    - "*"
  allowed_ports:
    - 80
    - 443
    - 8080
    - 8443
resources:
  requested_memory_mb: 96
  requested_cpu_ms: 30000
  max_open_connections: 4
