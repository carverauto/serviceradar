# Publishes elixir/serviceradar_ui to public hex.pm when a tag of the
# form `serviceradar_ui-vX.Y.Z` is pushed. The package is Apache-2.0.
# hex.pm package names are permanent, so the first publish needs
# maintainer approval before anyone pushes the tag.
#
# Setup once on the runner / GitHub Actions environment:
#   1. Create an API key on hex.pm with publish scope (`mix hex.user`).
#   2. Set repository secret `HEX_API_KEY` = the key value.
#
# Workflow:
#   1. Maintainer bumps version in elixir/serviceradar_ui/mix.exs.
#   2. Merges to staging.
#   3. Tags: `git tag serviceradar_ui-v0.x.y && git push origin serviceradar_ui-v0.x.y`.
#   4. This workflow runs the quality gate, then publishes to hex.pm.
#
# Do not run `mix hex.publish` by hand.

name: Publish serviceradar_ui

permissions:
  contents: write

on:
  push:
    tags:
      - "serviceradar_ui-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ImageOS: ubuntu24

jobs:
  publish:
    name: Publish serviceradar_ui to hex.pm
    runs-on: arc-runner-set
    defaults:
      run:
        working-directory: elixir/serviceradar_ui
    env:
      ImageOS: ubuntu24
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Setup Beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # erlef/setup-beam@v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: "28.1"
          elixir-version: "1.19.4"

      - name: Cache deps + _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: |
            elixir/serviceradar_ui/deps
            elixir/serviceradar_ui/_build
            elixir/serviceradar_ui/_matrix
            elixir/serviceradar_ui/example/deps
            elixir/serviceradar_ui/example/_build
          key: serviceradar-ui-${{ hashFiles('elixir/serviceradar_ui/mix.lock', 'elixir/serviceradar_ui/mix.lv11.lock', 'elixir/serviceradar_ui/example/mix.lock') }}
          restore-keys: |
            serviceradar-ui-

      - name: Fetch deps
        run: mix deps.get

      - name: Install Socket Firewall
        working-directory: .
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.9"
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64.zip"

      - name: Install hook-bundle dependencies
        working-directory: elixir/serviceradar_ui/assets
        run: sfw bun install --frozen-lockfile

      - name: Verify version tag matches mix.exs version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-}"
          if [ -z "$tag" ]; then
            echo "Could not determine tag name from env" >&2
            exit 1
          fi
          tag_version="${tag#serviceradar_ui-v}"
          mix_version=$(grep -E '^\s*@version' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag version: $tag_version"
          echo "mix.exs version: $mix_version"
          if [ "$tag_version" != "$mix_version" ]; then
            echo "Tag $tag does not match mix.exs version $mix_version. Refusing to publish." >&2
            exit 1
          fi

      - name: Quality gate
        run: ./scripts/check.sh

      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: MIX_ENV=prod mix hex.publish package --yes
