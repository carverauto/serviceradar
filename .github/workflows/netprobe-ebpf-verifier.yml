name: Netprobe eBPF Verifier

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'rust/netprobe/**'
      # The toolchain pins and the vendored crates decide the object's bytes just as
      # much as its source does. The pins are in MODULE.bazel (already listed below)
      # and the crates are here; between them a nightly bump, or an upgrade of the
      # external @rules_aya_ebpf module, always reaches this lane.
      - 'third_party/netprobe_ebpf_vendor/**'
      - 'build/platforms/**'
      - 'build/rust/**'
      - 'build/toolchains/**'
      - '.bazelrc'
      - '.github/workflows/netprobe-ebpf-verifier.yml'
      - 'MODULE.bazel'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
      - 'scripts/ci/netprobe-ebpf-verify.sh'
  pull_request:
    branches: [staging]
    paths:
      - 'rust/netprobe/**'
      # The toolchain pins and the vendored crates decide the object's bytes just as
      # much as its source does. The pins are in MODULE.bazel (already listed below)
      # and the crates are here; between them a nightly bump, or an upgrade of the
      # external @rules_aya_ebpf module, always reaches this lane.
      - 'third_party/netprobe_ebpf_vendor/**'
      - 'build/platforms/**'
      - 'build/rust/**'
      - 'build/toolchains/**'
      - '.bazelrc'
      - '.github/workflows/netprobe-ebpf-verifier.yml'
      - 'MODULE.bazel'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
      - 'scripts/ci/netprobe-ebpf-verify.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier_config:
    name: Resolve verifier configuration
    runs-on: arc-runner-set
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Resolve verifier availability
        id: config
        env:
          VERIFIER_ENABLED: ${{ vars.NETPROBE_EBPF_VERIFIER_ENABLED }}
        run: |
          if [[ "${VERIFIER_ENABLED:-}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Dedicated netprobe kernel verification is not enabled."
          fi

  verify-ebpf:
    needs: verifier_config
    name: Verify eBPF programs on Linux ${{ matrix.kernel }}
    runs-on: ${{ needs.verifier_config.outputs.enabled == 'true' && matrix.runner || 'arc-runner-set' }}
    env:
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
      SERVICERADAR_NETPROBE_EXPECT_KERNEL: ${{ matrix.kernel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: '5.8'
            runner: netprobe-kernel-5.8
          - kernel: '5.15'
            runner: netprobe-kernel-5.15
          - kernel: '6.x'
            runner: netprobe-kernel-6
    steps:
      - name: Report disabled verifier
        if: ${{ needs.verifier_config.outputs.enabled != 'true' }}
        run: echo "Dedicated netprobe kernel verification is not enabled."

      - name: Checkout
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: ./scripts/install-bazelisk.sh

      - name: Setup Rust
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify eBPF object
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: scripts/ci/netprobe-ebpf-verify.sh

  kernel-too-old:
    needs: verifier_config
    name: Verify eBPF refusal on Linux 5.4
    runs-on: ${{ needs.verifier_config.outputs.enabled == 'true' && 'netprobe-kernel-5.4' || 'arc-runner-set' }}
    env:
      SERVICERADAR_NETPROBE_EXPECT_KERNEL: '5.4'
    steps:
      - name: Report disabled verifier
        if: ${{ needs.verifier_config.outputs.enabled != 'true' }}
        run: echo "Dedicated netprobe kernel verification is not enabled."

      - name: Checkout
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: bash scripts/ci/install-sfw.sh

      - name: Install dependencies
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Setup Rust
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify unavailable state
        if: ${{ needs.verifier_config.outputs.enabled == 'true' }}
        run: scripts/ci/netprobe-kernel-too-old.sh
