name: Fingerprint Licensing

on:
  pull_request:
    branches: [staging]
    paths:
      - 'Cargo.lock'
      - 'rust/netprobe/**'
      - 'third_party/netprobe_corpora/**'
      - 'scripts/lint-recog-additions.sh'
      - 'scripts/check-netprobe-fingerprint-licenses.sh'
      - '.github/workflows/tests-fingerprint-licensing.yml'
      # Docs-only changes skip this workflow: Markdown is docs unless a build reads it.
      # Derived from build/ci/detect_docs_only.py (--print-github-paths <these paths>) and
      # checked by //build/contracts:docs_only_ci_contract_test.
      - '!**/*.md'
      - 'docs/sigstore/**/*.md'
      - 'openspec/changes/parallelize-core-integration-tests/benchmark.md'
      - 'third_party/**/*.md'
      - '**/vendor/**/*.md'
      - 'swift/FieldSurvey/LocalPackages/**/*.md'
      - '**/priv/**/*.md'
      - '**/testdata/**/*.md'
      - 'js/cli/templates/**/*.md'
      - 'go/cmd/wasm-plugins/axis/EXTRACTION_MANIFEST.md'
      - 'go/cmd/wasm-plugins/opentext-nom/docs/configuration.md'
      - 'demo/README.md'
      - 'k8s/starrocks/README.md'
  push:
    branches: [staging]
    paths:
      - 'Cargo.lock'
      - 'rust/netprobe/**'
      - 'third_party/netprobe_corpora/**'
      - 'scripts/lint-recog-additions.sh'
      - 'scripts/check-netprobe-fingerprint-licenses.sh'
      - '.github/workflows/tests-fingerprint-licensing.yml'
      # Docs-only changes skip this workflow: Markdown is docs unless a build reads it.
      # Derived from build/ci/detect_docs_only.py (--print-github-paths <these paths>) and
      # checked by //build/contracts:docs_only_ci_contract_test.
      - '!**/*.md'
      - 'docs/sigstore/**/*.md'
      - 'openspec/changes/parallelize-core-integration-tests/benchmark.md'
      - 'third_party/**/*.md'
      - '**/vendor/**/*.md'
      - 'swift/FieldSurvey/LocalPackages/**/*.md'
      - '**/priv/**/*.md'
      - '**/testdata/**/*.md'
      - 'js/cli/templates/**/*.md'
      - 'go/cmd/wasm-plugins/axis/EXTRACTION_MANIFEST.md'
      - 'go/cmd/wasm-plugins/opentext-nom/docs/configuration.md'
      - 'demo/README.md'
      - 'k8s/starrocks/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  netprobe-fingerprint-licenses:
    runs-on: arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          fi

          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Check netprobe fingerprint dependencies
        run: bash scripts/check-netprobe-fingerprint-licenses.sh

      - name: Check ServiceRadar Recog additions
        run: make lint-recog-additions
