# PORTED FROM .forgejo/workflows/main.yml AT THE HOST MIGRATION.
#
# That workflow was the repo-wide gate and it did NOT come across with the other 19. Everything
# Bazel on this host publishes artifacts (publish-oci, release, wasm-plugins, native-addons) or
# tests one package (rust-checks); nothing ran `bazel test` over `//...`. That matters more here
# than it looks: the Elixir unit shards exist ONLY as Bazel targets
# (//elixir/serviceradar_core:unit_tests_*, //elixir/web-ng:unit_tests_*), so they are invisible
# to `go test`, `cargo test` and `mix test`. Two broken Elixir suites reached a release tag that
# way. Between the migration and this file, every one of those targets was ungated on pull
# requests.
#
# SPLIT, NOT COPIED WHOLESALE. main.yml also carried image publishing and OCI registry auth,
# which publish-oci.yml and release.yml already own here; duplicating them would give two
# workflows the power to push images. What was missing is the test sweep and the add-on
# version-bump gate, so that is what this file is -- two jobs, no registry credentials.
name: Bazel Test

on:
  push:
    branches:
      - staging
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-test:
    name: Bazel test sweep
    runs-on: arc-runner-set
    env:
      GOTOOLCHAIN: local
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v5.0.1

      - name: Cache Bazel artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/bazelisk
          # Keyed on .bazelversion ONLY: this holds BAZELISK_HOME, which is just the downloaded
          # bazel binaries. Nothing in it depends on .bazelrc, MODULE.bazel or the source tree.
          key: ${{ runner.os }}-bazelisk-${{ hashFiles('.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazelisk-

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # MUST run before the first bazel invocation. The remote profiles point the executor,
      # cache and BES at carverauto.buildbuddy.io, and the API key reaches Bazel ONLY through
      # .bazelrc.remote -- which is gitignored, so a fresh checkout does not have it. Without it
      # every remote call dies with `PERMISSION_DENIED: Anonymous access disabled`, and the
      # symptom reads nothing like a missing credential: the build reports targets that "FAILED
      # TO BUILD" with no remote actions ever executed.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # The query is not decoration. Passing `//...` directly would let a tag filter silently
      # reduce the sweep to nothing and still exit 0; naming the targets means an empty result
      # is an error rather than a pass. `integration_test` targets need live infrastructure and
      # are excluded here, matching `make test`.
      - name: Test
        id: bazel_tests
        run: |
          set -euo pipefail

          target_query='tests(//...) except attr("tags", "manual|integration_test", tests(//...))'
          if ! target_list="$(bazel query "${target_query}")"; then
            echo "::error::bazel query failed; refusing to run an empty test sweep" >&2
            exit 1
          fi

          if [ -z "${target_list}" ]; then
            echo "::error::the test sweep matched no targets; refusing to report success" >&2
            exit 1
          fi

          mapfile -t bazel_targets <<<"${target_list}"

          # --config=remote, NOT --config=ci. Both drive the same remote_base RBE graph; they
          # differ only in the CLIENT cache paths. `ci` pins /bazel-cache, which is the volume
          # //k8s/buildbuddy bind-mounts into BUILDBUDDY's workflow runners -- it is not mounted
          # on arc-runner-set, so it dies with `Permission denied` / `could not acquire lock on
          # repo contents cache` after loading the whole graph. release.yml hit the same wall on
          # serviceradar-signing and resolved it the same way. `remote` uses $HOME cache paths.
          bazel test \
            -c opt \
            --config=remote \
            --test_tag_filters=-manual \
            "${bazel_targets[@]}"

      - name: Dump Bazel test logs
        if: ${{ failure() && steps.bazel_tests.conclusion == 'failure' }}
        run: |
          set +e

          if [ ! -d bazel-testlogs ]; then
            echo "bazel-testlogs not found"
            exit 0
          fi

          find bazel-testlogs -name 'test.log' -print0 |
            while IFS= read -r -d '' log; do
              echo "::group::${log}"
              cat "${log}"
              echo "::endgroup::"
            done

  native-addon-version-bumps:
    name: Native add-on version bumps
    runs-on: arc-runner-set
    env:
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      # Full history: the gate diffs a base against HEAD, and a shallow clone cannot name one.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      # THE BASE DIFFERS BY EVENT, and getting it wrong makes this step vacuous rather than
      # wrong-looking. On a pull request the target branch is the right comparison. On
      # `push: branches: [staging]` there is no GITHUB_BASE_REF, and falling back to `staging`
      # names the commit just pushed -- the gate then diffs staging against itself and returns 0
      # whatever the tree holds. d03bebf377 reached staging that way, carrying a changed netprobe
      # payload under an unchanged version.
      - name: Check native add-on version bumps
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base_ref="${GITHUB_BASE_REF:-staging}"
            git fetch --no-tags origin "${base_ref}"
            base="$(git rev-parse FETCH_HEAD)"
          else
            base=""
            if [ -n "${PUSH_BEFORE:-}" ] &&
               [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              base="${PUSH_BEFORE}"
            else
              # The previous tip for both a merge and a direct push. It under-covers only a
              # multi-commit direct push, which is not how staging is meant to receive changes.
              base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
            fi
          fi

          # No silent skip. The script refuses base == head for the same reason: a check that
          # cannot fail reads exactly like a check that passed.
          if [ -z "${base}" ]; then
            echo "::error::could not determine a base commit for the add-on version gate" >&2
            exit 1
          fi

          scripts/check-native-addon-version-bumps.sh "${base}" HEAD
