name: Web-NG Assets
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [ staging ]
    paths:
      - 'elixir/web-ng/assets/**'
      - '.github/workflows/web-ng-lint.yml'
      - 'scripts/ci/install-sfw.sh'
      - '.tool-versions'
      # Docs-only changes skip this workflow: Markdown is docs unless a build reads it.
      # Derived from build/ci/detect_docs_only.py (--print-github-paths <these paths>) and
      # checked by //build/contracts:docs_only_ci_contract_test.
      - '!**/*.md'
      - 'docs/sigstore/**/*.md'
      - 'openspec/changes/parallelize-core-integration-tests/benchmark.md'
      - 'third_party/**/*.md'
      - '**/vendor/**/*.md'
      - 'swift/FieldSurvey/LocalPackages/**/*.md'
      - '**/priv/**/*.md'
      - '**/testdata/**/*.md'
      - 'js/cli/templates/**/*.md'
      - 'go/cmd/wasm-plugins/axis/EXTRACTION_MANIFEST.md'
      - 'go/cmd/wasm-plugins/opentext-nom/docs/configuration.md'
      - 'demo/README.md'
      - 'k8s/starrocks/README.md'
  pull_request:
    branches: [ staging ]
    paths:
      - 'elixir/web-ng/assets/**'
      - '.github/workflows/web-ng-lint.yml'
      - 'scripts/ci/install-sfw.sh'
      - '.tool-versions'
      # Docs-only changes skip this workflow: Markdown is docs unless a build reads it.
      # Derived from build/ci/detect_docs_only.py (--print-github-paths <these paths>) and
      # checked by //build/contracts:docs_only_ci_contract_test.
      - '!**/*.md'
      - 'docs/sigstore/**/*.md'
      - 'openspec/changes/parallelize-core-integration-tests/benchmark.md'
      - 'third_party/**/*.md'
      - '**/vendor/**/*.md'
      - 'swift/FieldSurvey/LocalPackages/**/*.md'
      - '**/priv/**/*.md'
      - '**/testdata/**/*.md'
      - 'js/cli/templates/**/*.md'
      - 'go/cmd/wasm-plugins/axis/EXTRACTION_MANIFEST.md'
      - 'go/cmd/wasm-plugins/opentext-nom/docs/configuration.md'
      - 'demo/README.md'
      - 'k8s/starrocks/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  assets_js:
    name: Assets JS (Bun)
    runs-on: arc-runner-set
    defaults:
      run:
        working-directory: elixir/web-ng/assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Socket Firewall
        working-directory: .
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.9"
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64.zip"

      # @esbuild/linux-x64 is an optional dependency. A dropped Socket Firewall
      # fetch leaves bun install at exit 0, and node rum_bundle.mjs then dies
      # because the platform binary is missing. Retry a clean install until
      # that package is on disk.
      - name: Install assets dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sfw bun install --frozen-lockfile && [[ -e node_modules/@esbuild/linux-x64/package.json ]]; then
              exit 0
            fi
            echo "asset install attempt ${attempt} did not install @esbuild/linux-x64" >&2
            rm -rf node_modules
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run ESLint
        run: sfw bun run lint

      - name: Run Vitest
        run: sfw bun run test
