name: Web-NG Assets
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [ staging ]
    paths:
      - 'elixir/web-ng/assets/**'
      - '.github/workflows/web-ng-lint.yml'
      - 'scripts/ci/install-sfw.sh'
      - '.tool-versions'
  pull_request:
    branches: [ staging ]
    paths:
      - 'elixir/web-ng/assets/**'
      - '.github/workflows/web-ng-lint.yml'
      - 'scripts/ci/install-sfw.sh'
      - '.tool-versions'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  assets_js:
    name: Assets JS (Bun)
    runs-on: arc-runner-set
    defaults:
      run:
        working-directory: elixir/web-ng/assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Socket Firewall
        working-directory: .
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.9"
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64.zip"

      - name: Install assets dependencies
        run: sfw bun install --frozen-lockfile

      - name: Run ESLint
        run: sfw bun run lint

      - name: Run Vitest
        run: sfw bun run test
