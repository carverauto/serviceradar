name: Armis DIRE E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  armis-dire-e2e-scale:
    runs-on: arc-runner-set
    permissions:
      contents: read
    env:
      ImageOS: ubuntu24
      SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
      SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
      SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
      SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
      SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}

    steps:
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install build dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh service-build

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Run 50,000-device Armis/DIRE E2E
        run: |
          set -euo pipefail

          if [ -z "${SRQL_TEST_DATABASE_URL}" ] ||
            [ -z "${SRQL_TEST_ADMIN_URL}" ] ||
            [ -z "${SRQL_TEST_DATABASE_CA_CERT}" ]; then
            echo "SRQL fixture DSNs and CA certificate are required for the scale Armis/DIRE gate." >&2
            exit 1
          fi

          ca_file="${RUNNER_TEMP}/armis-dire-e2e-ca.crt"
          printf "%s" "${SRQL_TEST_DATABASE_CA_CERT}" >"${ca_file}"

          cert_env=()
          if [ -n "${SRQL_TEST_DATABASE_CERT:-}" ] || [ -n "${SRQL_TEST_DATABASE_KEY:-}" ]; then
            if [ -z "${SRQL_TEST_DATABASE_CERT:-}" ] || [ -z "${SRQL_TEST_DATABASE_KEY:-}" ]; then
              echo "SRQL_TEST_DATABASE_CERT and SRQL_TEST_DATABASE_KEY must be provided together." >&2
              exit 1
            fi

            cert_file="${RUNNER_TEMP}/armis-dire-e2e-client.crt"
            key_file="${RUNNER_TEMP}/armis-dire-e2e-client.key"
            printf "%s" "${SRQL_TEST_DATABASE_CERT}" >"${cert_file}"
            printf "%s" "${SRQL_TEST_DATABASE_KEY}" >"${key_file}"
            chmod 600 "${key_file}"
            cert_env=(
              "PGSSLCERT=${cert_file}"
              "PGSSLKEY=${key_file}"
              "SERVICERADAR_TEST_DATABASE_CERT=${cert_file}"
              "SERVICERADAR_TEST_DATABASE_KEY=${key_file}"
              "SRQL_TEST_DATABASE_CERT=${cert_file}"
              "SRQL_TEST_DATABASE_KEY=${key_file}"
            )
          fi

          env \
            "SERVICERADAR_TEST_DATABASE_URL=${SRQL_TEST_DATABASE_URL}" \
            "SERVICERADAR_TEST_ADMIN_URL=${SRQL_TEST_ADMIN_URL}" \
            "SERVICERADAR_TEST_DATABASE_CA_CERT_FILE=${ca_file}" \
            "PGSSLROOTCERT=${ca_file}" \
            "${cert_env[@]}" \
            ./scripts/test-armis-dire-e2e.sh --profile scale
