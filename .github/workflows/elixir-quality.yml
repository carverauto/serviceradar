name: Elixir Quality

# PR / staging-push gate is mix format + mix credo --strict per *touched*
# Mix project. The seven job names stay as required checks, so an untouched
# project still reports success — it just does not mix deps.compile.
#
# Compile --warnings-as-errors, xref, hex/deps audits, Sobelow, Dialyzer, and
# the committed OpenAPI dump check run daily from //buildbuddy.yaml
# ("Elixir Quality (daily)") against staging. BazelCI already compiles and
# tests the Elixir tree on every PR.
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    # usp-01-proposal is the long-lived integration branch for unify-sweep-results-proto.
    # PRs land there first and only reach staging much later, so a staging-only filter left every
    # one of them ungated: this workflow is what runs `mix format --check-formatted` and
    # `mix credo --strict`. It briefly ran by accident while those PRs were grouped in a GitHub
    # stack (the stack's base is staging), and caught eight credo findings the moment it did --
    # then stopped again when the PRs were unstacked.
    branches: [staging, usp-01-proposal]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
      - 'proto/**'
  pull_request:
    # usp-01-proposal is the long-lived integration branch for unify-sweep-results-proto.
    # PRs land there first and only reach staging much later, so a staging-only filter left every
    # one of them ungated: this workflow is what runs `mix format --check-formatted` and
    # `mix credo --strict`. It briefly ran by accident while those PRs were grouped in a GitHub
    # stack (the stack's base is staging), and caught eight credo findings the moment it did --
    # then stopped again when the PRs were unstacked.
    branches: [staging, usp-01-proposal]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
      - 'proto/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  quality:
    name: Elixir Quality (${{ matrix.name }})
    runs-on: arc-runner-set
    strategy:
      # One project's lint failure should not hide the other six.
      fail-fast: false
      matrix:
        include:
          - name: datasvc
            project: elixir/datasvc
          - name: palisade
            project: elixir/palisade
          - name: serviceradar_agent_gateway
            project: elixir/serviceradar_agent_gateway
          - name: serviceradar_core
            project: elixir/serviceradar_core
          - name: serviceradar_core_elx
            project: elixir/serviceradar_core_elx
          - name: serviceradar_srql
            project: elixir/serviceradar_srql
          - name: web-ng
            project: elixir/web-ng
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR checkout is a merge commit. Depth 2 is enough for HEAD^ vs HEAD
          # so we can skip Mix for projects the PR did not touch.
          fetch-depth: 2

      - name: Decide whether this Mix project needs lint
        id: decide
        env:
          PROJECT: ${{ matrix.project }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if ! files=$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD 2>/dev/null); then
            echo "Cannot list changed files; running Mix lint to stay fail-closed."
            echo "lint=true" >> "$GITHUB_OUTPUT"
            echo "proto=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lint=false
          proto=false
          project="${PROJECT%/}"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/elixir-quality.yml|\
              scripts/elixir_quality.sh|\
              .tool-versions|\
              elixir/.credo.base.exs|\
              elixir/.credo.ex_dna.exs|\
              elixir/.credo.ex_slop.exs)
                lint=true
                proto=true
                ;;
              proto/*)
                proto=true
                ;;
            esac
            case "$f" in
              "$project"|"$project"/*)
                lint=true
                ;;
            esac
          done <<< "$files"

          if [ "$NAME" = "serviceradar_core" ] && [ "$proto" = true ]; then
            lint=true
          fi

          echo "Changed files:"
          printf '%s\n' "$files"
          echo "lint=${lint} proto=${proto} project=${project}"
          echo "lint=${lint}" >> "$GITHUB_OUTPUT"
          echo "proto=${proto}" >> "$GITHUB_OUTPUT"

      - name: Skip Mix lint for an untouched project
        if: ${{ steps.decide.outputs.lint != 'true' }}
        run: |
          echo "No changes under ${{ matrix.project }} or shared analyzer inputs."
          echo "Required check Elixir Quality (${{ matrix.name }}) reports success without mix deps.compile."

      - name: Setup Beam
        if: ${{ steps.decide.outputs.lint == 'true' }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'

      - name: Cache Elixir dependencies and build
        if: ${{ steps.decide.outputs.lint == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.hex
            ~/.mix
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-elixir-lint-${{ matrix.name }}-${{ hashFiles(format('{0}/mix.exs', matrix.project), format('{0}/mix.lock', matrix.project), format('{0}/.formatter.exs', matrix.project), format('{0}/.credo.exs', matrix.project), 'elixir/.credo.base.exs', 'elixir/.credo.ex_dna.exs', 'elixir/.credo.ex_slop.exs', '.tool-versions', 'scripts/elixir_quality.sh') }}
          restore-keys: |
            ${{ runner.os }}-elixir-lint-${{ matrix.name }}-
            ${{ runner.os }}-elixir-quality-${{ matrix.name }}-

      # Lock-stability gate (serviceradar#4034): a bare `mix deps.get`
      # silently re-resolves to the newest satisfying versions and dirties the
      # tree, so drift stayed invisible until it blocked someone's commit. Fail
      # the leg while the committed mix.lock is stale instead; the fix is a
      # deliberate `mix deps.get` + lock commit (plus `bazel run
      # //third_party/hex:write` when versions move). Runs before the lint
      # script below because that script's own bare `deps.get` would resolve
      # the drift away before anything could observe it. scripts/ itself is
      # off-limits for this check (repo rule: everything is a Bazel target,
      # no script extensions), so the workflow owns it.
      - name: Check mix.lock is up to date
        if: ${{ steps.decide.outputs.lint == 'true' }}
        env:
          HEX_HTTP_CONCURRENCY: '1'
          HEX_HTTP_TIMEOUT: '120'
        run: |
          set -euo pipefail
          cd "${{ matrix.project }}"
          mix deps.get --check-locked

      - name: Run Elixir format and Credo
        if: ${{ steps.decide.outputs.lint == 'true' }}
        env:
          HEX_HTTP_CONCURRENCY: '1'
          HEX_HTTP_TIMEOUT: '120'
        run: |
          ./scripts/elixir_quality.sh \
            --project "${{ matrix.project }}" \
            --lint-only

      # `make verify-proto-elixir` regenerates every checked-in .pb.ex from proto/
      # and fails on a diff. It lives on the core lint job because that is the
      # project the bindings live in. protoc is installed here rather than for
      # the whole matrix because the other six legs never generate protos.
      # Version and checksum are pinned exactly as rust-checks.yml pins them.
      - name: Install protoc
        if: ${{ matrix.name == 'serviceradar_core' && (steps.decide.outputs.lint == 'true' || steps.decide.outputs.proto == 'true') }}
        env:
          PROTOC_VERSION: '35.1'
          PROTOC_SHA256: '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7'
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64|amd64) asset="protoc-${PROTOC_VERSION}-linux-x86_64.zip" ;;
            *) echo "unsupported protoc runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP:-/tmp}/protoc"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"

          curl -fsSL --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${asset}" \
            -o "${install_dir}/${asset}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${install_dir}/${asset}" | sha256sum -c -

          unzip -q "${install_dir}/${asset}" -d "${install_dir}"
          chmod +x "${install_dir}/bin/protoc"

          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          {
            echo "PROTOC=${install_dir}/bin/protoc"
            echo "PROTOC_INCLUDE=${install_dir}/include"
          } >> "${GITHUB_ENV}"

          "${install_dir}/bin/protoc" --version

      - name: Check committed Elixir protobuf bindings are up to date
        if: ${{ matrix.name == 'serviceradar_core' && (steps.decide.outputs.lint == 'true' || steps.decide.outputs.proto == 'true') }}
        env:
          # make generate-proto-elixir ends with `mix format`, which compiles
          # deps, and serviceradar_srql's Rustler NIF shells out to `cargo`.
          # This job has no Rust toolchain, so without this the step dies with
          # System.cmd("cargo", ...) -> :enoent -- nothing to do with protos.
          # Same flag scripts/elixir_quality.sh:177 exports for the lint-only
          # path.
          SERVICERADAR_SKIP_NIF_COMPILATION: '1'
          HEX_HTTP_CONCURRENCY: '1'
          HEX_HTTP_TIMEOUT: '120'
        run: make verify-proto-elixir

  # Neither script starts a BEAM -- they read files and shell out to jq -- so this needs no
  # toolchain and no cache, and does not belong behind a seven-way compile matrix.
  db-checks:
    name: Baseline metadata and migration startup safety
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Decide whether DB baseline scripts need to run
        id: decide
        run: |
          set -euo pipefail
          if ! files=$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              scripts/db/*|\
              elixir/serviceradar_core/priv/repo/migrations/*|\
              .github/workflows/elixir-quality.yml)
                run=true
                ;;
            esac
          done <<< "$files"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "run=${run}"

      - name: Skip DB baseline checks
        if: ${{ steps.decide.outputs.run != 'true' }}
        run: echo "No DB script or migration changes; skipping baseline checks."

      - name: Check baseline metadata and migration startup safety
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: |
          scripts/db/check-baseline-metadata.sh
          scripts/db/check-migration-startup-safety.sh

      # Live CNPG baseline-vs-migration replay stays on the in-cluster BuildBuddy fixture
      # path. It needs SRQL_TEST_* and must not run here.
      # See gitops github/serviceradar-ci-split.md.
