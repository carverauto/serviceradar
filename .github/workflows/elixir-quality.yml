name: Elixir Quality

# One job per project.
#
# This ran all seven projects sequentially in a single step, which was 18m35s of a 22m job.
# Each project compiles its OWN dependency closure into its own _build -- 223 lock entries for
# serviceradar_core_elx, 169 for web-ng, 138 for agent_gateway, 134 for core -- with heavy
# overlap between them. Sequentially that cost is summed; as a matrix it is the slowest leg.
#
# The cache key is per project for the same reason. One key over `elixir/**/mix.lock` plus
# every .credo.exs and .formatter.exs meant a formatting-config change in palisade invalidated
# web-ng's 169 compiled dependencies, and the restore-keys fallback then handed back a tree
# whose priv/native symlinks pointed at uncached NIFs -- which is what the force-recompile
# repair in scripts/elixir_quality.sh exists to paper over.
#
# STILL DUPLICATED, and not fixed here: scripts/elixir_quality.sh runs `mix hex.audit` and
# `mix deps.audit` per project, and elixir-dependency-audit.yml runs the same audits daily on
# cron and on mix.lock changes. Those depend on an upstream advisory database rather than on
# this source tree, so the per-PR copy costs time without adding signal. Removing it needs a
# --skip-audit flag on the script, which does not have one yet.
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
  pull_request:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  quality:
    name: Elixir Quality (${{ matrix.name }})
    runs-on: arc-runner-set
    strategy:
      # One project's lint failure should not hide the other six.
      fail-fast: false
      matrix:
        include:
          # `rust` gates the toolchain install and the cargo cache. Only projects that build a
          # Rustler NIF, or depend on one through serviceradar_core / serviceradar_srql, need
          # a compiler; datasvc and palisade were paying for a rustup install they never used.
          - name: datasvc
            project: elixir/datasvc
            rust: false
          - name: palisade
            project: elixir/palisade
            rust: false
          - name: serviceradar_agent_gateway
            project: elixir/serviceradar_agent_gateway
            rust: true
          - name: serviceradar_core
            project: elixir/serviceradar_core
            rust: true
          - name: serviceradar_core_elx
            project: elixir/serviceradar_core_elx
            rust: true
          - name: serviceradar_srql
            project: elixir/serviceradar_srql
            rust: true
          - name: web-ng
            project: elixir/web-ng
            rust: true
            phoenix: true
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'

      - name: Setup Rust
        if: ${{ matrix.rust }}
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      # The registry and the built crates. Neither was cached before, so every NIF rebuild --
      # and the repair path in elixir_quality.sh forces one whenever a restored priv/native
      # symlink dangles -- started from an empty cargo home.
      - name: Cache Rust toolchain artifacts
        if: ${{ matrix.rust }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          # Every NIF crate dir, not just this project's. agent_gateway and core_elx own no
          # native/ tree -- they build the NIFs through the serviceradar_core path dependency,
          # so a project-scoped path would cache nothing for them.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            elixir/serviceradar_core/native/**/target
            elixir/serviceradar_srql/native/**/target
            elixir/web-ng/native/**/target
          key: ${{ runner.os }}-elixir-quality-cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'elixir/*/native/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-elixir-quality-cargo-${{ matrix.name }}-

      - name: Cache Elixir dependencies and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.hex
            ~/.mix
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-elixir-quality-${{ matrix.name }}-${{ hashFiles(format('{0}/mix.exs', matrix.project), format('{0}/mix.lock', matrix.project), format('{0}/.formatter.exs', matrix.project), format('{0}/.credo.exs', matrix.project), format('{0}/.sobelow-conf', matrix.project), format('{0}/.sobelow-skips', matrix.project), format('{0}/.deps_audit_ignore', matrix.project), 'elixir/.credo.base.exs', 'elixir/.credo.ex_dna.exs', 'elixir/.credo.ex_slop.exs', '.tool-versions', 'scripts/elixir_quality.sh') }}
          restore-keys: |
            ${{ runner.os }}-elixir-quality-${{ matrix.name }}-

      - name: Run Elixir quality contract
        run: |
          ./scripts/elixir_quality.sh \
            --project "${{ matrix.project }}" \
            --skip-dialyzer \
            ${{ matrix.phoenix && '--phoenix' || '' }}

      # web-ng only, and deliberately in this leg rather than a job of its own: it needs the
      # app compiled, which this leg has just done.
      #
      # The developer portal fetches this committed artifact from the repo instead of the live
      # demo site, so it must match the live spec served at /api/v2/open_api. Regenerate and
      # commit with: (cd elixir/web-ng && mix serviceradar.openapi.dump)
      - name: Check committed OpenAPI spec is up to date
        if: ${{ matrix.name == 'web-ng' }}
        working-directory: elixir/web-ng
        run: mix serviceradar.openapi.dump --check

  # Neither script starts a BEAM -- they read files and shell out to jq -- so this needs no
  # toolchain and no cache, and does not belong behind a seven-way compile matrix.
  db-checks:
    name: Baseline metadata and migration startup safety
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check baseline metadata and migration startup safety
        run: |
          scripts/db/check-baseline-metadata.sh
          scripts/db/check-migration-startup-safety.sh

      # Live CNPG baseline-vs-migration replay stays on the in-cluster BuildBuddy fixture
      # path. It needs SRQL_TEST_* and must not run here.
      # See gitops github/serviceradar-ci-split.md.
