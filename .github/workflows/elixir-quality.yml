name: Elixir Quality

# PR / staging-push gate is mix format + mix credo --strict per project.
# Compile --warnings-as-errors, xref, hex/deps audits, Sobelow, Dialyzer, and
# the committed OpenAPI dump check run daily from //buildbuddy.yaml
# ("Elixir Quality (daily)") against staging. Those steps compile each
# project's full Mix closure (hundreds of lock entries, overlapping across
# apps) and were 18m+ of a required PR check for little extra signal over
# format and Credo; BazelCI already compiles and tests the Elixir tree on
# every PR.
#
# Job names stay "Elixir Quality (<project>)" so existing required checks
# keep matching.
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
      - 'proto/**'
  pull_request:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.github/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
      - 'proto/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  quality:
    name: Elixir Quality (${{ matrix.name }})
    runs-on: arc-runner-set
    strategy:
      # One project's lint failure should not hide the other six.
      fail-fast: false
      matrix:
        include:
          - name: datasvc
            project: elixir/datasvc
          - name: palisade
            project: elixir/palisade
          - name: serviceradar_agent_gateway
            project: elixir/serviceradar_agent_gateway
          - name: serviceradar_core
            project: elixir/serviceradar_core
          - name: serviceradar_core_elx
            project: elixir/serviceradar_core_elx
          - name: serviceradar_srql
            project: elixir/serviceradar_srql
          - name: web-ng
            project: elixir/web-ng
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'

      - name: Cache Elixir dependencies and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.hex
            ~/.mix
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-elixir-lint-${{ matrix.name }}-${{ hashFiles(format('{0}/mix.exs', matrix.project), format('{0}/mix.lock', matrix.project), format('{0}/.formatter.exs', matrix.project), format('{0}/.credo.exs', matrix.project), 'elixir/.credo.base.exs', 'elixir/.credo.ex_dna.exs', 'elixir/.credo.ex_slop.exs', '.tool-versions', 'scripts/elixir_quality.sh') }}
          restore-keys: |
            ${{ runner.os }}-elixir-lint-${{ matrix.name }}-
            ${{ runner.os }}-elixir-quality-${{ matrix.name }}-

      - name: Run Elixir format and Credo
        env:
          HEX_HTTP_CONCURRENCY: '1'
          HEX_HTTP_TIMEOUT: '120'
        run: |
          ./scripts/elixir_quality.sh \
            --project "${{ matrix.project }}" \
            --lint-only

      # `make verify-proto-elixir` regenerates every checked-in .pb.ex from proto/
      # and fails on a diff. It lives on the core lint job because that is the
      # project the bindings live in. protoc is installed here rather than for
      # the whole matrix because the other six legs never generate protos.
      # Version and checksum are pinned exactly as rust-checks.yml pins them.
      - name: Install protoc
        if: ${{ matrix.name == 'serviceradar_core' }}
        env:
          PROTOC_VERSION: '35.1'
          PROTOC_SHA256: '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7'
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64|amd64) asset="protoc-${PROTOC_VERSION}-linux-x86_64.zip" ;;
            *) echo "unsupported protoc runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP:-/tmp}/protoc"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"

          curl -fsSL --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${asset}" \
            -o "${install_dir}/${asset}"
          printf '%s  %s\n' "${PROTOC_SHA256}" "${install_dir}/${asset}" | sha256sum -c -

          unzip -q "${install_dir}/${asset}" -d "${install_dir}"
          chmod +x "${install_dir}/bin/protoc"

          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          {
            echo "PROTOC=${install_dir}/bin/protoc"
            echo "PROTOC_INCLUDE=${install_dir}/include"
          } >> "${GITHUB_ENV}"

          "${install_dir}/bin/protoc" --version

      - name: Check committed Elixir protobuf bindings are up to date
        if: ${{ matrix.name == 'serviceradar_core' }}
        env:
          # make generate-proto-elixir ends with `mix format`, which compiles
          # deps, and serviceradar_srql's Rustler NIF shells out to `cargo`.
          # This job has no Rust toolchain, so without this the step dies with
          # System.cmd("cargo", ...) -> :enoent -- nothing to do with protos.
          # Same flag scripts/elixir_quality.sh:177 exports for the lint-only
          # path.
          SERVICERADAR_SKIP_NIF_COMPILATION: '1'
          HEX_HTTP_CONCURRENCY: '1'
          HEX_HTTP_TIMEOUT: '120'
        run: make verify-proto-elixir

  # Neither script starts a BEAM -- they read files and shell out to jq -- so this needs no
  # toolchain and no cache, and does not belong behind a seven-way compile matrix.
  db-checks:
    name: Baseline metadata and migration startup safety
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check baseline metadata and migration startup safety
        run: |
          scripts/db/check-baseline-metadata.sh
          scripts/db/check-migration-startup-safety.sh

      # Live CNPG baseline-vs-migration replay stays on the in-cluster BuildBuddy fixture
      # path. It needs SRQL_TEST_* and must not run here.
      # See gitops github/serviceradar-ci-split.md.
