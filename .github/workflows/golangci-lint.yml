name: lint
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  lint:
    name: lint
    runs-on: arc-runner-set
    # Removed the invalid job-level env block here
    steps:
      # Added a step to inject GOCACHE into the job's environment
      - name: Set GOCACHE
        run: echo "GOCACHE=${{ runner.temp }}/go-build" >> "$GITHUB_ENV"

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `buf breaking` compares against the base branch, so the base ref has
          # to exist locally. The default fetch-depth of 1 gives only the head
          # commit and the comparison silently has nothing to diff against.
          fetch-depth: 0
        
      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          
      - name: go toolchain info
        run: |
          go version
          go env GOMOD GOCACHE GOMODCACHE GOPROXY GOTOOLCHAIN

      - name: Prefetch Go modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed on attempt $attempt; retrying..." >&2
            sleep $((attempt * 5))
          done
          exit 1
          
      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: golangci-lint
        run: make lint-go

      # Moved here from golang-tests.yml when that job became Bazel-native. `make proto-lint`
      # is `go run github.com/bufbuild/buf/cmd/buf`, so it needs the Go toolchain this job
      # already installs;
      - name: buf lint
        run: make proto-lint

      # Wire-compatibility gate (GitHub #4026). `buf lint` has nothing to say
      # about tag reuse: a field reusing a tag freed by a removed field is
      # accepted silently and mis-decodes against peers still running the old
      # encoding, with no error on either side. Verified to fail on exactly
      # that change, not just to pass on a clean tree.
      - name: buf breaking
        run: |
          git fetch --no-tags origin "${PROTO_BREAKING_BASE#origin/}"
          make proto-breaking
        env:
          PROTO_BREAKING_BASE: origin/${{ github.event_name == 'pull_request' && github.base_ref || 'staging' }}

      - name: go mod tidy check
        uses: katexochen/go-tidy-check@427c8c07d3d83ab8d7290cad04ce71c12eab3674
