# NATS Server Configuration for ServiceRadar CLOUD (hub)
#
# Subject-scoping model (B-5):
# ----------------------------
# This hub accepts both regular client connections (4222) and leaf-node
# links from edge clusters (7422). Both listeners use mTLS with
# verify_and_map=true so the client CN maps to a named NATS user with
# scoped permissions.
#
# Subject map:
#   flow.host-slice.<agent_id>      published by edge flow-collector(s) per
#                                   agent; consumed by the per-partition
#                                   attribution bridge in core.
#   flow.attributed.<partition_id>  published by the attribution bridge;
#                                   consumed by core EventWriter.
#   flow.raw.>                      legacy raw-flow ingest preserved for
#                                   backwards compatibility with core-elx.
#   $JS.>, _INBOX.>                 JetStream API + reply inboxes.
#   $SYS.>                          denied for all CN users.
#
# Per-edge isolation note: today every edge ships with the same
# `CN=serviceradar-edge` cert, so the hub cannot distinguish edge A from
# edge B at the NATS layer. Until per-edge CN provisioning lands (one CN
# per edge, e.g. CN=edge.<partition_id>,O=ServiceRadar) all edges share
# the same flow.host-slice.> publish allow list. JetStream domain "hub"
# remains the topological boundary that keeps edges from importing each
# other's streams.
#
# Per-partition core isolation (B-5 sub-issue 2):
# -----------------------------------------------
# ServiceRadar is one deployment per partition (see
# elixir/serviceradar_core/CLAUDE.md "Instance Isolation Model"). Each
# core process knows its own partition_id from SERVICERADAR_OTX_PARTITION
# at boot. To prevent core in partition A from publishing into partition
# B's flow.attributed.<partition> stream, this template renders the core
# user with a partition-scoped PublishAllow.
#
# NATS publish authorization is "any matching deny wins": a wildcard
# deny on the unscoped flow.attributed.> would be a strict superset of
# the partition-scoped allows and would shadow them, preventing core
# from publishing to its own partition (B-7). Cross-partition publish
# is prevented by the narrowness of PublishAllow itself —
# flow.attributed.<otherP> is not in the allow list, so NATS implicitly
# denies it.
#
# When deploying, render the literal `__SERVICERADAR_PARTITION_ID__`
# placeholder below to the partition_id of this deployment (matching
# the value set in core-elx config / SERVICERADAR_OTX_PARTITION). The
# bootstrap CLI (`go/pkg/cli/nats_bootstrap.go::GeneratePartitionCoreCreds`)
# emits the JWT equivalent for environments that have migrated off the
# static mTLS-mapped user block.

server_name: nats-aerviceradar-cloud
logfile: "/var/log/nats/nats.log"
debug: true

# Listener for regular clients (e.g., API, gateway)
listen: 0.0.0.0:4222

# Listener for Leaf Node connections from the Edge
leafnodes {
    port: 7422
    tls {
        cert_file: "/etc/nats/certs/nats-server.pem"
        key_file: "/etc/nats/certs/nats-server-key.pem"
        ca_file: "/etc/nats/certs/root.pem"
        verify_and_map: true
    }
}

# Enable JetStream for KV store
jetstream {
    store_dir: /var/lib/nats/jetstream
    max_memory_store: 1G
    max_file_store: 10G
    domain: hub
}

# Enable mTLS for secure client communication
tls {
    cert_file: "/etc/nats/certs/nats-server.pem"
    key_file: "/etc/nats/certs/nats-server-key.pem"
    ca_file: "/etc//nats/certs/root.pem"
    verify_and_map: true
}

# Authorization for clients and leaf nodes.
# Each CN maps to a named user with subject-scoped permissions. A
# compromised edge cannot impersonate core, publish to $SYS.>, or
# subscribe to flow.attributed.> (consumer-only data).
authorization {
    users: [
        # Edge leaf-node identity. Edges publish per-agent host slices and
        # raw flows up to the hub; they subscribe to JetStream control and
        # their config namespace. Subscribing to peer flow.host-slice.>
        # slices is explicitly denied — slice consumption is a hub-only
        # role.
        {
            user: "CN=serviceradar-edge,O=ServiceRadar"
            permissions: {
                publish: {
                    allow: [
                        "flow.host-slice.>",
                        "flow.raw.>",
                        "logs.>",
                        "events.>",
                        "$JS.API.>",
                        "$JS.ACK.>",
                        "_INBOX.>"
                    ]
                    deny: ["$SYS.>", "flow.attributed.>"]
                },
                subscribe: {
                    allow: [
                        "$JS.API.>",
                        "$JS.ACK.>",
                        "_INBOX.>",
                        "config.>"
                    ]
                    deny: ["$SYS.>", "flow.host-slice.>", "flow.attributed.>"]
                }
            }
        },
        # Core platform identity. Core consumes host-slice telemetry and
        # publishes the attributed-flow stream consumed by the EventWriter.
        #
        # The `__SERVICERADAR_PARTITION_ID__` placeholder MUST be
        # rendered to the partition_id of this deployment (matching the
        # value set in core-elx config / SERVICERADAR_OTX_PARTITION).
        #
        # NATS publish authorization is "any matching deny wins": a deny
        # on the unscoped wildcard `flow.attributed.>` would be a strict
        # superset of the partition-scoped allows below and would shadow
        # them at runtime, preventing core from publishing to its own
        # partition (B-7). Cross-partition publish is prevented by the
        # narrowness of the allow list — flow.attributed.<otherP> is
        # not present and is implicitly denied by NATS.
        {
          user: "CN=core.serviceradar,O=ServiceRadar"
          permissions: {
            publish: {
              allow: [
                "flow.attributed.__SERVICERADAR_PARTITION_ID__",
                "flow.attributed.__SERVICERADAR_PARTITION_ID__.>",
                "flow.raw.>",
                "logs.>",
                "events.>",
                "config.>",
                "$JS.API.>",
                "$JS.ACK.>",
                "_INBOX.>"
              ]
              deny: ["$SYS.>"]
            },
            subscribe: {
              allow: [
                "flow.host-slice.>",
                "flow.attributed.__SERVICERADAR_PARTITION_ID__",
                "flow.attributed.__SERVICERADAR_PARTITION_ID__.>",
                "flow.raw.>",
                "logs.>",
                "events.>",
                "config.>",
                "$JS.API.>",
                "$JS.ACK.>",
                "_INBOX.>"
              ]
              deny: ["$SYS.>"]
            }
          }
        }
    ]
}
