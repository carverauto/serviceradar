# NATS Server Configuration for ServiceRadar KV Store
#
# Subject-scoping model (B-5):
# ----------------------------
# This deployment uses mTLS with verify_and_map=true, which maps the client
# certificate's Common Name (CN) to a named NATS user. Each role gets a
# scoped permissions block so a compromised component cannot publish to or
# read from subjects outside its responsibility.
#
# Subject map:
#   flow.host-slice.<agent_id>      published by flow-collector per agent;
#                                   consumed only by the per-partition
#                                   attribution bridge (core).
#   flow.attributed.<partition_id>  published by the attribution bridge;
#                                   consumed by core EventWriter.
#   flow.raw.>                      legacy raw-flow ingest (kept for
#                                   backwards compatibility with core-elx
#                                   subscribers).
#   $JS.>, _INBOX.>                 JetStream API + reply inboxes.
#   $SYS.>                          system events; restricted to the system
#                                   account only — denied for all CN users.
#
# Per-agent isolation note: today every flow-collector ships with the same
# `CN=serviceradar-flow-collector` cert. Until per-agent certs (or per-agent
# JWTs) are provisioned, agents are constrained to the flow.host-slice.>
# prefix as a group, not as individuals. Per-agent scoping requires either
# (a) per-edge CN provisioning with `verify_and_map` + a user block per
# CN, or (b) JWT credentials where the per-agent allow list is bound to
# the agent_id at credential issuance. The bootstrap generator
# (go/pkg/cli/nats_bootstrap.go) emits the JWT template that achieves (b).
#
# Per-partition core isolation (B-5 sub-issue 2):
# -----------------------------------------------
# ServiceRadar is one deployment per partition (see
# elixir/serviceradar_core/CLAUDE.md "Instance Isolation Model"). Each
# core process knows its own partition_id from SERVICERADAR_OTX_PARTITION
# at boot. To prevent core in partition A from publishing into partition
# B's flow.attributed.<partition> stream, this template renders the core
# user with a partition-scoped PublishAllow listing only
# flow.attributed.<partition_id> and flow.attributed.<partition_id>.>.
#
# NATS publish authorization is "any matching deny wins": a wildcard
# deny on the unscoped flow.attributed.> would be a strict superset of
# the partition-scoped allows and would shadow them, preventing core
# from publishing to its own partition (B-7). Cross-partition publish
# is prevented by the narrowness of PublishAllow itself —
# flow.attributed.<otherP> is not in the allow list, so NATS implicitly
# denies it.
#
# When deploying, render the literal `__SERVICERADAR_PARTITION_ID__`
# placeholder below to the partition_id of this deployment (matching
# the value set in core-elx config / SERVICERADAR_OTX_PARTITION). The
# bootstrap CLI (`go/pkg/cli/nats_bootstrap.go::GeneratePartitionCoreCreds`)
# emits the JWT equivalent for environments that have migrated off the
# static mTLS-mapped user block.

# Listen on the default NATS port (restricted to localhost for security)
listen: 127.0.0.1:4222

# Server identification
server_name: nats-serviceradar

# Enable JetStream for KV store
jetstream {
  # Directory to store JetStream data
  store_dir: /var/lib/nats/jetstream
  # Maximum storage size
  max_memory_store: 1G
  # Maximum disk storage
  max_file_store: 10G
}

# Enable mTLS for secure communication
tls {
  # Path to the server certificate
  cert_file: "/etc/serviceradar/certs/nats-server.pem"
  # Path to the server private key
  key_file: "/etc/serviceradar/certs/nats-server-key.pem"
  # Path to the root CA certificate for verifying clients
  ca_file: "/etc/serviceradar/certs/root.pem"

  # Require client certificates (enables mTLS)
  verify: true
  # Require and verify client certificates
  verify_and_map: true
}

# Map the client certificate's Common Name (CN) to a NATS user so that
# components using certificates (e.g., core services) can authenticate.
authorization {
  users: [
    # Core platform service: subscribes to flow.host-slice.> for
    # attribution, publishes flow.attributed.<partition_id> for the
    # owning partition, manages JetStream streams/consumers, and uses
    # request/reply inboxes. Explicitly denied from $SYS.> — system
    # events are scoped to the system account only.
    #
    # The `__SERVICERADAR_PARTITION_ID__` placeholder MUST be rendered
    # to the partition_id of this deployment (matching the value set
    # in core-elx config / SERVICERADAR_OTX_PARTITION).
    #
    # NATS publish authorization is "any matching deny wins": a deny on
    # the unscoped wildcard `flow.attributed.>` would be a strict
    # superset of the partition-scoped allows above and would shadow
    # them at runtime, preventing core from publishing to its own
    # partition (B-7). Cross-partition publish is prevented by the
    # narrowness of the allow list — flow.attributed.<otherP> is not
    # present and is implicitly denied by NATS.
    {
      user: "CN=core.serviceradar,O=ServiceRadar"
      permissions: {
        publish: {
          allow: [
            "flow.attributed.__SERVICERADAR_PARTITION_ID__",
            "flow.attributed.__SERVICERADAR_PARTITION_ID__.>",
            "flow.raw.>",
            "logs.>",
            "signals.analytics.>",
            "events.>",
            "config.>",
            "$JS.API.>",
            "$JS.ACK.>",
            "_INBOX.>"
          ]
          deny: ["$SYS.>"]
        }
        subscribe: {
          allow: [
            "flow.host-slice.>",
            "flow.attributed.__SERVICERADAR_PARTITION_ID__",
            "flow.attributed.__SERVICERADAR_PARTITION_ID__.>",
            "flow.raw.>",
            "logs.>",
            "signals.analytics.>",
            "events.>",
            "config.>",
            "$JS.API.>",
            "$JS.ACK.>",
            "_INBOX.>"
          ]
          deny: ["$SYS.>"]
        }
      }
    },

    # Flow-collector role: publishes per-host slice telemetry to
    # flow.host-slice.<agent_id> and raw aggregate flows to
    # flow.raw.>. Producer-side allowlist in host_slice.rs is
    # defense-in-depth; subject ACL is the authoritative gate.
    #
    # The collector consumes nothing besides JetStream control and
    # its own reply inboxes — it must NOT subscribe to peer slices.
    {
      user: "CN=serviceradar-flow-collector,O=ServiceRadar"
      permissions: {
        publish: {
          allow: [
            "flow.host-slice.>",
            "flow.raw.>",
            "$JS.API.>",
            "$JS.ACK.>",
            "_INBOX.>"
          ]
          deny: ["$SYS.>", "flow.attributed.>"]
        }
        subscribe: {
          allow: [
            "$JS.API.>",
            "$JS.ACK.>",
            "_INBOX.>",
            "config.flow-collector.>"
          ]
          deny: ["$SYS.>", "flow.host-slice.>", "flow.attributed.>"]
        }
      }
    }
  ]
}

# Logging settings
logfile: "/var/log/nats/nats.log"
debug: true
