# ServiceRadar Unified Log Collector
# Enable/disable each input and point to their native config files.

[flowgger]
enabled = true
config_file = "/etc/serviceradar/flowgger.toml"

[otel]
enabled = true
config_file = "/etc/serviceradar/otel.toml"

[health]
listen_addr = "0.0.0.0:50044"

# Follow the Zen ruleset core publishes for syslog and normalize syslog here.
# The collector reads it from the NATS rule bucket with the same connection
# settings as [nats] in otel.toml; uncomment to enable.
# An optional domain = "..." names the JetStream domain that holds the rules
# bucket. Leave it unset for a collector connected to the hub; an edge
# collector, which reaches the hub through its leaf, sets the hub's JetStream
# domain (edge support is delivered later).
#
# [rules.nats]
# url = "nats://serviceradar-nats:4222"
# creds_file = "/var/run/serviceradar/runtime/NATS_CREDS_FILE"
# bucket = "serviceradar-zen-rules"
#
# A [rules.nats.tls] section takes cert_file, key_file and ca_file, as
# [nats.tls] does in otel.toml.
