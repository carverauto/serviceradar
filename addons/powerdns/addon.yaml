# PowerDNS protobuf telemetry native add-on.
#
# Runs as an agent-sidecar go-plugin add-on on DNS hosts. PowerDNS Recursor
# connects to the add-on's localhost TCP listener using protobufServer()
# framing; the add-on decodes PBDNSMessage, maps RPZ/policy-hit responses to
# OCSF DNS Activity, and emits generic native telemetry batches to the local
# serviceradar-agent.
id: powerdns
name: PowerDNS DNS Telemetry
version: 0.1.7
description: >-
  Local PowerDNS protobuf receiver that maps RPZ policy hits to OCSF DNS
  Activity events and forwards them through the authenticated ServiceRadar agent
  path.

kind: native
delivery: pushed-artifact
supervision: agent-sidecar
language: rust

capabilities:
  - native-telemetry:v1
  - dns-activity
  - powerdns-rpz

requires:
  base_agent: ">=1.2.0"
  platforms: [linux]
  os_capabilities: []
  run_as: serviceradar

plugin:
  protocol: grpc
  app_protocol_version: 1

exec:
  binary: serviceradar-powerdns-addon
  install_path: /usr/local/lib/serviceradar/bin

config_schema: config.schema.json

signal_schemas:
  - id: com.carverauto.powerdns.dns_activity
    version: 1.0.0
    signal_type: event
    payload_kind: ocsf_event
    payload_schema: schemas/dns_activity.schema.json
    display_contract: display/dns_activity.display.json
    display_contract_id: com.carverauto.powerdns.dns_activity.display
    display_contract_version: 1.1.0
    ocsf_schema_version: 1.5.0
    class_uid: 4003
