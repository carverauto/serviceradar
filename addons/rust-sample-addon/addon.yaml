# Rust sample native add-on manifest (issue 3425 reference consumer).
#
# This is the first Rust consumer of the native add-on framework and the
# reference for the `pushed-artifact` / `agent-sidecar` / `language: rust` shape.
# It is supervised by the agent's go-plugin client exactly like the Go sample
# add-on; the only difference is the implementation language (Rust via the
# rust/addon-sdk helper). The control plane validates operator config against
# config.schema.json before delivering it over the Configure RPC.
#
# id/capabilities/binary intentionally match the values the binary reports from
# its own Info() RPC (rust/addon-sdk/src/bin/rust_sample_addon.rs) so the
# manifest and the runtime agree.
id: rust-sample
name: Rust Sample Add-on
version: 0.1.0
description: >-
  Reference Rust native add-on that validates the go-plugin add-on contract from
  a non-Go implementation. Proves the framework's polyglot claim and the
  agent-sidecar supervision model end to end (handshake + AutoMTLS +
  Info/Configure/Health).

kind: native
delivery: pushed-artifact     # compiled-in | pushed-artifact | os-package
supervision: agent-sidecar    # config-toggle | agent-sidecar | systemd-service | systemd-timer | ephemeral-helper
language: rust                # go | rust

capabilities:
  - rust-sample

requires:
  base_agent: ">=1.2.0"
  platforms: [linux]
  os_capabilities: []
  run_as: serviceradar

plugin:
  protocol: grpc
  # Must match addon.ProtocolVersion (go/pkg/addon/addon.go) and
  # APP_PROTOCOL_VERSION (rust/addon-sdk). Pinned so go-plugin protocol drift on
  # upgrade is caught at the handshake rather than silently.
  app_protocol_version: 1

exec:
  binary: serviceradar-rust-sample-addon
  install_path: /usr/local/lib/serviceradar/bin

# artifacts[] (per-arch object_key/sha256/signature_ref) are populated by the
# signed-bundle build (native-addon-builds); omitted in this reference source.

config_schema: config.schema.json
