# Advisory feed producer native add-on.
#
# Runs as an agent-sidecar go-plugin add-on and refreshes vulnerability
# intelligence feeds into the generic ServiceRadar advisory-feed contract.
id: advisory-producer
name: Advisory Feed Producer
version: 0.1.0
description: >-
  First-party native producer for CISA KEV, NVD CVE 2.0, and VulnCheck advisory
  feeds.

kind: native
delivery: pushed-artifact
supervision: agent-sidecar
language: go

capabilities:
  - advisory-feed:v1
  - producer-schedule:v1
  - artifact-staging:v1

requires:
  base_agent: ">=1.2.0"
  platforms: [linux]
  os_capabilities: []
  run_as: serviceradar

plugin:
  protocol: grpc
  app_protocol_version: 1

exec:
  binary: serviceradar-advisory-producer
  install_path: /usr/local/lib/serviceradar/bin

config_schema: config.schema.json

producer_schedules:
  - schedule_id: cisa_kev.refresh
    label: Refresh CISA KEV
    description: >-
      Download the CISA Known Exploited Vulnerabilities catalog and emit
      normalized advisory records.
    action_id: cisa_kev.refresh
    command_type: addon.run_command
    default_cadence_seconds: 21600
    min_cadence_seconds: 300
    max_cadence_seconds: 2592000
    schedule_type: interval
    jitter_seconds: 300
    dispatch_scope: assignment
    timeout_seconds: 900
    settings_schema:
      type: object
      properties:
        url:
          type: string
          title: Catalog URL
          default: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  - schedule_id: nvd_cve.refresh
    label: Refresh NVD CVE 2.0
    description: >-
      Download NVD CVE 2.0 data and emit CPE-backed normalized advisory
      records.
    action_id: nvd_cve.refresh
    command_type: addon.run_command
    default_cadence_seconds: 86400
    min_cadence_seconds: 3600
    max_cadence_seconds: 2592000
    schedule_type: interval
    jitter_seconds: 900
    dispatch_scope: assignment
    timeout_seconds: 1800
    settings_schema:
      type: object
      properties:
        url:
          type: string
          title: NVD API URL
          default: https://services.nvd.nist.gov/rest/json/cves/2.0
    credential_requirements:
      api_key:
        required: false
        description: Optional NVD API key credential ref for higher API limits
    redaction:
      fields:
        - credential_refs.api_key
        - input_values.api_key
  - schedule_id: vulncheck.refresh
    label: Refresh VulnCheck
    description: >-
      Download VulnCheck KEV/NVD-enriched data and emit PURL/CPE normalized
      advisory records.
    action_id: vulncheck.refresh
    command_type: addon.run_command
    default_cadence_seconds: 43200
    min_cadence_seconds: 3600
    max_cadence_seconds: 2592000
    schedule_type: interval
    jitter_seconds: 900
    dispatch_scope: assignment
    timeout_seconds: 1800
    settings_schema:
      type: object
      properties:
        url:
          type: string
          title: VulnCheck API URL
          description: VulnCheck feed endpoint for KEV/NVD-enriched records
      required: [url]
    credential_requirements:
      api_token:
        required: true
        description: VulnCheck API token credential ref
    redaction:
      fields:
        - credential_refs.api_token
        - input_values.api_token
