name: Golang Tests
on:
  push:
    branches: [staging]
    paths-ignore:
      - 'rust/**'  # Ignore changes in the Rust project directory
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'rust/**'  # Ignore changes in the Rust project directory

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-go:
    runs-on: ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Run Proto Lint
        run: make proto-lint
      - name: Run Go Tests
        run: |
          go test -timeout=10m -race -count=10 -failfast -shuffle=on -short ./... -coverprofile=./cover.short.profile -covermode=atomic -coverpkg=./...
          go test -timeout=120s -race -count=1 -failfast -shuffle=on ./... -coverprofile=./cover.long.profile -covermode=atomic -coverpkg=./...
        env:
          GOFLAGS: "-tags=ci"
