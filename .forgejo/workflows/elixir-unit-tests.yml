name: Elixir Unit Tests

# Bazel-native ExUnit targets for the Elixir tree, grouped by test directory.
#
# Every Hex dependency is a Bazel repository (declared in MODULE.bazel, generated by
# scripts/gen_hex_bazel.exs) compiled by //build:mix_app.bzl inside a hermetic action, and
# OTP + Elixir come from @rules_erlang / @rules_elixir. Bazel supplies every toolchain and
# every dependency. It needs no database either: test_helper.exs excludes [:integration, :external, :cluster, :large_ingestion,
# :benchmark] unless a database URL is present in the environment, and none is set here.
#
on:
  push:
    branches: [staging]
    paths: &unit_test_paths
      - 'elixir/**'
      - 'addons/*/addon.yaml'
      - 'addons/*/config.schema.json'
      - 'build/elixir_test_config_loader.exs'
      - 'build/elixir_tests.bzl'
      - 'build/mix_app.bzl'
      - 'scripts/gen_hex_bazel.exs'
      - 'third_party/hex/**'
      - 'third_party/patches/rules_elixir/**'
      - 'third_party/patches/rules_erlang/**'
      - '.tool-versions'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.forgejo/workflows/elixir-unit-tests.yml'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths: *unit_test_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Elixir unit tests
    runs-on: ubuntu24
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # --config=ci sends the test actions to the executors and lets unchanged targets
      # resolve as remote cache hits. It also gives a BES invocation link on failure, which
      # is the whole diagnostic surface for a remote run.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # Fail loudly if the glob stops matching
      - name: Resolve test targets
        run: |
          set -euo pipefail

          if ! targets="$(bazel query 'tests(//elixir/...)')"; then
            echo "bazel query failed -- see the error above; the targets were never resolved." >&2
            exit 1
          fi

          count="$(printf '%s\n' "${targets}" | grep -c . || true)"
          echo "Resolved ${count} ExUnit targets"
          # serviceradar_core 11 unit + 8 integration shards + migrate_template, agent_gateway
          # 2, web-ng 9, bazel_spike 2 = 34 today. Guard well below that so a normal split does
          # not trip it, but a glob that stops matching does.
          if [ "${count}" -lt 15 ]; then
            echo "Expected at least 15 ExUnit targets; a glob in an elixir/*/BUILD.bazel is probably wrong." >&2
            exit 1
          fi

      # --test_output=errors prints only failing tests.
      - name: Run unit tests
        run: |
          bazel test --config=ci --test_output=errors \
            //elixir/serviceradar_core:unit_tests \
            //elixir/serviceradar_agent_gateway:unit_tests \
            //elixir/web-ng:unit_tests
