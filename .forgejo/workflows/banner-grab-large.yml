name: Banner-Grab Large-Host Synthetic Tests
on:
  workflow_dispatch:
  schedule:
    # Nightly at 07:00 UTC. The synthetic 1M-host engine test is too slow to
    # gate every PR but is the primary regression guard for the bounded
    # concurrency / queue-depth invariants in
    # go/pkg/scan/banner_grab/engine_test.go.
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  test-banner-grab-large:
    runs-on: ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Run synthetic 1M-host banner-grab engine test
        env:
          SERVICERADAR_LARGE_BANNER_GRAB_TEST: '1'
        run: |
          go test -count=1 -timeout=5m \
            -run TestEngineKeepsMillionHostSyntheticStreamBounded \
            ./go/pkg/scan/banner_grab/...
