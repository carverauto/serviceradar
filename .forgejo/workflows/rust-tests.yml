name: Rust Tests

# Bazel-native, and tests only. Every crate under //rust/... already declares its own
# rust_test targets, so the tests run once, through the build graph that ships, on the org's
# BuildBuddy: remote cache, remote execution, BES reporting.
#
# Previously this ran a 10-leg matrix in which six legs re-ran the same tests under `cargo
# test`. That resolved dependencies from the crates.io registry rather than the vendored
# tree, so a green leg proved nothing about the artifact that ships (see
# rust/README_RUST.md), and three of the four Bazel legs passed no --config at all, which
# meant they never reached the remote cache or the executors.
#
# Everything that fails for its own reasons lives in its own workflow, so a red X names the
# problem without anyone opening a log:
#
#   rust-lint.yml   clippy          -- a lint regression
#   rust-audit.yml  cargo-audit     -- an advisory published upstream against untouched code
#   rust-musl.yml   netprobe static -- a cross-compile or linkage break
on:
  push:
    branches: [staging]
    paths: &rust_paths
      - 'rust/**'
      - 'proto/**'
      - 'third_party/crates/**'
      - 'build/platforms/**'
      - 'build/rbe/**'
      - 'build/rust/**'
      - 'build/toolchains/**'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.forgejo/workflows/rust-tests.yml'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths: *rust_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    name: Rust Integration Tests
    runs-on: ubuntu24
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
      SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
      SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
      SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # Required. --config=ci points the remote cache, BES and executor at the
      # org's BuildBuddy, which rejects anonymous access, so without this header the first
      # bazel call dies with `PERMISSION_DENIED: Anonymous access disabled` -- a failure that
      # reads nothing like the missing credential it actually is.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # The SRQL DSNs reach the test actions through .bazelrc's own --action_env/--test_env
      # entries, so this step only has to materialise the CA file and export its path. When
      # the secrets are absent the step is a no-op: the fixture-backed assertions skip
      # themselves, and failing the whole Rust suite over an unavailable fixture would be
      # worse than losing that coverage.
      - name: Configure SRQL fixture
        if: ${{ env.SRQL_TEST_DATABASE_CA_CERT != '' }}
        run: |
          set -euo pipefail

          ca_file="${RUNNER_TEMP}/srql-fixture-ca.crt"
          printf '%s' "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"

          {
            echo "PGSSLROOTCERT=${ca_file}"
            echo "SRQL_TEST_DATABASE_CA_CERT_FILE=${ca_file}"
          } >> "$GITHUB_ENV"

      # Resolve up front so an empty match fails loudly. `bazel test` exits 4 for "no tests
      # found", which surfaces as a red job that reads like broken infrastructure rather than
      # a suite that quietly stopped existing.
      #
      # integration_test targets are excluded because rust-tests-integration.yml owns them:
      # they drive real containers on remote microVMs and are far slower than everything
      # here. manual-tagged targets need no exclusion -- --config=ci already sets
      # --build_tag_filters=-manual and --test_tag_filters=-manual.
      - name: Resolve test targets
        run: |
          set -euo pipefail

          mapfile -t targets < <(
            bazel query 'tests(//rust/...) except attr("tags", "integration_test", tests(//rust/...))'
          )

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No test targets found under //rust/..., which cannot be right." >&2
            exit 1
          fi

          printf 'Resolved %d test target(s)\n' "${#targets[@]}"
          printf '%s\n' "${targets[@]}" > "${RUNNER_TEMP}/rust-test-targets.txt"

      # Compiling is kept separate from running on purpose: they are different failure modes
      # with different owners. A broken build is a code or dependency problem, a failing test
      # is a behaviour problem. Folded into one step the job goes red either way and someone
      # has to read the log to find out which; split, the step name says it.
      - name: Build test targets
        run: |
          set -euo pipefail

          mapfile -t targets < "${RUNNER_TEMP}/rust-test-targets.txt"
          bazel build --config=ci "${targets[@]}"

      - name: Run tests
        run: |
          set -euo pipefail

          mapfile -t targets < "${RUNNER_TEMP}/rust-test-targets.txt"
          bazel test --config=ci --test_output=errors "${targets[@]}"
