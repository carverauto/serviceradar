name: Rust Tests
on:
  push:
    branches: [staging]
    paths:
      - 'rust/rperf-client/**'
      - 'rust/rperf-server/**'
      - 'rust/trapd/**'
      - 'rust/log-collector/**'
      - 'rust/netprobe/**'
      - 'rust/rdp-adapter/**'
      - 'rust/rdp-connector-probe/**'
      - 'rust/srql/**'
      - 'build/platforms/**'
      - 'build/rust/**'
      - 'build/toolchains/**'
      - '.bazelrc'
      - '.forgejo/workflows/tests-rust.yml'
      - 'MODULE.bazel'
      - 'scripts/ci/assert-netprobe-libpcap-free.sh'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths:
      - 'rust/rperf-client/**'
      - 'rust/rperf-server/**'
      - 'rust/trapd/**'
      - 'rust/log-collector/**'
      - 'rust/netprobe/**'
      - 'rust/rdp-adapter/**'
      - 'rust/rdp-connector-probe/**'
      - 'rust/srql/**'
      - 'build/platforms/**'
      - 'build/rust/**'
      - 'build/toolchains/**'
      - '.bazelrc'
      - '.forgejo/workflows/tests-rust.yml'
      - 'MODULE.bazel'
      - 'scripts/ci/assert-netprobe-libpcap-free.sh'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-rust:
    runs-on: ubuntu24
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
      SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
      SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
    strategy:
      matrix:
        include:
          - project: rust/rperf-client
            runner: cargo
          - project: rust/rperf-server
            runner: bazel
            bazel_target: //rust/rperf-server:rperf
          - project: rust/trapd
            runner: cargo
          - project: rust/log-collector
            runner: cargo
          - project: rust/netprobe
            runner: bazel-test
            bazel_target: //rust/netprobe:netprobe_test
          - project: rust/netprobe
            runner: bazel-static
            bazel_target: //rust/netprobe:netprobe
            platform: //build/platforms:linux_x86_64_musl
          - project: rust/netprobe
            runner: bazel-static
            bazel_target: //rust/netprobe:netprobe
            platform: //build/platforms:linux_aarch64_musl
          - project: rust/rdp-adapter
            runner: cargo
          - project: rust/rdp-connector-probe
            runner: cargo
          - project: rust/rdp-connector-probe
            runner: rdp-bazel-test
            bazel_target: >-
              //rust/rdp-connector-probe:rdp_connector_probe_test
              //rust/rdp-adapter:rdp_adapter_connector_link_probe_test
              //rust/rdp-adapter:rdp_adapter_ironrdp_connector_experimental_test
          - project: rust/srql
            runner: cargo
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          echo "Expected Bazel: ${expected}"
          echo "Resolved Bazel: ${actual}"
          test "${actual}" = "${expected}"

      - name: Report unavailable SRQL fixture secrets
        if: ${{ matrix.project == 'rust/srql' && (env.SRQL_TEST_DATABASE_URL == '' || env.SRQL_TEST_ADMIN_URL == '' || env.SRQL_TEST_DATABASE_CA_CERT == '') }}
        run: |
          {
            echo "## SRQL Fixture"
            echo
            echo "SRQL fixture secrets are unavailable in this workflow context."
            echo "Skipping rust/srql fixture configuration; tests will run without the external SRQL fixture."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure SRQL fixture database for tests
        if: ${{ matrix.project == 'rust/srql' && env.SRQL_TEST_DATABASE_URL != '' && env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail

          if [ -z "${SRQL_TEST_DATABASE_URL:-}" ] || [ -z "${SRQL_TEST_ADMIN_URL:-}" ]; then
            echo "SRQL fixture DSNs must be configured via SRQL_TEST_DATABASE_URL and SRQL_TEST_ADMIN_URL secrets." >&2
            exit 1
          fi

          if [ -z "${SRQL_TEST_DATABASE_CA_CERT:-}" ]; then
            echo "SRQL_TEST_DATABASE_CA_CERT secret must be configured to verify SRQL fixture TLS." >&2
            exit 1
          fi

          ca_file="${RUNNER_TEMP}/srql-fixture-ca.crt"
          printf "%s" "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"

          {
            echo "PGSSLROOTCERT=${ca_file}"
            echo "SRQL_TEST_DATABASE_CA_CERT_FILE=${ca_file}"
          } >> "$GITHUB_ENV"

      - name: Check SRQL fixture reachability
        if: ${{ matrix.project == 'rust/srql' && env.SRQL_TEST_DATABASE_URL != '' && env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
        run: |
          set -euo pipefail

          if python3 - <<'PY'
          import os
          import re
          import socket
          import sys
          from urllib.parse import urlparse, unquote

          raw = os.environ["SRQL_TEST_ADMIN_URL"].strip()
          host = ""
          port = 5432

          if "://" in raw:
              parsed = urlparse(raw)
              host = parsed.hostname or ""
              port = parsed.port or 5432
          else:
              fields = dict(
                  (key, unquote(value.strip("'\"")))
                  for key, value in re.findall(r"(\w+)=('[^']*'|\"[^\"]*\"|\S+)", raw)
              )
              host = fields.get("host", "")
              port = int(fields.get("port", "5432"))

          if not host:
              print("unable to resolve SRQL fixture host from SRQL_TEST_ADMIN_URL", file=sys.stderr)
              sys.exit(1)

          try:
              with socket.create_connection((host, port), timeout=10):
                  print(f"SRQL fixture reachable at {host}:{port}")
          except OSError as exc:
              print(f"SRQL fixture unreachable at {host}:{port}: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
          then
            exit 0
          fi

          {
            echo "SRQL_TEST_DATABASE_URL="
            echo "SRQL_TEST_ADMIN_URL="
            echo "SRQL_TEST_DATABASE_CA_CERT="
            echo "PGSSLROOTCERT="
            echo "SRQL_TEST_DATABASE_CA_CERT_FILE="
          } >> "$GITHUB_ENV"

          {
            echo "## SRQL Fixture"
            echo
            echo "SRQL fixture secrets are configured, but the fixture service is unreachable from this runner."
            echo "Falling back to non-fixture SRQL tests for this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo registry
        if: ${{ matrix.runner == 'cargo' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        if: ${{ matrix.runner == 'cargo' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ matrix.project }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.project }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Cargo Audit
        if: ${{ matrix.project == 'rust/rdp-connector-probe' && matrix.runner == 'cargo' }}
        run: sfw cargo install cargo-audit --locked --version 0.22.1

      - name: Audit RDP connector probe dependencies
        if: ${{ matrix.project == 'rust/rdp-connector-probe' && matrix.runner == 'cargo' }}
        run: |
          advisory_db="${RUNNER_TEMP:-/tmp}/rustsec-advisory-db"
          rm -rf "${advisory_db}"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "${advisory_db}"

          cd rust/rdp-connector-probe
          sfw cargo audit --db "${advisory_db}" --no-fetch --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2023-0089

          {
            echo "## RDP Connector Probe RustSec Audit"
            echo
            echo "Known accepted advisories for the review-only IronRDP connector probe:"
            echo "- RUSTSEC-2023-0071: rsa Marvin timing issue via connector 0.10.0 -> sspi 0.21.1 -> picky 7.0.0-rc.25; no fixed upgrade is available in this IronRDP family."
            echo "- RUSTSEC-2023-0089: atomic-polyfill is unmaintained in connector 0.10.0's forced sspi/scard build subtree; ServiceRadar rejects smart-card redirection at runtime."
            echo "- Reviewed exact family: blocking/connector 0.10.0, core 0.2.1, graphics/pdu 0.9.0, session 0.11.0."
            echo "- Yanked spin 0.9.8 is absent. Non-yanked spin 0.9.9 remains unreachable smart-card build baggage until IronRDP feature-gates sspi/scard."
            echo
            echo "Any additional RustSec vulnerability or warning fails this job."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Clippy
        if: ${{ matrix.runner == 'cargo' }}
        run: |
          cd ${{ matrix.project }}
          sfw cargo clippy -- -D warnings

      - name: Run Tests
        if: ${{ matrix.runner == 'cargo' }}
        env:
          DOCKER_BUILDKIT: 1
        run: |
          cd ${{ matrix.project }}
          sfw cargo test

      # --config=ci is what connects these to the org's BuildBuddy: remote cache, remote
      # execution on the self-hosted executor fleet, and BES reporting. Without it Bazel
      # falls back to building everything locally on this runner against nothing but the
      # restored disk cache, which is why the "Configure remote cache" step above used to
      # look inert.
      - name: Build Bazel target
        if: ${{ matrix.runner == 'bazel' }}
        run: |
          bazel build --config=ci ${{ matrix.bazel_target }}

      - name: Test Bazel target
        if: ${{ matrix.runner == 'bazel-test' }}
        run: |
          bazel test --config=ci ${{ matrix.bazel_target }}

      - name: Test isolated RDP connector Bazel targets
        if: ${{ matrix.runner == 'rdp-bazel-test' }}
        run: |
          bazel test --config=ci --lockfile_mode=error ${{ matrix.bazel_target }}

      - name: Build static musl Bazel target
        if: ${{ matrix.runner == 'bazel-static' }}
        run: |
          set -euo pipefail

          bazel build \
            --config=ci \
            --platforms=${{ matrix.platform }} \
            --remote_download_outputs=all \
            ${{ matrix.bazel_target }}

          output="$(
            bazel cquery \
              --config=ci \
              --platforms=${{ matrix.platform }} \
              ${{ matrix.bazel_target }} \
              --output=files | tail -n 1
          )"
          if [ "${output#/}" = "${output}" ]; then
            output="$(bazel info execution_root)/${output}"
          fi

          file "${output}"
          if ! file "${output}" | grep -q 'statically linked'; then
            echo "expected static ELF output for ${{ matrix.platform }}" >&2
            exit 1
          fi

          if readelf -l "${output}" | grep -q 'INTERP'; then
            echo "static netprobe output must not request a dynamic interpreter" >&2
            exit 1
          fi

          if readelf -d "${output}" 2>/dev/null | grep -q 'NEEDED'; then
            echo "static netprobe output must not declare shared-library dependencies" >&2
            exit 1
          fi

          scripts/ci/assert-netprobe-libpcap-free.sh "${output}"

          case "${{ matrix.platform }}" in
            *linux_x86_64_musl)
              "${output}" --help >/dev/null
              ;;
          esac
