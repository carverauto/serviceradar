name: Rust Integration Tests

# Integration tests run on BuildBuddy RBE, not on this runner. `--config=ci` pulls in
# `remote_base`, which sets --remote_executor, so each test lands on a Firecracker microVM
# sized and equipped by the target's own exec_properties (see
# //rust/dgraph-client/tests:acceptance_tests). This runner only drives Bazel; it needs no
# Docker daemon of its own.
on:
  push:
    branches: [staging]
    paths:
      - 'rust/**'
      - 'proto/**'
      - 'third_party/crates/**'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.forgejo/workflows/tests-integration-rust.yml'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths:
      - 'rust/**'
      - 'proto/**'
      - 'third_party/crates/**'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.forgejo/workflows/tests-integration-rust.yml'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-integration-rust:
    runs-on: ubuntu24
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # Required, --config=ci points the remote cache, BES and executor at
      # BuildBuddy, which rejects anonymous access, so without this header the first bazel
      # call dies with `PERMISSION_DENIED: Anonymous access disabled` -- a failure that reads
      # nothing like the missing credential it actually is.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # Resolve the targets up front so an empty match fails loudly. `bazel test` exits 4 for
      # "no tests found", which surfaces as a red job that reads like broken infrastructure
      # rather than a suite that quietly stopped existing.
      - name: Resolve integration test targets
        run: |
          set -euo pipefail

          mapfile -t targets < <(bazel query 'attr("tags", "integration_test", tests(//rust/...))')

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No //rust/... target carries the integration_test tag." >&2
            echo "Either the tag was dropped or the suite moved; this job has nothing to run." >&2
            exit 1
          fi

          printf 'Resolved %d integration target(s):\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}"
          printf '%s\n' "${targets[@]}" > "${RUNNER_TEMP}/integration-targets.txt"

      # Compiling the tests is kept separate from running them on purpose: they are different
      # failure modes with different owners. A broken build is a code or dependency problem,
      # while a failing test is a behaviour or environment problem -- frequently, for this
      # suite, the container rather than the code. Folded into one step, the job goes red
      # either way and someone has to read the log to find out which; split, the step name
      # says it.
      #
      # The resolved targets are passed explicitly instead of being tag-filtered, because a
      # build has no --test_tag_filters (that is --build_tag_filters). Filtering here would
      # be silently ignored and widen the build to all of //rust/....
      - name: Build integration test targets
        run: |
          set -euo pipefail

          mapfile -t targets < "${RUNNER_TEMP}/integration-targets.txt"

          bazel build \
            --config=ci \
            "${targets[@]}"

      # Everything here is already built and cached by the step above, so a failure at this
      # point is a test failure, not a compile failure.
      #
      # This --test_tag_filters replaces the value test:ci sets in .bazelrc rather than
      # merging with it. The targets were already resolved by tag in the query above, so the
      # filter is a consistency check on that list, not the selection mechanism.
      - name: Run integration tests
        run: |
          set -euo pipefail

          mapfile -t targets < "${RUNNER_TEMP}/integration-targets.txt"

          bazel test \
            --config=ci \
            --test_tag_filters=integration_test \
            --test_output=errors \
            "${targets[@]}"