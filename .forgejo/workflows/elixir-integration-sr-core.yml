name: Elixir Integration Tests

# The serviceradar_core integration suite, against the shared SRQL/CNPG fixture.
#
# Every step is a Bazel target. The database lifecycle that used to live in
# scripts/{reset,drop,sweep-stale-core}-test-db.sh is //rust/integration-db, and the
# migrations are //elixir/serviceradar_core:migrate_template. There is no orchestration
# script, no mix, and no Beam install.
#
# WHY THE SPLIT IS WHERE IT IS
# An ex_unit_test that depends on serviceradar_core costs 28.8-45.6s before running a single
# test -- staging a 140-application ERL_LIBS tree, copying data, starting the BEAM, loading
# the app. Measured, not estimated: unit_tests_external ran zero tests and still took that
# long. A rust_test in this repo starts in 0.1s. So provisioning, sweeping and teardown are
# Rust, and only the migrations are Elixir -- they are `use Ecto.Migration` modules, and
# nothing but Ecto.Migrator can apply them.
#
# THE TEMPLATE DATABASE
# serviceradar_core carries 368 migrations, and that set only grows. Applying them per run
# to rebuild a schema that did not change is waste that compounds, so they are applied once
# to a long-lived `sr_core_template` and each run takes a physical copy:
#
#   CREATE DATABASE sr_core_test_<run> TEMPLATE sr_core_template;
#
# A file copy, not a replay -- which also makes it faithful in a way a schema dump would not
# be, because TimescaleDB hypertables/caggs/retention policies and AGE graphs keep state in
# their own catalogs that pg_dump does not round-trip.
#
# Whether the template needs migrating is decided by comparing the migration versions on disk
# against its schema_migrations -- the same predicate Ecto.Migrator uses, and deliberately not
# a recorded digest, which would go stale exactly when a migration failed half way. On a
# branch that adds no migrations `needs_migration` is false, the Elixir step is skipped, and
# the BEAM is off the critical path entirely.
#
# ORDERING
# Bazel deliberately does not order tests, so the sequence is these separate invocations:
#   sweep_stale_dbs -> prepare_template -> [migrate_template] -> provision_db
#     -> integration_tests -> teardown_db
# Each LIFECYCLE target is tagged `external`, which disables test caching. Without that a
# rerun would be a cache hit that provisioned nothing and dropped nothing, and the job would
# go green having done neither. They are also `manual`, so an ordinary `bazel test //...`
# can never point DDL at the shared fixture.
#
# The database-facing TestRunner actions are never cached or uploaded. Their outcome depends on
# mutable fixture state and their command environment contains the fixture DSNs. Compile actions
# still use RBE/cache; only the local test result stays local. A unique run ID already made a
# cross-run test-cache hit impossible, so disabling result caching costs no useful reuse.
#
# It is SHARDED, with a database per shard. These tests share a mutable database and Ecto's
# SQL sandbox isolates within a BEAM VM but not across OS processes, so parallel shards
# against ONE database deadlock (measured: 25 failures across 6 of 7 groups, mostly
# 40P01 deadlock_detected, where each group passed run on its own). A database each is only
# affordable because provisioning is a template file copy now; provision_db clones one per
# shard from //build:integration_shards.bzl, which is also what generates the targets.
#
# Sizing, from the unsharded run: ~36s fixed per target (sandbox, 149-app ERL_LIBS staging,
# BEAM boot) + ~39s ExUnit load + ~165s tests. Only the last two divide, so 8 shards is
# ~36 + 204/8 ~= 62s against 240s unsharded.
#
# provision_db re-checks the pending set itself and refuses to clone a template that is
# behind, so a mistake in the skip condition above fails loudly here rather than running the
# suite against a schema that does not match the code under test.
#
# The per-run database name is derived from GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT by every step
# independently, so nothing is handed between steps through GITHUB_ENV.
#
# ONLY the tests that need a running application run here:
# //elixir/serviceradar_core:integration_tests sets SERVICERADAR_ONLY_INTEGRATION=1, so
# test_helper.exs selects include: [:integration, :requires_app] rather than ADDING to the
# default set. `mix test --include integration` used to re-run the ~2700 database-free tests
# that elixir-unit-tests.yml already covers.
#
# Its own workflow because it fails for its own reasons -- a fixture outage, a migration
# break, a flaky remote database -- and folding those into main.yml made them
# indistinguishable from a compile failure.
#
# Concurrency with main.yml is safe. The fixture's consumers use disjoint databases:
#   * //rust/srql tests take pg_advisory_lock on the shared fixture and reset it
#   * this suite creates sr_core_test_<run_id>_<attempt> and drops it again
# That isolation already has to hold, because concurrent pull requests hit the same fixture.
#
# EVERY NAMED LIFECYCLE STEP EXPLICITLY CLEARS MANUAL FILTERS
# Checked-in `--config=ci` does not currently install a `-manual` filter, but these targets are
# deliberately manual and developer/generated rc files can add filters. Test calls therefore pass
# `--test_tag_filters=` and prepare passes `--build_tag_filters=`. This makes the explicit target
# selection self-contained while `manual` continues keeping lifecycle targets out of wildcards.
#
# NOTE ON `paths`: if this workflow is made a required status check, confirm how Forgejo
# treats a path-skipped run before relying on the filter -- a skipped required check can
# block merges.
on:
  push:
    branches: [staging]
    paths: &core_integration_paths
      - 'elixir/serviceradar_core/**'
      - 'elixir/serviceradar_srql/**'
      - 'elixir/connection/**'
      - 'elixir/datasvc/**'
      - 'elixir/elixir_uuid/**'
      - 'elixir/vendor/**'
      - 'proto/**'
      - 'rust/anomaly-core/**'
      - 'rust/anomaly-disposition/**'
      - 'rust/integration-db/**'
      - 'rust/kvutil/**'
      - 'rust/srql/**'
      - 'integration_tests/srql/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/elixir_test_config_loader.exs'
      - 'build/elixir_tests.bzl'
      - 'build/BUILD.bazel'
      - 'build/integration_shards.bzl'
      - 'build/integration_tests.bzl'
      - 'build/mix_app.bzl'
      - 'third_party/crate_mirror/**'
      - 'third_party/hex/**'
      - '.tool-versions'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'scripts/ci/configure-srql-fixture.sh'
      - 'scripts/install-bazelisk.sh'
      - '.forgejo/workflows/elixir-integration-sr-core.yml'
  pull_request:
    branches: [staging]
    paths: *core_integration_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-integration:
    name: serviceradar_core integration
    runs-on: ubuntu24
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

      # The dedicated `database_env` profile forwards these only to guarded, local,
      # non-uploaded database TestRunner actions. Generic remote test sweeps never load them.
      SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
      SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
      SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
      SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
      SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}
      SRQL_TEST_DATABASE_SERVER_NAME: srql-fixture-rw.srql-fixtures.svc.cluster.local

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # --config=ci is what supplies the BuildBuddy remote cache, the remote executors and
      # the BES invocation link. Fail rather than silently fall back to a local-only build.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # This is the authoritative database-integration job, not an optional fixture smoke.
      # Missing credentials must make the job red; silently skipping would let a required
      # status report success without running any database tests. Print names only, never values.
      - name: Require SRQL fixture credentials
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SRQL_TEST_DATABASE_URL \
            SRQL_TEST_ADMIN_URL \
            SRQL_TEST_DATABASE_CA_CERT; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is unavailable; database integration cannot run safely." >&2
              missing=1
            fi
          done
          test "${missing}" -eq 0

      # Writes the fixture CA to disk, normalizes both DSNs to verify-full, and exports the
      # Rust/Elixir TLS server-name bridges through GITHUB_ENV. A Bazel action cannot fetch
      # these for itself without turning live credentials into declared/action-cache inputs.
      - name: Configure SRQL fixture
        run: ./scripts/ci/configure-srql-fixture.sh

      # --//build:enable_integration_tests is repeated on every guarded Bazel call below. Every
      # target in this chain carries target_compatible_with =
      # requires_shared_fixture() (build/integration_tests.bzl), which resolves to
      # @platforms//:incompatible unless the flag is set. A wildcard would merely skip such a
      # target; naming one explicitly, which is what this job does, is a hard error.
      #
      # It is not a default and should not become one. The guard exists because these targets
      # run DDL against a CNPG fixture that concurrent pull requests share, where an accidental
      # run is destructive rather than slow. Setting it in .bazelrc would arm every
      # `bazel test //...` on every workstation.
      #
      # Regression note: the guard landed in f14be4eba (2026-08-02), two days after the last
      # fix to this file, so until this was added step 1 exited 1 immediately with
      #
      #   Target //rust/integration-db:sweep_stale_dbs is incompatible and cannot be built,
      #   but was explicitly requested.
      #     <-- target platform (//build/rbe:rbe_platform) didn't satisfy constraint
      #         @@platforms//:incompatible
      #
      # and the whole chain never ran.

      # `--strategy=TestRunner=local` on every step below that talks to the fixture.
      #
      # The fixture is addressed by a KUBERNETES-INTERNAL name, so no BuildBuddy RBE executor
      # can ever reach it -- this is structural, not a flaky executor:
      #
      #   sweep failed: error connecting to server
      #       failed to lookup address information: Name or service not known
      #
      #   tcp connect (srql-fixture-rw.srql-fixtures.svc.cluster.local:5432):
      #       non-existing domain - :nxdomain
      #   Executed 8 out of 8 tests: 8 fail remotely.
      #
      # The runner resolves it; it is inside the cluster. Every target that opens a connection,
      # including migrate_template and the sharded suite, follows the same TestRunner-local rule.
      # The second error above is what proved the shards need it too, and it is why the note in
      # //rust/integration-db/BUILD.bazel claiming the shards "run fully remote" was wrong.
      #
      # The tag is deliberately NOT the fix here -- see the long comment in
      # //rust/integration-db/BUILD.bazel. Tags propagate from a *_test rule to its COMPILE
      # actions, so tagging these would drag rustc onto the runner, which has no compiler
      # (`linker /usr/bin/gcc not found`) and onto macOS workstations, which cannot execute the
      # Linux process_wrapper (Exit 126). Both were live failures; that is why it was removed.
      #
      # `--strategy=` selects per MNEMONIC, and `TestRunner` is the test action alone. Compiles
      # stay remote and cached; only the test binary runs where the fixture is reachable. Scoped
      # to these invocations rather than //.bazelrc so it cannot leak into other jobs.
      #
      # This does NOT serialize the shards: the local strategy still runs actions concurrently
      # up to --jobs. It trades RBE's executor count for the runner's cores, which is the price
      # of the tests being able to open a connection at all.

      # 1. Collect databases leaked by cancelled runs, before this one adds to the fixture.
      - name: Sweep stale integration databases
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //rust/integration-db:sweep_stale_dbs

      # 2. Create sr_core_template if absent, and report whether it is behind the migrations
      # on disk. `bazel run`, not `bazel test`: it writes needs_migration to $GITHUB_OUTPUT,
      # while `bazel run` builds eligible actions remotely and launches the binary on this
      # runner, where that output file exists. The DB test calls below separately force their
      # TestRunner actions local.
      - name: Prepare template database
        id: template
        run: bazel run -c opt --config=ci --//build:enable_integration_tests --build_tag_filters= //rust/integration-db:prepare_template

      # 3. Apply the Ecto migrations to the template. The one step that needs the BEAM, and
      # the reason step 2 exists: on a branch that adds no migrations this is skipped and
      # nothing in the job starts an Erlang VM until the suite itself.
      - name: Migrate template database
        if: ${{ steps.template.outputs.needs_migration == 'true' }}
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //elixir/serviceradar_core:migrate_template

      # 4. Clone sr_core_test_<run_id>_<attempt> from the template. Re-checks the pending set
      # itself, so a wrong skip in step 3 fails here rather than silently running the suite
      # against a stale schema.
      - name: Provision integration database
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //rust/integration-db:provision_db

      # 5. The suite.
      - name: serviceradar_core integration tests
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --experimental_ui_max_stdouterr_bytes=10485760 --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //elixir/serviceradar_core:integration_tests

      # The named SRQL suites are manual and therefore never enter main.yml's generic wildcard.
      # Run them here under the same explicit fixture guard and local/non-uploaded policy.
      - name: SRQL fixture integration tests
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //integration_tests/srql:srql_api_test //integration_tests/srql:srql_comprehensive_test

      # --test_output=errors is not enough: a shard that prints more than
      # --experimental_ui_max_stdouterr_bytes is dropped wholesale, taking the
      # ExUnit failure with it. Extract numbered failures from the on-disk
      # test.log (main.yml's first-400-lines dump misses failures past that).
      - name: Dump failed ExUnit results
        if: ${{ failure() }}
        run: |
          set +e
          if [ ! -d bazel-testlogs ]; then
            echo "bazel-testlogs not found"
            exit 0
          fi
          find bazel-testlogs -type f -name test.log | sort | while read -r file; do
            if ! grep -E -q '^  [0-9]+\) |^[0-9]+ tests, [1-9][0-9]* failure' "${file}"; then
              continue
            fi
            echo "===== ${file} ====="
            awk '
              /^  [0-9]+\) / {printing=1; lines=0}
              printing {print; lines++; if (lines>=50) printing=0}
              /^[0-9]+ tests,/ {print}
            ' "${file}"
            echo
          done
          exit 0

      # 6. Drop the per-run database. always() rather than success(): a red suite must not
      # leak its database. A cancelled job never reaches this at all, which is what the sweep
      # in step 1 is for. The template is not a `sr_core_test_*` name, so neither this nor the
      # sweep can drop it.
      - name: Drop integration database
        if: ${{ always() && env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_URL != '' && env.SRQL_TEST_DATABASE_CA_CERT != '' }}
        run: bazel test -c opt --config=ci --config=database_env --strategy=TestRunner=local --//build:enable_integration_tests --test_tag_filters= --test_output=errors --nocache_test_results --remote_upload_local_results=false --flaky_test_attempts=1 //rust/integration-db:teardown_db

      - name: Remove fixture credential files
        if: ${{ always() }}
        run: |
          set +e
          cleanup_status=0
          for path in \
            "${RUNNER_TEMP}/srql-fixture-ca.crt" \
            "${RUNNER_TEMP}/srql-fixture-client.crt" \
            "${RUNNER_TEMP}/srql-fixture-client.key"; do
            rm -f -- "${path}" || cleanup_status=$?
          done
          exit "${cleanup_status}"
