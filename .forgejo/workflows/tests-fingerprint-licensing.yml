name: Fingerprint Licensing

on:
  pull_request:
    branches: [staging]
    paths:
      - 'Cargo.lock'
      - 'rust/netprobe/**'
      - 'scripts/lint-recog-additions.sh'
      - 'scripts/check-netprobe-fingerprint-licenses.sh'
      - '.forgejo/workflows/tests-fingerprint-licensing.yml'
  push:
    branches: [staging]
    paths:
      - 'Cargo.lock'
      - 'rust/netprobe/**'
      - 'scripts/lint-recog-additions.sh'
      - 'scripts/check-netprobe-fingerprint-licenses.sh'
      - '.forgejo/workflows/tests-fingerprint-licensing.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  netprobe-fingerprint-licenses:
    runs-on: ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Check netprobe fingerprint dependencies
        run: bash scripts/check-netprobe-fingerprint-licenses.sh

      - name: Check ServiceRadar Recog additions
        run: make lint-recog-additions
