name: Source Security Scan

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag whose release should receive the generated bundle."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-security:
    runs-on: ubuntu24
    env:
      FORGEJO_URL: http://forgejo-http.forgejo.svc.cluster.local:3000
      FORGEJO_REPOSITORY: carverauto/serviceradar
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install Syft
        run: ./scripts/install-syft.sh

      - name: Install OSV-Scanner
        run: ./scripts/install-osv-scanner.sh

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate source SBOM and vulnerability report
        run: |
          set -euo pipefail
          rm -rf out/security/source
          mkdir -p out/security/source

          osv_exit=0
          osv-scanner scan source -r . \
            --format json \
            --output-file out/security/source/serviceradar-source.osv.json || osv_exit=$?

          echo "OSV_EXIT=${osv_exit}" >> "${GITHUB_ENV}"

          syft scan dir:. \
            -c .syft.yaml \
            -o spdx-json=out/security/source/serviceradar-source.spdx.json \
            -o syft-text=out/security/source/serviceradar-source.sbom.txt

      - name: Bundle source security artifacts
        run: |
          set -euo pipefail
          tar -C out/security/source -czf out/security/serviceradar-source-security.tar.gz .

      - name: Wait for release to exist
        if: ${{ steps.release.outputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          api_url="${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          releases_url="${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases?draft=true&limit=100"
          release_exists() {
            if curl -fsS --connect-timeout 5 --max-time 10 \
              -H "Accept: application/json" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${api_url}" >/dev/null 2>&1; then
              return 0
            fi
            curl -fsS --connect-timeout 5 --max-time 10 \
              -H "Accept: application/json" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${releases_url}" 2>/dev/null \
              | jq -e --arg tag "${RELEASE_TAG}" 'any(.[]; .tag_name == $tag)' >/dev/null
          }
          for _ in $(seq 1 360); do
            if release_exists; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for release ${RELEASE_TAG} to exist" >&2
          exit 1

      - name: Upload source security bundle to release
        if: ${{ steps.release.outputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/upload-forgejo-release-asset.sh \
            "${RELEASE_TAG}" \
            out/security/serviceradar-source-security.tar.gz

      - name: Summarize source security outputs
        run: |
          set -euo pipefail
          {
            echo "## Source Security Scan"
            echo
            echo "Generated:"
            echo "- \`serviceradar-source.spdx.json\`"
            echo "- \`serviceradar-source.sbom.txt\`"
            echo "- \`serviceradar-source.osv.json\`"
            echo
            if [[ "${OSV_EXIT:-0}" -eq 0 ]]; then
              echo "OSV findings: none detected"
            else
              echo "OSV findings: vulnerabilities detected (see JSON artifact)"
            fi
            if [[ -n "${{ steps.release.outputs.tag }}" ]]; then
              echo
              echo "Uploaded release asset:"
              echo "- \`serviceradar-source-security.tar.gz\` on \`${{ steps.release.outputs.tag }}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
