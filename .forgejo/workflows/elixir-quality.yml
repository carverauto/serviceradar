name: Elixir Quality
permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.forgejo/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'
  pull_request:
    branches: [staging]
    paths:
      - 'elixir/**'
      - '.forgejo/workflows/elixir-quality.yml'
      - '.tool-versions'
      - 'scripts/elixir_quality.sh'
      - 'scripts/db/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  quality:
    name: Elixir Quality
    runs-on: ubuntu24
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Elixir dependencies and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.hex
            ~/.mix
            elixir/datasvc/deps
            elixir/datasvc/_build
            elixir/palisade/deps
            elixir/palisade/_build
            elixir/serviceradar_agent_gateway/deps
            elixir/serviceradar_agent_gateway/_build
            elixir/serviceradar_core/deps
            elixir/serviceradar_core/_build
            elixir/serviceradar_core_elx/deps
            elixir/serviceradar_core_elx/_build
            elixir/serviceradar_srql/deps
            elixir/serviceradar_srql/_build
            elixir/web-ng/deps
            elixir/web-ng/_build
          key: ${{ runner.os }}-elixir-quality-${{ hashFiles('elixir/**/mix.exs', 'elixir/**/mix.lock', 'elixir/**/.formatter.exs', 'elixir/**/.credo.exs', 'elixir/**/.sobelow-conf', 'elixir/**/.sobelow-skips', 'elixir/**/.deps_audit_ignore', 'elixir/.credo.base.exs', 'elixir/.credo.ex_dna.exs', 'elixir/.credo.ex_slop.exs', '.tool-versions', 'scripts/elixir_quality.sh') }}
          restore-keys: |
            ${{ runner.os }}-elixir-quality-

      - name: Run Elixir quality contract
        run: |
          run_quality() {
            local name="$1"
            local project="$2"
            shift 2

            echo "::group::Elixir Quality (${name})"
            ./scripts/elixir_quality.sh --project "${project}" --skip-dialyzer "$@"
            echo "::endgroup::"
          }

          run_quality datasvc elixir/datasvc
          run_quality palisade elixir/palisade
          run_quality serviceradar_agent_gateway elixir/serviceradar_agent_gateway
          run_quality serviceradar_core elixir/serviceradar_core
          run_quality serviceradar_core_elx elixir/serviceradar_core_elx
          run_quality serviceradar_srql elixir/serviceradar_srql
          run_quality web-ng elixir/web-ng --phoenix

      - name: Check committed OpenAPI spec is up to date
        working-directory: elixir/web-ng
        run: |
          # The developer portal fetches this committed artifact from the repo
          # instead of the live demo site, so it must match the live spec served
          # at /api/v2/open_api. Regenerate + commit with:
          #   (cd elixir/web-ng && mix serviceradar.openapi.dump)
          mix serviceradar.openapi.dump --check

      - name: Check baseline metadata and migration startup safety
        run: |
          scripts/db/check-baseline-metadata.sh
          scripts/db/check-migration-startup-safety.sh

      - name: Install PostgreSQL 18 client
        run: |
          set -euo pipefail
          # compare-platform-baseline.sh needs pg_dump/psql whose major matches
          # the CNPG server (PG18); Ubuntu ships 16, so pull the PGDG client
          # into a local tool directory. Forgejo runners do not have passwordless
          # sudo, so avoid mutating system apt sources or packages.
          if command -v pg_dump >/dev/null 2>&1 && pg_dump --version | grep -qE ' (18|19)\.'; then
            echo "Using pre-installed $(pg_dump --version)"
            exit 0
          fi

          pg_root="${RUNNER_TEMP:-/tmp}/postgresql-client-18"
          pg_apt="${pg_root}/apt"
          pg_extract="${pg_root}/root"
          install -d "${pg_apt}/lists/partial" "${pg_apt}/archives/partial" "${pg_extract}"

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o "${pg_apt}/apt.postgresql.org.gpg"

          . /etc/os-release
          pg_sources="${pg_apt}/pgdg.list"
          echo "deb [signed-by=${pg_apt}/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" >"${pg_sources}"

          apt_opts=(
            -o "Dir::Etc::sourcelist=${pg_sources}"
            -o "Dir::Etc::sourceparts=-"
            -o "Dir::State::lists=${pg_apt}/lists"
            -o "Dir::Cache::archives=${pg_apt}/archives"
            -o "Dir::State::status=/var/lib/dpkg/status"
          )

          apt-get "${apt_opts[@]}" update
          (
            cd "${pg_apt}/archives"
            apt-get "${apt_opts[@]}" download postgresql-client-18 postgresql-client-common libpq5
          )
          for deb in "${pg_apt}"/archives/*.deb; do
            dpkg-deb -x "${deb}" "${pg_extract}"
          done

          pg_bin="${pg_extract}/usr/lib/postgresql/18/bin"
          pg_lib="${pg_extract}/usr/lib/x86_64-linux-gnu"
          echo "${pg_bin}" >>"${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${pg_lib}:${LD_LIBRARY_PATH:-}" >>"${GITHUB_ENV}"
          export PATH="${pg_bin}:${PATH}"
          export LD_LIBRARY_PATH="${pg_lib}:${LD_LIBRARY_PATH:-}"
          pg_dump --version

      - name: Verify baseline equals migration replay
        env:
          # Reuses the already-configured SRQL fixture secrets. SRQL_TEST_ADMIN_URL
          # is a superuser DSN to the srql-fixtures CloudNativePG cluster, which is
          # a TimescaleDB + Apache AGE Postgres 18 (a stock postgres image cannot
          # replay these migrations, and the operand image cannot be preloaded via
          # a `services:` block). The gate creates two disposable scratch DBs on
          # that cluster, loads the committed baseline into one and replays the
          # migrations into the other, then diffs them.
          BASELINE_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail
          # Fail closed: never silently skip. A missing secret is a
          # misconfiguration, not a reason to let baseline drift through.
          if [ -z "${BASELINE_ADMIN_URL:-}" ] || [ -z "${SRQL_TEST_DATABASE_CA_CERT:-}" ]; then
            echo "::error::Baseline gate cannot run: repository secrets SRQL_TEST_ADMIN_URL and SRQL_TEST_DATABASE_CA_CERT are required. They already back the srql-fixtures integration DB (a Timescale+AGE CNPG cluster). Configure them in Forgejo repo settings." >&2
            exit 1
          fi
          ca_file="${RUNNER_TEMP:-/tmp}/baseline-ca.crt"
          printf '%s' "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"
          export PGSSLROOTCERT="${ca_file}"
          export CNPG_CA_FILE="${ca_file}"
          export SERVICERADAR_TEST_DATABASE_CA_CERT_FILE="${ca_file}"
          scripts/db/verify-baseline.sh
