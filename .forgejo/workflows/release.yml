name: Publish Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the event tag or v-prefixed VERSION)."
        required: false
        type: string
      dry_run:
        description: "Run publish_packages in --dry_run mode."
        required: false
        type: boolean
        default: false
      append_notes:
        description: "Append notes when updating an existing release."
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the Forgejo release as a prerelease."
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the Forgejo release as a draft."
        required: false
        type: boolean
        default: false
      overwrite_assets:
        description: "Replace assets on the release when filenames match."
        required: false
        type: boolean
        default: true
      allow_local_fallback:
        description: "Allow local Bazel fallback if remote execution fails."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: serviceradar-signing
    container:
      image: registry.carverauto.dev/serviceradar/forgejo-ci@sha256:4da98b050cbbbc66e6c823977a80a7b67db51a610e48c28fc2e066c1bb164a79
      options: --user 1000:1000 --group-add 2375 --volume /var/run/secrets/kubernetes.io/serviceaccount/token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
    enable-openid-connect: true
    environment: release
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      FORGEJO_URL: http://forgejo-http.forgejo.svc.cluster.local:3000
      FORGEJO_REPOSITORY: carverauto/serviceradar
      OCI_REGISTRY: registry.carverauto.dev
      OCI_PROJECT: serviceradar
      OCI_CHART_REPOSITORY: serviceradar/charts
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
      COSIGN_KEYLESS: ${{ secrets.COSIGN_KEYLESS }}
      SIGSTORE_FULCIO_URL: ${{ secrets.SIGSTORE_FULCIO_URL }}
      SIGSTORE_REKOR_URL: ${{ secrets.SIGSTORE_REKOR_URL }}
      SIGSTORE_OIDC_ISSUER: ${{ secrets.SIGSTORE_OIDC_ISSUER }}
      SIGSTORE_OIDC_CLIENT_ID: ${{ secrets.SIGSTORE_OIDC_CLIENT_ID }}
      SIGSTORE_OIDC_AUDIENCE: ${{ secrets.SIGSTORE_OIDC_AUDIENCE }}
      SIGSTORE_TRUSTED_ROOT: ${{ secrets.SIGSTORE_TRUSTED_ROOT }}
      SIGSTORE_TRUSTED_ROOT_FILE: ${{ secrets.SIGSTORE_TRUSTED_ROOT_FILE }}
      SIGSTORE_ROOT_PEM: ${{ secrets.SIGSTORE_ROOT_PEM }}
      SIGSTORE_ROOT_FILE: ${{ secrets.SIGSTORE_ROOT_FILE }}
      SIGSTORE_CT_LOG_PUBLIC_KEY: ${{ secrets.SIGSTORE_CT_LOG_PUBLIC_KEY }}
      SIGSTORE_CT_LOG_PUBLIC_KEY_FILE: ${{ secrets.SIGSTORE_CT_LOG_PUBLIC_KEY_FILE }}
      SIGSTORE_REKOR_PUBLIC_KEY_PEM: ${{ secrets.SIGSTORE_REKOR_PUBLIC_KEY_PEM }}
      SIGSTORE_REKOR_PUBLIC_KEY_FILE: ${{ secrets.SIGSTORE_REKOR_PUBLIC_KEY_FILE }}
      COSIGN_CERTIFICATE_IDENTITY: ${{ secrets.COSIGN_CERTIFICATE_IDENTITY }}
      COSIGN_CERTIFICATE_IDENTITY_REGEXP: ${{ secrets.COSIGN_CERTIFICATE_IDENTITY_REGEXP }}
      COSIGN_CERTIFICATE_OIDC_ISSUER: ${{ secrets.COSIGN_CERTIFICATE_OIDC_ISSUER }}
      COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ${{ secrets.COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP }}
      # (Wasm plugin upload-signing secrets moved to wasm-plugins.yml, which now owns
      # publishing the plugins on `v*` tags.)
      ALLOW_LOCAL_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_local_fallback || 'false' }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Enforce release source
        id: source
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          RELEASE_BASE_REF: origin/staging
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/staging:refs/remotes/origin/staging

          tag="${INPUT_TAG}"
          if [[ -z "${tag}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${tag}" ]]; then
            version="$(tr -d '\r\n' < VERSION)"
            tag="v${version}"
          fi
          ./scripts/validate-release-tag.sh "${tag}"

          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            release_commit="$(git rev-list -n1 "refs/tags/${tag}^{commit}")"
          else
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "Release tag ${tag} is not available in this checkout" >&2
              exit 1
            fi
            release_commit="$(git rev-parse HEAD)"
          fi

          if ! git merge-base --is-ancestor "${release_commit}" "${RELEASE_BASE_REF}"; then
            echo "Release commit ${release_commit} is not reachable from ${RELEASE_BASE_REF}" >&2
            exit 1
          fi

          printf 'tag=%s\ncommit=%s\n' "${tag}" "${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # actions/cache@v5.0.4
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Ensure rpmbuild available for rules_pkg toolchain
        run: |
          ./scripts/ci/ensure-forgejo-tools.sh release-rpm
          if ! command -v rpmbuild >/dev/null 2>&1; then
            echo "rpmbuild not found after install" >&2
            exit 1
          fi
          rpmbuild --version

      - name: Refresh Bazel externals after rpm install
        run: |
          # Force the rules_pkg rpmbuild toolchain to re-detect the system rpmbuild binary.
          if command -v bazel >/dev/null 2>&1; then
            bazel clean --expunge
          else
            echo "bazel not yet installed; skipping clean (Bazelisk step will follow)" >&2
          fi

      - name: Configure BuildBuddy remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          cat <<'EOF' | sed 's/^ *//' > .bazelrc.remote
            build --bes_results_url=https://carverauto.buildbuddy.io/invocation/
            build --bes_backend=grpcs://carverauto.buildbuddy.io
            build --remote_cache=grpcs://carverauto.buildbuddy.io
            build --remote_executor=grpcs://carverauto.buildbuddy.io
            build --remote_timeout=10m
            build --remote_download_minimal
            build --remote_upload_local_results
            build --jobs=100
            build --strategy=ExpandTemplate=local
            build --strategy=NpmPackageExtract=local
            build --strategy=CopyDirectory=local
          EOF
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" >> .bazelrc.remote

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install Cosign
        run: ./scripts/install-cosign.sh

      - name: Install ORAS
        run: ./scripts/install-oras.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          echo "Expected Bazel: ${expected}"
          echo "Resolved Bazel: ${actual}"
          test "${actual}" = "${expected}"

      - name: Resolve release metadata
        id: release
        env:
          GATED_TAG: ${{ steps.source.outputs.tag }}
          GATED_COMMIT: ${{ steps.source.outputs.commit }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          INPUT_APPEND_NOTES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.append_notes || 'false' }}
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || 'false' }}
          INPUT_DRAFT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || 'false' }}
          INPUT_OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.overwrite_assets || 'true' }}
        run: |
          set -euo pipefail

          tag="${GATED_TAG}"
          release_commit="${GATED_COMMIT}"
          if [[ -z "$tag" || -z "$release_commit" ]]; then
            echo "Canonical release source outputs are incomplete" >&2
            exit 1
          fi

          version="${tag#v}"
          file_version="$(git show "${release_commit}:VERSION")"
          file_version="${file_version%%[$'\r\n']*}"
          if [[ -n "$file_version" && "$file_version" != "$version" ]]; then
            echo "VERSION file ($file_version) does not match release tag ($version)" >&2
            exit 1
          fi

          # Auto-detect pre-release from version pattern
          is_prerelease="${INPUT_PRERELEASE}"
          if [[ "$version" =~ -pre[0-9]*$ ]] || \
             [[ "$version" =~ -rc[0-9]*$ ]] || \
             [[ "$version" =~ -alpha[0-9]*$ ]] || \
             [[ "$version" =~ -beta[0-9]*$ ]]; then
            is_prerelease="true"
            echo "Auto-detected pre-release version: $version"
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${release_commit}"
            echo "dry_run=${INPUT_DRY_RUN}"
            echo "append_notes=${INPUT_APPEND_NOTES}"
            echo "prerelease=${is_prerelease}"
            echo "draft=${INPUT_DRAFT}"
            echo "overwrite_assets=${INPUT_OVERWRITE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_COMMIT}" ]]; then
            echo "Resolved release commit is empty" >&2
            exit 1
          fi

          if [[ -x scripts/check-oci-image-tags-exist.sh ]]; then
            cp scripts/check-oci-image-tags-exist.sh "${RUNNER_TEMP}/check-oci-image-tags-exist.sh"
            chmod +x "${RUNNER_TEMP}/check-oci-image-tags-exist.sh"
          fi

          git checkout --detach "${RELEASE_COMMIT}"
          echo "Checked out release commit ${RELEASE_COMMIT}"

      - name: Derive managed agent release public key
        env:
          SERVICERADAR_AGENT_RELEASE_PRIVATE_KEY: ${{ secrets.SERVICERADAR_AGENT_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          public_key="$(go run ./tools/go/derive_agent_release_public_key)"
          if [[ -z "${public_key}" ]]; then
            echo "derived managed agent release public key is empty" >&2
            exit 1
          fi
          printf '%s\n' "${public_key}" > .bazel-agent-release-public-key
          echo "SERVICERADAR_AGENT_RELEASE_PUBLIC_KEY=${public_key}" >> "$GITHUB_ENV"

      - name: Generate release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if scripts/extract-changelog.py "$VERSION" --output "$notes_file"; then
            echo "Using changelog entry for version $VERSION" >&2
          else
            echo "CHANGELOG entry not found for $VERSION, falling back to autogenerated notes" >&2
            {
              printf '# ServiceRadar %s\n\n' "$VERSION"
              printf 'Automated release generated by Forgejo Actions.\n'
            } > "$notes_file"
          fi
          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"
          echo "---- release notes preview ----"
          cat "$notes_file"
          echo "--------------------------------"

      - name: Authenticate Docker for OCI registry
        run: |
          set -euo pipefail
          login_registry() {
            local user="${1:-}"
            local token="${2:-}"
            if [[ -z "${user}" || -z "${token}" ]]; then
              return 1
            fi
            echo "${token}" | docker login "${OCI_REGISTRY}" -u "${user}" --password-stdin
          }

          if [[ -z "${OCI_USERNAME:-}" || -z "${OCI_TOKEN:-}" ]]; then
            echo "Missing Harbor robot credentials. Set HARBOR_ROBOT_USERNAME and HARBOR_ROBOT_SECRET." >&2
            exit 1
          fi

          login_registry "${OCI_USERNAME}" "${OCI_TOKEN}"

          export OCI_DOCKER_AUTH=""
          unset OCI_DOCKER_AUTH || true
          {
            echo "OCI_USERNAME=${OCI_USERNAME}"
            echo "OCI_TOKEN=${OCI_TOKEN}"
            echo "OCI_DOCKER_AUTH="
          } >> "${GITHUB_ENV}"

          chmod +x ./buildbuddy_setup_docker_auth.sh
          ./buildbuddy_setup_docker_auth.sh

      - name: Verify managed agent release key stamp
        run: ./scripts/verify-agent-release-key-stamp.sh --config=remote -c opt

      - name: Publish container images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          OPENBAO_ADDR: http://openbao-active.openbao-system.svc.cluster.local:8200
          OPENBAO_K8S_ROLE: forgejo-signing-runner
          OPENBAO_SIGNING_ALLOWED_REFS_REGEX: '^refs/(tags/v.*|heads/(staging|main|master))$'
          COSIGN_KEY_REF: hashivault://cosign-release
        run: |
          set -euo pipefail
          release_sha_tag="sha-${RELEASE_COMMIT}"
          extra_args=()
          if [[ -n "${RELEASE_TAG}" ]]; then
            extra_args+=(-- --tag "${RELEASE_TAG}")
          fi

          if ! command -v skopeo >/dev/null 2>&1; then
            ./scripts/ci/ensure-forgejo-tools.sh skopeo
          fi

          tag_check_script="./scripts/check-oci-image-tags-exist.sh"
          if [[ -x "${RUNNER_TEMP}/check-oci-image-tags-exist.sh" ]]; then
            tag_check_script="${RUNNER_TEMP}/check-oci-image-tags-exist.sh"
          fi

          skip_push=false
          if [[ -n "${RELEASE_TAG}" ]]; then
            if "${tag_check_script}" "${release_sha_tag}" "${RELEASE_TAG}" latest; then
              echo "All release image tags match the immutable release digest; skipping image push and continuing to signing/verification."
              skip_push=true
            else
              tag_check_status=$?
              if [[ "${tag_check_status}" -ne 1 ]]; then
                echo "Release image tag preflight failed with status ${tag_check_status}; refusing to publish through an unhealthy registry path." >&2
                exit "${tag_check_status}"
              fi

              echo "Release image tags are missing or mismatched; running the idempotent publish graph."
            fi
          fi

          if [[ "${skip_push}" != "true" ]]; then
            run_remote_publish() {
              bazel run --config=remote_push --stamp //:push "${extra_args[@]}"
            }

            if ! run_remote_publish; then
              echo "Remote bazel run failed; retrying once with the completed action cache." >&2
              bazel shutdown || true
              sleep 5

              if run_remote_publish; then
                echo "Remote bazel publish retry succeeded."
              elif [[ "${ALLOW_LOCAL_FALLBACK:-false}" == "true" ]]; then
                echo "Remote bazel retry failed; retrying locally without remote executor/cache" >&2
                bazel run \
                  --remote_executor= \
                  --remote_cache= \
                  --noremote_accept_cached \
                  --noremote_upload_local_results \
                  --jobs=8 \
                  --stamp \
                  //:push \
                  "${extra_args[@]}"
              else
                echo "Remote bazel retry failed; local fallback disabled." >&2
                exit 1
              fi
            fi
          else
            mapfile -t image_targets < <(
              python3 -c 'import ast, re, sys; from pathlib import Path; text = Path(sys.argv[1]).read_text(); match = re.search(r"PUBLISHABLE_IMAGES\s*=\s*(\[[\s\S]*?\])\n\n", text); assert match, "unable to parse image inventory"; [print("//docker/images:" + entry.get("push_image", entry["image"])) for entry in ast.literal_eval(match.group(1))]' docker/images/image_inventory.bzl
            )
            bazel build --config=remote_push --stamp "${image_targets[@]}"
          fi

          echo "Rechecking release image digest equality after publish/build handling."
          if "${tag_check_script}" "${release_sha_tag}" "${RELEASE_TAG}" latest; then
            echo "Post-publish release image digests match the immutable release digest."
          else
            tag_check_status=$?
            echo "Post-publish release image digest verification failed with status ${tag_check_status}; refusing to sign or advance the release." >&2
            exit "${tag_check_status}"
          fi

          verify_tags=(latest "${release_sha_tag}")
          if [[ -n "${RELEASE_TAG}" ]]; then
            verify_tags+=("${RELEASE_TAG}")
          fi
          source ./scripts/ci/prepare-openbao-cosign-env.sh
          ./scripts/sign-oci-publish.sh
          ./scripts/verify-oci-publish.sh "${verify_tags[@]}"
          unset VAULT_TOKEN VAULT_ADDR COSIGN_KEY_REF

      - name: Publish Helm chart to OCI registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          export HELM_STATE_DIR="${PWD}/.helm-home"
          rm -rf "${HELM_STATE_DIR}"
          mkdir -p "${HELM_STATE_DIR}"
          trap 'rm -rf "${HELM_STATE_DIR}"' EXIT

          login_registry() {
            local user="${1:-}"
            local token="${2:-}"
            if [[ -z "${user}" || -z "${token}" ]]; then
              return 1
            fi
            echo "${token}" | ./scripts/run-helm.sh registry login "${OCI_REGISTRY}" -u "${user}" --password-stdin
          }

          if [[ -z "${OCI_USERNAME:-}" || -z "${OCI_TOKEN:-}" ]]; then
            echo "Missing Harbor robot credentials. Set HARBOR_ROBOT_USERNAME and HARBOR_ROBOT_SECRET." >&2
            exit 1
          fi

          login_registry "${OCI_USERNAME}" "${OCI_TOKEN}"

          # Package and push chart
          ./scripts/run-helm.sh package helm/serviceradar
          ./scripts/run-helm.sh push "serviceradar-${VERSION}.tgz" "oci://${OCI_REGISTRY}/${OCI_CHART_REPOSITORY}"

          # Cleanup
          rm -f "serviceradar-${VERSION}.tgz"

          echo "Published Helm chart: oci://${OCI_REGISTRY}/${OCI_CHART_REPOSITORY}/serviceradar:${VERSION}"

      # Wasm plugins are published, signed, indexed, and attached to the release by
      # wasm-plugins.yml, which runs in parallel on the same `v*` tag (mirroring
      # native-addons.yml). Inlining it here as well would double-publish and race the
      # index upload, so it is intentionally NOT part of the release job.
      - name: Publish release packages and agent manifest assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          APPEND_NOTES: ${{ steps.release.outputs.append_notes }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DRAFT: ${{ steps.release.outputs.draft }}
          OVERWRITE_ASSETS: ${{ steps.release.outputs.overwrite_assets }}
          SERVICERADAR_AGENT_RELEASE_PRIVATE_KEY: ${{ secrets.SERVICERADAR_AGENT_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          declare -a args
          args+=("--tag" "$RELEASE_TAG")
          args+=("--commit" "${{ steps.release.outputs.commit }}")
          if [[ -n "$NOTES_FILE" ]]; then
            args+=("--notes_file" "$NOTES_FILE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=("--dry_run")
          fi
          if [[ "$APPEND_NOTES" == "true" ]]; then
            args+=("--append_notes")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=("--prerelease")
          fi
          # Always create/update the release as a draft so assets can be uploaded
          # even when immutable releases are enforced. We'll publish afterward
          # if the workflow input did not request a draft.
          args+=("--draft")
          if [[ "$OVERWRITE_ASSETS" != "true" ]]; then
            args+=("--overwrite_assets=${OVERWRITE_ASSETS}")
          fi

          run_remote() {
            bazel run \
              --config=remote \
              --platforms=//build/platforms:linux_pkg_local \
              --stamp \
              //build/release:publish_packages \
              -- "${args[@]}"
          }

          run_local() {
            bazel run \
              --config=no_remote \
              --host_platform=@local_config_platform//:host \
              --platforms=//build/platforms:linux_pkg_local \
              --stamp \
              //build/release:publish_packages \
              -- "${args[@]}"
          }

          if ! run_remote; then
            if [[ "${ALLOW_LOCAL_FALLBACK:-false}" == "true" ]]; then
              echo "Remote packaging failed; retrying locally without remote executor/cache" >&2
              run_local
            else
              echo "Remote packaging failed; local fallback disabled." >&2
              exit 1
            fi
          fi

      # (Wasm plugin import index is uploaded by wasm-plugins.yml — see the note above.)
      - name: Verify uploaded release assets via Forgejo API
        id: release_assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://forgejo-http.forgejo.svc.cluster.local:3000
          FORGEJO_REPOSITORY: carverauto/serviceradar
          REQUIRE_MAC_PKG: ${{ env.REQUIRE_MAC_PKG }}
        run: |
          set -euo pipefail
          api_url="${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          response=$(curl -sSf -H "Accept: application/json" -H "Authorization: token ${FORGEJO_TOKEN}" "$api_url" || true)
          release_id=$(echo "$response" | jq -r '.id // empty')
          if [[ -z "${release_id}" ]]; then
            releases_url="${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases?limit=100"
            release_id=$(curl -sSf -H "Accept: application/json" -H "Authorization: token ${FORGEJO_TOKEN}" "$releases_url" \
              | jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' \
              | head -n1)
            if [[ -n "${release_id}" ]]; then
              response=$(curl -sSf \
                -H "Accept: application/json" \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/${release_id}")
            fi
          fi
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve draft release id for ${RELEASE_TAG}" >&2
            exit 1
          fi
          printf 'Release asset summary for %s:\n' "$RELEASE_TAG"
          echo "$response" | jq '.assets[]? | {name, size, download_count}'
          deb_count=$(echo "$response" | jq '[.assets[]? | select(.name | endswith(".deb"))] | length')
          rpm_count=$(echo "$response" | jq '[.assets[]? | select(.name | endswith(".rpm"))] | length')
          pkg_count=$(echo "$response" | jq '[.assets[]? | select(.name | endswith(".pkg"))] | length')
          agent_runtime_count=$(echo "$response" | jq --arg asset "serviceradar-agent_${VERSION}_linux_amd64.tar.gz" '[.assets[]? | select(.name == $asset)] | length')
          agent_manifest_count=$(echo "$response" | jq '[.assets[]? | select(.name == "serviceradar-agent-release-manifest.json")] | length')
          agent_manifest_sig_count=$(echo "$response" | jq '[.assets[]? | select(.name == "serviceradar-agent-release-manifest.sig")] | length')
          if (( deb_count == 0 )); then
            echo "No .deb assets detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          if (( rpm_count == 0 )); then
            echo "No .rpm assets detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          if (( agent_runtime_count == 0 )); then
            echo "No managed agent runtime asset detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          if (( agent_manifest_count == 0 )); then
            echo "No agent release manifest asset detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          if (( agent_manifest_sig_count == 0 )); then
            echo "No agent release manifest signature asset detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          # NOTE: the Wasm plugin import index (serviceradar-wasm-plugin-index.json) is
          # uploaded out-of-band by wasm-plugins.yml, which runs in parallel on the same
          # tag and may not have finished when this step runs. That workflow verifies its
          # own upload, so it is intentionally not asserted here (same as the native
          # add-on index, which is likewise published by native-addons.yml).
          if [[ "${REQUIRE_MAC_PKG:-false}" == "true" ]] && (( pkg_count == 0 )); then
            echo "No .pkg assets detected for ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "Validated presence of ${deb_count} .deb, ${rpm_count} .rpm, ${pkg_count} .pkg, ${agent_runtime_count} runtime archive, ${agent_manifest_count} manifest, and ${agent_manifest_sig_count} signature assets."
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Finalize Forgejo release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.release_assets.outputs.release_id }}
          DRAFT: ${{ steps.release.outputs.draft }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://forgejo-http.forgejo.svc.cluster.local:3000
          FORGEJO_REPOSITORY: carverauto/serviceradar
        run: |
          set -euo pipefail
          if [[ "${DRAFT}" == "true" ]]; then
            echo "Release left as draft per workflow input."
            exit 0
          fi

          if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "Verified release id is invalid for ${RELEASE_TAG}: ${RELEASE_ID}" >&2
            exit 1
          fi

          curl -sSf -X PATCH \
            -H "Accept: application/json" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/${RELEASE_ID}" \
            -d '{"draft": false}' >/dev/null
          echo "Published release ${RELEASE_TAG}"

      - name: Advance demo release source branch
        if: ${{ steps.release.outputs.dry_run != 'true' && steps.release.outputs.prerelease != 'true' && steps.release.outputs.draft != 'true' }}
        env:
          DEMO_RELEASE_BRANCH: demo/prod-release
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://forgejo-http.forgejo.svc.cluster.local:3000
          FORGEJO_REPOSITORY: carverauto/serviceradar
        run: |
          set -euo pipefail
          if [[ -z "${FORGEJO_TOKEN:-}" ]]; then
            echo "FORGEJO_TOKEN is required to advance ${DEMO_RELEASE_BRANCH}" >&2
            exit 1
          fi

          git config user.name "ServiceRadar Release Bot"
          git config user.email "release-bot@serviceradar.local"

          remote_url="${FORGEJO_URL}/${FORGEJO_REPOSITORY}.git"
          git remote remove demo-release 2>/dev/null || true
          git remote add demo-release "${remote_url}"

          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" \
            fetch demo-release "refs/heads/${DEMO_RELEASE_BRANCH}:refs/remotes/demo-release/${DEMO_RELEASE_BRANCH}" || true

          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" \
            push --force-with-lease demo-release "HEAD:refs/heads/${DEMO_RELEASE_BRANCH}"

          echo "Advanced ${DEMO_RELEASE_BRANCH} to ${{ steps.release.outputs.commit }}"
