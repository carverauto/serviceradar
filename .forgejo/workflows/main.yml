name: CI

on:
  push:
    branches:
      - staging
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  build:
    runs-on: ubuntu24
    permissions:
      contents: read
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # No GHCR_*. ghcr.io/cloudnative-pg/postgresql -- the //integration_tests/srql test data
      # this used to authenticate -- was mirrored into Harbor. //MODULE.bazel now has ZERO
      # ghcr.io pulls; the only ghcr mentions there are comments recording what was mirrored.
      # DOCKERHUB_* above stays for the single remaining upstream pull,
      # docker.io/pgduckdb/pgduckdb.
      TEST_CNPG_DATABASE: serviceradar_web_ng_test
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"

          if [ -d .git ]; then
            git reset --hard
            # An unqualified clean is safe: //.bazelrc no longer redirects any Bazel cache
            # into the workspace, so the repository cache lives under Bazel's own
            # machine-local root and `git clean` cannot reach it. This previously needed
            # `-e` exclusions, because wiping the repository cache made Bazel refetch every
            # external repo each run -- including the base images in MODULE.bazel, which walked
            # into an anonymous rate limit and surfaced as a loading-phase "no such package" on
            # targets unrelated to containers. (Those base images are mirrored into Harbor now;
            # only docker.io/pgduckdb/pgduckdb is still fetched upstream.)
            git clean -ffdx
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "${REPO_URL}"
            else
              git remote add origin "${REPO_URL}"
            fi
          else
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init -q
            git remote add origin "${REPO_URL}"
          fi

          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Check native add-on version bumps
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # THE BASE DIFFERS BY EVENT, and getting it wrong makes this step vacuous rather
          # than wrong-looking. On a pull request the target branch is the right comparison.
          # On `push: branches: [staging]` there is no GITHUB_BASE_REF, so the old code fell
          # back to `staging` -- which on that event is the commit just pushed. The gate then
          # diffed staging against itself and returned 0 no matter what the tree contained.
          # d03bebf377 reached staging that way, carrying a changed netprobe payload under an
          # unchanged version.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base_ref="${GITHUB_BASE_REF:-staging}"
            git fetch --no-tags --depth=1 origin "${base_ref}"
            base="$(git rev-parse FETCH_HEAD)"
          else
            # The pushed range's starting point. The checkout above is --depth=1, so the base
            # has to be fetched before it can be named.
            base=""
            if [ -n "${PUSH_BEFORE:-}" ] &&
               [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] &&
               git fetch --no-tags --depth=1 origin "${PUSH_BEFORE}" 2>/dev/null; then
              base="$(git rev-parse FETCH_HEAD)"
            else
              # Fall back to this commit's first parent -- the previous tip for both a merge
              # and a direct push. It under-covers only a multi-commit direct push, which is
              # not how staging is meant to receive changes anyway.
              git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
              base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
            fi
          fi

          # No silent skip. The script refuses base == head for the same reason: a check that
          # cannot fail reads exactly like a check that passed.
          if [ -z "${base}" ]; then
            echo "::error::could not determine a base commit for the add-on version gate" >&2
            exit 1
          fi

          scripts/check-native-addon-version-bumps.sh "${base}" HEAD

      - name: Verify committed Rust vendor snapshot
        run: python3 scripts/check-rust-vendor-tracked.py

      # `bazel-build`, not `service-build`. The extras that profile adds over this one are
      # rpmbuild, rpm2cpio and psql, and nothing in this job uses any of them: RPM packaging
      # belongs to release.yml, and configure-srql-fixture.sh talks to CNPG through Bazel
      # tests rather than a psql client. Every other Bazel workflow already uses bazel-build.
      #
      # Whether even this is needed is an open question. It requires gcc, g++, make,
      # pkg-config, protoc, cmake, flex, bison, file, readelf and libpcap on the RUNNER, but
      # under --config=ci every compile happens on the executor and remote_base sets
      # BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1. The only local actions are ExpandTemplate,
      # CopyDirectory and NpmPackageExtract, none of which want a C compiler. Left in place
      # because that should be settled by watching a run fail, not by reasoning.
      - name: Install build dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      # No Setup Beam and no Setup Rust.
      #
      # This job used to install OTP 28.3, Elixir 1.19.4 and a rustup stable toolchain on the
      # runner for a build that compiles entirely on remote executors. The proof they were
      # dead weight is in the sibling workflows: elixir-unit-tests.yml, rust-tests.yml and
      # golang-tests.yml build and test the same Elixir, Rust and Go code with none of them.
      # Bazel supplies every toolchain as declared action inputs --
      # build/mix_precommit.bzl:13 says so for OTP and Elixir via
      # @rules_elixir//:toolchain_type, and @rules_rust does the same for cargo and rustc.
      #
      # If something here ever genuinely needs a host toolchain, that is a bug in the target,
      # not a reason to reinstate an OTP install on every CI run.

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # No Bazel version assertion. It compared `bazel --version` against .bazelversion, which
      # is the file bazelisk just read to decide which Bazel to fetch. It could only fail if
      # bazelisk itself were broken, and in that case every later step fails anyway with a
      # message that names the real problem.

      # No Gazelle drift check. scripts/check-gazelle-drift.sh and its `git fetch` of the base
      # branch are gone, and the //:gazelle_diff_test that briefly replaced them is gone too.
      #
      # It only ever enforced canonicalisation -- sorted srcs, shortened labels, attribute
      # order. The part that matters is already enforced by the build: a Go file importing
      # something absent from `deps` fails to compile, and a package with no BUILD file shows
      # up the moment anything tries to depend on it.
      #
      # Run `bazel run //:gazelle` when you add or move Go files. The `# gazelle:exclude`
      # directives and the `# keep` markers in //BUILD.bazel and elsewhere still matter --
      # without them that command deletes //proto/dgraph:proto_dgraph and rewrites the proto
      # compiler lists.

      - name: Report unavailable SRQL fixture secrets
        if: ${{ secrets.SRQL_TEST_DATABASE_URL == '' || secrets.SRQL_TEST_ADMIN_URL == '' || secrets.SRQL_TEST_DATABASE_CA_CERT == '' }}
        run: |
          {
            echo "## SRQL Fixture"
            echo
            echo "SRQL fixture secrets are unavailable in this workflow context."
            echo "Skipping fixture-dependent configuration and serviceradar_core integration tests."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure SRQL fixture database for tests
        if: ${{ secrets.SRQL_TEST_DATABASE_URL != '' && secrets.SRQL_TEST_ADMIN_URL != '' && secrets.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
          SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
          SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}
        # Shared with integration-core.yml. This job still needs it after the core suite moved
        # out: the Test step below reads SERVICERADAR_RUN_CORE_INTEGRATION to decide whether to
        # drop the //rust/srql tests, and passes the exported PGSSL*/SRQL_* through as
        # --test_env.
        run: ./scripts/ci/configure-srql-fixture.sh

      - name: Configure remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # Identical to the "Authenticate Docker for OCI registry" step in publish-oci.yml and
      # release.yml. This used to be a bare `./buildbuddy_setup_docker_auth.sh`, which skipped
      # three things those two do: the `docker login` to Harbor, re-exporting the credentials
      # through $GITHUB_ENV so later steps see them, and explicitly clearing OCI_DOCKER_AUTH
      # (the script branches on it, so a value inherited from anywhere else would silently take
      # a different path).
      #
      # The `if:` guard is kept, unlike those two, which hard-exit when Harbor credentials are
      # missing. This workflow runs on every pull request, including ones without access to
      # secrets, where skipping is correct and failing is not. GHCR_* is in the condition so
      # Docker Hub credentials alone are enough to run it.
      - name: Authenticate Docker for OCI registry
        if: ${{ env.OCI_USERNAME != '' && env.OCI_TOKEN != '' || env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          login_registry() {
            local user="${1:-}"
            local token="${2:-}"
            if [[ -z "${user}" || -z "${token}" ]]; then
              return 1
            fi
            echo "${token}" | docker login "${OCI_REGISTRY}" -u "${user}" --password-stdin
          }

          if [[ -n "${OCI_USERNAME:-}" && -n "${OCI_TOKEN:-}" ]]; then
            login_registry "${OCI_USERNAME}" "${OCI_TOKEN}"
          else
            echo "Harbor robot credentials absent; continuing with the remaining registries." >&2
          fi

          export OCI_DOCKER_AUTH=""
          unset OCI_DOCKER_AUTH || true
          {
            echo "OCI_USERNAME=${OCI_USERNAME:-}"
            echo "OCI_TOKEN=${OCI_TOKEN:-}"
            echo "OCI_DOCKER_AUTH="
          } >> "${GITHUB_ENV}"

          chmod +x ./buildbuddy_setup_docker_auth.sh
          ./buildbuddy_setup_docker_auth.sh

      - name: Test
        id: bazel_tests
        env:
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          # attr() takes exactly three arguments, so the two excluded tags are one
          # alternation pattern rather than two arguments. Integration tests are excluded
          # here because elixir-integration-sr-core.yml owns them: they drive a shared CNPG
          # fixture, and folding them into this sweep makes a fixture failure and a compile
          # failure produce the same red X.
          #
          # There used to be a third clause, `except set(//elixir/web-ng:precommit)`, keeping
          # the web-ng precommit on its own red X. That target no longer exists: it was pulled
          # in 8fb020fb9 because :precommit_check fails `mix format --check-formatted` against
          # pre-existing HEEx formatting (see the header of //elixir/web-ng:BUILD.bazel).
          # `set()` hard-errors on an unknown label rather than ignoring it, so the clause was
          # not merely stale -- it aborted the whole query with exit 7 and this step then died
          # through its own "refusing to run an empty test sweep" guard. No tests ran at all.
          #
          # //elixir/web-ng:BUILD.bazel says to restore the target once the tree is formatted.
          # Whoever does that should decide again whether it wants its own workflow, and
          # re-add the exclusion here only if so.
          target_query='tests(//...) except attr("tags", "manual|integration_test", tests(//...))'
          # These two live in //integration_tests/srql, not //rust/srql -- they were moved and
          # this exclusion was left behind. A stale label here does not degrade gracefully:
          # `set()` hard-errors with "no such target", so on the one path this branch exists to
          # serve (fixture unreachable) the query died instead of skipping the tests.
          if [ "${SERVICERADAR_RUN_CORE_INTEGRATION:-1}" = "0" ]; then
            target_query="${target_query} except set(//integration_tests/srql:srql_api_test //integration_tests/srql:srql_comprehensive_test)"
          fi

          # Fail on a bad query rather than silently testing nothing: mapfile swallows the
          # exit status through the process substitution, so an errored query would otherwise
          # produce an empty target list and a green build.
          if ! target_list="$(bazel query "${target_query}")"; then
            echo "::error::bazel query failed; refusing to run an empty test sweep" >&2
            exit 1
          fi
          mapfile -t bazel_targets <<<"${target_list}"

          # No --test_output here on purpose. Bazel documents `streamed` as forcing tests to
          # run "locally one at a time regardless of --test_strategy", which serialised this
          # whole sweep onto the runner and discarded both remote execution and --jobs=100.
          # test:ci already sets --test_output=errors, and the "Dump Bazel test logs" step
          # below prints the logs of anything that failed.
          bazel test \
            -c opt \
            --config=ci \
            --test_tag_filters=-manual \
            --test_env=PGSSLROOTCERT \
            --test_env=PGSSLCERT \
            --test_env=PGSSLKEY \
            --test_env=SERVICERADAR_TEST_DATABASE_CERT \
            --test_env=SERVICERADAR_TEST_DATABASE_KEY \
            --test_env=SRQL_TEST_DATABASE_CERT \
            --test_env=SRQL_TEST_DATABASE_KEY \
            --test_env=CNPG_CA_FILE \
            --test_env=SRQL_TEST_DATABASE_URL \
            --test_env=SRQL_TEST_ADMIN_URL \
            --test_env=SRQL_TEST_DATABASE_CA_CERT \
            --test_env=SRQL_TEST_DATABASE_CA_CERT_FILE \
            --test_env=SERVICERADAR_TEST_DATABASE_URL \
            --test_env=SERVICERADAR_TEST_ADMIN_URL \
            --test_env=SERVICERADAR_TEST_DATABASE_CA_CERT_FILE \
            "${bazel_targets[@]}"

      - name: Dump Bazel test logs
        if: ${{ failure() && steps.bazel_tests.conclusion == 'failure' }}
        run: |
          set +e

          if [ ! -d bazel-testlogs ]; then
            echo "bazel-testlogs not found"
            exit 0
          fi

          files="$(find bazel-testlogs -type f \( -name test.log -o -name test.xml \) 2>/dev/null | sort || true)"
          if [ -z "${files}" ]; then
            echo "no bazel test logs found"
            exit 0
          fi

          printf '%s\n' "${files}" | while read -r file; do
            echo "===== ${file} ====="
            sed -n '1,400p' "${file}" || cat "${file}" || true
            echo
          done

          exit 0

      # serviceradar_core integration tests moved to elixir-integration-sr-core.yml.
