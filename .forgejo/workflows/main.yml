name: CI

on:
  push:
    branches:
      - staging
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  build:
    runs-on: ubuntu24
    permissions:
      contents: read
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TEST_CNPG_DATABASE: serviceradar_web_ng_test
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"

          if [ -d .git ]; then
            git reset --hard
            git clean -ffdx
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "${REPO_URL}"
            else
              git remote add origin "${REPO_URL}"
            fi
          else
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init -q
            git remote add origin "${REPO_URL}"
          fi

          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Check native add-on version bumps
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-staging}"
          git fetch --no-tags --depth=1 origin "${base_ref}"
          scripts/check-native-addon-version-bumps.sh FETCH_HEAD HEAD

      - name: Verify committed Rust vendor snapshot
        run: python3 scripts/check-rust-vendor-tracked.py

      - name: Install build dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh service-build

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        env:
          ImageOS: ubuntu24
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          echo "Expected Bazel: ${expected}"
          echo "Resolved Bazel: ${actual}"
          test "${actual}" = "${expected}"

      - name: Check Gazelle BUILD drift for changed Go packages
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-staging}"
          git fetch --no-tags --depth=1 origin "${base_ref}"
          scripts/check-gazelle-drift.sh FETCH_HEAD HEAD

      - name: Report unavailable SRQL fixture secrets
        if: ${{ secrets.SRQL_TEST_DATABASE_URL == '' || secrets.SRQL_TEST_ADMIN_URL == '' || secrets.SRQL_TEST_DATABASE_CA_CERT == '' }}
        run: |
          {
            echo "## SRQL Fixture"
            echo
            echo "SRQL fixture secrets are unavailable in this workflow context."
            echo "Skipping fixture-dependent configuration and serviceradar_core integration tests."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure SRQL fixture database for tests
        if: ${{ secrets.SRQL_TEST_DATABASE_URL != '' && secrets.SRQL_TEST_ADMIN_URL != '' && secrets.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
          SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
          SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}
        # Shared with integration-core.yml. This job still needs it after the core suite moved
        # out: the Test step below reads SERVICERADAR_RUN_CORE_INTEGRATION to decide whether to
        # drop the //rust/srql tests, and passes the exported PGSSL*/SRQL_* through as
        # --test_env.
        run: ./scripts/ci/configure-srql-fixture.sh

      - name: Configure remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      - name: Configure Docker auth for Bazel pulls
        if: ${{ env.OCI_USERNAME != '' && env.OCI_TOKEN != '' || env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: ./buildbuddy_setup_docker_auth.sh

      - name: Test
        id: bazel_tests
        env:
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          # attr() takes exactly three arguments, so the two excluded tags are one
          # alternation pattern rather than two arguments. Integration tests are excluded
          # here because rust-tests-integration.yml owns them: they drive real containers on
          # remote microVMs, and folding them into this sweep makes a container failure and
          # a compile failure produce the same red X.
          target_query='tests(//...) except attr("tags", "manual|integration_test", tests(//...)) except set(//elixir/web-ng:precommit)'
          if [ "${SERVICERADAR_RUN_CORE_INTEGRATION:-1}" = "0" ]; then
            target_query="${target_query} except set(//rust/srql:srql_api_test //rust/srql:srql_comprehensive_test)"
          fi

          mapfile -t bazel_targets < <(bazel query "${target_query}")

          # No --test_output here on purpose. Bazel documents `streamed` as forcing tests to
          # run "locally one at a time regardless of --test_strategy", which serialised this
          # whole sweep onto the runner and discarded both remote execution and --jobs=100.
          # test:ci already sets --test_output=errors, and the "Dump Bazel test logs" step
          # below prints the logs of anything that failed.
          bazel test \
            --config=ci \
            --test_tag_filters=-manual \
            --test_env=PGSSLROOTCERT \
            --test_env=PGSSLCERT \
            --test_env=PGSSLKEY \
            --test_env=SERVICERADAR_TEST_DATABASE_CERT \
            --test_env=SERVICERADAR_TEST_DATABASE_KEY \
            --test_env=SRQL_TEST_DATABASE_CERT \
            --test_env=SRQL_TEST_DATABASE_KEY \
            --test_env=CNPG_CA_FILE \
            --test_env=SRQL_TEST_DATABASE_URL \
            --test_env=SRQL_TEST_ADMIN_URL \
            --test_env=SRQL_TEST_DATABASE_CA_CERT \
            --test_env=SRQL_TEST_DATABASE_CA_CERT_FILE \
            --test_env=SERVICERADAR_TEST_DATABASE_URL \
            --test_env=SERVICERADAR_TEST_ADMIN_URL \
            --test_env=SERVICERADAR_TEST_DATABASE_CA_CERT_FILE \
            "${bazel_targets[@]}"

      - name: Dump Bazel test logs
        if: ${{ failure() && steps.bazel_tests.conclusion == 'failure' }}
        run: |
          set +e

          if [ ! -d bazel-testlogs ]; then
            echo "bazel-testlogs not found"
            exit 0
          fi

          files="$(find bazel-testlogs -type f \( -name test.log -o -name test.xml \) 2>/dev/null | sort || true)"
          if [ -z "${files}" ]; then
            echo "no bazel test logs found"
            exit 0
          fi

          printf '%s\n' "${files}" | while read -r file; do
            echo "===== ${file} ====="
            sed -n '1,400p' "${file}" || cat "${file}" || true
            echo
          done

          exit 0

      # //elixir/web-ng:precommit moved to precommit-web-ng.yml. It is tagged no-remote with
      # timeout = "eternal", so it always ran on this runner, in series behind the sweep
      # above, for reasons unrelated to anything else here. It depends on no Bazel library
      # target -- its `data` is filegroups of raw sources and the script does its own
      # mix/cargo build -- so nothing in this job has to precede it.

      # serviceradar_core integration tests, and the isolated-database cleanup that belongs
      # with them, moved to integration-core.yml. They ran here as the final step of this job,
      # serially behind the entire Bazel sweep, purely because they shared a job:
      # scripts/test-integration.sh invokes no Bazel target and consumes nothing this job
      # produces. Splitting them also stops a fixture outage from rendering as the same red X
      # as a compile failure.
