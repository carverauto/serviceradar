name: CI

on:
  push:
    branches:
      - staging
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  ImageOS: ubuntu24

jobs:
  build:
    runs-on: ubuntu24
    permissions:
      contents: read
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TEST_CNPG_DATABASE: serviceradar_web_ng_test
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"

          if [ -d .git ]; then
            git reset --hard
            git clean -ffdx
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "${REPO_URL}"
            else
              git remote add origin "${REPO_URL}"
            fi
          else
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init -q
            git remote add origin "${REPO_URL}"
          fi

          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Check native add-on version bumps
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-staging}"
          git fetch --no-tags --depth=1 origin "${base_ref}"
          scripts/check-native-addon-version-bumps.sh FETCH_HEAD HEAD

      - name: Verify committed Rust vendor snapshot
        run: python3 scripts/check-rust-vendor-tracked.py

      - name: Install build dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh service-build

      - name: Setup Beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        env:
          ImageOS: ubuntu24
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          echo "Expected Bazel: ${expected}"
          echo "Resolved Bazel: ${actual}"
          test "${actual}" = "${expected}"

      - name: Check Gazelle BUILD drift for changed Go packages
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-staging}"
          git fetch --no-tags --depth=1 origin "${base_ref}"
          scripts/check-gazelle-drift.sh FETCH_HEAD HEAD

      - name: Report unavailable SRQL fixture secrets
        if: ${{ secrets.SRQL_TEST_DATABASE_URL == '' || secrets.SRQL_TEST_ADMIN_URL == '' || secrets.SRQL_TEST_DATABASE_CA_CERT == '' }}
        run: |
          {
            echo "## SRQL Fixture"
            echo
            echo "SRQL fixture secrets are unavailable in this workflow context."
            echo "Skipping fixture-dependent configuration and serviceradar_core integration tests."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure SRQL fixture database for tests
        if: ${{ secrets.SRQL_TEST_DATABASE_URL != '' && secrets.SRQL_TEST_ADMIN_URL != '' && secrets.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
          SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
          SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}
          SERVICERADAR_SKIP_UNREACHABLE_INTEGRATION_DB: "1"
        run: |
          set -euo pipefail

          if [ -z "${SRQL_TEST_DATABASE_URL:-}" ] || [ -z "${SRQL_TEST_ADMIN_URL:-}" ]; then
            echo "SRQL fixture DSNs must be configured via SRQL_TEST_DATABASE_URL and SRQL_TEST_ADMIN_URL secrets." >&2
            exit 1
          fi

          if [ -z "${SRQL_TEST_DATABASE_CA_CERT:-}" ]; then
            echo "SRQL_TEST_DATABASE_CA_CERT secret must be configured to verify SRQL fixture TLS." >&2
            exit 1
          fi

          ca_file="${RUNNER_TEMP}/srql-fixture-ca.crt"
          printf "%s" "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"

          {
            echo "SRQL_TEST_DATABASE_URL=${SRQL_TEST_DATABASE_URL}"
            echo "SRQL_TEST_ADMIN_URL=${SRQL_TEST_ADMIN_URL}"
            echo "PGSSLROOTCERT=${ca_file}"
            echo "CNPG_CA_FILE=${ca_file}"
            echo "SERVICERADAR_TEST_DATABASE_CA_CERT_FILE=${ca_file}"
            echo "SRQL_TEST_DATABASE_CA_CERT_FILE=${ca_file}"
            echo "SERVICERADAR_SKIP_UNREACHABLE_INTEGRATION_DB=1"
          } >> "$GITHUB_ENV"

          if [ -n "${SRQL_TEST_DATABASE_CERT:-}" ] || [ -n "${SRQL_TEST_DATABASE_KEY:-}" ]; then
            if [ -z "${SRQL_TEST_DATABASE_CERT:-}" ] || [ -z "${SRQL_TEST_DATABASE_KEY:-}" ]; then
              echo "SRQL_TEST_DATABASE_CERT and SRQL_TEST_DATABASE_KEY must be provided together." >&2
              exit 1
            fi

            cert_file="${RUNNER_TEMP}/srql-fixture-client.crt"
            key_file="${RUNNER_TEMP}/srql-fixture-client.key"
            printf "%s" "${SRQL_TEST_DATABASE_CERT}" > "${cert_file}"
            printf "%s" "${SRQL_TEST_DATABASE_KEY}" > "${key_file}"
            chmod 600 "${key_file}"
            {
              echo "PGSSLCERT=${cert_file}"
              echo "PGSSLKEY=${key_file}"
              echo "SERVICERADAR_TEST_DATABASE_CERT=${cert_file}"
              echo "SERVICERADAR_TEST_DATABASE_KEY=${key_file}"
              echo "SRQL_TEST_DATABASE_CERT=${cert_file}"
              echo "SRQL_TEST_DATABASE_KEY=${key_file}"
            } >> "$GITHUB_ENV"
          fi

          parser="$(command -v python3 || command -v python || true)"
          if [ -z "${parser}" ]; then
            echo "python is required to parse SRQL fixture DSNs." >&2
            exit 1
          fi

          "${parser}" - <<'PY' >> "$GITHUB_ENV"
          import os
          import socket
          from urllib.parse import urlparse, parse_qs

          def parse(url):
              u = urlparse(url)
              qs = parse_qs(u.query)
              return {
                  "user": u.username or "",
                  "password": u.password or "",
                  "host": u.hostname or "",
                  "port": str(u.port or 5432),
                  "sslmode": (qs.get("sslmode") or [""])[0],
              }

          db = parse(os.environ["SRQL_TEST_DATABASE_URL"])
          admin = parse(os.environ["SRQL_TEST_ADMIN_URL"])
          host = admin["host"] or db["host"]
          port = admin["port"] or db["port"]
          user = admin["user"]
          password = admin["password"]

          if not host or not user:
              raise SystemExit("SRQL_TEST_ADMIN_URL must include host and username")

          print(f"TEST_CNPG_HOST={host}")
          print(f"TEST_CNPG_PORT={port}")
          print(f"TEST_CNPG_USERNAME={user}")
          print(f"TEST_CNPG_PASSWORD={password}")
          print(f"CNPG_HOST={host}")
          print(f"CNPG_PORT={port}")

          sslmode = db["sslmode"] or "require"
          print(f"CNPG_SSL_MODE={sslmode}")
          print(f"CNPG_TLS_SERVER_NAME={host}")

          reachable = False
          try:
              with socket.create_connection((host, int(port)), timeout=5):
                  reachable = True
          except OSError:
              reachable = False

          print(f"SERVICERADAR_RUN_CORE_INTEGRATION={'1' if reachable else '0'}")
          PY

      - name: Configure remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      - name: Configure Docker auth for Bazel pulls
        if: ${{ env.OCI_USERNAME != '' && env.OCI_TOKEN != '' || env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: ./buildbuddy_setup_docker_auth.sh

      - name: Test
        id: bazel_tests
        env:
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          # attr() takes exactly three arguments, so the two excluded tags are one
          # alternation pattern rather than two arguments. Integration tests are excluded
          # here because tests-integration-rust.yml owns them: they drive real containers on
          # remote microVMs, and folding them into this sweep makes a container failure and
          # a compile failure produce the same red X.
          target_query='tests(//...) except attr("tags", "manual|integration_test", tests(//...)) except set(//elixir/web-ng:precommit)'
          if [ "${SERVICERADAR_RUN_CORE_INTEGRATION:-1}" = "0" ]; then
            target_query="${target_query} except set(//rust/srql:srql_api_test //rust/srql:srql_comprehensive_test)"
          fi

          mapfile -t bazel_targets < <(bazel query "${target_query}")

          bazel test \
            --config=ci \
            --test_tag_filters=-manual \
            --test_output=streamed \
            --test_env=PGSSLROOTCERT \
            --test_env=PGSSLCERT \
            --test_env=PGSSLKEY \
            --test_env=SERVICERADAR_TEST_DATABASE_CERT \
            --test_env=SERVICERADAR_TEST_DATABASE_KEY \
            --test_env=SRQL_TEST_DATABASE_CERT \
            --test_env=SRQL_TEST_DATABASE_KEY \
            --test_env=CNPG_CA_FILE \
            --test_env=SRQL_TEST_DATABASE_URL \
            --test_env=SRQL_TEST_ADMIN_URL \
            --test_env=SRQL_TEST_DATABASE_CA_CERT \
            --test_env=SRQL_TEST_DATABASE_CA_CERT_FILE \
            --test_env=SERVICERADAR_TEST_DATABASE_URL \
            --test_env=SERVICERADAR_TEST_ADMIN_URL \
            --test_env=SERVICERADAR_TEST_DATABASE_CA_CERT_FILE \
            "${bazel_targets[@]}"

      - name: Dump Bazel test logs
        if: ${{ failure() && steps.bazel_tests.conclusion == 'failure' }}
        run: |
          set +e

          if [ ! -d bazel-testlogs ]; then
            echo "bazel-testlogs not found"
            exit 0
          fi

          files="$(find bazel-testlogs -type f \( -name test.log -o -name test.xml \) 2>/dev/null | sort || true)"
          if [ -z "${files}" ]; then
            echo "no bazel test logs found"
            exit 0
          fi

          printf '%s\n' "${files}" | while read -r file; do
            echo "===== ${file} ====="
            sed -n '1,400p' "${file}" || cat "${file}" || true
            echo
          done

          exit 0

      - name: web-ng precommit
        id: web_ng_precommit
        run: |
          bazel test \
            --config=ci \
            --test_output=streamed \
            //elixir/web-ng:precommit

      - name: Dump web-ng precommit logs
        if: ${{ failure() && steps.web_ng_precommit.conclusion == 'failure' }}
        run: |
          set +e

          if [ ! -d bazel-testlogs/elixir/web-ng ]; then
            echo "web-ng bazel-testlogs not found"
            exit 0
          fi

          files="$(find bazel-testlogs/elixir/web-ng -type f \( -name test.log -o -name test.xml \) 2>/dev/null | sort || true)"
          if [ -z "${files}" ]; then
            echo "no web-ng precommit logs found"
            exit 0
          fi

          printf '%s\n' "${files}" | while read -r file; do
            echo "===== ${file} ====="
            sed -n '1,400p' "${file}" || cat "${file}" || true
            echo
          done

          exit 0

      - name: serviceradar_core integration tests
        if: ${{ secrets.SRQL_TEST_DATABASE_URL != '' && secrets.SRQL_TEST_ADMIN_URL != '' && secrets.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
          SERVICERADAR_SKIP_UNREACHABLE_INTEGRATION_DB: "1"
          # sr-testing NATS JetStream fixture (namespace sr-testing, svc
          # sr-testing-nats-ext, NodePort 31819). When these are absent the e2e
          # test skips itself rather than failing the job.
          NATS_TEST_HOST: ${{ secrets.NATS_TEST_HOST }}
          NATS_TEST_PORT: ${{ secrets.NATS_TEST_PORT }}
          NATS_TEST_SERVER_NAME: ${{ secrets.NATS_TEST_SERVER_NAME }}
          NATS_TEST_CA_CERT: ${{ secrets.NATS_TEST_CA_CERT }}
          NATS_TEST_CLIENT_CERT: ${{ secrets.NATS_TEST_CLIENT_CERT }}
          NATS_TEST_CLIENT_KEY: ${{ secrets.NATS_TEST_CLIENT_KEY }}
        run: |
          set -euo pipefail

          if [ "${SERVICERADAR_RUN_CORE_INTEGRATION:-1}" = "0" ]; then
            echo "serviceradar_core integration database is unreachable; skipping optional integration tests" >&2
            exit 0
          fi

          ca_file="${RUNNER_TEMP}/srql-fixture-ca.crt"
          printf "%s" "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"

          export PGSSLROOTCERT="${ca_file}"
          export CNPG_CA_FILE="${ca_file}"
          export SERVICERADAR_TEST_DATABASE_CA_CERT_FILE="${ca_file}"
          export SRQL_TEST_DATABASE_CA_CERT_FILE="${ca_file}"

          # NATS mTLS material -> NATS_TEST_CERT_DIR/{ca,client}.crt + client.key.
          # Leaving NATS_TEST_CERT_DIR unset is a supported state: the e2e test
          # skips when it (or NATS_TEST_HOST) is empty.
          if [ -n "${NATS_TEST_HOST:-}" ] && [ -n "${NATS_TEST_CA_CERT:-}" ] &&
            [ -n "${NATS_TEST_CLIENT_CERT:-}" ] && [ -n "${NATS_TEST_CLIENT_KEY:-}" ]; then
            nats_cert_dir="${RUNNER_TEMP}/sr-testing-nats-certs"
            mkdir -p "${nats_cert_dir}"
            chmod 700 "${nats_cert_dir}"
            printf "%s" "${NATS_TEST_CA_CERT}" > "${nats_cert_dir}/ca.crt"
            printf "%s" "${NATS_TEST_CLIENT_CERT}" > "${nats_cert_dir}/client.crt"
            printf "%s" "${NATS_TEST_CLIENT_KEY}" > "${nats_cert_dir}/client.key"
            chmod 600 "${nats_cert_dir}"/*
            export NATS_TEST_CERT_DIR="${nats_cert_dir}"
            export NATS_TEST_PORT="${NATS_TEST_PORT:-31819}"
            # Authenticates the fixture: the CA is only meaningful with verify_peer
            # plus the expected server name.
            export NATS_TEST_SERVER_NAME="${NATS_TEST_SERVER_NAME:-sr-testing-nats}"
          elif [ -n "${NATS_TEST_HOST:-}${NATS_TEST_CA_CERT:-}${NATS_TEST_CLIENT_CERT:-}${NATS_TEST_CLIENT_KEY:-}" ]; then
            # PARTIAL configuration: fail loudly. A silent skip here would let a
            # renamed or deleted secret quietly disable the integration coverage
            # this job exists to provide.
            echo "::error::sr-testing NATS fixture is PARTIALLY configured. Set all of" \
              "NATS_TEST_HOST, NATS_TEST_CA_CERT, NATS_TEST_CLIENT_CERT," \
              "NATS_TEST_CLIENT_KEY (and optionally NATS_TEST_PORT," \
              "NATS_TEST_SERVER_NAME), or none of them." >&2
            exit 1
          else
            echo "sr-testing NATS fixture not configured; the NATS e2e test will skip" >&2
          fi

          ./scripts/sweep-stale-core-test-dbs.sh "${SRQL_TEST_ADMIN_URL}" 86400

          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]] ||
            [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT must be numeric." >&2
            exit 1
          fi

          # Rust owns the shared fixture behind an advisory lock. Give the Core
          # reset/migration suite its own database so concurrent PRs cannot drop
          # another run's fixture.
          created_epoch="$(date +%s)"
          if [[ ! "${created_epoch}" =~ ^[0-9]{10,11}$ ]]; then
            echo "current epoch must be 10 or 11 digits" >&2
            exit 1
          fi

          database_name="sr_core_test_${created_epoch}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [ "${#database_name}" -gt 63 ]; then
            echo "isolated integration database name exceeds PostgreSQL's 63-byte limit" >&2
            exit 1
          fi

          parser="$(command -v python3 || command -v python || true)"
          if [ -z "${parser}" ]; then
            echo "python is required to derive the isolated integration database URL." >&2
            exit 1
          fi

          SERVICERADAR_TEST_DATABASE_URL="$("${parser}" - "${SRQL_TEST_DATABASE_URL}" "${database_name}" <<'PY'
          import sys
          from urllib.parse import quote, urlparse, urlunparse

          parsed = urlparse(sys.argv[1])
          database_name = sys.argv[2]

          if parsed.scheme not in {"postgres", "postgresql"} or not parsed.hostname:
              raise SystemExit("SRQL_TEST_DATABASE_URL is not a valid PostgreSQL URL")

          print(
              urlunparse(
                  (
                      parsed.scheme,
                      parsed.netloc,
                      "/" + quote(database_name, safe=""),
                      parsed.params,
                      parsed.query,
                      parsed.fragment,
                  )
              )
          )
          PY
          )"
          export SERVICERADAR_TEST_DATABASE_URL
          echo "::add-mask::${SERVICERADAR_TEST_DATABASE_URL}"

          # shellcheck source=scripts/db/test-database-url-guard.sh
          source ./scripts/db/test-database-url-guard.sh
          serviceradar_assert_test_database_url "${SERVICERADAR_TEST_DATABASE_URL}"
          printf 'SERVICERADAR_CI_TEST_DATABASE_URL=%s\n' \
            "${SERVICERADAR_TEST_DATABASE_URL}" >> "${GITHUB_ENV}"

          cleanup_done=0
          cleanup_isolated_database() {
            if [ "${cleanup_done}" -eq 1 ]; then
              return 0
            fi

            cleanup_done=1
            ./scripts/drop-test-db.sh \
              "${SRQL_TEST_ADMIN_URL}" "${SERVICERADAR_TEST_DATABASE_URL}"
          }
          trap cleanup_isolated_database EXIT

          test_status=0
          ./scripts/test-integration.sh || test_status=$?

          if [ "${test_status}" -eq 0 ] && [ "${SERVICERADAR_RUN_ARMIS_DIRE_E2E:-1}" != "0" ]; then
            echo "Running hermetic Armis/DIRE fast E2E"
            SERVICERADAR_TEST_DATABASE_URL="${SRQL_TEST_DATABASE_URL}" \
              SERVICERADAR_TEST_ADMIN_URL="${SRQL_TEST_ADMIN_URL}" \
              PGSSLROOTCERT="${ca_file}" \
              ./scripts/test-armis-dire-e2e.sh --profile fast || test_status=$?
          fi

          cleanup_status=0
          cleanup_isolated_database || cleanup_status=$?
          trap - EXIT

          if [ "${test_status}" -ne 0 ]; then
            exit "${test_status}"
          fi

          exit "${cleanup_status}"

      - name: Retry isolated SRQL fixture cleanup
        if: ${{ always() && secrets.SRQL_TEST_ADMIN_URL != '' && secrets.SRQL_TEST_DATABASE_CA_CERT != '' }}
        env:
          SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
          SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
        run: |
          set -euo pipefail

          if [ -z "${SERVICERADAR_CI_TEST_DATABASE_URL:-}" ]; then
            exit 0
          fi

          ca_file="${RUNNER_TEMP}/srql-fixture-ca.crt"
          printf "%s" "${SRQL_TEST_DATABASE_CA_CERT}" > "${ca_file}"
          export PGSSLROOTCERT="${ca_file}"

          ./scripts/drop-test-db.sh \
            "${SRQL_TEST_ADMIN_URL}" "${SERVICERADAR_CI_TEST_DATABASE_URL}"
