name: Rust Security Audit

# RustSec advisories for rust/rdp-connector-probe, the review-only IronRDP probe.
#
# Separate from tests and from clippy because it fails for a reason neither of those can:
# the advisory database moves on its own, so this job can go red on a commit that changed
# nothing. Folding it into the test workflow would make an unrelated upstream disclosure
# look like a broken test.
#
# That independence is also why it runs on a schedule. A code-triggered audit only tells
# you about advisories published before your last commit; the weekly run is what catches a
# disclosure against a dependency nobody has touched in months.
on:
  push:
    branches: [staging]
    paths: &audit_paths
      - 'rust/rdp-connector-probe/**'
      - '.forgejo/workflows/audit-rust.yml'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths: *audit_paths
  schedule:
    # Mondays 05:17 UTC. Off the hour so it does not pile onto every other cron.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Cargo Audit
        run: sfw cargo install cargo-audit --locked --version 0.22.1

      # --no-fetch against a freshly cloned database, rather than letting cargo-audit fetch:
      # the clone is visible in the log, so a run can be reproduced against exactly the
      # advisory set it saw.
      - name: Audit RDP connector probe dependencies
        run: |
          set -euo pipefail

          advisory_db="${RUNNER_TEMP:-/tmp}/rustsec-advisory-db"
          rm -rf "${advisory_db}"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "${advisory_db}"

          cd rust/rdp-connector-probe
          sfw cargo audit --db "${advisory_db}" --no-fetch --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2023-0089

          {
            echo "## RDP Connector Probe RustSec Audit"
            echo
            echo "Known accepted advisories for the review-only IronRDP connector probe:"
            echo "- RUSTSEC-2023-0071: rsa Marvin timing issue via connector 0.10.0 -> sspi 0.21.1 -> picky 7.0.0-rc.25; no fixed upgrade is available in this IronRDP family."
            echo "- RUSTSEC-2023-0089: atomic-polyfill is unmaintained in connector 0.10.0's forced sspi/scard build subtree; ServiceRadar rejects smart-card redirection at runtime."
            echo "- Reviewed exact family: blocking/connector 0.10.0, core 0.2.1, graphics/pdu 0.9.0, session 0.11.0."
            echo "- Yanked spin 0.9.8 is absent. Non-yanked spin 0.9.9 remains unreachable smart-card build baggage until IronRDP feature-gates sspi/scard."
            echo
            echo "Any additional RustSec vulnerability or warning fails this job."
          } >> "${GITHUB_STEP_SUMMARY}"
