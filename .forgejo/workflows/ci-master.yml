name: CI Master

# The single Bazel-driven CI workflow. Sequence: openspec/notes/bazel-bb-ci.md.
# Plan and audit: openspec/notes/bazel-ci.md.
#
# ONE JOB, ON PURPOSE. Every bazel command below runs in one workspace against one Bazel
# server, and that is the entire design, not an accident of layout.
#
on:
  push:
    branches:
      - staging
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ImageOS: ubuntu24

jobs:
  ci:
    name: Bazel CI
    runs-on: ubuntu24
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      # One registry, for pulls and pushes both. Every oci.pull in MODULE.bazel resolves to registry.carverauto.dev.
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
      TEST_CNPG_DATABASE: serviceradar_web_ng_test
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
      SRQL_TEST_DATABASE_URL: ${{ secrets.SRQL_TEST_DATABASE_URL }}
      SRQL_TEST_ADMIN_URL: ${{ secrets.SRQL_TEST_ADMIN_URL }}
      SRQL_TEST_DATABASE_CA_CERT: ${{ secrets.SRQL_TEST_DATABASE_CA_CERT }}
      SRQL_TEST_DATABASE_CERT: ${{ secrets.SRQL_TEST_DATABASE_CERT }}
      SRQL_TEST_DATABASE_KEY: ${{ secrets.SRQL_TEST_DATABASE_KEY }}

    steps:
      # Hand-rolled rather than actions/checkout, and the exclusions are load-bearing.
      # //.bazelrc puts both Bazel caches inside the workspace (repository_cache and
      # disk_cache under third_party/) and both are gitignored, so an unqualified
      # `git clean -ffdx` wipes them every run. That forces a refetch of every external repo,
      # including the 11 OCI base images in MODULE.bazel, on every single run.
      - name: Checkout
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"

          if [ -d .git ]; then
            git reset --hard
            git clean -ffdx \
              -e third_party/bazel-repo-cache \
              -e third_party/bazel-disk-cache
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "${REPO_URL}"
            else
              git remote add origin "${REPO_URL}"
            fi
          else
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init -q
            git remote add origin "${REPO_URL}"
          fi

          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # --- Runner setup --------------------------------------------------------------------
      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      # Required. --config=ci points cache, BES and executor at the org's BuildBuddy, which
      # rejects anonymous access, so without this header the first bazel call dies with
      # `PERMISSION_DENIED: Anonymous access disabled`.
      #
      # This is the ONE line that changes if the backend moves to NativeLink; it becomes an
      # mTLS client cert. Everything below only ever names --config=ci.
      - name: Configure remote cache
        if: ${{ env.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      # =====================================================================================
      # From here down: one Bazel server, one loading and analysis phase, warm across every
      # command. Do not move any of these into another job.
      # =====================================================================================

      # 0. Docker auth for rules_oci fetches.
      - name: Setup Docker authentication
        run: bazel run -c opt --config=ci //:buildbuddy_setup_docker_auth --verbose_failures

      # 1. Build everything.
      - name: Build
        run: bazel build -c opt --config=ci //...

      # 2. Unit tests everything
      - name: Unit tests
        id: unit_tests
        run: bazel test -c opt --config=ci //... --test_tag_filters=-integration_test,-acceptance_test

      # 3. Go race detector and repeat-count flake hunt.
      # --flaky_test_attempts=1 overrides the repo default of 2. A flake hunt that retries is
      # not a flake hunt.
      - name: Go tests with race detector
        id: go_race
        run: |
          bazel test -c opt --config=ci //go/... \
            --@io_bazel_rules_go//go/config:pure=false \
            --@io_bazel_rules_go//go/config:race \
            --test_tag_filters=-integration_test,-acceptance_test \
            --test_timeout=600 \
            --flaky_test_attempts=1 \
            --test_arg=-test.count=10 \
            --test_arg=-test.short \
            --test_arg=-test.shuffle=on

      # 4. Integration tests that bring their own Postgres.
      #
      # Named explicitly because no wildcard can reach them: //integration_tests/srql is tagged
      # `manual`, which removes a target from //... expansion before tag filters are even
      # considered. `--test_tag_filters=` is required for the same reason -- the empty value
      # clears the repo default so a manual target named on the command line is not filtered
      # back out.
      #
      # NOT part of the fixture window below, and they do not take
      # --//build:enable_integration_tests. They carry no requires_shared_fixture() guard and
      # never read SRQL_TEST_*; their `data` includes //docker/images:cnpg_image_amd64_tar, so
      # each spins its own CNPG Postgres. `no-remote-exec` puts them on the runner.
      #
      # These were running nowhere. main.yml's sweep listed them in an `except set(...)` clause
      # for the fixture-unreachable case, but `manual` already kept them out of `tests(//...)`,
      # so the exclusion was inert and nothing ever named them.
      - name: Integration tests (self-contained Postgres)
        run: >-
          bazel test -c opt --config=ci
          --test_tag_filters=
          //integration_tests/srql:srql_api_test
          //integration_tests/srql:srql_comprehensive_test

      # NOT wired up: //go/pkg/scan/banner_grab:banner_grab_integration_test. It is tagged
      # `manual` because it FAILS, not because it is slow or needs a fixture -- its BUILD
      # comment records that assertIntegrationMatches wants an `ntp` product match the recog
      # corpus cannot produce, and calls the resolution a product decision. Enabling it here
      # would turn CI red on a known open issue. Add an NTP recog entry or drop "ntp" from the
      # expectations first.

      # 5. Database lifecycle.
      #
      # Sequencing lives here because Bazel deliberately does not order tests. The canonical
      # chain is documented at rust/integration-db/BUILD.bazel:
      #   sweep_stale_dbs -> prepare_template -> [migrate_template] -> provision_db
      #     -> <suites> -> teardown_db
      #
      # --//build:enable_integration_tests on every call, and all of them need it: every target
      # here carries target_compatible_with = requires_shared_fixture(), which resolves to
      # @platforms//:incompatible without the flag. A wildcard skips such a target; naming one
      # explicitly exits 1. It must NOT move to .bazelrc -- the guard exists because these
      # targets run DDL against a CNPG fixture that concurrent pull requests share.
      #
      # `>-` folded scalars below, and the backslashes are gone on purpose. In a plain YAML
      # scalar a line break folds to a SPACE, so `--test_tag_filters= \` + newline + a target
      # label collapsed into the single argument
      # `--test_tag_filters=//rust/integration-db:sweep_stale_dbs`: the empty filter swallowed
      # the label and the command named no target at all. `>-` folds the same way but needs no
      # continuation characters, so each argument stays an argument.
      - name: Sweep stale integration databases
        if: ${{ env.SRQL_TEST_ADMIN_URL != '' }}
        run: >-
          bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=
          //rust/integration-db:sweep_stale_dbs

      # `bazel run`, not `bazel test`: it writes needs_migration to $GITHUB_OUTPUT, and under
      # --config=ci a test executes on a remote executor with no access to the runner's
      # filesystem. `bazel run` builds remotely and runs locally. --build_tag_filters, not
      # --test_tag_filters, because it is a rust_binary.
      - name: Prepare template database
        id: template
        if: ${{ env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_URL != '' }}
        run: >-
          bazel run -c opt --config=ci --//build:enable_integration_tests
          --build_tag_filters=
          //rust/integration-db:prepare_template

      # The one step that needs the BEAM, and the reason the previous step exists: on a branch
      # that adds no migrations this is skipped and nothing starts an Erlang VM. Running it
      # against a current template is a documented no-op, so the condition is an optimisation
      # rather than a correctness requirement.
      - name: Migrate template database
        if: ${{ steps.template.outputs.needs_migration == 'true' }}
        run: >-
          bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=
          //elixir/serviceradar_core:migrate_template

      # Re-checks the pending set itself, so a wrong skip above fails here rather than silently
      # running a suite against a stale schema.
      - name: Provision integration database
        if: ${{ env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_URL != '' }}
        run: >-
          bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=
          //rust/integration-db:provision_db

      # The suites. This is the blueprint's "// Add more integration tests here that require
      # the DB fixture" slot, and the line it left commented out.
      #
      # Selects //elixir/serviceradar_core:integration_tests_s0..s7 and nothing else. The tag
      # filter reads as though it would also pick up the other two integration_test targets in
      # the repo, and it does not: `manual` removes a target from //... expansion entirely,
      # before tag filters are considered.
      #
      #   //go/pkg/scan/banner_grab:banner_grab_integration_test   integration_test, manual
      #   //rust/dgraph-client/tests:acceptance_tests_*            integration_test, acceptance_test
      #
      # This is also the step that first exercises the 8 shards since `test.env-secrets` was
      # removed from them, so it is the proof that the --test_env credential path works.
      - name: Integration suites
        if: ${{ env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_URL != '' }}
        run: >-
          bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=integration_test,-acceptance_test //...

      # always() rather than success(): a red suite must not leak its database. A cancelled job
      # never reaches this at all, which is what the sweep above is for.
      - name: Drop integration database
        if: ${{ always() && env.SRQL_TEST_ADMIN_URL != '' && env.SRQL_TEST_DATABASE_URL != '' }}
        run: >-
          bazel test -c opt --config=ci --//build:enable_integration_tests
          --test_tag_filters=
          //rust/integration-db:teardown_db

      # 6. Push. //:push is rules_multirun over the per-image push targets
      - name: Push images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
        run: bazel run -c opt --config=ci //:push
