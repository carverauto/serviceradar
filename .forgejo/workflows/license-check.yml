name: License Check

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teleport-license-paths:
    runs-on: ubuntu-24.04
    env:
      TELEPORT_SRC: ${{ github.workspace }}/.cache/teleport
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod

      - name: Cache Teleport source
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: .cache/teleport
          key: teleport-source-main-v1

      - name: Prepare Teleport source
        run: |
          set -euo pipefail
          if [[ -d "${TELEPORT_SRC}/.git" ]]; then
            git -C "${TELEPORT_SRC}" fetch --depth=1 origin master
            git -C "${TELEPORT_SRC}" checkout --force FETCH_HEAD
          else
            rm -rf "${TELEPORT_SRC}"
            git clone --depth=1 https://github.com/gravitational/teleport.git "${TELEPORT_SRC}"
          fi

      - name: Check Teleport import license paths
        run: |
          set -euo pipefail
          mapfile -t teleport_imports < <(
            rg --no-heading --no-filename --only-matching \
              'github\.com/gravitational/teleport[^"[:space:]]*' \
              go go.mod 2>/dev/null | sort -u
          )

          if [[ "${#teleport_imports[@]}" -eq 0 ]]; then
            echo "No Teleport Go imports found in ServiceRadar."
            exit 0
          fi

          ./scripts/check-teleport-license-paths.sh "${teleport_imports[@]}"
