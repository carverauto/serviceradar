name: Helm Lint
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ staging ]
    paths:
      - 'helm/**'
      - '.forgejo/workflows/helm-lint.yml'
      - 'scripts/run-helm.sh'
      - 'scripts/check-core-analytics-helm-defaults.sh'
      - 'scripts/check-tenant-chart-hook-order.sh'
      - 'scripts/check-hosted-runtime-cert-boundary.sh'
      - 'scripts/check-web-ng-extra-env-value-from.sh'
  pull_request:
    branches: [ staging ]
    paths:
      - 'helm/**'
      - '.forgejo/workflows/helm-lint.yml'
      - 'scripts/run-helm.sh'
      - 'scripts/check-core-analytics-helm-defaults.sh'
      - 'scripts/check-tenant-chart-hook-order.sh'
      - 'scripts/check-hosted-runtime-cert-boundary.sh'
      - 'scripts/check-web-ng-extra-env-value-from.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu24
    env:
      HELM_VERSION: 3.14.4

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run helm lint
        run: ./scripts/run-helm.sh lint helm/serviceradar

      - name: Run helm template (validate rendering)
        run: |
          ./scripts/run-helm.sh template serviceradar helm/serviceradar \
            --set global.imageTag="v1.0.0" \
            --debug > /dev/null

      - name: Verify web-ng secret-backed environment values
        run: HELM_BIN=./scripts/run-helm.sh ./scripts/check-web-ng-extra-env-value-from.sh

      - name: Verify core analytics defaults
        run: HELM_BIN=./scripts/run-helm.sh ./scripts/check-core-analytics-helm-defaults.sh

      - name: Verify CNPG WAL cap defaults
        run: HELM_BIN=./scripts/run-helm.sh ./scripts/check-cnpg-wal-cap-helm-defaults.sh

      - name: Verify tenant bootstrap hook order
        run: HELM_BIN=./scripts/run-helm.sh ./scripts/check-tenant-chart-hook-order.sh

      - name: Verify hosted runtime certificate boundary
        run: HELM_BIN=./scripts/run-helm.sh ./scripts/check-hosted-runtime-cert-boundary.sh
