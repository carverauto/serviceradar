name: Proto ABI

# Stack-aware ABI gate: this runs on EVERY pull request that touches the proto ABI,
# its generated bindings, or the edge record-plane validators, regardless of base
# branch, so stacked contract PRs are gated too. It is path-filtered so it stays
# cheap.
#
# Single-source model: protoc (via `make generate-proto`) is the ONE generator for
# the checked-in *.pb.go; Bazel compiles those exact files (a plain go_library), so
# there is no second generator to drift against and no Bazel-vs-Make parity gate.
# `make verify-proto-go` / `make verify-proto-elixir` (regenerate into a clean temp
# tree, then compare the file manifest AND bytes vs committed) are the sole drift
# guards. This job needs no Bazel toolchain because `main.yml` already runs the full
# Go/Elixir/Bazel graph on every pull request -- its `pull_request:` trigger is
# unrestricted, so stacked PRs get the edge Bazel build there too. That full-CI/Bazel
# check must remain a required status.
#
# The pull_request and push path lists MUST stay identical (Forgejo's parser does
# not support YAML anchors, so they are duplicated verbatim).
on:
  pull_request:
    paths:
      # --- KEEP IN SYNC with push.paths below ---
      - 'proto/**'
      - 'buf.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'go/pkg/edge/edgerecord/**'
      # execstate builds the lifecycle events that carry the completion proof, so a
      # producer change there can break the frozen ABI without touching edgerecord.
      - 'go/pkg/edge/execstate/**'
      - 'elixir/serviceradar_core/lib/serviceradar/proto/**'
      - 'elixir/serviceradar_core/lib/serviceradar/edge/**'
      - 'elixir/serviceradar_core/test/serviceradar/proto/**'
      - 'elixir/serviceradar_core/test/serviceradar/edge/**'
      - 'scripts/patch_edge_enum_negatives.exs'
      - 'scripts/test_patch_edge_enum_negatives.exs'
      - 'elixir/serviceradar_core/mix.exs'
      - 'elixir/serviceradar_core/mix.lock'
      - 'elixir/serviceradar_core/.formatter.exs'
      - 'Makefile'
      - '.forgejo/workflows/proto-abi.yml'
  push:
    branches: [staging]
    paths:
      # --- KEEP IN SYNC with pull_request.paths above ---
      - 'proto/**'
      - 'buf.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'go/pkg/edge/edgerecord/**'
      # execstate builds the lifecycle events that carry the completion proof, so a
      # producer change there can break the frozen ABI without touching edgerecord.
      - 'go/pkg/edge/execstate/**'
      - 'elixir/serviceradar_core/lib/serviceradar/proto/**'
      - 'elixir/serviceradar_core/lib/serviceradar/edge/**'
      - 'elixir/serviceradar_core/test/serviceradar/proto/**'
      - 'elixir/serviceradar_core/test/serviceradar/edge/**'
      - 'scripts/patch_edge_enum_negatives.exs'
      - 'scripts/test_patch_edge_enum_negatives.exs'
      - 'elixir/serviceradar_core/mix.exs'
      - 'elixir/serviceradar_core/mix.lock'
      - 'elixir/serviceradar_core/.formatter.exs'
      - 'Makefile'
      - '.forgejo/workflows/proto-abi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto-abi:
    runs-on: ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Setup BEAM (Elixir/OTP)
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'
      # verify-proto-elixir compiles the Elixir tree, which includes the
      # serviceradar_srql path dependency's Rust NIF; without cargo on PATH `mix`
      # aborts with `System.cmd("cargo", ...) :enoent` before the drift guard runs
      # (the root cause of the earlier red run #38747). Install the moving-stable
      # toolchain, matching main.yml -- this job only needs a cargo that can compile
      # the NIF so the drift guard runs; the authoritative Rust build is elsewhere.
      - name: Setup Rust
        run: |
          set -euo pipefail

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      # Pin protoc to the exact version the committed bindings were generated with
      # (libprotoc 34.1 -> "// protoc v7.34.1"), installed WITHOUT sudo so the
      # runner's passworded-sudo restriction cannot skip the gate. The byte-exact
      # regeneration drift guard requires this precise version.
      - name: Install pinned protoc (no sudo)
        env:
          PROTOC_VERSION: "34.1"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL "$url" -o /tmp/protoc.zip
          unzip -o -q /tmp/protoc.zip -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version
      # protoc-gen-go / protoc-gen-go-grpc are pinned by the Makefile's `proto-tools`
      # target (protoc-gen-go built from go.mod, go-grpc pinned to v1.5.1) so the
      # regenerated Go bindings match the committed ones byte-for-byte.
      - name: Build pinned proto codegen toolchain
        run: make proto-tools
      # Elixir codegen + the golden test need project deps and the pinned
      # protoc-gen-elixir escript. Without deps.get, `mix format`/`mix test` fail
      # before the drift guard even runs.
      - name: Fetch Elixir deps
        working-directory: elixir/serviceradar_core
        run: mix deps.get
      - name: Buf lint (incl. proto/edge/v1)
        run: make proto-lint
      - name: Go binding regeneration drift guard
        run: make verify-proto-go
      - name: Elixir binding regeneration drift guard
        run: make verify-proto-elixir
      - name: Edge ABI golden parity (Go)
        run: go test ./proto/edge/v1/... ./go/pkg/edge/edgerecord/... ./go/pkg/edge/execstate/...
      - name: Edge ABI golden parity (Elixir cross-language)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/proto/edge_v1_golden_test.exs
      # The stacked PRs in this series are based on each other, NOT on `staging`, so the
      # general Elixir Quality workflow (filtered to base=staging) never runs for them.
      # The wire-parity proof must therefore be a REQUIRED status in this stack-aware job.
      - name: Edge wire-hygiene parity (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/wire_validate_test.exs
      - name: Edge enum parity (Elixir semantic validation)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/semantic_validate_test.exs
      # The Elixir RELATIONAL validator. Its whole purpose is Go parity, so like the
      # wire/semantic suites above it must be a REQUIRED status here: the general Elixir
      # Quality workflow is filtered to base=staging and never runs for this stack, and
      # it does not run tests at all.
      - name: Edge recovery relational parity (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/recovery_validate_test.exs
      # The compiled-assignment CARRIER validator, for the same reason: it exists to match Go
      # on a frozen contract, and a parity suite that no required job runs proves nothing about
      # what CI accepts. It was written and reported green locally while this job kept running
      # 142 tests -- the suite was invisible to the gate it was supposed to be gated by.
      - name: Edge compiled-assignment carrier parity (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/compiled_assignment_validate_test.exs
      # The claim-variant freeze, pinned against GENERATED oneof metadata. Gated because it
      # is the only place a proto-side variant addition fails loudly; every gate that asks
      # "is this a claim body?" shares the predicate it guards.
      - name: Edge capability claim variants (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/capability_claims_test.exs
      # The sweep BODY ingress stage (task 1.2-c). Gated because its ceiling is the
      # EXTRACTED-BODY work bound, not the record's physical 512 KiB: a compressed payload
      # may legitimately expand past that, and a wrong bound here permanently rejects valid
      # records rather than failing loudly.
      - name: Edge sweep body decode (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/sweep_batch_decode_test.exs
      # The sweep CORRELATION peer: the Elixir half of the matrix. Gated because the
      # (label, gate) PAIR is only proven if BOTH runtimes assert it, and a peer no
      # required job runs proves nothing about what CI accepts.
      - name: Edge sweep correlation peer (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/sweep_correlate_test.exs
      # The sweep CORRELATION MATRIX inventory. Gated because an inventory is the only thing
      # that shows the mapping is TOTAL, INJECTIVE, and free of the two unreachable kinds --
      # vectors sample, so a vector-only gate cannot establish absence. It also pins the
      # fifteen portable labels, which is what makes cross-runtime reason parity checkable.
      - name: Edge sweep correlation matrix inventory (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/sweep_matrix_test.exs
      # The HOST execution-grant validator, gated for the same reason as the carrier: a parity
      # suite no required job runs proves nothing about what CI accepts.
      - name: Edge execution-grant parity (Elixir)
        working-directory: elixir/serviceradar_core
        run: mix test --no-start test/serviceradar/edge/execution_grant_validate_test.exs
      # Fixture test for the post-generation transform itself: proves it is idempotent and
      # fails closed on inventory / generator-version / partial-patch drift.
      - name: Edge enum transform fail-closed fixture
        run: elixir scripts/test_patch_edge_enum_negatives.exs
