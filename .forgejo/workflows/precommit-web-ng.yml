name: web-ng Precommit

# //elixir/web-ng:precommit runs `mix precommit_fast` against a staged copy of the tree.
#
# There is no Setup Beam and no Setup Rust here on purpose. The work happens in a
# mix_precommit action (//build:mix_precommit.bzl) that takes OTP and Elixir from
# @rules_elixir and cargo/rustc from @rules_rust, so Bazel supplies every toolchain and this
# runner needs none of them installed. It needs no database either.
#
# It is also a build ACTION rather than a test, which is what makes it cacheable: an
# unchanged tree is a remote cache hit instead of a full Elixir + NIF rebuild. `precommit` is
# a skylib build_test over it, so `bazel test //elixir/web-ng:precommit` still gates.
#
# Its own workflow because it fails for its own reasons -- an Elixir compile error, a credo
# finding, or a NIF build break -- and because it should not sit in series behind the Rust
# test sweep in main.yml, which it does not depend on in any way.
on:
  push:
    branches: [staging]
    paths: &precommit_paths
      - 'elixir/**'
      - 'rust/anomaly-core/**'
      - 'rust/anomaly-disposition/**'
      - 'rust/kvutil/**'
      - 'rust/srql/**'
      - 'proto/**'
      - 'addons/*/addon.yaml'
      - 'build/mix_release_patches.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.tool-versions'
      - '.bazelrc'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.forgejo/workflows/precommit-web-ng.yml'
      - 'scripts/ci/ensure-forgejo-tools.sh'
      - 'scripts/ci/install-sfw.sh'
  pull_request:
    branches: [staging]
    paths: *precommit_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precommit:
    name: web-ng precommit
    runs-on: ubuntu24
    env:
      ImageOS: ubuntu24
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Socket Firewall
        run: bash scripts/ci/install-sfw.sh

      - name: Cache Bazel artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install dependencies
        run: ./scripts/ci/ensure-forgejo-tools.sh bazel-build

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          echo "Expected Bazel: ${expected}"
          echo "Resolved Bazel: ${actual}"
          test "${actual}" = "${expected}"

      # --config=ci is what sends the precommit action to the executors and lets an
      # unchanged tree resolve as a remote cache hit. It also gives a BES invocation link
      # when it fails, which is the whole diagnostic surface for a remote run.
      - name: Configure remote cache
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=ci cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote

      - name: Run precommit
        run: bazel test --config=ci //elixir/web-ng:precommit

      # mix_precommit tees everything into precommit.log, so the failure is explicable
      # from the action output even though it ran on an executor.
      - name: Dump precommit log
        if: ${{ failure() }}
        run: |
          set +e

          log="$(bazel cquery --config=ci //elixir/web-ng:precommit_check --output=files 2>/dev/null | tail -n 1)"
          if [ -n "${log}" ] && [ -f "${log}" ]; then
            echo "===== ${log} ====="
            sed -n '1,600p' "${log}"
          else
            echo "precommit.log not produced; the action failed before writing it"
          fi

          find bazel-testlogs/elixir/web-ng -type f -name test.log 2>/dev/null | sort | while read -r file; do
            echo "===== ${file} ====="
            sed -n '1,200p' "${file}"
          done

          exit 0
