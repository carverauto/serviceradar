namespace: demo

# Pod topology spread constraints.
# When enabled, the scheduler distributes replicas of each workload across nodes.
topologySpread:
  enabled: false
  # maxSkew: 1
  # topologyKey: kubernetes.io/hostname
  # whenUnsatisfiable: ScheduleAnyway

podDisruptionBudgets:
  # Protect the remote-access control plane during voluntary disruptions such
  # as node drains. Disable only for tiny lab clusters where PDBs would block
  # maintenance.
  enabled: true
  minAvailable: 1

# Global settings that apply across all services
global:
  # Override all ServiceRadar image tags at once. Leave empty to track the
  # chart appVersion, which is almost always what you want -- the chart and the
  # application it deploys are released together. Set a sha-* tag or use
  # image.digests.* for production rollouts needing immutable references.
  imageTag: ""
  # The ServiceRadar RELEASE this deployment corresponds to, as a `v<semver>`
  # tag. Distinct from imageTag on purpose: web-ng resolves plugin and native
  # add-on assets from the GitHub release with this name, and shows it in the
  # product status UI. Immutable rollouts set imageTag to a `sha-<gitsha>`, and
  # no release is ever named that, so the two cannot share one value.
  # Empty means "use the chart appVersion", which is what you want unless you are
  # deliberately pulling add-ons from a different release than the chart.
  releaseVersion: ""
  # Image pull policy: IfNotPresent (default), Always (for staging/mutable tags), Never
  imagePullPolicy: IfNotPresent
  # When true, stamp the pod template with a Helm-managed revision so a normal
  # `helm upgrade` rolls mutable-tag workloads and pulls fresh images.
  forceRolloutOnUpgrade: false
  storage:
    # StorageClass used for durable data that may contain remote-access
    # recordings, object-store payloads, database rows, credentials, or audit
    # material. Production clusters should provide this class with encryption
    # at rest enabled by the underlying CSI/storage backend.
    encryptedStorageClassName: "encrypted"
    # Set true only for local/lab clusters where the encrypted class does not
    # exist. When false, durable storage templates default to
    # encryptedStorageClassName instead of silently inheriting the cluster
    # default StorageClass.
    allowInsecureStorage: false

image:
  # Base registry/repository prefix for first-party ServiceRadar images.
  # Override with ghcr.io/carverauto to pull published GHCR images.
  registry: registry.carverauto.dev/serviceradar
  registryPullSecret: registry-carverauto-dev-cred
  tags:
    # Default tag for first-party ServiceRadar images. Empty means "use the
    # chart appVersion" (see serviceradar.imageTag). Do not hardcode a version
    # here: it silently decouples the images from the chart that ships them.
    appTag: &appTag ""
    core: *appTag
    webNg: *appTag
    nats: "2.14.0-alpine"
    datasvc: *appTag
    agent: *appTag
    agentGateway: *appTag
    logCollector: *appTag
    # Deprecated: otel and flowgger are now merged into logCollector
    otel: *appTag
    trapd: *appTag
    flowgger: *appTag
    flowCollector: *appTag
    bmpCollector: *appTag
    rperfClient: *appTag
    faker: *appTag
    rperfChecker: *appTag
    tools: *appTag
    trivySidecar: *appTag
    k8sInventory: *appTag
  # Optional per-service digest pins. Keys match image.tags service names
  # (core, webNg, agent, agentGateway, datasvc, tools, etc.). Values can be
  # either "sha256:..." or "@sha256:..."; when set they override tags.
  digests: {}

argocdImageUpdater:
  pullSecretReader:
    enabled: false
    namespace: argocd
    serviceAccountName: argocd-image-updater-controller

tools:
  enabled: true

trivySidecar:
  enabled: false
  replicaCount: 1
  clusterId: ""
  nats:
    hostPort: "tls://serviceradar-nats:4222"
    subjectPrefix: "trivy.report"
    stream: "trivy_reports"
    caCertFile: "/etc/serviceradar/certs/ca.crt"
    certFile: "/etc/serviceradar/certs/trivy-sidecar.pem"
    keyFile: "/etc/serviceradar/certs/trivy-sidecar-key.pem"
    serverName: "serviceradar-nats"
  metrics:
    addr: ":9108"
    port: 9108
  publish:
    maxRetries: 5
    timeout: "5s"
    retryDelay: "500ms"
  informer:
    resync: "5m"
  reportGroupVersion: "aquasecurity.github.io/v1alpha1"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Optional cluster-plane public endpoint / VIP ownership inventory.
# Does NOT grant kube API access to host agents. See openspec change
# add-k8s-public-endpoint-inventory and go/pkg/k8sinventory.
k8sInventory:
  enabled: false
  replicaCount: 1
  clusterId: ""
  # nats | stdout | none — use stdout for local debug without JetStream
  publishMode: nats
  namespaces: []
  gatewayAPI:
    enabled: true
  nodes:
    # Watch Kubernetes Nodes (Ready condition) and publish inventory.k8s.nodes.
    # Absent means enabled. Set enabled: false to drop Nodes RBAC.
    enabled: true
  envoyProxyCRD:
    enabled: false
  nats:
    hostPort: "tls://serviceradar-nats:4222"
    subject: "inventory.k8s.public_endpoints"
    stream: "k8s_inventory"
    caCertFile: "/etc/serviceradar/certs/ca.crt"
    certFile: "/etc/serviceradar/certs/k8s-inventory.pem"
    keyFile: "/etc/serviceradar/certs/k8s-inventory-key.pem"
    serverName: "serviceradar-nats"
  metrics:
    addr: ":9109"
    port: 9109
  publish:
    maxRetries: 5
    timeout: "5s"
    retryDelay: "500ms"
  resync:
    period: "5m"
    debounce: "2s"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kv:
  enabled: true
  configSource: file
  bucket: serviceradar-datasvc
  address: serviceradar-datasvc:50057
  secMode: mtls
  trustDomain: ""
  serverSPIFFEID: ""
  workloadSocket: unix:/run/spire/sockets/agent.sock
  certDir: /etc/serviceradar/certs
natsCreds:
  # Inline NATS .creds files for platform/system accounts.
  # When set, these are stored in the serviceradar-nats-creds Secret.
  autoGenerate: true
  platform: ""
  system: ""
  operator: ""
# Partition identity for this ServiceRadar deployment (B-5 sub-issue 2).
#
# ServiceRadar is one deployment per partition (see
# elixir/serviceradar_core/CLAUDE.md "Instance Isolation Model"). The
# value below is rendered into:
#   * the NATS authorization block (templates/nats.yaml) — the
#     core/datasvc/agent roles get the deployment partition context used by
#     runtime services and ACL comments. Attributed-flow DB writes no longer
#     depend on a `flow.attributed.*` NATS read-back stream.
#   * `SERVICERADAR_OTX_PARTITION` env on core/datasvc workloads so the
#     runtime side (elixir/serviceradar_core/config/runtime.exs) stays
#     consistent with what the NATS ACL was rendered against.
#
# Precedence (resolved in nats.yaml / core.yaml via `coalesce`):
#   1. .Values.partitionId (this field)
#   2. .Values.agent.partitionId
#   3. literal "default"
# Leaving this empty falls through to agent.partitionId, preserving the
# established `--set agent.partitionId=prod-east` release API. Set this
# field explicitly when deploying multiple partitions to the same
# Kubernetes cluster.
partitionId: ""

nats:
  replicas: 3
  clusterName: "serviceradar"
  jetstream:
    maxMemoryStore: 1G
    # Decimal G (10^9). 30G ≈ 27.9 GiB usable for JetStream file store on the
    # default 30Gi PVC (binary). volumeClaimTemplates are immutable — do not
    # raise persistence.size via Helm on a live StatefulSet; expand PVCs
    # out-of-band first if you need larger stream reservations.
    # Capacity-safe R=3 budget (binary GiB): KV 4 + objects 10 + events 2 + flows 10
    # = 26 GiB < 30G maxFileStore. Raising flows above 10 GiB requires PVC expand.
    maxFileStore: 30G
  persistence:
    # Immutable after first install for this StatefulSet. Keep stable defaults.
    size: 30Gi
    storageClassName: ""
certs:
  runtimeSecretName: serviceradar-runtime-certs
  # Empty preserves the self-managed single-Secret bootstrap. Hosted values
  # set distinct pre-created Secrets so CA signing keys never enter the general
  # runtime Secret.
  issuerSecretName: ""
  cnpgIssuerSecretName: ""
  runtimeLayoutVersion: "4"
  # Non-secret rollout token. Hosted rotation supplies a SHA-256 revision so
  # all certificate consumers restart onto the reconciled Secret generation.
  runtimeRevision: initial
  generator:
    # Self-managed installs bootstrap their runtime Secret in-cluster. Hosted
    # runtimes always disable this path and receive a control-plane-managed
    # Secret before Helm installs the workloads.
    enabled: true
  regenerator:
    # Disable by default to avoid unexpected cert rotation.
    enabled: false
checkerTemplates:
  # KV-backed checker template seeding is deprecated; leave disabled.
  enabled: false
# OpenTelemetry exporter configuration for Elixir services (core-elx, web-ng, agent-gateway).
# Points to the OTEL collector deployed in the same namespace.
otelExporter:
  enabled: true
  # OTLP/gRPC endpoint (uses the unified log-collector service)
  endpoint: "https://serviceradar-log-collector:4317"
  # TLS certificate directory (SPIFFE-issued certs)
  certDir: "/etc/serviceradar/certs"
  # Trace sampling ratio (0.0 - 1.0). 1.0 = sample everything.
  samplingRatio: "1.0"

prometheusRules:
  cnpg:
    enabled: false
    clusterName: cnpg
    labels: {}
    backendsWaitingWarning: 5
    slowQueryLogThresholdMs: 500

observability:
  enabled: false
  prometheus:
    serviceMonitors:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      targets:
        webNg:
          enabled: true
          path: /metrics
        core:
          enabled: true
          path: /metrics
        agentGateway:
          enabled: true
          path: /metrics
        flowCollector:
          enabled: true
          path: /metrics
    rules:
      enabled: true
      labels: {}
      pgbouncer:
        clientsWaitingWarning: 1
        maxWaitSecondsWarning: 5
      webNg:
        scrapeDownFor: 5m
        restartWindow: 15m
        restartWarning: 1
      core:
        scrapeDownFor: 5m
      agentGateway:
        scrapeDownFor: 5m
        resultsBufferDroppedWindow: 5m
        resultsBufferDroppedFor: 1m
  grafana:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      annotations: {}
      folder: ServiceRadar

core:
  replicas: 3
  # KV watch/reload is no longer supported for service configuration.
  configWatchEnabled: false
  clusterStrategy: "dns"
  clusterWebService: "serviceradar-web-ng-headless"
  clusterWebDnsQuery: ""
  clusterWebNodeBasename: "serviceradar_web_ng"
  clusterGatewayService: "serviceradar-agent-gateway-headless"
  clusterGatewayDnsQuery: ""
  clusterGatewayNodeBasename: "serviceradar_agent_gateway"
  kubernetesSelector: "app=serviceradar-core"
  kubernetesNodeBasename: "serviceradar_core"
  ashObanSchedulerEnabled: true
  logPromotionConsumerEnabled: true
  # Outbound mail for the native email notification transport and the auth
  # senders (confirmation, password reset).
  #
  # Left empty the mailer resolves to Swoosh.Adapters.Test, which accepts every
  # message, reports success, and delivers nothing. That is deliberately NOT a
  # working default: an email notification channel refuses to validate while it
  # is in that state, so the failure surfaces when an operator saves the channel
  # instead of during the incident the channel was supposed to page for.
  #
  # Setting `relay` is enough - a relay host selects the SMTP adapter.
  mailer:
    # "smtp", "local", "sendgrid", ... Leave empty to infer SMTP from `relay`.
    adapter: ""
    relay: ""
    port: 587
    # HELO/EHLO name this deployment announces; empty lets the relay decide.
    hostname: ""
    # always | never | if_available
    auth: "if_available"
    tls: "if_available"
    # Implicit TLS (port 465). STARTTLS is `tls`, above.
    ssl: false
    from:
      name: "ServiceRadar"
      email: "noreply@serviceradar.cloud"
    # Relay credentials are read from an existing Secret and are never values:
    # a password here ends up in the rendered manifest, in `helm get values`,
    # and in whatever GitOps repository holds this file. Create the Secret with
    # the two keys below and name it here.
    existingSecret: ""
    usernameKey: "smtp-username"
    passwordKey: "smtp-password"
  # Core-owned advisory vulnerability feed ingestion (CISA KEV, VulnCheck KEV,
  # VulnCheck nist-nvd2, NVD CVE 2.0, Ubuntu OSV + OpenVEX). Feeds are AshOban-scheduled in core,
  # disk-staged on a PVC, and bulk-loaded into CNPG — no agent involvement.
  # See openspec/changes/refactor-advisory-feeds-into-core.
  advisoryFeeds:
    # Master switch: mounts the staging PVC and enables the feed scheduler.
    # Off by default until the PVC exists; on in demo (see values-demo.yaml).
    enabled: false
    # Sub-gate for the large nist-nvd2 (full NVD CPE) load; KEV enrichment runs
    # independently when this is false.
    nistNvd2Enabled: false
    # Persistent staging volume (download.zip + extracted *.json.gz shards).
    # Set emptyDir: true on multi-replica cores that cannot share an RWO PVC.
    emptyDir: false
    stagingDir: "/var/lib/serviceradar/advisory-feeds"
    size: "5Gi"
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
    existingClaim: ""
  mtrAutomation:
    enabled: false
    baselineEnabled: false
    triggerEnabled: false
    consensusEnabled: false
    baselineTickMs: 60000
    consensusCohortRetentionMs: 300000
  # Initial MTR history retention in days (1-395) for a fresh database. After
  # bootstrap, change the persisted policy in Settings -> Networks -> MTR.
  mtrRetentionDays: 30
  observabilityRetention:
    # High-volume raw tables. Retention is reconciled at runtime and by the
    # migration job on upgrade; chunk intervals affect newly-created Timescale
    # chunks and should stay smaller than the retention window.
    traceSummaryDays: 3
    otelTracesDays: 3
    logsDays: 30
    ocsfNetworkActivityDays: 90
    # Raw netprobe-to-process attribution observations are hot staging data used
    # to correlate delayed NetFlow/IPFIX rows. Lower this to discard unmatched
    # raw observations quickly; keep it at least 15 minutes.
    flowAttributionMinutes: 60
    otelTracesChunkIntervalHours: 6
    logsChunkIntervalHours: 24
    ocsfNetworkActivityChunkIntervalHours: 24
    batchSize: 50000
    cron: "17 3 * * *"
    sweepHostResultDays: 7
    sweepExecutionDays: 30
    trivyDays: 30
    endpointInventoryDays: 30
    # Provider CIDR snapshots are ~410k rows. Keep the active copy plus one
    # inactive rollback; drop the rest instead of accumulating two weeks.
    datasetSnapshotDays: 2
    datasetSnapshotKeepLast: 1
    topologyLinkDays: 30
  # Ansible integration: AWX/AAP playbook execution + observability.
  # Per-controller / per-repository / per-schedule overrides are stored
  # on the Ash resources themselves (e.g. AnsibleController.run_pulse_interval_ms);
  # the values below are the deployment-wide defaults.
  ansible:
    # Days of run-detail retention (PlaybookPlay / PlaybookTask /
    # PlaybookTaskResult rows). Set to 0 to disable detail pruning.
    runDetailDays: 90
    # Days of run-summary retention. Empty / 0 means keep forever.
    runSummaryDays: ""
    # How often RetentionWorker scans for prunable runs.
    retentionIntervalSeconds: 86400
    # AWX controller health probe cadence.
    controllerHealthIntervalSeconds: 30
    # RunWatchdog interval (flags stuck non-terminal runs).
    runWatchdogIntervalSeconds: 60
    # ScheduleEvaluatorWorker cron evaluation cadence.
    scheduleEvaluatorIntervalSeconds: 60
    # Writable emptyDir for GitCatalogSyncWorker repo clones. Catalog metadata
    # is stored in CNPG; clones are recreated after pod replacement.
    catalogBaseDir: "/var/lib/serviceradar/ansible_catalog"
  # EventWriter persists NATS JetStream records (incl. edge anomaly verdicts on
  # signals.analytics.predictions.*) into CNPG. On by default so anomaly findings
  # and alerts surface; set enabled=false only to disable verdict persistence.
  eventWriter:
    enabled: true
  # First-boot defaults for CNPG-backed anomaly detection settings (seed the
  # singleton config row when missing; do not overwrite operator edits).
  anomalyDetectionConfig:
    nSigma: 3.0
    windowSize: 300
    windowDurationSeconds: 900
    confirmSlots: 5
    minSamples: 30
    metricDenylist:
      - cpu.frequency_hz
    emission:
      cooldown_secs: 300
      budget_per_tick: 100
      episode_update_interval_secs: 1800
      reopen_cooldown_secs: 600
    metricClassOverrides:
      cpu:
        drift_mode: deseasonalized_only
      memory:
        drift_mode: deseasonalized_only
      interface:
        drift_mode: deseasonalized_only
      disk:
        # Keep "off" quoted: drift_mode is a schema string, while YAML 1.1
        # parses an unquoted off as boolean false.
        drift_mode: "off"
      icmp:
        drift_mode: "off"
      other:
        drift_mode: "off"
      red: {}
  # First-boot defaults for CNPG-backed capacity forecast settings. These seed
  # the singleton config row when missing and do not overwrite operator edits.
  capacityForecasting:
    enabled: true
    cron: "41 * * * *"
    emitVerdicts: true
    horizonSeconds: 7776000
    warningHorizonSeconds: 2592000
    minPoints: 72
    seasonalPeriod: 24
  capacityForecastConfig:
    forecastHorizonSeconds: 7776000
    warningHorizonSeconds: 2592000
    warningThresholdPercent: 80.0
    model: "linear"
    minimumHistoryPoints: 72
    metricClassOverrides:
      interface: {}
      cpu: {}
      memory: {}
      disk: {}
      flow: {}
  # Optional first-party native add-on package seed refs. The release/native
  # add-on import path populates these with per-platform signed artifact refs.
  # Without artifacts, the package seeder stages the manifest version but does
  # not approve assignment.
  netprobeAddon:
    version: ""
    ociRef: ""
    ociDigest: ""
    artifacts: {}
  workloadIdentityAddon:
    version: ""
    ociRef: ""
    ociDigest: ""
    artifacts: {}
  endpointInventoryAddon:
    version: ""
    ociRef: ""
    ociDigest: ""
    artifacts: {}
  # Resource requests/limits for core-elx.
  # Demo steady-state is ~1.4–1.5Gi RSS; the previous template-only default of
  # 4Gi limit OOMKills under load (demo runs 2Gi/16Gi). 8Gi is a safer chart
  # default for single-tenant installs; use values-demo for full demo headroom.
  resources:
    limits:
      cpu: "4"
      memory: "8Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  # Extra environment variables for the core-elx pod.
  # Prefix-tag flow enrichment (requires migration 20260718010000 first):
  #   SERVICERADAR_PREFIX_TAG_ENRICHMENT_ENABLED: "true"
  #   SERVICERADAR_PREFIX_TAG_PROVIDER_TRIE_ENABLED: "true"
  #   SERVICERADAR_THREAT_INTEL_ENGINE_MATCH_ENABLED: "true"
  #   SERVICERADAR_GEO_TAG_DERIVATION_ENABLED: "false"
  #   SERVICERADAR_PREFIX_TAGS_LOADER_ENABLED: "true"
  # FQDN-allowlist CONNECT proxy (Smokescreen). Finch uses this for every
  # outbound HTTPS fetch (advisory feeds, GeoLite, OTX, …). Pair it with a
  # default-deny egress NetworkPolicy that admits only that Service:
  #   SERVICERADAR_EGRESS_PROXY: "http://smokescreen.egress.svc.cluster.local:4750"
  extraEnv: {}
  # Extra environment variables sourced from Kubernetes secrets/configmaps.
  # OpenBao providers can also use Kubernetes auth with the pod service account
  # token, so a static OPENBAO_TOKEN secret is optional when that auth mode is
  # configured in the provider metadata and pre-authorized by the OpenBao
  # operators.
  # Example:
  # extraEnvValueFrom:
  #   OPENBAO_TOKEN:
  #     secretKeyRef:
  #       name: openbao-serviceradar-token
  #       key: token
  #       optional: true
  extraEnvValueFrom: {}
  database:
    poolSize: 40
    queueTargetMs: 2000
    queueIntervalMs: 2000
    timeoutMs: 120000
    poolTimeoutMs: 120000
  controlDatabase:
    enabled: true
    poolSize: 10
    queueTargetMs: 2000
    queueIntervalMs: 2000
    timeoutMs: 120000
    poolTimeoutMs: 120000
  # Notification platform (openspec add-notification-platform).
  notifications:
    # Which serviceradar-agent runs `:control_plane` wasm notification plugins.
    # There is exactly one Wasm host in the product - wazero inside the agent -
    # so a platform-egress plugin notification is dispatched to the agent this
    # chart already deploys, through the same plugin.run_action command an edge
    # dispatch uses. Left empty, both fields fall back to `agent.agentId` and
    # the deployment partition. Set them only when the platform-resident agent
    # lives outside this release; with `agent.enabled: false` and no override,
    # nothing is configured and a :control_plane plugin channel fails with
    # `platform_agent_unconfigured` rather than dispatching somewhere arbitrary.
    platformAgent:
      agentId: ""
      partitionId: ""
    # The bounded sweep that closes out an agent-routed delivery whose command
    # result never came back. It reads only what core itself wrote, so it does
    # not depend on STATUS_HANDLER_ENABLED. Disabling it leaves those rows to
    # the blind stall sweep, which re-sends rather than settling.
    receiptSweep:
      enabled: true
  obanQueues:
    default: 10
    maintenance: 5
    monitoring: 5
    alerts: 5
    serviceChecks: 10
    notifications: 5
    onboarding: 3
    events: 10
    sweeps: 20
    edge: 10
    integrations: 5
    natsAccounts: 3
  syncIngestor:
    batchConcurrency: 2
    coalesceMs: 250
    maxInflight: 2
    queueMaxChunks: 10
    async: true
  deviceEnrichment:
    rulesDir: "/var/lib/serviceradar/rules/device-enrichment"
    filesystemOverrides:
      enabled: false
      existingConfigMap: ""
      existingSecret: ""
      existingClaim: ""
  migrations:
    enabled: true
    # Defaults to global.imagePullPolicy when unset.
    imagePullPolicy: ""
    podAnnotations: {}
    markerPath: /var/lib/serviceradar/migrations/complete
    # Newest migration timestamp this chart revision ships, used by the
    # `wait-migrations` init container to prove the schema is CURRENT rather
    # than merely present. Kept in sync with
    # elixir/serviceradar_core/priv/repo/migrations by
    # //helm/serviceradar:migrations_expected_version_test -- do not hand-edit;
    # the gate will tell you the value to use.
    #
    # Set to "" to fall back to the old existence-only check (for operators
    # running the chart against a deliberately pinned schema).
    expectedVersion: "20260908180200"
  # Stale device reaper settings - controls cleanup of IP-only "ghost" devices
  reaper:
    # How often to run the reaper job
    interval: "1h"
    # How long a device without strong identity (IP-only) must be unseen before deletion
    ttl: "24h"
  identity:
    enabled: true
    # Enable promotion so sightings are turned into devices automatically.
    sightingsOnlyMode: true
    promotion:
      enabled: false
      shadowMode: false
      minPersistence: "1h"
      requireHostname: true
      requireFingerprint: false
    fingerprinting:
      enabled: false
      portBudget: 32
      timeout: "2s"
    reaper:
      interval: "1m"
      profiles:
        default:
          ttl: "24h"
        dynamic:
          ttl: "6h"
        guest:
          ttl: "1h"
        static:
          ttl: "72h"
          allowIPAsID: false
    drift:
      baselineDevices: 50000
      tolerancePercent: 2
      pauseOnDrift: true
      alertOnDrift: true
faker:
  enabled: false
  gobgp:
    # When enabled, an initContainer copies gobgpd/gobgp binaries into a shared volume
    # mounted into the faker container.
    enabled: false
    image:
      repository: docker.io/osrg/gobgp
      tag: latest
      pullPolicy: IfNotPresent
    binDir: /opt/gobgp
  simulation:
    totalDevices: 50000
    ipShuffle:
      enabled: true
      interval: "10m"
      percentage: 5
      warmupCycles: 2
      allowExpansion: false
      poolHeadroomPercent: 0
    bgp:
      enabled: false
      seed: 40164200
      publishInterval: "15s"
      outageInterval: "2m"
      outageDurationMin: "20s"
      outageDurationMax: "45s"
      manageDaemon: true
      gobgpApiAddress: "127.0.0.1:50051"
      gobgpBinary: "gobgpd"
      gobgpCliBinary: "gobgp"
      bmpCollectorAddress: "serviceradar-bmp-collector:11019"
      routerId: "204.209.51.59"
      maxPrefixesPerTick: 3
      localAsn: 401642
      advertisedPrefixes:
        - "23.138.124.0/24"
        - "2602:f678::/48"
      peers:
        - name: "k8s-cp1-control"
          ip: "10.0.2.2"
          peer_asn: 401642
          description: "k8s-cp1-control"
        - name: "k8s-cp2-control"
          ip: "10.0.2.3"
