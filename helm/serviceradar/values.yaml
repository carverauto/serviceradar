    port: 50051
  bgp:
    localAsn: 401642
    routerId: "204.209.51.59"
    listenPort: 179
  bmp:
    address: "serviceradar-bmp-collector"
    port: 11019
  # By default we reuse faker BGP peers to keep topology aligned.
  peers: []
  podAnnotations: {}
  nodeSelector: {}
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: ClusterIP
    annotations: {}
