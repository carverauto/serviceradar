# High-availability overlay for production-like ServiceRadar installs.
#
# Usage (no repository checkout needed; this overlay ships inside the chart):
#   helm pull oci://registry.carverauto.dev/serviceradar/charts/serviceradar \
#     --version <chart-version> --untar --untardir serviceradar-<chart-version>
#   helm upgrade --install serviceradar oci://registry.carverauto.dev/serviceradar/charts/serviceradar \
#     --version <chart-version> \
#     -n <namespace> --create-namespace \
#     -f serviceradar-<chart-version>/serviceradar/values-ha.yaml \
#     -f my-values.yaml
#
# List your own values file last so its site overrides win.
#
# This mirrors the demo namespace control-plane shape without carrying
# demo-specific hostnames, MetalLB addresses, or sample-data services.

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nats:
  replicas: 3

# Avoid scaling workloads with shared ReadWriteOnce volumes by default. Enable
# this in an environment-specific values file only when existingClaim or
# storageClassName points at RWX-capable storage, and set accessModes to
# ReadWriteMany for newly created claims.
geoipMmdb:
  enabled: false

cnpg:
  pooler:
    enabled: true
    instances: 3
    monitoring:
      podMonitor:
        enabled: true
    route:
      core: true
      webNg: true
    parameters:
      ignore_startup_parameters: "search_path"
      max_client_conn: "2000"
      default_pool_size: "40"
      reserve_pool_size: "10"
      reserve_pool_timeout: "5"

webNg:
  replicas: 3
  database:
    poolSize: 8
  pluginStorage:
    enabled: true
    backend: "jetstream"
    jetstreamReplicas: 3

core:
  replicas: 3
  database:
    poolSize: 10
  controlDatabase:
    enabled: true
    poolSize: 3
  obanQueues:
    default: 2
    maintenance: 1

agentGateway:
  replicas: 3

# HA Dgraph: 3 Zero, 3 Alpha, RF=3. TLS between nodes (internal-port).
dgraph:
  enabled: true
  zero:
    replicaCount: 3
    shardReplicaCount: 3
    antiAffinity: soft
    persistence:
      enabled: true
      size: 16Gi
    tls:
      enabled: true
      files: {}
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    customLivenessProbe:
      httpGet:
        path: /health
        port: 6080
        scheme: HTTPS
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    customReadinessProbe:
      httpGet:
        path: /state
        port: 6080
        scheme: HTTPS
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    extraFlags: >-
      --tls "ca-cert=/dgraph/tls/ca.crt; server-cert=/dgraph/tls/tls.crt;
      server-key=/dgraph/tls/tls.key; client-cert=/dgraph/tls/tls.crt;
      client-key=/dgraph/tls/tls.key; internal-port=true"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  alpha:
    replicaCount: 3
    antiAffinity: soft
    persistence:
      enabled: true
      size: 32Gi
    extraFlags: >-
      --tls "ca-cert=/dgraph/tls/ca.crt; server-cert=/dgraph/tls/tls.crt;
      server-key=/dgraph/tls/tls.key; client-cert=/dgraph/tls/tls.crt;
      client-key=/dgraph/tls/tls.key; internal-port=true"
      --acl "secret-file=/dgraph/acl/hmac_secret_file"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi

datasvc:
  replicaCount: 3
  jetstreamReplicas: 3
  data:
    enabled: false

logCollector:
  replicaCount: 3
  streamReplicas: 3
  data:
    enabled: false
  tcpCollector:
    enabled: true
    replicaCount: 3
    streamReplicas: 3

trapd:
  replicaCount: 3
  streamReplicas: 3

# Flow/IPFIX template state is process-local, so keep this single-replica even
# in the HA overlay until exporter sharding or shared template state lands.
flowCollector:
  replicaCount: 1
  # HA is config.stream_replicas only (serialized into flow-collector.json).
  config:
    stream_replicas: 3
    rehome_state_path: "/var/lib/serviceradar/flow-collector-rehome.json"
  # Rehome marker + ready file must survive pod replacement during cutover.
  data:
    enabled: true
    size: 1Gi
