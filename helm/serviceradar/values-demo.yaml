# Demo Environment Values
# Consumed by ArgoCD via Helm `valueFiles`.

namespace: demo

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

global:
  # Demo uses an immutable ServiceRadar image tag so Kyverno can verify
  # signatures without requiring digest-pinned user-facing values.
  imageTag: "sha-217d693de66908133302bffea9a1091b03e45d87"
  imagePullPolicy: Always
  forceRolloutOnUpgrade: true
  storage:
    # The demo k3s cluster uses local-path storage. Keep this override explicit
    # so production installs fail closed unless an encrypted class is supplied.
    allowInsecureStorage: true

image:
  registryPullSecret: registry-carverauto-dev-cred

argocdImageUpdater:
  pullSecretReader:
    enabled: true
    namespace: argocd
    serviceAccountName: argocd-image-updater-controller

tools:
  enabled: true

trivySidecar:
  enabled: true
  clusterId: demo

# Public VIP ownership inventory (cluster-plane only; host agents stay without kube API).
# Image must exist as serviceradar-k8s-inventory before the Deployment becomes Ready.
k8sInventory:
  enabled: true
  clusterId: demo
  gatewayAPI:
    enabled: true
  # MetalLB + Envoy Gateway demo; CRD optional for ownership (Service status is enough).
  envoyProxyCRD:
    enabled: false

natsCreds:
  autoGenerate: true

cnpg:
  # THE CLUSTER-INTERNAL DIRECT ENDPOINT. NOT the one most demo workloads use -- see
  # `pooler.host` below, and read both before changing either.
  #
  # There are TWO internal endpoints, and `serviceradar.cnpgWorkloadHost` picks between them per
  # workload: the pooler when `pooler.enabled` and `pooler.route.<workload>` are set, this one
  # otherwise. Verified live, and it is the pooler that answers for the services:
  #
  #   kubectl get deploy serviceradar-core -n demo \
  #     -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="CNPG_HOST")].value}'
  #   -> cnpg-pooler-rw.demo.svc.cluster.local
  #
  # This direct host is what migrations, bootstrap, DDL and any client that is not
  # transaction-pooler safe connect to.
  #
  # Equal to what the chart already derives -- `serviceradar.cnpgDirectHost` falls back to
  # `<clusterName>-rw.<namespace>.svc.cluster.local` when `host` is empty -- so this changes no
  # behaviour. It is stated because an endpoint that exists only as an empty string plus a
  # template is not reviewable: you cannot grep the overlay to learn where demo's database
  # traffic goes, and "" reads as "unset" rather than "derived".
  #
  # The namespace is a literal, which is safe here and only here: the Argo CD Application
  # serviceradar-demo-prod pins values-demo.yaml to `demo`
  # (`.spec.destination.namespace=demo`, `valueFiles=["values-demo.yaml"]`). Do not copy this
  # line into values.yaml, where the namespace is not known and the derivation is correct.
  #
  # NOT the 192.168.6.82 `cnpg-rw-internal-lb` VIP. That LoadBalancer exists for workstation
  # access (gitops/k8s/demo-cnpg-internal-access, used by the demo-cnpg-local-web-ng skill);
  # routing in-cluster workloads through it would send pod-to-pod traffic out to an L2 VIP and
  # back for no reason, and couple every workload to MetalLB.
  #
  # The rest of the DSN is unchanged from the chart defaults and deliberately not duplicated
  # here: database `serviceradar`, username `serviceradar`, schema `platform`. The password is
  # never in values -- it is projected from a Secret via valueFrom.secretKeyRef.
  host: "cnpg-rw.demo.svc.cluster.local"
  port: 5432

  # Temporary while only two dedicated CNPG workers exist. Argo CD currently
  # ignores live changes to /spec/instances for this Cluster, so changing this
  # value documents the desired demo shape but does not downscale the live
  # cluster by itself.
  instances: 2
  storageClass: local-path-cnpg
  affinity:
    podAntiAffinityType: preferred
    nodeSelector:
      cnpg.io/dedicated: "true"
    tolerations:
      - key: cnpg.io/dedicated
        operator: Equal
        value: "true"
        effect: NoSchedule
  # The demo's local-path volume is a 1TB disk (scsi3), larger than the declared
  # storageSize, so the chart's ~30%-of-storageSize default is too small here.
  # The live cnpg PVCs were grown to 500Gi (post 2026-06-17 disk outage); the
  # chart default of 100Gi made ArgoCD try to SHRINK storage on every sync, which
  # CNPG rejects ("can't shrink existing storage from 500Gi to 100Gi") and fails
  # the whole demo sync. Pin storageSize to the live size so syncs reconcile.
  storageSize: 500Gi
  # Pin the WAL retention cap explicitly. (NEVER -1/unbounded — the 2026-06-17 outage.)
  maxSlotWalKeepSize: "250GB"
  localDevAccess:
    enabled: true
    # Allow local web-ng testing from the workstation LANs used for demo
    # development. This gates only direct CNPG access on TCP/5432.
    policyName: cnpg-allow-oracle-test-postgres
    allowedCIDRs:
      - "192.168.1.0/24"
      - "192.168.2.0/24"
  # Demo runs ~6+ ServiceRadar deployments (web-ng, core-elx, datasvc,
  # agent-gateway, etc.). Even with the pgBouncer Pooler
  # in front of the primary, the default 100-slot ceiling is too tight:
  # workloads that bypass the pooler (core-elx Oban, migrations, db-event-
  # writer ADBC, etc.) saturated the `serviceradar` role and pushed web-ng
  # into CrashLoopBackOff with "remaining connection slots are reserved for
  # roles with the SUPERUSER attribute". 500 + 1 GiB shared_buffers gives
  # ample headroom; the pooler keeps server-side counts well below the cap.
  postgresqlParameters:
    max_connections: "500"
    shared_buffers: "1GB"
    work_mem: "16MB"
  pooler:
    enabled: true
    # THE CLUSTER-INTERNAL ENDPOINT THE SERVICES ACTUALLY USE, for every workload routed to the
    # pooler -- which today is what `kubectl get deploy serviceradar-core -n demo` reports as
    # CNPG_HOST. Stated here for the same reason as `cnpg.host` above: it is otherwise only
    # `serviceradar.cnpgPoolerHost` deriving `<poolerName>.<namespace>.svc.cluster.local` from an
    # empty default, and the endpoint carrying most of demo's database traffic should be legible
    # in the overlay rather than reconstructed from two template helpers.
    #
    # Namespace literal, safe for the same reason: Argo CD pins this file to `demo`.
    host: "cnpg-pooler-rw.demo.svc.cluster.local"
    instances: 3
    monitoring:
      podMonitor:
        enabled: true
    parameters:
      ignore_startup_parameters: "search_path"
      max_client_conn: "2000"
      default_pool_size: "40"
      reserve_pool_size: "10"
      reserve_pool_timeout: "5"

logCollector:
  replicaCount: 3
  # Shared events stream (logs/OTEL/falco) — not used for raw NetFlow.
  # Sized independently of the dedicated flows stream.
  streamReplicas: 3
  streamMaxBytes: 2147483648
  # Use the dedicated UDP Service when the collector must record the actual
  # device address. The shared Envoy UDPRoute remains enabled below for
  # compatibility, but Envoy Gateway's UDP forwarding path rewrites the
  # transport peer to the proxy pod address.
  externalService:
    enabled: true
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
    loadBalancerIP: "23.138.124.23"
    externalTrafficPolicy: Local
  tcpCollector:
    enabled: true
    replicaCount: 3
    streamReplicas: 3
  data:
    enabled: false
  probes:
    liveness:
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      timeoutSeconds: 10
      failureThreshold: 6
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  # External OTLP ingest via the shared envoy gateway (no dedicated public
  # IP; rides the serviceradar-shared-gateway address).
  #   OTLP/HTTP : https://otlp-demo.serviceradar.cloud/v1/{traces,logs,metrics}
  #               TLS terminates at the gateway with the public wildcard cert;
  #               envoy forwards plaintext in-cluster (http.tlsEnabled=false).
  #   OTLP/gRPC : otlp-demo.grpc.serviceradar.cloud:50052 — TLS passthrough to
  #               the collector; senders must trust the ServiceRadar private
  #               root CA (or use insecure skip-verify).
  # The opt-in dedicated LoadBalancer mode (service.type=LoadBalancer plus a
  # MetalLB pool annotation/pinned IP) remains available but is off here to
  # avoid consuming a public IP.
  otlp:
    http:
      tlsEnabled: false
    service:
      enabled: true
      type: ClusterIP
      http:
        enabled: true
    gateway:
      enabled: true
      httpHostname: "otlp-demo.serviceradar.cloud"
      grpcHostname: "otlp-demo.grpc.serviceradar.cloud"

agentGateway:
  enabled: true
  replicas: 3
  publicHostname: "demo-gw.serviceradar.cloud"
  # Demo HA headroom above the chart default (1Gi/2Gi). Reconnect-storm spikes
  # still push the gateway past 2Gi; steady-state is ~850–900Mi.
  resources:
    requests:
      memory: "1Gi"
    limits:
      memory: "3Gi"
  service:
    type: LoadBalancer
    port: 50052
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
      external-dns.alpha.kubernetes.io/hostname: "demo-gw.serviceradar.cloud."

agent:
  enabled: true
  hostNetwork: false
  allowNetRaw: false
  ebpf:
    enabled: false
  pushInterval: "30s"
  statusDebounceInterval: "30s"
  statusHeartbeatInterval: "5m"
  remoteAccessKnownHostsFile: "/var/lib/serviceradar/checkers/remote-access-known_hosts"
  resources:
    limits:
      memory: 4Gi
  checkersStorage:
    enabled: true
    basePath: "/var/lib/serviceradar/checkers"
    existingClaim: ""
    size: 2Gi
    storageClassName: ""

ingress:
  enabled: false
  host: demo.serviceradar.cloud
  className: ""
  tls:
    enabled: true
    secretName: ""
    clusterIssuer: ""
gatewayApi:
  enabled: true
  mode: attach
  host: demo.serviceradar.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serviceradar-shared-gateway
      namespace: serviceradar-system
      sectionName: https-web
  redirectParentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serviceradar-shared-gateway
      namespace: serviceradar-system
      sectionName: http-web
  http:
    enabled: true
    redirectToHttps: true
  tls:
    enabled: true
    # Shared serviceradar edge terminates TLS with the wildcard cert in
    # serviceradar-system; demo only attaches routes.
    secretName: ""
    clusterIssuer: ""
  syslog:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: serviceradar-shared-gateway
        namespace: serviceradar-system
        sectionName: syslog-udp
  backendTrafficPolicy:
    enabled: true
    requestTimeout: 86400s
    requestBufferLimit: 100Mi
networkPolicy:
  enabled: true
  podSelectorMatchAll: true
  ingress:
    allowSameNamespace: true
    allowedNamespaces:
      # The demo HTTPRoute attaches to the shared Gateway in this namespace;
      # keep access for compatibility with in-namespace gateway deployments.
      - serviceradar-system
      # Envoy Gateway runs shared Gateway data-plane pods in this namespace;
      # allow those proxies to reach ServiceRadar backends.
      - envoy-gateway-system
      # Prometheus runs in this namespace and scrapes ServiceRadar and CNPG metrics.
      - monitoring
      # Falco runs as a DaemonSet in this namespace and posts runtime events to
      # the falcosidekick receiver deployed with the demo ServiceRadar stack.
      - falco
    cnpgOperator:
      enabled: true
    cnpgInstanceManager:
      enabled: true
    monitoring:
      enabled: true
      namespace: monitoring
      cnpgMetricsPort: 9187
      pgbouncerMetricsPort: 9127
    gobgpExternal:
      enabled: true
      allowedCIDRs:
        - "192.168.10.1/32"
        - "10.0.2.1/32"
        - "10.0.2.0/24"
        - "192.168.6.0/24"
  egress:
    allowDNS: true
    allowKubeAPIServer: true
    allowDefaultNamespace: true
    allowSameNamespace: true
    allowedNamespaces:
      - openbao-system
      # Smokescreen CONNECT proxy. HTTP(S) fetches should go through
      # SERVICERADAR_EGRESS_PROXY rather than the public CIDRs below.
      - egress
    allowedCIDRs:
      - "10.0.0.0/8"
      - "192.168.0.0/16"
      # Allow GitHub API/web endpoints used by the repo release importer in web-ng.
      # Resolved on 2026-03-28:
      # - api.github.com -> 140.82.112.5
      # - github.com -> 140.82.113.3
      # GitHub serves these from the 140.82.112.0/20 range.
      - "140.82.112.0/20"
      # Allow GeoLite MMDB + rezmoss provider CIDR refresh from raw.githubusercontent.com
      # (resolved on 2026-02-28 to 185.199.108.133-111.133, summarized as 185.199.108.0/22).
      # Kubernetes NetworkPolicy can't allow by DNS name, so we allow the minimal known CIDR for this host.
      - "185.199.108.0/22"
      # Allow IEEE OUI refresh from standards-oui.ieee.org
      # (resolved on 2026-02-28 to 140.98.223.27).
      - "140.98.223.27/32"
      # Allow CISA KEV refresh from www.cisa.gov's current Akamai edge.
      # Kubernetes NetworkPolicy cannot match FQDNs; resolved on 2026-07-11
      # to 23.210.150.135 and summarized to the serving /24.
      - "23.210.150.0/24"
      # Allow ARIN Whois-RWS ASN lookups from web-ng flow details modal.
      # whois.arin.net resolves (2026-02-28) to:
      # - 199.5.26.46
      # - 199.71.0.46
      # - 199.212.0.46
      - "199.5.26.46/32"
      - "199.71.0.46/32"
      - "199.212.0.46/32"
      # Allow RIPE Stat Whois API endpoint used for non-ARIN ASN fallback.
      # stat.ripe.net resolves (2026-02-28) to:
      # - 193.0.6.150
      # - 2001:67c:2e8:22::c100:696
      - "193.0.6.150/32"
      - "2001:67c:2e8:22::c100:696/128"
      # Allow ipinfo lite MMDB refresh from ipinfo.io. (Resolved as 34.117.59.81 on 2026-02-07.)
      # Note: this is a best-effort allowlist and may need adjustment if ipinfo changes their IPs.
      - "34.117.0.0/16"
      # ipinfo MMDB download currently redirects to dl.assets.ipinfo.io (Cloudflare).
      # Allow the observed /24s (resolved on 2026-02-07 to 104.18.22.73 and 104.18.23.73).
      # Note: Cloudflare anycast can change; if downloads fail again, re-resolve and update.
      - "104.18.22.0/24"
      - "104.18.23.0/24"
      # Allow AlienVault OTX API access for threat-intel sync/plugin checks.
      # otx.alienvault.com is served through CloudFront; Kubernetes NetworkPolicy
      # cannot allow by DNS name, so this tracks observed CIDRs. CloudFront can
      # move between ranges, so re-resolve and update these if OTX times out again.
      - "18.160.181.0/24"
      # Observed on 2026-05-08.
      - "54.192.55.0/24"
      - "99.84.203.0/24"
      # Observed on 2026-07-10.
      - "3.170.185.0/24"
      # Discord incoming webhooks (discord.com / discordapp.com). Served by
      # Cloudflare; Kubernetes NetworkPolicy cannot match FQDNs. Resolved
      # 2026-08-13 to 162.159.128.233-138.232. Re-resolve if test-sends start
      # timing out again.
      - "162.159.128.0/18"
      # VulnCheck backup index currently lands on CloudFront 99.84.203.0/24
      # (already listed above). The presigned archive is S3 Global MRAP
      # (*.mrap.accesspoint.s3-global.amazonaws.com). Resolved 2026-08-15 to
      # 13.248.232.82 and 76.223.103.50. Re-resolve if VulnCheck downloads
      # start timing out again.
      - "13.248.232.0/24"
      - "76.223.103.0/24"
  calicoLogDenied:
    enabled: true
    selector: "all()"
    order: 1000

geoipMmdb:
  enabled: true
  basePath: "/var/lib/serviceradar/geoip"
  existingClaim: ""
  size: 1Gi
  storageClassName: ""

webNg:
  replicas: 3
  database:
    poolSize: 8
    queueTargetMs: 2000
    queueIntervalMs: 2000
    timeoutMs: 120000
    poolTimeoutMs: 120000
  obanEnabled: true
  obanQueues:
    default: 1
    alerts: 1
    serviceChecks: 1
    notifications: 1
    onboarding: 1
    events: 1
    sweeps: 1
    edge: 1
    # Heavy data jobs run on core only — web-ng is the UI tier. Keeping these at
    # 0 avoids UI pod OOMs, orphaned executing Oban jobs on web-ng restart, and
    # web-ng picking up core's :maintenance queue (the identity-reconciliation
    # cron + enrichment/threat-intel refresh). core processes :maintenance.
    integrations: 0
    maintenance: 0
    webMaintenance: 2
  godView:
    runtimeGraphRefreshMs: 30000
    runtimeGraphAutoRefresh: true
    snapshotBudgetMs: 2000
    snapshotCoalesceMs: 0
  firstPartyPluginImport:
    autoSyncEnabled: true
    syncReleaseLimit: 20
    syncIntervalSeconds: 3600
    cosignPublicKey: |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEhJcdPbybyipSl8sNHSKStAYiqhP7
      cp6jIdZ3L4AkL/WI9oFn5xqJSnwTC29cz+JN/bXzWE807+iPS/DOl3C9EQ==
      -----END PUBLIC KEY-----
    registryDockerConfigSecret: registry-carverauto-dev-cred
  nativeAddonImport:
    autoSyncEnabled: true
    syncReleaseLimit: 20
    syncIntervalSeconds: 1800
    autoApproveAddonIds:
      - bumblebee
      - netprobe
      - powerdns
      - rdp
      - workload-identity
      - scalibr-endpoint-inventory
      # anomaly: so the rebuilt 0.1.1 bundle (config_schema with metric_feed)
      # auto-approves on import and the Edge Anomaly profile reconciles.
      - anomaly
      # otel-collector: deliver the edge OTLP collector once CI publishes its blob.
      - otel-collector
  gatewayAddress: "demo-gw.serviceradar.cloud:50052"
  agentReleasePublicKey: "ZY2//cpkD3oVdC6q4Cg6lN1I2M6SgmDMzL4QyQjptH8="
  extraEnv:
    # City MMDB is large; we only enable it in demo where we can allocate more memory.
    GEOLITE_CITY_ENABLED: "true"
    # FQDN allowlist; pair with networkPolicy.egress.allowedNamespaces egress.
    SERVICERADAR_EGRESS_PROXY: "http://smokescreen.egress.svc.cluster.local:4750"
    # Trust first-party Wasm upload signatures published by the release pipeline.
    PLUGIN_TRUSTED_UPLOAD_SIGNING_KEYS: "serviceradar-first-party-v1=L+H5fG0eEraBsWAd2aKMzK7I+AMhbnSxlOKny5/+dLo=,serviceradar-first-party-v2=2KMsaqvof357MV3RQl4/0DNXfF6+eIMQ+qjDJfL/N8I="
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "500m"
      memory: 2Gi
  devRoutes: "true"
  localMailer: "false"
  # The serviceradar-secrets/admin-password is the source of truth for demo;
  # if it gets rotated while the database persists, force-sync resets the
  # stored hash on the next restart instead of locking us out of the UI.
  adminPasswordForceSync: true
  # Local-login break-glass + SSO toggle (server-side LoginPolicy). Default off.
  auth:
    forceLocalLogin: false
    disableSso: false
  publicUrl: "https://demo.serviceradar.cloud"
  # MCP OAuth AS for Authentik SSO testing. Chart default is off. Keep this
  # on the demo overlay so /mcp survives Image Updater rewrite of
  # .argocd-source-serviceradar-demo-prod.yaml (those parameters are not
  # durable). extraEnv.SERVICERADAR_MCP_ENABLED is ignored.
  mcpEnabled: "true"
  pluginStorage:
    enabled: true
    backend: "jetstream"
    basePath: "/var/lib/serviceradar/plugin-packages"
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
    downloadTtlSeconds: 86400
    jetstreamReplicas: 3

faker:
  enabled: true
  gobgp:
    enabled: false
    # Keep latest for demo iterations; pin to a digest/tag if reproducibility
    # requirements tighten.
    image:
      repository: docker.io/osrg/gobgp
      tag: latest
      pullPolicy: IfNotPresent
    binDir: /opt/gobgp
  simulation:
    totalDevices: 1000
    ipShuffle:
      enabled: true
      interval: "10m"
      percentage: 5
      warmupCycles: 2
      allowExpansion: false
      poolHeadroomPercent: 0
    bgp:
      enabled: false
      manageDaemon: false
      gobgpApiAddress: "serviceradar-gobgp:50051"
      gobgpBinary: "/opt/gobgp/gobgpd"
      gobgpCliBinary: "/opt/gobgp/gobgp"
      bmpCollectorAddress: "serviceradar-bmp-collector:11019"

gobgp:
  enabled: true
  image:
    repository: docker.io/osrg/gobgp
    tag: latest
    pullPolicy: IfNotPresent
  bgp:
    localAsn: 401642
    routerId: "10.42.68.126"
    listenPort: 179
  service:
    bgp:
      enabled: false
      port: 179
  nodeSelector:
    kubernetes.io/hostname: k8s-cp3-worker1
  podAnnotations:
    cni.projectcalico.org/ipAddrs: '["10.42.68.126"]'
  peers:
    - name: tonka01
      ip: "10.0.2.1"
      peer_asn: 401642
      description: "tonka01"
      passiveMode: true

core:
  replicas: 3
  # Demo HA headroom above the chart default (1Gi/8Gi). Live core sits around
  # 1.4–1.5Gi RSS but spikes well past 8Gi under full demo load.
  resources:
    requests:
      memory: "2Gi"
    limits:
      memory: "16Gi"
  clusterWebDnsQuery: "serviceradar-web-ng-headless.demo.svc.cluster.local"
  clusterGatewayDnsQuery: "serviceradar-agent-gateway-headless.demo.svc.cluster.local"
  # Core advisory feed ingestion. nist-nvd2 is the CPE catalog; core prunes
  # leftover extracts every scheduler tick so a killed load cannot refill the node.
  advisoryFeeds:
    enabled: true
    nistNvd2Enabled: true
    size: "5Gi"
  database:
    poolSize: 10
  controlDatabase:
    enabled: true
    poolSize: 3
  extraEnvValueFrom:
    OPENBAO_TOKEN:
      secretKeyRef:
        name: openbao-serviceradar-token
        key: token
        optional: true
  obanQueues:
    default: 2
    maintenance: 1
    monitoring: 1
    alerts: 1
    serviceChecks: 2
    notifications: 1
    onboarding: 1
    events: 2
    sweeps: 2
    edge: 2
    integrations: 1
    natsAccounts: 1
  # MTR automation rollout profiles (copy/paste into mtrAutomation):
  # baseline_only:
  #   enabled: true
  #   baselineEnabled: true
  #   triggerEnabled: false
  #   consensusEnabled: false
  #   baselineTickMs: 60000
  #   consensusCohortRetentionMs: 300000
  # trigger_capture:
  #   enabled: true
  #   baselineEnabled: true
  #   triggerEnabled: true
  #   consensusEnabled: false
  #   baselineTickMs: 60000
  #   consensusCohortRetentionMs: 300000
  # full_consensus:
  #   enabled: true
  #   baselineEnabled: true
  #   triggerEnabled: true
  #   consensusEnabled: true
  #   baselineTickMs: 60000
  #   consensusCohortRetentionMs: 300000
  logPromotionConsumerEnabled: true
  capacityForecasting:
    enabled: true
    emitVerdicts: true
  mtrAutomation:
    enabled: true
    baselineEnabled: true
    triggerEnabled: false
    consensusEnabled: false
    baselineTickMs: 60000
    consensusCohortRetentionMs: 300000
  observabilityRetention:
    traceSummaryDays: 1
    otelTracesDays: 1
    logsDays: 1
    flowAttributionMinutes: 20
    otelTracesChunkIntervalHours: 6
    logsChunkIntervalHours: 6
    datasetSnapshotDays: 2
    datasetSnapshotKeepLast: 1
  deviceEnrichment:
    rulesDir: "/var/lib/serviceradar/rules/device-enrichment"
    filesystemOverrides:
      # Keep enabled in demo so override mounts are consistently wired on upgrades.
      # Provide existingConfigMap/existingSecret/existingClaim when you want custom rules.
      enabled: true
  extraEnv:
    SERVICERADAR_EGRESS_PROXY: "http://smokescreen.egress.svc.cluster.local:4750"
    EVENT_WRITER_NATS_CREDS_FILE: "/etc/serviceradar/creds/platform.creds"
    EVENT_WRITER_NATS_URL: "tls://serviceradar-nats:4222"
    EVENT_WRITER_NATS_TLS: "true"
    # Keep last-known topology visible in demo when external mapper agents are
    # briefly offline or being re-enrolled.
    SERVICERADAR_MAPPER_TOPOLOGY_EDGE_STALE_MINUTES: "10080"
    # Mint provisional MAC-keyed sr: identities for FDB/UniFi-client neighbors so
    # switch<->host attachment edges render (fj #4379 / PR #4398; flag-gated rollout,
    # demo is the canary — watch device_identifiers growth per the OpenSpec runbook).
    SERVICERADAR_TOPOLOGY_ENDPOINT_IDENTITY_PROMOTION: "true"
    # City MMDB is large, but demo has headroom and it lets us enrich flows with city/region/lat/tz.
    GEOLITE_CITY_ENABLED: "true"

# Keep mutable AWX callbacks disabled until a ServiceRadar-initiated live
# preflight canary has passed and its redacted evidence is retained. The
# non-secret identifiers and operator-owned policy Secret remain staged here
# so the enablement procedure can be reviewed without reconstructing custody.
automationCallbacks:
  enabled: false
  canonicalOrigin: "https://demo.serviceradar.cloud"
  envelopeKeyId: "current"
  awxCredentialTypeId: 68
  awxOrganizationId: 3
  awxInjectorDigest: "2ee3cea02c901d13ad0ecc5071ffc10ed7937f7c205a7c5f003cbf8fc0567738"
  responsePolicy:
    existingSecretName: serviceradar-automation-callback-policy
    secretKey: response-policy.json

# Exercise the registered SSH and Windows desktop paths in demo. SSH private
# signing material and account/principal policy remain in operator-created
# Secrets. Cloudflare's public STUN endpoint supplies server-reflexive
# candidates without carrying any credential material. Add a TURN endpoint and
# existing Secret below when a restrictive NAT/firewall requires relay service.
remoteAccess:
  ssh:
    enabled: true
  sshCertificatePolicy:
    enabled: true
    existingSecretName: serviceradar-ssh-certificate-policy
    secretKey: certificate-policy.json
    workloads:
      web: true
      core: false
  sshCaSigner:
    enabled: true
    keyId: demo-remote-access-ca-2026q3
    existingSecretName: serviceradar-ssh-ca
    secretKey: ca-key
    workloads:
      web: true
      core: false
  desktop:
    rdp:
      enabled: true
      webRTC:
        iceServers:
          - urls:
              - "stun:stun.cloudflare.com:3478"
        networkPolicy:
          enabled: true
          # Kubernetes NetworkPolicy cannot match the STUN FQDN. These are the
          # exact A/AAAA answers observed for stun.cloudflare.com on 2026-07-13.
          # Re-resolve and review this list if Cloudflare changes its anycast IPs.
          allowedCIDRs:
            - "162.159.207.0/32"
            - "2606:4700:49::/128"
          allowedUDPPorts:
            - 3478
          allowedTCPPorts: []

datasvc:
  replicaCount: 3
  jetstreamReplicas: 3
  # Match the live demo JetStream account budget. Keep this in Git so Argo does
  # not restore the chart's larger production-oriented object-store reservation.
  bucketMaxBytes: 536870912
  objectMaxBytes: 536870912
  objectStoreBytes: 2147483648
  data:
    # datasvc is safe to run stateless in demo because KV/object state lives in NATS.
    enabled: false

# Temporarily disabled client CA for initial testing - there's a circular dependency
# where CNPG needs the client CA secret, but the job that creates it
# runs post-install and needs CNPG to be running first.
# cnpg:
#   clientCASecret: serviceradar-cnpg-client-ca
#   clientCAFromCerts: true
#   requireClientCert: true

spire:
  enabled: false
  trustDomain: carverauto.dev
  clusterName: carverauto-cluster
  agent:
    hostNetwork: false
  postgres:
    enabled: false
    clusterName: cnpg
    instances: 3
    storageSize: 100Gi

prometheusRules:
  cnpg:
    enabled: true
    clusterName: cnpg
    labels:
      release: kube-prom
    backendsWaitingWarning: 5
    slowQueryLogThresholdMs: 500

observability:
  enabled: true
  prometheus:
    serviceMonitors:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      targets:
        webNg:
          enabled: true
          path: /metrics
        core:
          enabled: true
          path: /metrics
        agentGateway:
          enabled: true
          path: /metrics
        flowCollector:
          enabled: false
          path: /metrics
    rules:
      enabled: true
      labels:
        release: kube-prom
      pgbouncer:
        clientsWaitingWarning: 1
        maxWaitSecondsWarning: 5
      core:
        scrapeDownFor: 5m
      agentGateway:
        scrapeDownFor: 5m
      webNg:
        scrapeDownFor: 5m
        restartWindow: 15m
        restartWarning: 1
  grafana:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      annotations: {}
      folder: ServiceRadar

trapd:
  replicaCount: 3
  # trapd writes into the shared 3x events stream.
  streamReplicas: 3
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
    loadBalancerIP: "23.138.124.26"
    externalTrafficPolicy: Local

flowgger:
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
    loadBalancerIP: "23.138.124.24"
    externalTrafficPolicy: Local

flowCollector:
  enabled: true
  # IPFIX/NetFlow v9 templates are stateful per collector process. Keep the
  # external UDP ingress single-replica until collector-side exporter sharding
  # or shared template state is implemented.
  replicaCount: 1
  # Dedicated flows stream at R=3 (same HA topology as production). Size is
  # smaller than prod 10 GiB default but isolated from logs/OTEL on the events
  # stream. HA is only config.stream_replicas (serialized into the ConfigMap).
  config:
    stream_name: "flows"
    rehome_state_path: "/var/lib/serviceradar/flow-collector-rehome.json"
    # 8 GiB / 2h / R=3 — dedicated flows budget (design). Demo reduces
    # datasvc object/KV reservations so this fits 30Gi PVC + maxFileStore.
    # No volumeClaimTemplate mutation.
    stream_max_bytes: 8589934592
    stream_max_age_secs: 7200
    stream_replicas: 3
  # Persist rehome marker + ready file across Recreate / pod replacement.
  # JetStream holds flow durability; this PVC is only for local cutover state.
  data:
    enabled: true
    size: 1Gi
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
    loadBalancerIP: "23.138.124.25"
    externalTrafficPolicy: Local
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800
    ports:
      netflow:
        enabled: true
        port: 2055
        targetPort: 2055
        protocol: UDP
      sflow:
        enabled: true
        port: 6343
        targetPort: 6343
        protocol: UDP
      ipfix:
        enabled: false
        port: 4739
        targetPort: 4739
        protocol: UDP
      # Metrics port is intentionally hidden from the public LoadBalancer in
      # the demo. The Rust binary still starts the in-process Prometheus
      # server (config.metrics_addr remains set in base values), so
      # cluster-internal scrapers can reach /metrics on the pod IP.
      # Probes are unaffected: they gate on the ready-file, not on HTTP.
      metrics:
        enabled: false
        port: 50046
        targetPort: 50046
        protocol: TCP

certs:
  regenerator:
    # Leave disabled in demo so pre-upgrade cert preservation is stable and
    # upgrades do not rotate the runtime CA unexpectedly.
    enabled: false

objectStoreRetention:
  enabled: true
  dryRun: false
  agentReleaseKeepLatest: 1
  nativeAddonOrphanGraceSeconds: 604800
  pluginOrphanGraceSeconds: 604800
  datasvcTimeoutMs: 30000
  webNgMaintenanceQueueLimit: 1

bmpCollector:
  enabled: true
  replicaCount: 3
  image:
    repository: ""
  args:
    - "--bmp-address=0.0.0.0:11019"
    - "--kafka-disable"
    - "--nats-enable"
    - "--nats-server=nats://serviceradar-nats:4222"
    - "--nats-subject=arancini.updates"
    - "--nats-tls-required"
    - "--nats-tls-ca-cert-path=/etc/serviceradar/certs/root.pem"
    - "--nats-tls-client-cert-path=/etc/serviceradar/certs/bmp-collector.pem"
    - "--nats-tls-client-key-path=/etc/serviceradar/certs/bmp-collector-key.pem"
    - "--curation-state-path=/var/lib/serviceradar/state.bin"
    - "--curation-snapshot-backend=local"
    - "-vvv"
  config:
    streamMaxBytes: 1073741824
    # Pods are HA, but the dedicated ARANCINI_CAUSAL stream still stays at a
    # single JetStream replica until that budget is sized separately.
    streamReplicas: 1
    natsTlsClientCertPath: "/etc/serviceradar/certs/bmp-collector.pem"
    natsTlsClientKeyPath: "/etc/serviceradar/certs/bmp-collector-key.pem"
  data:
    # Keep false: three HA replicas cannot safely share one RWO PVC.
    enabled: false
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: k3s-pool
    loadBalancerIP: "23.138.124.27"
    externalTrafficPolicy: Local
nats:
  replicas: 3
  jetstream:
    maxMemoryStore: 1G
    # Within existing 30Gi PVC. Do not change persistence.size here — STS
    # volumeClaimTemplates are immutable and block Helm upgrades.
    maxFileStore: 30G
