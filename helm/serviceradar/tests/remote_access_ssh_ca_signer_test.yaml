suite: remote access SSH CA signer custody
templates:
  - templates/core.yaml
  - templates/web.yaml
# Assertions are scoped with `template:` and select documents by a path that is unique
# within that template. Selecting on metadata.name matches several documents here and
# fails with `multiple indexes found`. See README.md in this directory.
tests:
  - it: mounts one operator-owned CA key into web by default
    set:
      remoteAccess.sshCaSigner.enabled: true
      remoteAccess.sshCaSigner.keyId: demo-ca-v1
      remoteAccess.sshCaSigner.existingSecretName: serviceradar-ssh-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_REMOTE_ACCESS_SSH_CA_SIGNER_ENABLED
            value: "true"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: remote-access-ssh-ca
            mountPath: /run/secrets/serviceradar_ssh_ca
            subPath: ca-key
            readOnly: true
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: remote-access-ssh-ca
            secret:
              secretName: serviceradar-ssh-ca
              defaultMode: 256
              items:
                - key: ca-key
                  path: ca-key
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: can scope key custody to core instead of web
    set:
      remoteAccess.sshCaSigner.enabled: true
      remoteAccess.sshCaSigner.keyId: core-ca-v1
      remoteAccess.sshCaSigner.existingSecretName: serviceradar-core-ssh-ca
      remoteAccess.sshCaSigner.workloads.web: false
      remoteAccess.sshCaSigner.workloads.core: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_REMOTE_ACCESS_SSH_CA_KEY_ID
            value: core-ca-v1
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: remote-access-ssh-ca
            mountPath: /run/secrets/serviceradar_ssh_ca
            subPath: ca-key
            readOnly: true
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
