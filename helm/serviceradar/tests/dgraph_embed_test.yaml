suite: dgraph chart embed
release:
  name: serviceradar
  namespace: serviceradar-test
templates:
  - templates/dgraph-certificates.yaml
tests:
  - it: mints the CA and the Alpha TLS secret the subchart mounts
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.name
          value: dgraph-ca
        documentIndex: 0
      - equal:
          path: type
          value: kubernetes.io/tls
        documentSelector:
          path: metadata.name
          value: dgraph-ca
      - isNotEmpty:
          path: data["tls.crt"]
        documentSelector:
          path: metadata.name
          value: dgraph-ca
      - isNotEmpty:
          path: data["tls.key"]
        documentSelector:
          path: metadata.name
          value: dgraph-ca
      - isNotEmpty:
          path: data["ca.crt"]
        documentSelector:
          path: metadata.name
          value: dgraph-ca
      - equal:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
        documentIndex: 1
      - equal:
          path: type
          value: kubernetes.io/tls
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
      - isNotEmpty:
          path: data["tls.crt"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
      - isNotEmpty:
          path: data["tls.key"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
      - isNotEmpty:
          path: data["ca.crt"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret

  - it: mints a Zero TLS secret only when Zero TLS is enabled
    set:
      dgraph:
        zero:
          tls:
            enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: serviceradar-dgraph-zero-tls-secret
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-zero-tls-secret
      - equal:
          path: type
          value: kubernetes.io/tls
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-zero-tls-secret
      - isNotEmpty:
          path: data["tls.crt"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-zero-tls-secret

  - it: omits in-chart TLS when dgraph is an external cluster
    set:
      dgraph:
        enabled: false
        schema:
          enabled: false
        external:
          host: dgraph-dgraph-alpha.demo.svc.cluster.local
          port: 9080
          tlsMode: verify-ca
          caSecret: dgraph-ca
    asserts:
      - hasDocuments:
          count: 0
