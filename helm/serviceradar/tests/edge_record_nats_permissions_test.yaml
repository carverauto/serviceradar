suite: edge record NATS permissions
templates:
  - templates/nats.yaml
release:
  namespace: serviceradar-test
tests:
  - it: lets the gateway publish the primary, audit and security-quarantine edge-record routes from default values
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)user: "CN=serviceradar-agent-gateway,[^"]+"\s+permissions: \{\s+publish: \{\s+allow: \["telemetry\.edge-record\.v1\.bulk\.>", "telemetry\.edge-record-audit\.v1\.bulk\.>", "telemetry\.edge-record-security-quarantine\.v1\.bulk\.>", "metrics\.sysmon\.>"'

  # Core's certificate authorization callout grants an adopted gateway
  # certificate the block in this ConfigMap, not the broker's static config.
  - it: grants the gateway the edge-record routes through the authorization callout list
    template: templates/nats.yaml
    documentSelector:
      path: metadata.name
      value: serviceradar-nats-static-users
    asserts:
      - matchRegex:
          path: data["static-users.yaml"]
          pattern: '(?m)^- publish:\n    allow:\n(?: .*\n)*    - telemetry\.edge-record\.v1\.bulk\.>\n    - telemetry\.edge-record-audit\.v1\.bulk\.>\n    - telemetry\.edge-record-security-quarantine\.v1\.bulk\.>\n(?: .*\n)*  user: CN=serviceradar-agent-gateway,'

  - it: lets core dead-letter and replay edge records but not purge or delete the dead-letter stream
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)user: "CN=serviceradar-core,[^"]+"\s+permissions: \{\s+publish: \{\s+allow: \[[^\]]*"telemetry\.edge-record-dlq\.v1\.bulk\.>",\s+"telemetry\.edge-record\.v1\.bulk\.>",\s+"telemetry\.edge-record-audit\.v1\.bulk\.>",[^\]]*\]\s+deny: \[[^\]]*"\\\$JS\.API\.STREAM\.PURGE\.TELEMETRY_EDGE_RECORD_DLQ_V1_BULK", "\\\$JS\.API\.STREAM\.DELETE\.TELEMETRY_EDGE_RECORD_DLQ_V1_BULK"\]'
