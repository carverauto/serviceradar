suite: core migrations hook ordering
templates:
  - templates/core-migrations-job.yaml
tests:
  - it: runs as a non-hook Job gated on CNPG readiness during fresh install
    asserts:
      - equal:
          path: metadata.name
          value: serviceradar-core-migrations
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - notExists:
          path: metadata.annotations["helm.sh/hook-weight"]
      - notExists:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      # Argo CD always renders the install branch. Without Force+Replace the
      # second sync patches the completed Job's immutable pod template and fails,
      # so the migrations for the new image never run.
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true
      # A release resource that the TTL controller deletes makes `helm install
      # --wait` report it NotFound and fail if other resources are still
      # becoming Ready when the TTL expires.
      - notExists:
          path: spec.ttlSecondsAfterFinished
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-cnpg

  - it: migrates as a pre-upgrade hook after CNPG extension preparation on upgrade
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: serviceradar-core-migrations
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-cnpg

  # The hook runs after the runtime certificate generator (-4) and before any
  # workload rolls. It records each reissued certificate on its adopted
  # component from the generator's rotation record, and it is given that
  # record alone: no key from the runtime certificate Secret.
  - it: reads the runtime certificate rotation record on upgrade, without any key
    release:
      upgrade: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_RUNTIME_CERT_ROTATION_FILE
            value: /etc/serviceradar/runtime-cert-rotation/runtime-cert-rotation.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: runtime-cert-rotation
            mountPath: /etc/serviceradar/runtime-cert-rotation
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: runtime-cert-rotation
            secret:
              secretName: serviceradar-runtime-certs
              optional: true
              items:
                - key: runtime-cert-rotation.json
                  path: runtime-cert-rotation.json
