suite: netflow requires starrocks
templates:
  - flow-collector.yaml
tests:
  - it: fails closed when netflow is on without starrocks
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "flowCollector.enabled requires analytics.starrocks.enabled: NetFlow is part of the StarRocks warehouse. Without StarRocks, logs stay on CNPG hypertables and NetFlow is not collected."
  - it: enables the collector when starrocks is on even if flowCollector.enabled is false
    set:
      analytics.starrocks.enabled: true
      flowCollector.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
  - it: renders the collector when starrocks is also enabled
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
