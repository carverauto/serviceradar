suite: netflow requires starrocks
templates:
  - flow-collector.yaml
tests:
  - it: fails closed when netflow is on without starrocks
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "flowCollector.enabled requires analytics.starrocks.enabled: NetFlow history is stored in StarRocks. Without StarRocks, logs stay on CNPG hypertables and NetFlow is not collected."
  - it: does not deploy the collector when flowCollector.enabled is false
    set:
      analytics.starrocks.enabled: true
      flowCollector.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the collector when starrocks is also enabled
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
