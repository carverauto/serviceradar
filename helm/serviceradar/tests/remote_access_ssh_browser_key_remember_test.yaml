suite: remote access SSH browser key remember defaults off
templates:
  - templates/web.yaml
# The SSH console "remember key" checkbox stores user-present private keys in
# the browser. It must stay opt-in: every deployment path defaults to off so
# keys remain memory-only unless an operator explicitly accepts the tradeoff.
tests:
  - it: disables browser key remember by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_REMOTE_ACCESS_BROWSER_KEY_REMEMBER_ENABLED
            value: "false"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: enables browser key remember only when explicitly set
    set:
      remoteAccess.ssh.browserKeyRemember.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_REMOTE_ACCESS_BROWSER_KEY_REMEMBER_ENABLED
            value: "true"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
