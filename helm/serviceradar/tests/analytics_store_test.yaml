- it: passes an explicit hot window and independently longer archive expiry to both runtimes
  set:
    analyticsStore.pgDuckdb.clusterName: archive-fixture
    analyticsStore.pgDuckdb.s3.secretName: fixture-object-store
    analyticsStore.pgDuckdb.s3.bucket: telemetry-archive.example
    analyticsStore.pgDuckdb.s3.endpoint: objects.example.com
    analyticsStore.pgDuckdb.s3.region: example-region
    analyticsStore.pgDuckdb.s3.egressCidrs: *id001
    analyticsStore.driver: hybrid
    analyticsStore.tables:
    - timeseries_metrics
    analyticsStore.hotWindowDays: 14
    analyticsStore.parquetRetentionDays: 180
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_HOT_WINDOW_DAYS
        value: '14'
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_PARQUET_RETENTION_DAYS
        value: '180'
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_HOT_WINDOW_DAYS
        value: '14'
      count: 1
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
