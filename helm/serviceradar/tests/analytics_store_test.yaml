- it: tunes connection slots independently from per backend memory
  set:
    analyticsStore.headEnabled: true
    analyticsStore.pgDuckdb.maxConnections: 84
  asserts:
  - equal:
      path: spec.postgresql.parameters.max_connections
      value: '84'
    template: templates/cold-analytics-head.yaml
  - equal:
      path: spec.postgresql.parameters["duckdb.max_memory"]
      value: 1536MB
    template: templates/cold-analytics-head.yaml
  - equal:
      path: spec.resources.limits.memory
      value: 7680Mi
    template: templates/cold-analytics-head.yaml
- it: supports filesystem hybrid storage without object store egress
  set:
    analyticsStore.pgDuckdb.clusterName: archive-fixture
    analyticsStore.pgDuckdb.s3.secretName: fixture-object-store
    analyticsStore.pgDuckdb.s3.bucket: telemetry-archive.example
    analyticsStore.pgDuckdb.s3.endpoint: objects.example.com
    analyticsStore.pgDuckdb.s3.region: example-region
    analyticsStore.pgDuckdb.s3.egressCidrs: *id001
    analyticsStore.driver: hybrid
    analyticsStore.tables:
    - timeseries_metrics
    analyticsStore.pgDuckdb.storage: filesystem
    analyticsStore.pgDuckdb.filesystem.path: /srv/synthetic-archive
  asserts:
  - notExists:
      path: spec.postgresql.parameters["duckdb.disabled_filesystems"]
    template: templates/cold-analytics-head.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_STORAGE
        value: filesystem
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_FILESYSTEM_PATH
        value: /srv/synthetic-archive
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_BUCKET_URL")]
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_STORAGE
        value: filesystem
      count: 1
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_FILESYSTEM_PATH
        value: /srv/synthetic-archive
      count: 1
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_BUCKET_URL")]
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notContains:
      path: spec.egress
      content:
        to:
        - ipBlock:
            cidr: 192.0.2.0/24
        ports:
        - protocol: TCP
          port: 443
    template: templates/cold-analytics-head-network-policy.yaml
- it: opens the declared documentation subnet for archive storage
  set:
    analyticsStore.pgDuckdb.clusterName: archive-fixture
    analyticsStore.pgDuckdb.s3.secretName: fixture-object-store
    analyticsStore.pgDuckdb.s3.bucket: telemetry-archive.example
    analyticsStore.pgDuckdb.s3.endpoint: objects.example.com
    analyticsStore.pgDuckdb.s3.region: example-region
    analyticsStore.pgDuckdb.s3.egressCidrs: *id001
    analyticsStore.driver: hybrid
    analyticsStore.tables:
    - timeseries_metrics
  asserts:
  - contains:
      path: spec.egress
      content:
        to:
        - ipBlock:
            cidr: 192.0.2.0/24
        ports:
        - protocol: TCP
          port: 443
    template: templates/cold-analytics-head-network-policy.yaml
- it: places the archive allow ahead of a configured Calico deny
  set:
    analyticsStore.pgDuckdb.clusterName: archive-fixture
    analyticsStore.pgDuckdb.s3.secretName: fixture-object-store
    analyticsStore.pgDuckdb.s3.bucket: telemetry-archive.example
    analyticsStore.pgDuckdb.s3.endpoint: objects.example.com
    analyticsStore.pgDuckdb.s3.region: example-region
    analyticsStore.pgDuckdb.s3.egressCidrs: *id001
    analyticsStore.driver: hybrid
    analyticsStore.tables:
    - timeseries_metrics
    networkPolicy.calicoLogDenied.enabled: true
    networkPolicy.calicoLogDenied.order: 700
  asserts:
  - equal:
      path: spec.order
      value: 699
    template: templates/cold-analytics-head-network-policy.yaml
    documentSelector:
      path: apiVersion
      value: projectcalico.org/v3
  - contains:
      path: spec.egress
      content:
        action: Allow
        protocol: TCP
        destination:
          nets:
          - 192.0.2.0/24
          ports:
          - 443
    template: templates/cold-analytics-head-network-policy.yaml
    documentSelector:
      path: apiVersion
      value: projectcalico.org/v3
