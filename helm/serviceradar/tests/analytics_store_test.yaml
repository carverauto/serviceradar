suite: analytics store routing and deployment contract
templates:
- templates/cold-analytics-head.yaml
- templates/cold-analytics-head-network-policy.yaml
- templates/core.yaml
- templates/web.yaml
release:
  namespace: fixture-analytics
tests:
- it: keeps the default Timescale deployment independent of archive infrastructure
  asserts:
  - hasDocuments:
      count: 0
    template: templates/cold-analytics-head.yaml
  - hasDocuments:
      count: 0
    template: templates/cold-analytics-head-network-policy.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_DRIVER
        value: timescale
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_HEAD_HOST")]
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_BUCKET_URL")]
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_ACCESS_KEY_ID")]
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_DRIVER
        value: timescale
      count: 1
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_HEAD_HOST")]
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_BUCKET_URL")]
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_S3_ACCESS_KEY_ID")]
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "SERVICERADAR_ANALYTICS_STORE_DUAL_WRITE")]
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
- it: enables hybrid archive reads on core and web with a thirty day hot window
  set:
    analyticsStore.pgDuckdb.clusterName: archive-fixture
    analyticsStore.pgDuckdb.s3.secretName: fixture-object-store
    analyticsStore.pgDuckdb.s3.bucket: telemetry-archive.example
    analyticsStore.pgDuckdb.s3.endpoint: objects.example.com
    analyticsStore.pgDuckdb.s3.region: example-region
    analyticsStore.pgDuckdb.s3.egressCidrs: &id001
    - 192.0.2.0/24
    analyticsStore.driver: hybrid
    analyticsStore.tables:
    - timeseries_metrics
  asserts:
  - equal:
      path: metadata.name
      value: archive-fixture
    template: templates/cold-analytics-head.yaml
  - equal:
      path: spec.postgresql.parameters.max_connections
      value: '60'
    template: templates/cold-analytics-head.yaml
  - equal:
      path: spec.postgresql.parameters["duckdb.disabled_filesystems"]
      value: LocalFileSystem
    template: templates/cold-analytics-head.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_DRIVER
        value: hybrid
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_TABLES
        value: timeseries_metrics
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_HOT_WINDOW_DAYS
        value: '30'
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_PARQUET_RETENTION_DAYS
        value: ''
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_STORAGE
        value: s3
      count: 1
    template: templates/core.yaml
    documentSelector:
