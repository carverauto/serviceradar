      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_S3_BUCKET_URL
        value: s3://telemetry-archive.example
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_S3_ENDPOINT
        value: objects.example.com
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_S3_REGION
        value: example-region
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SERVICERADAR_ANALYTICS_STORE_POOL_SIZE
        value: '4'
      count: 1
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
  - contains:
