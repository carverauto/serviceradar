suite: the StarRocks analytics config refuses to render without the Frontend password Secret
# One template per suite on purpose: helm-unittest attributes a `fail` to the
# template it fired in, so only a single-template suite proves THIS template
# refuses on its own. This one renders whenever StarRocks analytics is on, even
# with every workload disabled, and carries the full message verbatim.
templates:
  - templates/starrocks-analytics-config.yaml
tests:
  - it: fails the render with the full message when fePasswordSecretName is empty
    set:
      analytics.starrocks.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: 'analytics.starrocks.catalog.fePasswordSecretName is required when analytics.starrocks.enabled=true: set it to a Secret in the release namespace whose key analytics.starrocks.catalog.fePasswordSecretKey (default "password") holds the StarRocks Frontend root password, the same value as the StarRocks operator''s initPassword Secret. A passwordless Frontend is not supported; see "Frontend root password" in k8s/starrocks/README.md.'

  - it: an explicitly empty name is refused the same way
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: 'analytics\.starrocks\.catalog\.fePasswordSecretName is required when analytics\.starrocks\.enabled=true'
