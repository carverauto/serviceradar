suite: StarRocks JDBC catalog credentials need no hand-made Secret
templates:
  - templates/secret-generator-job.yaml
  - templates/cnpg-cluster.yaml
  - templates/starrocks-catalog-job.yaml
release:
  namespace: sr-catalog-ns
set:
  analytics:
    starrocks:
      enabled: true
      fe:
        service: fe.starrocks.svc
        queryPort: 9030
      catalog:
        enabled: true
        jdbcUri: "jdbc:postgresql://cnpg-rw.sr-catalog-ns.svc:5432/serviceradar?ssl=true&sslmode=require"
tests:
  - it: the generator mints the reader secret and may patch it
    templates:
      - templates/secret-generator-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STARROCKS_READER_SECRET_NAME
            value: serviceradar-starrocks-reader
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STARROCKS_READER_USERNAME
            value: serviceradar_starrocks_reader
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'ensure_cnpg_secret "\$\{STARROCKS_READER_SECRET_NAME:-\}"'
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: rules[1].resourceNames
          content: serviceradar-starrocks-reader
        documentSelector:
          path: kind
          value: Role

  - it: the generator leaves the reader secret alone while the catalog is off
    templates:
      - templates/secret-generator-job.yaml
    set:
      analytics.starrocks.catalog.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STARROCKS_READER_SECRET_NAME
            value: ""
        documentSelector:
          path: kind
          value: Job
      - notContains:
          path: rules[1].resourceNames
          content: serviceradar-starrocks-reader
        documentSelector:
          path: kind
          value: Role

  - it: CNPG and the catalog Job read the same secret
    templates:
      - templates/cnpg-cluster.yaml
      - templates/starrocks-catalog-job.yaml
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: serviceradar_starrocks_reader
            ensure: present
            login: true
            passwordSecret:
              name: serviceradar-starrocks-reader
        template: templates/cnpg-cluster.yaml
        documentSelector:
          path: kind
          value: Cluster
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: READER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: serviceradar-starrocks-reader
                key: password
        template: templates/starrocks-catalog-job.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CATALOG_SQL
          any: true
        template: templates/starrocks-catalog-job.yaml

  - it: a renamed reader secret moves all three consumers together
    templates:
      - templates/cnpg-cluster.yaml
      - templates/starrocks-catalog-job.yaml
      - templates/secret-generator-job.yaml
    set:
      analytics.starrocks.catalog.readerPasswordSecret: custom-reader
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: serviceradar_starrocks_reader
            ensure: present
            login: true
            passwordSecret:
              name: custom-reader
        template: templates/cnpg-cluster.yaml
        documentSelector:
          path: kind
          value: Cluster
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: READER_USER
            valueFrom:
              secretKeyRef:
                name: custom-reader
                key: username
        template: templates/starrocks-catalog-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STARROCKS_READER_SECRET_NAME
            value: custom-reader
        template: templates/secret-generator-job.yaml
        documentSelector:
          path: kind
          value: Job

  - it: the catalog is recreated so a corrected password can reach it
    templates:
      - templates/starrocks-catalog-job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'DROP CATALOG IF EXISTS \$\{CATALOG_NAME\}; CREATE EXTERNAL CATALOG \$\{CATALOG_NAME\}'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JDBC_URI
            value: "jdbc:postgresql://cnpg-rw.sr-catalog-ns.svc:5432/serviceradar?ssl=true&sslmode=require"

  - it: an operator-supplied statement still overrides the built one
    templates:
      - templates/starrocks-catalog-job.yaml
    set:
      analytics.starrocks.catalog.secretName: my-catalog-sql
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CATALOG_SQL
            valueFrom:
              secretKeyRef:
                name: my-catalog-sql
                key: createSql
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: READER_PASSWORD
          any: true
