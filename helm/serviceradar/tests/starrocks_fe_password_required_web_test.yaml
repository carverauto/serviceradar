suite: web-ng refuses to render without the StarRocks Frontend password Secret
# One template per suite on purpose: helm-unittest attributes a `fail` to the
# template it fired in, so only a single-template suite proves THIS consumer
# refuses on its own. See starrocks_fe_password_test.yaml.
templates:
  - templates/web.yaml
tests:
  - it: fails the render when StarRocks analytics is enabled without fePasswordSecretName
    set:
      analytics.starrocks.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'analytics\.starrocks\.catalog\.fePasswordSecretName is required when analytics\.starrocks\.enabled=true'
