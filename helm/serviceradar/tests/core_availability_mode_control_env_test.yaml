suite: core availability mode control
templates:
  - templates/core.yaml
release:
  namespace: serviceradar-test
tests:
  - it: leaves the control to the settings UI by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AVAILABILITY_MODE_CONTROL
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: pins the configured control
    set:
      core.availability.modeControl: hold_legacy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AVAILABILITY_MODE_CONTROL
            value: hold_legacy
          count: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: refuses a value that is not a control
    set:
      core.availability.modeControl: cutover
    asserts:
      - failedTemplate:
          errorMessage: core.availability.modeControl must be auto, hold_legacy or hold_shadow, got "cutover"
