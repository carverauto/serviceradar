suite: dgraph ACL secret generator
templates:
  - templates/secret-generator-job.yaml
tests:
  - it: creates the ACL HMAC once and keeps it on 409
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: hmac_secret_file
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: leaving ACL HMAC unchanged
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DGRAPH_ACL_SECRET_NAME
            value: RELEASE-NAME-dgraph-alpha-acl-secret
        documentSelector:
          path: kind
          value: Job
