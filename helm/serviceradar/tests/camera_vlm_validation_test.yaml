suite: cameraVlm validation flags
templates:
  - templates/camera-vlm.yaml
release:
  name: serviceradar
  namespace: sr-test
tests:
  - it: refuses setting both cameraVlm.enabled and cameraVlm.externalUrl
    set:
      cameraVlm.enabled: true
      cameraVlm.externalUrl: "https://vlm.example.com/v1"
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "mutually exclusive"

  - it: refuses non-http externalUrl even when cameraVlm is disabled
    set:
      cameraVlm.enabled: false
      cameraVlm.externalUrl: "ftp://vlm.example.com/v1"
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.externalUrl must start with http:// or https://"

  - it: refuses missing image.repository when enabled
    set:
      cameraVlm.enabled: true
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.image.repository is required"

  - it: refuses missing image.tag and image.digest when enabled
    set:
      cameraVlm.enabled: true
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "requires cameraVlm.image.tag or cameraVlm.image.digest"

  - it: refuses missing modelFile for llama-server without custom args
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: llama-server
      cameraVlm.image.repository: ghcr.io/ggml-org/llama.cpp
      cameraVlm.image.tag: server-cuda
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.models.modelFile is required"
