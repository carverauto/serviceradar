suite: CNPG Secrets the generator created are never handed to Helm for adoption
templates:
  - templates/cnpg-cluster.yaml
release:
  name: sr
  namespace: srtest
set:
  cnpg.superuserPassword: example
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
tests:
  # A fresh install's secret generator creates cnpg-superuser without Helm
  # ownership metadata. Rendering it makes every later `helm upgrade` fail with
  # "cannot be imported into the current release".
  - it: leaves a generator-created superuser Secret out of the release
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: cnpg-superuser
            namespace: srtest
            annotations:
              helm.sh/resource-policy: keep
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: cnpg-superuser
          any: true
        not: true
      - containsDocument:
          kind: Cluster
          apiVersion: postgresql.cnpg.io/v1
          name: cnpg
          any: true

  - it: leaves a Secret missing app.kubernetes.io/managed-by=Helm out of the release
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: cnpg-superuser
            namespace: srtest
            annotations:
              meta.helm.sh/release-name: sr
              meta.helm.sh/release-namespace: srtest
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: cnpg-superuser
          any: true
        not: true

  - it: keeps rendering a superuser Secret this release already owns
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: cnpg-superuser
            namespace: srtest
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: sr
              meta.helm.sh/release-namespace: srtest
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: cnpg-superuser
          any: true
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
        documentSelector:
          path: metadata.name
          value: cnpg-superuser
      - equal:
          path: metadata.annotations["meta.helm.sh/release-name"]
          value: sr
        documentSelector:
          path: metadata.name
          value: cnpg-superuser
      - equal:
          path: metadata.annotations["meta.helm.sh/release-namespace"]
          value: srtest
        documentSelector:
          path: metadata.name
          value: cnpg-superuser

  - it: still renders the superuser Secret on a first install with Helm ownership metadata
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: cnpg-superuser
          any: true
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
        documentSelector:
          path: metadata.name
          value: cnpg-superuser
      - equal:
          path: metadata.annotations["meta.helm.sh/release-name"]
          value: sr
        documentSelector:
          path: metadata.name
          value: cnpg-superuser
      - equal:
          path: metadata.annotations["meta.helm.sh/release-namespace"]
          value: srtest
        documentSelector:
          path: metadata.name
          value: cnpg-superuser
