suite: Shared CNPG configuration defaults and overrides
templates:
  - templates/cnpg-cluster.yaml
release:
  namespace: synthetic-namespace
tests:
  - it: keeps the native built-in defaults
    template: templates/cnpg-cluster.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: metadata.name
          value: cnpg
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.storage.size
          value: 100Gi
  - it: applies neutral CNPG cluster overrides
    template: templates/cnpg-cluster.yaml
    set:
      cnpg.clusterName: synthetic-db
      cnpg.instances: 1
      cnpg.storageSize: 40Gi
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: metadata.name
          value: synthetic-db
      - equal:
          path: spec.instances
          value: 1
      - equal:
          path: spec.storage.size
          value: 40Gi
