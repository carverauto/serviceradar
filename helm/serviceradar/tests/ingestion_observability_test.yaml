suite: result ingestion prometheus rules and grafana dashboard
templates:
  - templates/serviceradar-prometheus-rules.yaml
  - templates/grafana-dashboards.yaml
release:
  namespace: sr-test
tests:
  - it: renders non-accepted admission lane and incomplete sync run alerts when observability is enabled
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarAdmissionLaneNotAccepted
            expr: sum by (lane) (increase(serviceradar_admission_lane_completion_count{namespace="sr-test", outcome="not_accepted"}[5m])) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ServiceRadar admission lane recorded non-accepted completions"
              description: "One or more core admission lanes recorded non-accepted completion outcomes in namespace sr-test."
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarSyncIncompleteRun
            expr: sum by (lane) (increase(serviceradar_admission_lane_incomplete_run_count{namespace="sr-test"}[15m])) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ServiceRadar sync ingestion detected an incomplete sync run"
              description: "Sync ingestion recorded an incomplete sync run and skipped snapshot finalization in namespace sr-test."

  - it: pages on any record held in the edge-record security quarantine
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarEdgeRecordSecurityQuarantine
            expr: max(serviceradar_event_writer_consumer_stream_bytes_value{namespace="sr-test", subject_class="edge_record_quarantine"}) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "ServiceRadar edge records are held in security quarantine"
              description: "The edge-record security-quarantine stream holds records signed by a compromise-revoked key in namespace sr-test. The EventWriter log line 'Edge record held in security quarantine' names each record's stream sequence; see docs/edge-record-quarantine-runbook.md."

  - it: ships the ingestion edge dashboard configmap when grafana dashboards are enabled
    template: templates/grafana-dashboards.yaml
    set:
      observability.enabled: true
      observability.grafana.dashboards.enabled: true
    asserts:
      - isNotEmpty:
          path: data["serviceradar-ingestion-edge.json"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dashboard-serviceradar-ingestion-edge
