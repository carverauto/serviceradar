suite: result ingestion prometheus rules and grafana dashboard
templates:
  - templates/serviceradar-prometheus-rules.yaml
  - templates/grafana-dashboards.yaml
release:
  namespace: sr-test
tests:
  - it: renders non-accepted admission lane and incomplete sync run alerts when observability is enabled
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarAdmissionLaneNotAccepted
            expr: sum by (lane) (increase(serviceradar_admission_lane_completion_count{namespace="sr-test", outcome="not_accepted"}[5m])) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ServiceRadar admission lane recorded non-accepted completions"
              description: "One or more core admission lanes recorded non-accepted completion outcomes in namespace sr-test."
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarSyncIncompleteRun
            expr: sum by (lane) (increase(serviceradar_admission_lane_incomplete_run_count{namespace="sr-test"}[15m])) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ServiceRadar sync ingestion detected an incomplete sync run"
              description: "Sync ingestion recorded an incomplete sync run and skipped snapshot finalization in namespace sr-test."

  - it: pages on any record held in the edge-record security quarantine
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarEdgeRecordSecurityQuarantine
            expr: max(serviceradar_event_writer_consumer_stream_bytes_value{namespace="sr-test", subject_class="edge_record_quarantine"}) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "ServiceRadar edge records are held in security quarantine"
              description: "The edge-record security-quarantine stream holds records signed by a compromise-revoked key in namespace sr-test. The EventWriter log line 'Edge record held in security quarantine' names each record's stream sequence; see docs/edge-record-quarantine-runbook.md."

  - it: pages when an edge-record source stream nears its backlog cap
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarEdgeRecordBacklogPressure
            expr: max by (subject_class) (serviceradar_event_writer_consumer_stream_byte_utilization_ratio{namespace="sr-test", subject_class=~"edge_record|edge_record_audit"}) > 0.8
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "ServiceRadar edge-record backlog is nearly full"
              description: "The {{ $labels.subject_class }} edge-record source stream is above 80% of its MaxBytes in namespace sr-test. The streams hold only unwritten records, so the owning durable is stuck; DiscardNew refuses new records when full, which leaves those agent spool sequences unresolved. Fix the consumer before the backlog fills."

  - it: alerts on dead-lettered edge records and pages when a dead-letter cannot be stored
    template: templates/serviceradar-prometheus-rules.yaml
    set:
      observability.enabled: true
      observability.prometheus.rules.enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarEdgeRecordDeadLettered
            expr: sum by (contract, reason_class) ((increase(serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="stored"}[15m]) > 0) or (serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="stored"} unless serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="stored"} offset 15m)) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ServiceRadar edge records were dead-lettered"
              description: "EventWriter dead-lettered {{ $labels.contract }} edge records ({{ $labels.reason_class }}) in namespace sr-test after their projection kept failing. They are held in TELEMETRY_EDGE_RECORD_DLQ_V1_BULK; fix the cause, then replay them (docs/edge-record-dead-letter-runbook.md)."
      - contains:
          path: spec.groups[0].rules
          content:
            alert: ServiceRadarEdgeRecordDeadLetterPublishFailed
            expr: sum((increase(serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="failed"}[5m]) > 0) or (serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="failed"} unless serviceradar_event_writer_edge_record_dead_letter_count{namespace="sr-test", result="failed"} offset 5m)) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "ServiceRadar cannot dead-letter failing edge records"
              description: "EventWriter could not store a failing edge record in its dead-letter stream in namespace sr-test. The record stays on the edge-record stream and keeps retrying (source streams have no MaxAge); check the dead-letter stream exists and has room."

  - it: ships the ingestion edge dashboard configmap when grafana dashboards are enabled
    template: templates/grafana-dashboards.yaml
    set:
      observability.enabled: true
      observability.grafana.dashboards.enabled: true
    asserts:
      - isNotEmpty:
          path: data["serviceradar-ingestion-edge.json"]
        documentSelector:
          path: metadata.name
          value: serviceradar-dashboard-serviceradar-ingestion-edge
