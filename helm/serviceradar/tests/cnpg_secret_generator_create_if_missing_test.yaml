suite: secret-generator creates CNPG secrets only when missing
templates:
  - templates/secret-generator-job.yaml
tests:
  - it: treats HTTP 409 as keep the existing password
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'leaving password unchanged'
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\b409\b'
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CNPG_APP_SECRET_NAME
            value: serviceradar-db-credentials
        documentSelector:
          path: kind
          value: Job
