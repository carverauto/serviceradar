suite: secret-generator creates CNPG secrets only when missing
templates:
  - templates/secret-generator-job.yaml
release:
  name: sr-release
  namespace: sr-ns
tests:
  - it: treats HTTP 409 as keep the existing password and stamps Helm ownership metadata
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'leaving password unchanged'
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\b409\b'
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"meta\.helm\.sh/release-name":\s*"sr-release"'
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"meta\.helm\.sh/release-namespace":\s*"sr-ns"'
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"app\.kubernetes\.io/managed-by":\s*"Helm"'
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CNPG_APP_SECRET_NAME
            value: serviceradar-db-credentials
        documentSelector:
          path: kind
          value: Job
