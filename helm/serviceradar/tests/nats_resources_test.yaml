suite: NATS StatefulSet resources omit CPU limits by default
templates:
  - templates/nats.yaml
release:
  namespace: sr-nats-resources
tests:
  - it: omits resources.limits.cpu while keeping memory limits and 500m CPU request by default
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "4Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "1Gi"

  - it: keeps resources.limits.cpu absent with values-demo.yaml layered
    template: templates/nats.yaml
    values:
      - ../values-demo.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "4Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "1Gi"

  - it: renders resources.limits.cpu when explicitly set in values
    template: templates/nats.yaml
    set:
      nats.resources.limits.cpu: "4"
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "4"
