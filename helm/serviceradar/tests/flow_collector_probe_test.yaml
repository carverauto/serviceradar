suite: flow collector probes and service isolation
templates:
  - templates/flow-collector.yaml
  - templates/serviceradar-servicemonitors.yaml
tests:
  - it: uses an exec readiness probe against the ready marker file
    template: templates/flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      flowCollector.config.metrics_addr: "0.0.0.0:50046"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - test
            - -f
            - /var/lib/serviceradar/flow-collector.ready
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: isolates metrics on a dedicated ClusterIP service and excludes it from the main service
    template: templates/flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      flowCollector.config.metrics_addr: "0.0.0.0:50046"
      flowCollector.service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: flow-collector-ingress
      - notContains:
          path: spec.ports
          content:
            name: metrics
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: flow-collector-ingress
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: metadata.name
          value: serviceradar-flow-collector-metrics
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 50046
            protocol: TCP
            targetPort: 50046
        documentSelector:
          path: metadata.name
          value: serviceradar-flow-collector-metrics

  - it: updates servicemonitor to select dedicated metrics service
    template: templates/serviceradar-servicemonitors.yaml
    set:
      observability.enabled: true
      observability.prometheus.serviceMonitors.enabled: true
      flowCollector.enabled: true
      flowCollector.service.ports.metrics.enabled: true
      flowCollector.config.metrics_addr: "0.0.0.0:50046"
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: serviceradar-flow-collector-metrics
        documentSelector:
          path: metadata.name
          value: serviceradar-flow-collector
      - equal:
          path: spec.endpoints[0].port
          value: "metrics"
        documentSelector:
          path: metadata.name
          value: serviceradar-flow-collector
      - equal:
          path: spec.endpoints[0].path
          value: "/metrics"
        documentSelector:
          path: metadata.name
          value: serviceradar-flow-collector

  - it: requires metrics_addr when metrics are enabled
    template: templates/flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      flowCollector.config.metrics_addr: null
    asserts:
      - failedTemplate:
          errorMessage: "flowCollector.config.metrics_addr is required when flowCollector.service.ports.metrics is enabled"

  - it: fails when retired template_store is configured
    template: templates/flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      flowCollector.config.metrics_addr: "0.0.0.0:50046"
      flowCollector.config.template_store:
        kv_bucket: "test_templates"
    asserts:
      - failedTemplate:
          errorMessage: "flowCollector.config.template_store is unsupported; shared template persistence is retired"
