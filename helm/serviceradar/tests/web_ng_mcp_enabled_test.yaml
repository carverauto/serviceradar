suite: web-ng MCP feature flag
templates:
  - templates/web.yaml
tests:
  - it: defaults MCP off
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "false"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: renders MCP from webNg.mcpEnabled
    set:
      webNg.mcpEnabled: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "true"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "false"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: does not let extraEnv shadow webNg.mcpEnabled
    set:
      webNg.mcpEnabled: "false"
      webNg.extraEnv.SERVICERADAR_MCP_ENABLED: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "false"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "true"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: demo overlay enables MCP
    values:
      - ../values-demo.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_ENABLED
            value: "true"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: renders MCP client-credentials and refresh TTL flags
    set:
      webNg.mcpClientCredentialsEnabled: "false"
      webNg.mcpRefreshTtlSeconds: "3600"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_CLIENT_CREDENTIALS_ENABLED
            value: "false"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_MCP_REFRESH_TTL_SECONDS
            value: "3600"
          count: 1
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
