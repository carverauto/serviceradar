suite: in-cluster and external camera VLM runtime
templates:
  - templates/camera-vlm.yaml
  - templates/core.yaml
  - templates/web.yaml
  - templates/media-worker.yaml
  - templates/network-policy.yaml
  - templates/calico-network-policy.yaml
release:
  name: serviceradar
  namespace: sr-test
tests:
  - it: renders zero camera-vlm documents by default
    template: templates/camera-vlm.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: omits VLM env vars from core and web-ng when disabled
    templates:
      - templates/core.yaml
      - templates/web.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_ENABLED
            value: "true"
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_ENABLED
            value: "true"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: renders llama-server GPU deployment, ClusterIP service, and zero-egress NetworkPolicy
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: llama-server
      cameraVlm.replicas: 2
      cameraVlm.image.repository: ghcr.io/ggml-org/llama.cpp
      cameraVlm.image.tag: server-cuda
      cameraVlm.image.digest: "sha256:db9a58a154741e6a122ecbdb006303a6d7a9abbb5ec61b29a7e2e4d4e75137a6"
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.nodeSelector:
        kubernetes.io/arch: arm64
      cameraVlm.tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      cameraVlm.models.existingClaim: serviceradar-vlm-models
      cameraVlm.models.modelFile: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      cameraVlm.models.mmprojFile: mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec
          value:
            type: ClusterIP
            selector:
              app: serviceradar-camera-vlm
            ports:
              - name: http
                port: 8080
                targetPort: http
                protocol: TCP
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: spec.replicas
          value: 2
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app: serviceradar-camera-vlm
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:db9a58a154741e6a122ecbdb006303a6d7a9abbb5ec61b29a7e2e4d4e75137a6"
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--model"
            - "/models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
            - "--mmproj"
            - "/models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf"
            - "--ctx-size"
            - "4096"
            - "--parallel"
            - "1"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          value: 1
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: models
            mountPath: /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
            subPath: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
            readOnly: true
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: models
            mountPath: /models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
            subPath: mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
            readOnly: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app: serviceradar-camera-vlm
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - from:
                  - podSelector:
                      matchLabels:
                        app: serviceradar-core
                  - podSelector:
                      matchLabels:
                        app: serviceradar-web-ng
                  - podSelector:
                      matchLabels:
                        app: serviceradar-media-worker
                ports:
                  - protocol: TCP
                    port: 8080
            egress: []
        documentSelector:
          path: kind
          value: NetworkPolicy

  - it: renders crane pure-Rust Candle CUDA runtime with model directory mount and /v1/models healthPath
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: crane
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
      cameraVlm.models.modelSubPath: qwen3-vl-4b
      cameraVlm.extraArgs:
        - "--dtype"
        - "bf16"
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.template.metadata.annotations["serviceradar.io/camera-vlm-runtime"]
          value: crane
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--model-path"
            - "/models/qwen3-vl-4b"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--dtype"
            - "bf16"
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /v1/models
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: models
            mountPath: /models
            readOnly: true
        documentSelector:
          path: kind
          value: Deployment

  - it: supports custom command, args, and healthPath overrides
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: crane
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
      cameraVlm.command:
        - "/usr/local/bin/crane-serve"
      cameraVlm.args:
        - "--custom-flag"
      cameraVlm.healthPath: "/healthz"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - "/usr/local/bin/crane-serve"
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--custom-flag"
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
        documentSelector:
          path: kind
          value: Deployment

  - it: wires SERVICERADAR_CAMERA_VLM_ENABLED and SERVICERADAR_CAMERA_VLM_URL into core and web-ng when enabled
    templates:
      - templates/core.yaml
      - templates/web.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.port: 8080
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_ENABLED
            value: "true"
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_URL
            value: "http://serviceradar-camera-vlm.sr-test.svc.cluster.local:8080/v1/chat/completions"
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_ENABLED
            value: "true"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_URL
            value: "http://serviceradar-camera-vlm.sr-test.svc.cluster.local:8080/v1/chat/completions"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: wires external VLM URL into core and web-ng without deploying in-cluster VLM pod
    templates:
      - templates/camera-vlm.yaml
      - templates/core.yaml
      - templates/web.yaml
    set:
      cameraVlm.enabled: false
      cameraVlm.externalUrl: "https://vlm.example.com/v1"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/camera-vlm.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_URL
            value: "https://vlm.example.com/v1"
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_CAMERA_VLM_URL
            value: "https://vlm.example.com/v1"
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: excludes camera-vlm from broad egress policies and allows core, web-ng, and media-worker egress to it
    templates:
      - templates/network-policy.yaml
      - templates/calico-network-policy.yaml
      - templates/media-worker.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.port: 8080
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
      networkPolicy.enabled: true
      networkPolicy.calicoLogDenied.enabled: true
      mediaWorker.enabled: true
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.backend: stub
      mediaWorker.auth.existingSecret: example-media-worker-auth
      mediaWorker.auth.deploymentRef: "00000000-0000-4000-8000-000000000001"
      mediaWorker.auth.generation: "1"
      webNg.controlPlaneRuntime.mediaWorker.enabled: true
      webNg.controlPlaneRuntime.mediaWorker.existingSecret: example-media-worker-auth
      webNg.controlPlaneRuntime.mediaWorker.deploymentRef: "00000000-0000-4000-8000-000000000001"
      webNg.controlPlaneRuntime.mediaWorker.generation: "1"
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content:
            key: app
            operator: NotIn
            values:
              - serviceradar-camera-vlm
        template: templates/network-policy.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app: serviceradar-camera-vlm
            ports:
              - protocol: TCP
                port: 8080
        template: templates/network-policy.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-egress
      - matchRegex:
          path: spec.selector
          pattern: "app != 'serviceradar-camera-vlm'"
        template: templates/calico-network-policy.yaml
      - contains:
          path: spec.egress
          content:
            action: Allow
            protocol: TCP
            source:
              selector: "app == 'serviceradar-core' || app == 'serviceradar-web-ng'"
            destination:
              selector: "app == 'serviceradar-camera-vlm'"
              ports:
                - 8080
        template: templates/calico-network-policy.yaml
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app: serviceradar-camera-vlm
            ports:
              - protocol: TCP
                port: 8080
        template: templates/media-worker.yaml
        documentSelector:
          path: spec.podSelector.matchLabels.app
          value: serviceradar-media-worker

  - it: refuses disabling NetworkPolicy without operatorManaged
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.networkPolicy.enabled: false
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.networkPolicy.operatorManaged"

  - it: refuses missing models.existingClaim when enabled
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.image.repository: registry.carverauto.dev/serviceradar/serviceradar-camera-vlm-cuda
      cameraVlm.image.tag: sha-abcdef123456
      cameraVlm.runtimeClassName: nvidia
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.models.existingClaim is required"

  - it: refuses path traversal in models.modelFile
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: llama-server
      cameraVlm.image.repository: ghcr.io/ggml-org/llama.cpp
      cameraVlm.image.tag: server-cuda
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
      cameraVlm.models.modelFile: "../secret.gguf"
    asserts:
      - failedTemplate:
          errorPattern: "must be a clean relative path"

  - it: refuses unsupported cameraVlm.runtime
    template: templates/camera-vlm.yaml
    set:
      cameraVlm.enabled: true
      cameraVlm.runtime: ollama
      cameraVlm.image.repository: example.com/vlm
      cameraVlm.image.tag: v1
      cameraVlm.runtimeClassName: nvidia
      cameraVlm.models.existingClaim: serviceradar-vlm-models
    asserts:
      - failedTemplate:
          errorPattern: "cameraVlm.runtime must be crane or llama-server"
