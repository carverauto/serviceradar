suite: independently replicated NVR runtime and retained storage
templates:
  - templates/nvr.yaml
  - templates/core.yaml
  - templates/network-policy.yaml
  - templates/calico-network-policy.yaml
tests:
  - it: creates no NVR resources by default
    template: templates/nvr.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: requires explicit durable storage selection
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: nvr.storage.storageClassName must name a qualified node-loss-tolerant CSI class
  - it: requires a distinct identity for every replica
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000011
    asserts:
      - failedTemplate:
          errorMessage: NVR replicas must have distinct storage identities
  - it: requires independently managed recovery state
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
    asserts:
      - failedTemplate:
          errorMessage: nvr.recovery.existingConfigMap must name operator-owned recovery state
  - it: refuses a block fragment limit below the service range
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.maxBlockFragments: 7
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
    asserts:
      - failedTemplate:
          errorMessage: nvr.maxBlockFragments must be from 8 through 256
  - it: refuses a block fragment limit above the service range
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.maxBlockFragments: 257
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
    asserts:
      - failedTemplate:
          errorMessage: nvr.maxBlockFragments must be from 8 through 256
  - it: retains per-replica volumes through scale-down and workload deletion
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.maxSpoolBytes: 536870912
      nvr.reserveBytes: 134217728
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal: {path: "spec.replicas", value: 2}
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy
          value: {whenDeleted: Retain, whenScaled: Retain}
      - equal: {path: "spec.updateStrategy.type", value: OnDelete}
      - equal: {path: "spec.volumeClaimTemplates[0].spec.storageClassName", value: example-replicated}
      - equal: {path: "spec.volumeClaimTemplates[0].spec.accessModes", value: [ReadWriteOnce]}
      - equal: {path: "spec.template.spec.automountServiceAccountToken", value: false}
      - equal: {path: "spec.template.spec.securityContext.seccompProfile.type", value: RuntimeDefault}
      - equal: {path: "spec.template.spec.securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 10001}
      - equal: {path: "spec.template.spec.containers[0].args", value: [start]}
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "/serviceradar-nvr:"
      - notExists: {path: "spec.template.spec.initContainers"}
      - equal: {path: "spec.template.spec.containers[0].readinessProbe.httpGet.path", value: /readyz}
      - equal: {path: "spec.template.spec.containers[0].resources.limits.memory", value: 1Gi}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_MAX_SPOOL_BYTES, value: "536870912"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_RESERVE_BYTES, value: "134217728"}
      # A 270-second Core capture must fit one session and one block.
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_MAX_DURATION_MS, value: "300000"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_MAX_BLOCK_FRAGMENTS, value: "150"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NVR_RECOVERY_GENERATION
            valueFrom:
              configMapKeyRef: {name: synthetic-nvr-recovery, key: generation}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_RECOVERY_STATE_FILE, value: /etc/serviceradar/nvr-recovery/state.json}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: recovery, mountPath: /etc/serviceradar/nvr-recovery, readOnly: true}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: recovery
            configMap: {name: synthetic-nvr-recovery, optional: false}
      - notExists: {path: "spec.template.spec.containers[0].volumeMounts[2].subPath"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_INGEST_CONFIG_FILE}
          any: true
  - it: refuses shared server and client TLS secrets for private NVR ingest
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
      nvr.ingest.enabled: true
      nvr.ingest.configSecretName: example-nvr-ingest-config
      nvr.ingest.tokenSecretName: example-nvr-ingest-token
      nvr.ingest.tlsSecretName: example-shared-tls
      nvr.ingest.client.configSecretName: example-nvr-client-config
      nvr.ingest.client.tokenSecretName: example-nvr-ingest-token
      nvr.ingest.client.tlsSecretName: example-shared-tls
    asserts:
      - failedTemplate:
          errorMessage: nvr.ingest server and client TLS Secrets must be distinct
  - it: mounts private workload mTLS and token inputs on NVR and Core when ingest is enabled
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
      nvr.ingest.enabled: true
      nvr.ingest.port: 8443
      nvr.ingest.configSecretName: example-nvr-ingest-config
      nvr.ingest.tokenSecretName: example-nvr-ingest-token
      nvr.ingest.tlsSecretName: example-nvr-server-tls
      nvr.ingest.client.cameraRecordingEnabled: true
      nvr.ingest.client.configSecretName: example-nvr-client-config
      nvr.ingest.client.tokenSecretName: example-nvr-ingest-token
      nvr.ingest.client.tlsSecretName: example-nvr-client-tls
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
      networkPolicy.calicoLogDenied.enabled: true
    asserts:
      - template: templates/nvr.yaml
        documentSelector:
          path: kind
          value: Service
        contains:
          path: spec.ports
          content: {name: ingest-https, port: 8443, targetPort: ingest-https}
      - template: templates/nvr.yaml
        documentSelector:
          path: kind
          value: StatefulSet
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_INGEST_CONFIG_FILE, value: /etc/serviceradar/nvr-ingest/config/config.json}
      - template: templates/nvr.yaml
        documentSelector:
          path: kind
          value: StatefulSet
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_INGEST_TOKEN_FILE, value: /etc/serviceradar/nvr-ingest/auth/ingest-token}
      - template: templates/nvr.yaml
        documentSelector:
          path: kind
          value: NetworkPolicy
        equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app: serviceradar-core
              ports:
                - {protocol: TCP, port: 8443}
      - template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_CLIENT_CONFIG_FILE, value: /etc/serviceradar/nvr-client/config/config.json}
      - template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NVR_CLIENT_TOKEN_FILE, value: /etc/serviceradar/nvr-client/auth/ingest-token}
      - template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_CAMERA_RECORDING_ENABLED, value: "true"}
      - template: templates/network-policy.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-egress
        contains:
          path: spec.podSelector.matchExpressions
          content:
            key: app
            operator: NotIn
            values: [serviceradar-nvr]
      - template: templates/network-policy.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-egress
        contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app: serviceradar-nvr
            ports:
              - {protocol: TCP, port: 8443}
      - template: templates/calico-network-policy.yaml
        documentSelector:
          path: kind
          value: NetworkPolicy
        contains:
          path: spec.egress
          content:
            action: Allow
            protocol: TCP
            source:
              selector: "app == 'serviceradar-core'"
            destination:
              selector: "app == 'serviceradar-nvr'"
              ports: [8443]
