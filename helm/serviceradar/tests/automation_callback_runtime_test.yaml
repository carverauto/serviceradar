suite: automation callback runtime contract
templates:
  - templates/agent-gateway.yaml
  - templates/core.yaml
  - templates/web.yaml
# Assertions are scoped with `template:` and select documents by a path that is unique
# within that template. Selecting on metadata.name matches several documents here and
# fails with `multiple indexes found`. See README.md in this directory.
tests:
  - it: keeps callback custody absent when the feature is disabled with a legacy Secret
    set:
      secrets.autoGenerate: false
      secrets.existingSecretName: legacy-serviceradar-secrets
      automationCallbacks.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_HMAC_KEYRING_FILE
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_FILE
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_FILE
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: automation-callback-secrets
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: automation-callback-envelope
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: gives issuance custody only to web and envelope custody only to core
    set:
      webNg.publicUrl: https://demo.example.com
      automationCallbacks.enabled: true
      automationCallbacks.awxCredentialTypeId: 68
      automationCallbacks.awxOrganizationId: 3
      automationCallbacks.awxInjectorDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      automationCallbacks.responsePolicy.existingSecretName: callback-policy
      automationCallbacks.responsePolicy.secretKey: reviewed.json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ORIGIN
            value: https://demo.example.com
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_HMAC_KEYRING_FILE
            value: /etc/serviceradar/automation-callback/hmac-keyring.json
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_FILE
            value: /etc/serviceradar/automation-callback/envelope-key
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_HMAC_KEYRING_FILE
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ORIGIN
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_FILE
            value: /etc/serviceradar/automation-callback/envelope-key
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_HMAC_KEYRING_FILE
        template: templates/agent-gateway.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_FILE
        template: templates/agent-gateway.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: automation-callback-envelope
            secret:
              secretName: serviceradar-secrets
              defaultMode: 288
              items:
                - key: automation-callback-envelope-key
                  path: envelope-key
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: automation-callback-secrets
            secret:
              secretName: serviceradar-secrets
              defaultMode: 288
              items:
                - key: automation-callback-hmac-keyring
                  path: hmac-keyring.json
                - key: automation-callback-envelope-key
                  path: envelope-key
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: permits a deployment-owned web origin and envelope key identifier
    set:
      webNg.publicUrl: https://public.example.com
      automationCallbacks.enabled: true
      automationCallbacks.canonicalOrigin: https://callbacks.example.com:8443
      automationCallbacks.envelopeKeyId: envelope-v2
      automationCallbacks.awxCredentialTypeId: 68
      automationCallbacks.awxOrganizationId: 3
      automationCallbacks.awxInjectorDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      automationCallbacks.responsePolicy.existingSecretName: callback-policy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ORIGIN
            value: https://callbacks.example.com:8443
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_AUTOMATION_CALLBACK_ENVELOPE_KEY_ID
            value: envelope-v2
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
