suite: core is given only the public certificates of the chart's NATS identities
templates:
  - templates/core.yaml
  - templates/web.yaml
  - templates/cert-generator-job.yaml
release:
  namespace: sr-inventory
tests:
  # The generator writes every chart identity's certificate, so core can be
  # given all of them. No private key is among them.
  - it: projects every chart identity's public certificate when the generator owns the Secret
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: &generatedInventory
            name: nats-infrastructure-certs
            secret:
              secretName: serviceradar-runtime-certs
              items:
                - {key: tools.pem, path: tools.pem}
                - {key: web.pem, path: web.pem}
                - {key: core.pem, path: core.pem}
                - {key: gateway.pem, path: gateway.pem}
                - {key: kv.pem, path: kv.pem}
                - {key: agent.pem, path: agent.pem}
                - {key: log-collector.pem, path: log-collector.pem}
                - {key: trapd.pem, path: trapd.pem}
                - {key: flow-collector.pem, path: flow-collector.pem}
                - {key: bmp-collector.pem, path: bmp-collector.pem}
                - {key: falcosidekick.pem, path: falcosidekick.pem}
                - {key: trivy-sidecar.pem, path: trivy-sidecar.pem}
                - {key: k8s-inventory.pem, path: k8s-inventory.pem}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nats-infrastructure-certs
            mountPath: /etc/serviceradar/nats-infrastructure-certs
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_INFRASTRUCTURE_CERTS_DIR
            value: /etc/serviceradar/nats-infrastructure-certs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CHART_IDENTITIES_FILE
            value: /etc/serviceradar/nats-static-users/chart-identities.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_INFRASTRUCTURE_ROOT_FILE
            value: /etc/serviceradar/certs/root.pem

  - it: projects every generated identity from the runtime Secret with a separate issuer
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      certs.issuerSecretName: separate-issuer
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: *generatedInventory

  - it: leaves core inventory inactive with an external broker
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content: {name: nats-infrastructure-certs}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: nats-infrastructure-certs}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NATS_CHART_IDENTITIES_FILE}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NATS_INFRASTRUCTURE_CERTS_DIR}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_NATS_INFRASTRUCTURE_ROOT_FILE}
          any: true

  # A supplier's Secret is not known to carry any of these files, and a Secret
  # volume does not mount when a listed key is missing. With nothing listed the
  # directory is empty, never the whole Secret.
  - it: projects nothing by default when the generator is disabled
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      certs.generator.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: &emptyInventory
            name: nats-infrastructure-certs
            emptyDir: {}

  - it: projects an empty inventory by default in hosted mode
    template: templates/core.yaml
    set: &hostedGenerator
      hostedRuntime.contractVersion: v1
      certs.generator.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: *emptyInventory

  - it: leaves generation to the supplier in hosted mode
    template: templates/cert-generator-job.yaml
    set: *hostedGenerator
    asserts:
      - hasDocuments:
          count: 0

  - it: projects exactly the certificates a supplier lists
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      certs.generator.enabled: false
      certs.inventoryCertificates:
        - core.pem
        - web.pem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats-infrastructure-certs
            secret:
              secretName: serviceradar-runtime-certs
              items:
                - {key: core.pem, path: core.pem}
                - {key: web.pem, path: web.pem}

  - it: ignores a supplier list while the generator owns the Secret
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      certs.inventoryCertificates:
        - core.pem
    asserts:
      - contains:
          path: spec.template.spec.volumes[?(@.name == "nats-infrastructure-certs")].secret.items
          content:
            key: bmp-collector.pem
            path: bmp-collector.pem

  - it: refuses a private key in the supplier list
    template: templates/core.yaml
    set:
      certs.generator.enabled: false
      certs.inventoryCertificates:
        - core-key.pem
    asserts:
      - failedTemplate:
          errorPattern: 'certs\.inventoryCertificates lists core-key\.pem: allowed names are'

  - it: refuses an unrelated Secret key in the supplier list
    template: templates/core.yaml
    set:
      certs.generator.enabled: false
      certs.inventoryCertificates: [jwt-secret]
    asserts:
      - failedTemplate:
          errorPattern: 'certs\.inventoryCertificates lists jwt-secret: allowed names are'

  - it: gives the inventory to no other workload
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats-infrastructure-certs
          any: true

  # A Secret from an older release that lacks one of the projected files must
  # take the regeneration path before core rolls.
  - it: makes every projected certificate a required file of the generator
    template: templates/cert-generator-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - root.pem
            - root-key.pem
            - tools-key.pem
            - falcosidekick-key.pem
            - trivy-sidecar-key.pem
            - k8s-inventory-key.pem
            - runtime-cert-layout-version
            - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-chain.pem"
            - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-key.pem"
            - tools.pem
            - web.pem
            - core.pem
            - gateway.pem
            - kv.pem
            - agent.pem
            - log-collector.pem
            - trapd.pem
            - flow-collector.pem
            - bmp-collector.pem
            - falcosidekick.pem
            - trivy-sidecar.pem
            - k8s-inventory.pem

  - it: keeps the previous generator requirements with external NATS
    template: templates/cert-generator-job.yaml
    set:
      nats.enabled: false
    documentSelector:
      path: kind
      value: Job
    asserts: &previousGeneratorRequirements
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - root.pem
            - root-key.pem
            - tools-key.pem
            - falcosidekick-key.pem
            - trivy-sidecar-key.pem
            - k8s-inventory-key.pem
            - runtime-cert-layout-version
            - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-chain.pem"
            - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-key.pem"
            - tools.pem
            - falcosidekick.pem
            - trivy-sidecar.pem
            - k8s-inventory.pem

  - it: keeps the previous generator requirements with core disabled
    template: templates/cert-generator-job.yaml
    set:
      core.enabled: false
    documentSelector:
      path: kind
      value: Job
    asserts: *previousGeneratorRequirements
