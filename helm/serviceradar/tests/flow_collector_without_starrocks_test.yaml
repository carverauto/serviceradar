suite: netflow requires starrocks
templates:
  - flow-collector.yaml
tests:
  # Flows are stored only in StarRocks; EventWriter has no CNPG flow write.
  # A collector without the warehouse would deliver flows that are dropped,
  # so the chart refuses to render it. The bootstrap Job's refusal is in
  # flow_collector_bootstrap_test.yaml: a fail in one template of a suite
  # leaves the others with no failed document.
  - it: refuses the collector when starrocks is disabled
    template: flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "flowCollector.enabled requires analytics.starrocks.enabled: NetFlow, sFlow and IPFIX flows are stored only in StarRocks"
  - it: does not deploy the collector when flowCollector.enabled is false
    template: flow-collector.yaml
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      flowCollector.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the collector when starrocks is enabled
    template: flow-collector.yaml
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
