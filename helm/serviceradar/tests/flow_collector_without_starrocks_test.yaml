suite: netflow renders without starrocks
templates:
  - flow-collector.yaml
tests:
  # NetFlow collection must stay deployable on a CNPG-only install: the
  # collector publishes to JetStream and EventWriter persists to CNPG
  # hypertables whether or not the warehouse is present.
  - it: renders the collector when starrocks is disabled
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
  - it: does not deploy the collector when flowCollector.enabled is false
    set:
      analytics.starrocks.enabled: true
      flowCollector.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the collector when starrocks is also enabled
    set:
      flowCollector.enabled: true
      analytics.starrocks.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-flow-collector
