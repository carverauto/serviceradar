suite: DataService agent authorization
templates:
  - templates/serviceradar-config.yaml
tests:
  - it: keeps both agent identities read-only while core remains a writer
    asserts:
      - matchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "spiffe://[^"]+/ns/[^"]+/sa/serviceradar-agent", "role": "reader"'
      - matchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "CN=serviceradar-agent,[^"]+", "role": "reader"'
      - matchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "CN=serviceradar-core,[^"]+", "role": "writer"'
      - notMatchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "spiffe://[^"]+/ns/[^"]+/sa/serviceradar-agent", "role": "writer"'
      - notMatchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "CN=serviceradar-agent,[^"]+", "role": "writer"'
  - it: authorizes the neutral agent account under the neutral trust domain
    set:
      trustDomain: synthetic.example.test
      spire.trustDomain: legacy.example.test
      serviceAccounts.agent: synthetic-agent
      spire.serviceradarAgentServiceAccount: legacy-agent
    asserts:
      - matchRegex:
          path: data["datasvc.json"]
          pattern: '"identity": "spiffe://synthetic[.]example[.]test/ns/[^"]+/sa/synthetic-agent", "role": "reader"'
      - notMatchRegex:
          path: data["datasvc.json"]
          pattern: 'spiffe://legacy[.]example[.]test/'
