suite: one setting turns NATS certificate authorization on
templates:
  - templates/nats.yaml
  - templates/core.yaml
  - templates/web.yaml
release:
  namespace: sr-nats-callout
tests:
  - it: does not install authorization callout by default
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'auth_callout|nats-callout-'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)user: "CN=serviceradar-agent-gateway,[^"]+"\s+permissions: \{.*?subscribe: \{\s+allow: \[">"\]\s+deny: \["\\\$SYS\.>", "flow\.attributed\.>", "flow\.host-slice\.>"\]'
      - equal:
          path: spec.template.spec.volumes[?(@.name == "cert-data")].secret.items
          value:
            - {key: root.pem, path: root.pem}
            - {key: nats.pem, path: nats.pem}
            - {key: nats-key.pem, path: nats-key.pem}

  - it: refuses callout with the certificate regenerator, which reissues the root CA
    template: templates/nats.yaml
    set:
      certs.regenerator.enabled: true
      nats.certificateAuthorization.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "nats.certificateAuthorization.enabled cannot be combined with certs.regenerator.enabled: the regenerator reissues every runtime certificate from a new root CA, which adopted components cannot rotate onto"

  # The broker's half of the signing set is public keys only, read from the
  # runtime certificate Secret where the generator or the supplier put it.
  - it: gives the broker the two public fragments and nothing secret
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      nats.certificateAuthorization.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "cert-data")].secret.items
          value:
            - {key: root.pem, path: root.pem}
            - {key: nats.pem, path: nats.pem}
            - {key: nats-key.pem, path: nats-key.pem}
            - {key: nats-callout-authorization.conf, path: nats-callout-authorization.conf}
            - {key: nats-callout-accounts.conf, path: nats-callout-accounts.conf}
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\$\(cat /etc/serviceradar/certs/nats-callout-authorization\.conf\)'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)accounts \{\s+\$\(cat /etc/serviceradar/certs/nats-callout-accounts\.conf\)'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)SYS: \{\s+users: \[\]'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\.seed|BEGIN NKEY|PRIVATE'

  # Core signs every grant with the seeds, from the issuer Secret.
  - it: gives core the three seeds from the issuer Secret, optionally
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats-callout-seeds
            secret:
              secretName: serviceradar-runtime-certs
              optional: true
              defaultMode: 288
              items:
                - {key: nats-callout-issuer.seed, path: nats-callout-issuer.seed}
                - {key: nats-callout-auth.seed, path: nats-callout-auth.seed}
                - {key: nats-callout-system.seed, path: nats-callout-system.seed}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nats-callout-seeds
            mountPath: /etc/serviceradar/nats-callout-seeds
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CALLOUT_SEEDS_DIR
            value: /etc/serviceradar/nats-callout-seeds

  - it: reads the seeds from a distinct issuer Secret when one is configured
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
      certs.issuerSecretName: example-issuer
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "nats-callout-seeds")].secret.secretName
          value: example-issuer

  - it: gives core no seeds while certificate authorization is off
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats-callout-seeds
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CALLOUT_SEEDS_DIR
          any: true

  - it: gives the seeds to no other workload
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats-callout-seeds
          any: true

  # Core cannot inspect the chart or broker configuration, so the chart tells
  # it whether enforcement and the leafnodes listener were rendered.
  - it: tells core enforcement and leaf listener are both off by default
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CERTIFICATE_AUTHORIZATION_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_LEAF_LISTENER_ENABLED
            value: "false"

  - it: tells core leaf listener is still off when leafnodes is on without enforcement
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.leafnodes.enabled: true
      nats.certificateAuthorization.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CERTIFICATE_AUTHORIZATION_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_LEAF_LISTENER_ENABLED
            value: "false"

  - it: tells core enforcement is on and leaf listener is off when only enforcement is enabled
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
      nats.leafnodes.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CERTIFICATE_AUTHORIZATION_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_LEAF_LISTENER_ENABLED
            value: "false"

  - it: tells core enforcement and leaf listener are both on when both settings are enabled
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
      nats.leafnodes.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CERTIFICATE_AUTHORIZATION_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_LEAF_LISTENER_ENABLED
            value: "true"

  - it: does not render hub readiness settings on other workloads
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      nats.certificateAuthorization.enabled: true
      nats.leafnodes.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_CERTIFICATE_AUTHORIZATION_ENABLED
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_NATS_LEAF_LISTENER_ENABLED
          any: true
