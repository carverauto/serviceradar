suite: media worker inference backend, GPU guards, NATS identity and network reach
templates:
  - templates/media-worker.yaml
  - templates/network-policy.yaml
  - templates/nvr.yaml
  - templates/nats.yaml
  - templates/core.yaml
  - templates/calico-network-policy.yaml
  - templates/cnpg-application-network-policy.yaml
  - templates/cnpg-media-worker-guard-network-policy.yaml
release:
  name: serviceradar
  namespace: sr-media-test
# A worker that renders: CUDA on a GPU runtime class, weights on a PVC, and the
# same deployment identity on both sides of web-ng's read-grant listener.
set:
  mediaWorker.enabled: true
  mediaWorker.runtimeClassName: nvidia
  mediaWorker.image.repository: registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda
  mediaWorker.image.tag: sha-0123456789abcdef0123456789abcdef01234567
  mediaWorker.models.existingClaim: example-media-models-pvc
  mediaWorker.auth.existingSecret: example-media-worker-auth
  mediaWorker.auth.deploymentRef: "00000000-0000-4000-8000-000000000003"
  mediaWorker.auth.generation: "2"
  webNg.controlPlaneRuntime.mediaWorker.enabled: true
  webNg.controlPlaneRuntime.mediaWorker.existingSecret: example-media-worker-auth
  webNg.controlPlaneRuntime.mediaWorker.deploymentRef: "00000000-0000-4000-8000-000000000003"
  webNg.controlPlaneRuntime.mediaWorker.generation: "2"
tests:
  - it: runs the candle backend on the CUDA device against the mounted weights
    template: templates/media-worker.yaml
    set:
      mediaWorker.models.mountPath: /opt/synthetic-models
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_BACKEND, value: candle}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_DEVICE, value: cuda}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_MODEL_DIR, value: /opt/synthetic-models}
      # Only the three SigLIP files: a detector file on the PVC must stay invisible.
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - {name: tmp, mountPath: /tmp}
            - {name: cert-data, mountPath: /etc/serviceradar/certs, readOnly: true}
            - {name: cuda-cache, mountPath: /var/cache/serviceradar-media-worker/cuda}
            - {name: models, mountPath: /opt/synthetic-models/config.json, subPath: config.json, readOnly: true}
            - {name: models, mountPath: /opt/synthetic-models/model.safetensors, subPath: model.safetensors, readOnly: true}
            - {name: models, mountPath: /opt/synthetic-models/tokenizer.json, subPath: tokenizer.json, readOnly: true}

  - it: runs the deterministic stub only when chosen, on the CPU and without weights
    template: templates/media-worker.yaml
    set:
      mediaWorker.backend: stub
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.models.existingClaim: ""
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_BACKEND, value: stub}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_DEVICE, value: cpu}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_MODEL_DIR}
          any: true

  - it: refuses the candle backend without a weights volume
    template: templates/media-worker.yaml
    set:
      mediaWorker.models.existingClaim: ""
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.backend candle loads SigLIP weights .* set mediaWorker.models.existingClaim"

  - it: refuses CUDA execution without the NVIDIA runtime class
    template: templates/media-worker.yaml
    set:
      mediaWorker.runtimeClassName: ""
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.executionProvider cuda needs the NVIDIA container runtime: set mediaWorker.runtimeClassName"

  - it: refuses a CPU device under a GPU execution provider
    template: templates/media-worker.yaml
    set:
      mediaWorker.device: cpu
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.device cpu contradicts mediaWorker.executionProvider cuda"

  - it: refuses a model identity that differs from core's, even while the worker is off
    template: templates/media-worker.yaml
    set:
      mediaWorker.enabled: false
      mediaWorker.models.embedderModelId: siglip-base-patch16-384
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.models.embedderModelId is not configurable: core dispatches jobs and semantic-search requests with its built-in model identity \\(embedder siglip-b16-384 2026.1"

  - it: refuses detector weights whose detections the pinned identity would mislabel
    template: templates/media-worker.yaml
    set:
      mediaWorker.models.detectorPath: /var/lib/serviceradar-media-worker/models/detector.safetensors
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.models.detectorPath is not supported: the worker indexes whole scenes only"

  - it: refuses a CUDA device under cpu_explicit, which requests no GPU
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.device: cuda
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.device cuda contradicts mediaWorker.executionProvider cpu_explicit"

  - it: refuses zero GPUs under a GPU execution provider
    template: templates/media-worker.yaml
    set:
      mediaWorker.gpuCount: 0
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.gpuCount must be >= 1 under mediaWorker.executionProvider cuda"

  - it: scales a GPU worker to zero and replaces it without a surge pod
    template: templates/media-worker.yaml
    set:
      mediaWorker.replicas: 0
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 0
      - equal:
          path: spec.strategy
          value: {type: Recreate}

  - it: rolls a cpu_explicit worker and requests no GPU even with gpuCount 0
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.gpuCount: 0
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy
          value: {type: RollingUpdate}
      - notExists:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]

  - it: refuses to run without web-ng's read-grant listener
    template: templates/media-worker.yaml
    set:
      webNg.controlPlaneRuntime.mediaWorker.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.enabled needs webNg.controlPlaneRuntime.mediaWorker.enabled"

  - it: refuses a worker generation web-ng would reject
    template: templates/media-worker.yaml
    set:
      webNg.controlPlaneRuntime.mediaWorker.generation: "3"
    asserts:
      - failedTemplate:
          errorMessage: mediaWorker.auth.generation must equal webNg.controlPlaneRuntime.mediaWorker.generation

  - it: checks the listener for an explicitly configured URL of this release's web-ng
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: http://serviceradar-web-ng-headless.sr-media-test.svc.cluster.local:4001
      webNg.controlPlaneRuntime.mediaWorker.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.enabled needs webNg.controlPlaneRuntime.mediaWorker.enabled"

  - it: refuses this release's web-ng as control plane when web-ng is not deployed
    template: templates/media-worker.yaml
    set:
      webNg.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker control plane http://serviceradar-web-ng-headless.sr-media-test.svc.cluster.local:4001 is this release's web-ng, but webNg.enabled is false"

  - it: refuses this release's web-ng on a port other than its control-plane listener
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: http://serviceradar-web-ng-headless.sr-media-test.svc.cluster.local:4000
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.controlPlaneUrl http://serviceradar-web-ng-headless.sr-media-test.svc.cluster.local:4000 must use webNg.controlPlaneRuntime.port 4001"

  - it: recognises this release's web-ng regardless of host case and a DNS root dot
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: HTTP://ServiceRadar-Web-NG-Headless.SR-Media-Test.svc.cluster.local.:4001
      webNg.controlPlaneRuntime.mediaWorker.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.enabled needs webNg.controlPlaneRuntime.mediaWorker.enabled"

  - it: refuses the ClusterIP web-ng Service, which does not expose the control-plane port
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: http://serviceradar-web-ng:4001
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.controlPlaneUrl http://serviceradar-web-ng:4001 names the serviceradar-web-ng Service, which does not expose web-ng's private control-plane port"

  - it: refuses HTTPS to web-ng's plain-HTTP control-plane listener
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: https://serviceradar-web-ng-headless:4001
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.controlPlaneUrl https://serviceradar-web-ng-headless:4001 must use http"

  - it: refuses a path the worker would prefix to the read-grant endpoint
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: http://serviceradar-web-ng-headless:4001/api
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.controlPlaneUrl http://serviceradar-web-ng-headless:4001/api must have no path"

  - it: leaves the read-grant listener to an explicitly configured remote control plane
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: https://control.example.com
      webNg.controlPlaneRuntime.mediaWorker.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_MEDIA_WORKER_CONTROL_PLANE_URL, value: https://control.example.com}

  - it: runs the CUDA build selected by repository and sha tag, with a writable kernel cache
    template: templates/media-worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda:sha-0123456789abcdef0123456789abcdef01234567
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CUDA_CACHE_PATH, value: /var/cache/serviceradar-media-worker/cuda}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_DTYPE, value: auto}
      - contains:
          path: spec.template.spec.volumes
          content: {name: cuda-cache, emptyDir: {sizeLimit: 1Gi}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: cuda-cache, mountPath: /var/cache/serviceradar-media-worker/cuda}

  - it: keeps the CUDA kernel cache on a claim when one is named
    template: templates/media-worker.yaml
    set:
      mediaWorker.cudaCache.existingClaim: example-cuda-cache
      mediaWorker.dtype: f32
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: cuda-cache, persistentVolumeClaim: {claimName: example-cuda-cache}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MEDIA_WORKER_DTYPE, value: f32}

  - it: gives a cpu_explicit worker no CUDA kernel cache
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CUDA_CACHE_PATH}
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content: {name: cuda-cache}
          any: true

  - it: refuses a dtype the worker does not support
    template: templates/media-worker.yaml
    set:
      mediaWorker.dtype: bf16
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.dtype must be auto, f32, or f16"

  - it: refuses a GPU provider on the release's CPU build and names the CUDA repository
    template: templates/media-worker.yaml
    set:
      mediaWorker.image.repository: ""
      mediaWorker.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.executionProvider cuda cannot start on registry.carverauto.dev/serviceradar/serviceradar-media-worker, which is a CPU build: set mediaWorker.image.repository to registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda"

  - it: refuses the CUDA repository without the sha tag its workflow produced
    template: templates/media-worker.yaml
    set:
      mediaWorker.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.image.repository registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda needs mediaWorker.image.tag"

  - it: connects to NATS with its own client certificate and nothing else from the runtime Secret
    template: templates/media-worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_MEDIA_WORKER_NATS_TLS_CA_FILE, value: /etc/serviceradar/certs/root.pem}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_MEDIA_WORKER_NATS_TLS_CERT_FILE, value: /etc/serviceradar/certs/media-worker.pem}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_MEDIA_WORKER_NATS_TLS_KEY_FILE, value: /etc/serviceradar/certs/media-worker-key.pem}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_MEDIA_WORKER_NATS_INBOX_PREFIX, value: _INBOX.media-worker}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert-data
            secret:
              secretName: serviceradar-runtime-certs
              items:
                - {key: root.pem, path: root.pem}
                - {key: media-worker.pem, path: media-worker.pem}
                - {key: media-worker-key.pem, path: media-worker-key.pem}

  - it: keeps the worker out of a match-all namespace policy that would reopen CNPG
    template: templates/network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
    documentSelector:
      path: metadata.name
      value: serviceradar-egress
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content:
            key: app
            operator: NotIn
            values: [serviceradar-media-worker]

  - it: lets the NVR pods accept the worker's analysis reads when they are allowed
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
      mediaWorker.networkPolicy.allowNvrRead: true
      mediaWorker.networkPolicy.nvrReadPort: 8555
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app: serviceradar-media-worker
            ports:
              - protocol: TCP
                port: 8555

  - it: keeps the NVR closed to the worker unless analysis reads are allowed
    template: templates/nvr.yaml
    set:
      nvr.enabled: true
      nvr.storage.storageClassName: example-replicated
      nvr.recovery.existingConfigMap: synthetic-nvr-recovery
      nvr.storage.storageIds:
        serviceradar-nvr-0: 00000000-0000-4000-8000-000000000011
        serviceradar-nvr-1: 00000000-0000-4000-8000-000000000012
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - equal:
          path: spec.ingress
          value: []

  # The worker creates CAMERA_MEDIA_JOBS (512Mi) and CAMERA_MEDIA_RESULTS (2Gi)
  # itself; the 2 GB tenant profile cannot hold them.
  - it: counts the worker's streams in the JetStream budget
    template: templates/nats.yaml
    set:
      nats.jetstream.profile: tenant-2g
    asserts:
      - failedTemplate:
          errorPattern: "JetStream storage budget exceeded \\(nats.jetstream.profile=tenant-2g\\).*CAMERA_MEDIA_RESULTS: 2147483648 bytes"

  - it: refuses the worker where its results stream fits on no server, even when overcommit is allowed
    template: templates/media-worker.yaml
    set:
      nats.jetstream.profile: tenant-2g
      nats.jetstream.allowOvercommit: true
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.enabled needs the worker's CAMERA_MEDIA_RESULTS stream, which reserves a fixed 2147483648 bytes, but NATS max_file_store is 2000000000 bytes"

  - it: turns on core's visual-index dispatch with the worker
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED, value: "true"}

  - it: keeps core's visual-index dispatch off without the worker
    template: templates/core.yaml
    set:
      mediaWorker.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED, value: "false"}

  - it: refuses a GPU entry left in resources under cpu_explicit
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.resources:
        limits: {cpu: "4", "nvidia.com/gpu": 1}
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.resources.limits.nvidia.com/gpu requests a GPU under mediaWorker.executionProvider cpu_explicit"

  - it: keeps core's dispatch flag out of core.extraEnv
    template: templates/core.yaml
    set:
      core.extraEnv.SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED: "false"
    asserts:
      - failedTemplate:
          errorPattern: "^SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED cannot be set through core.extraEnv"

  - it: keeps core's dispatch flag out of core.extraEnvValueFrom
    template: templates/core.yaml
    set:
      core.extraEnvValueFrom.SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED:
        configMapKeyRef: {name: synthetic-flags, key: visual-indexing}
    asserts:
      - failedTemplate:
          errorPattern: "^SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED cannot be set through core.extraEnvValueFrom"

  - it: keeps the worker out of the Calico namespace policy that would reopen CNPG
    template: templates/calico-network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.calicoLogDenied.enabled: true
      networkPolicy.calicoLogDenied.selector: all()
    asserts:
      - equal:
          path: spec.selector
          value: "(all()) && app != 'serviceradar-media-worker'"

  - it: admits every namespace pod but the worker to CNPG
    template: templates/cnpg-application-network-policy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchExpressions:
                    - {key: app, operator: NotIn, values: [serviceradar-media-worker]}
            ports:
              - {protocol: TCP, port: 5432}
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector: {}
          any: true

  - it: refuses a MIG slice left in resources under cpu_explicit
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.resources:
        requests: {cpu: 500m, "nvidia.com/mig-1g.5gb": 1}
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.resources.requests.nvidia.com/mig-1g.5gb requests a GPU under mediaWorker.executionProvider cpu_explicit"

  - it: refuses the configured GPU resource name left in resources under cpu_explicit
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.gpuResourceName: example.com/accelerator
      mediaWorker.resources:
        limits: {cpu: "4", "example.com/accelerator": 1}
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.resources.limits.example.com/accelerator requests a GPU under mediaWorker.executionProvider cpu_explicit"

  - it: refuses a worker and web-ng that read the token from different Secrets
    template: templates/media-worker.yaml
    set:
      webNg.controlPlaneRuntime.mediaWorker.existingSecret: example-media-worker-auth-copy
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.auth \\(Secret \"example-media-worker-auth\", key \"media-worker-token\"\\) and webNg.controlPlaneRuntime.mediaWorker \\(Secret \"example-media-worker-auth-copy\", key \"media-worker-token\"\\) must reference the same Secret and key"

  - it: refuses a query on this release's web-ng, which the worker would put before the endpoint path
    template: templates/media-worker.yaml
    set:
      mediaWorker.controlPlaneUrl: http://serviceradar-web-ng-headless:4001/?revision=2
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.controlPlaneUrl http://serviceradar-web-ng-headless:4001/\\?revision=2 must have no path, query or fragment"

  - it: refuses a fractional replica count instead of truncating it
    template: templates/media-worker.yaml
    set:
      mediaWorker.replicas: 0.5
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.replicas must be a whole number >= 0, got float64 \"0.5\""

  - it: refuses a fractional GPU count instead of truncating it
    template: templates/media-worker.yaml
    set:
      mediaWorker.gpuCount: 1.5
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.gpuCount must be a whole number >= 0"

  - it: refuses the dispatch flag in core.extraEnv while core itself is disabled
    template: templates/core.yaml
    set:
      core.enabled: false
      core.extraEnv.SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED: "true"
    asserts:
      - failedTemplate:
          errorPattern: "^SERVICERADAR_CAMERA_VISUAL_INDEXING_ENABLED cannot be set through core.extraEnv"

  # With its own policy off, the worker stays out of the namespace-wide allows:
  # the operator supplies its policy, and PostgreSQL stays closed to it.
  - it: keeps the worker out of the Calico namespace policy with its own policy off
    template: templates/calico-network-policy.yaml
    set:
      mediaWorker.networkPolicy.enabled: false
      networkPolicy.enabled: true
      networkPolicy.calicoLogDenied.enabled: true
      networkPolicy.calicoLogDenied.selector: all()
    asserts:
      - equal:
          path: spec.selector
          value: "(all()) && app != 'serviceradar-media-worker'"

  # Database isolation is enforced at the database pods. With the namespace-wide
  # policy on, the instances and the pooler get their own copy of it whose ingress
  # peers all exclude the worker -- whatever the ports, and also for the release's
  # own namespace listed as an allowed namespace -- and the main copy leaves them out.
  - it: gives the CNPG instances a copy of the namespace policy that never admits the worker
    template: templates/network-policy.yaml
    set:
      mediaWorker.networkPolicy.enabled: false
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
      networkPolicy.ingress.allowedNamespaces: [sr-media-test]
      networkPolicy.ingress.allowedPorts:
        - {protocol: TCP, port: 5430, endPort: 5440}
      logCollector.tcpCollector.enabled: false
    documentSelector:
      path: metadata.name
      value: serviceradar-egress-cnpg-instances
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content: {key: cnpg.io/podRole, operator: In, values: [instance]}
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: sr-media-test
              podSelector:
                matchExpressions:
                  - {key: app, operator: NotIn, values: [serviceradar-media-worker]}
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: sr-media-test
              podSelector:
                matchExpressions:
                  - {key: app, operator: NotIn, values: [serviceradar-media-worker]}
      - contains:
          path: spec.ingress[2].from[0].podSelector.matchExpressions
          content: {key: app, operator: NotIn, values: [serviceradar-media-worker]}

  - it: gives the pooler a copy of the namespace policy that never admits the worker
    template: templates/network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
    documentSelector:
      path: metadata.name
      value: serviceradar-egress-cnpg-pooler
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content: {key: cnpg.io/poolerName, operator: In, values: [cnpg-pooler-rw]}
      - equal:
          path: spec.ingress[0].from[0].podSelector
          value:
            matchExpressions:
              - {key: app, operator: NotIn, values: [serviceradar-media-worker]}

  - it: keeps the database pods out of the main namespace policy, whose rules stay as they were
    template: templates/network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
      networkPolicy.ingress.allowedPorts:
        - {protocol: TCP, port: 4222}
      logCollector.tcpCollector.enabled: false
    documentSelector:
      path: metadata.name
      value: serviceradar-egress
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content: {key: cnpg.io/cluster, operator: NotIn, values: [cnpg]}
      - contains:
          path: spec.podSelector.matchExpressions
          content: {key: cnpg.io/poolerName, operator: NotIn, values: [cnpg-pooler-rw]}
      - equal:
          path: spec.ingress[0]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: sr-media-test
            ports:
              - {protocol: TCP, port: 4222}

  # With the namespace-wide policy off, replicas and the pooler are selected by no
  # ingress policy (the primary has the CNPG application policy), so a guard admits
  # every source to them except the worker, whatever the worker's own policy says.
  - it: guards the CNPG replicas and the pooler when the namespace-wide policy is off
    template: templates/cnpg-media-worker-guard-network-policy.yaml
    set:
      mediaWorker.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/cluster: cnpg, cnpg.io/podRole: instance, cnpg.io/instanceRole: replica}
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/poolerName: cnpg-pooler-rw}
        documentIndex: 1
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchExpressions:
                      - {key: app, operator: NotIn, values: [serviceradar-media-worker]}
                - namespaceSelector:
                    matchExpressions:
                      - {key: kubernetes.io/metadata.name, operator: NotIn, values: [sr-media-test]}

  - it: guards the primary too when the CNPG application policy is off
    template: templates/cnpg-media-worker-guard-network-policy.yaml
    set:
      cnpg.applicationAccess.enabled: false
    documentIndex: 0
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/cluster: cnpg, cnpg.io/podRole: instance}

  - it: leaves the database guard to the namespace-wide policy's copies when that policy is on
    template: templates/cnpg-media-worker-guard-network-policy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # Another CNPG cluster's instances in the namespace stay under the main rules:
  # the complement of "this cluster's instances" is two selectors.
  - it: keeps this cluster's non-instance pods under the main rules in a second selector
    template: templates/network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
    documentSelector:
      path: metadata.name
      value: serviceradar-egress-cnpg-cluster-other
    asserts:
      - equal:
          path: spec.podSelector.matchExpressions
          value:
            - {key: app, operator: NotIn, values: [serviceradar-media-worker]}
            - {key: cnpg.io/cluster, operator: In, values: [cnpg]}
            - {key: cnpg.io/podRole, operator: NotIn, values: [instance]}
            - {key: cnpg.io/poolerName, operator: NotIn, values: [cnpg-pooler-rw]}

  - it: excludes the worker only where it can live, the release namespace
    template: templates/network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelectorMatchAll: true
      networkPolicy.ingress.allowSameNamespace: false
      networkPolicy.ingress.allowedNamespaces: [synthetic-other]
    documentSelector:
      path: metadata.name
      value: serviceradar-egress-cnpg-instances
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: synthetic-other

  # Layouts the chart's policies cannot reach are refused rather than covered.
  - it: refuses a CNPG cluster outside the release namespace
    template: templates/media-worker.yaml
    set:
      cnpg.namespace: synthetic-database
    asserts:
      - failedTemplate:
          errorPattern: "^cnpg.namespace \"synthetic-database\" is not the release namespace \"sr-media-test\": the media worker's database isolation cannot be guaranteed in that layout"

  - it: refuses a StarRocks catalog policy that admits the release namespace to the primary
    template: templates/media-worker.yaml
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.enabled: true
      analytics.starrocks.catalog.sourceNamespace: sr-media-test
    asserts:
      - failedTemplate:
          errorPattern: "^analytics.starrocks.catalog.sourceNamespace \"sr-media-test\" is the release namespace, so its policy admits every pod there to the CNPG primary: the media worker's database isolation cannot be guaranteed in that layout"

  - it: refuses a customised namespace policy selector
    template: templates/media-worker.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.podSelector:
        matchLabels: {synthetic-tier: app}
    asserts:
      - failedTemplate:
          errorPattern: "^networkPolicy.podSelector is customised .*: the media worker's database isolation cannot be guaranteed in that layout"

  # The guard covers only database pods no other chart policy selects.
  - it: guards only the replicas when another chart policy already restricts the primary
    template: templates/cnpg-media-worker-guard-network-policy.yaml
    set:
      cnpg.applicationAccess.enabled: false
      cnpg.localDevAccess.enabled: true
      cnpg.localDevAccess.allowedCIDRs: ["192.0.2.0/24"]
    documentIndex: 0
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/cluster: cnpg, cnpg.io/podRole: instance, cnpg.io/instanceRole: replica}

  - it: guards the replicas under the namespace-wide policy when no CNPG policy selects them
    template: templates/cnpg-media-worker-guard-network-policy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.cnpgOperator.enabled: false
      networkPolicy.ingress.cnpgInstanceManager.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/cluster: cnpg, cnpg.io/podRole: instance, cnpg.io/instanceRole: replica}

  # Another repository never takes the packaged CPU digest.
  - it: refuses a repository override that would fall back to the packaged CPU digest
    template: templates/media-worker.yaml
    set:
      mediaWorker.image.tag: ""
      image.digests.mediaWorker: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.image.repository registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda needs mediaWorker.image.tag .* image.digests.mediaWorker pins the release CPU build and does not apply to it"

  - it: pins the overridden repository by its own digest, ignoring the packaged one
    template: templates/media-worker.yaml
    set:
      mediaWorker.image.tag: ""
      mediaWorker.image.digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
      image.digests.mediaWorker: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.carverauto.dev/serviceradar/serviceradar-media-worker-cuda@sha256:2222222222222222222222222222222222222222222222222222222222222222

  - it: refuses half precision under cpu_explicit
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.dtype: f16
    asserts:
      - failedTemplate:
          errorPattern: "^mediaWorker.dtype f16 is not supported under cpu_explicit"

  - it: pins the release CPU build by an explicit digest instead of the packaged one
    template: templates/media-worker.yaml
    set:
      mediaWorker.executionProvider: cpu_explicit
      mediaWorker.image.repository: ""
      mediaWorker.image.tag: ""
      mediaWorker.image.digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
      image.digests.mediaWorker: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.carverauto.dev/serviceradar/serviceradar-media-worker@sha256:3333333333333333333333333333333333333333333333333333333333333333
