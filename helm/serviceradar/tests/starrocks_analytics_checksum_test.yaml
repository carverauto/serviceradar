suite: a change to the StarRocks analytics settings rolls the pods that read them
templates:
  - templates/web.yaml
  - templates/core.yaml
# helm-unittest cannot compare two renders inside one test, so the first test
# pins the digest for one fixed set of values and the second changes ONLY
# cutoverDatasets and asserts the digest is no longer that one. The settings
# these tests vary (enabled, cutoverDatasets, shadowDatasets) are set explicitly
# rather than inherited. The digest covers the whole analytics.starrocks block,
# so a changed default inside that block moves the pin too: the `equal` test
# then fails first, and the value is regenerated by rendering, never by hand:
#   helm template x . --set analytics.starrocks.enabled=true \
#     --set 'analytics.starrocks.cutoverDatasets={flows}' \
#     --set-json 'analytics.starrocks.shadowDatasets=["flows","metrics","logs","events"]' \
#     -s templates/web.yaml | grep checksum/starrocks-analytics
tests:
  - it: stamps the same analytics digest on web-ng and core for a fixed set of values
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.cutoverDatasets: [flows]
      analytics.starrocks.shadowDatasets: [flows, metrics, logs, events]
    asserts:
      - equal:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          value: 8ee8d9a4cab761147bc52ad68ae98f131a70f2498cf731f4c3e0cc446bd46501
        documentSelector:
          path: kind
          value: Deployment
        template: templates/web.yaml
      - equal:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          value: 8ee8d9a4cab761147bc52ad68ae98f131a70f2498cf731f4c3e0cc446bd46501
        documentSelector:
          path: kind
          value: Deployment
        template: templates/core.yaml

  - it: changes the digest on both when only the cut-over datasets change
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.cutoverDatasets: [flows, metrics]
      analytics.starrocks.shadowDatasets: [flows, metrics, logs, events]
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          pattern: ^[0-9a-f]{64}$
        documentSelector:
          path: kind
          value: Deployment
        template: templates/web.yaml
      - notEqual:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          value: 8ee8d9a4cab761147bc52ad68ae98f131a70f2498cf731f4c3e0cc446bd46501
        documentSelector:
          path: kind
          value: Deployment
        template: templates/web.yaml
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          pattern: ^[0-9a-f]{64}$
        documentSelector:
          path: kind
          value: Deployment
        template: templates/core.yaml
      - notEqual:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
          value: 8ee8d9a4cab761147bc52ad68ae98f131a70f2498cf731f4c3e0cc446bd46501
        documentSelector:
          path: kind
          value: Deployment
        template: templates/core.yaml

  - it: leaves the annotation off when StarRocks is not enabled
    set:
      analytics.starrocks.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
        documentSelector:
          path: kind
          value: Deployment
        template: templates/web.yaml
      - notExists:
          path: spec.template.metadata.annotations['checksum/starrocks-analytics']
        documentSelector:
          path: kind
          value: Deployment
        template: templates/core.yaml
