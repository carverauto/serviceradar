suite: every StarRocks client reads the Frontend root password from one Secret
templates:
  - templates/core.yaml
  - templates/web.yaml
  - templates/starrocks-analytics-config.yaml
  - templates/starrocks-storage-volume-job.yaml
  - templates/starrocks-catalog-job.yaml
release:
  namespace: sr-fe-ns
# An empty fePasswordSecretName used to render a passwordless `root` login on
# every workload and Job that talks to the Frontend. It now stops the render.
# There is no flag that restores the old behaviour, and none should be added:
# a bypass becomes the default.
#
# The refusals live in the single-template
# starrocks_fe_password_required_*_test.yaml suites: helm-unittest attributes a
# `fail` to the one template it fired in (trap 4 in README.md), so only a
# suite rendering one template proves that template refuses on its own.
tests:
  - it: core reads the Frontend password from the named Secret
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_STARROCKS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sr-fe-password
                key: password
          count: 1

  - it: web-ng reads the Frontend password from the named Secret
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_STARROCKS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sr-fe-password
                key: password
          count: 1

  - it: honours a non-default key in the Frontend password Secret
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
      analytics.starrocks.catalog.fePasswordSecretKey: root-password
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_STARROCKS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sr-fe-password
                key: root-password
          count: 1

  - it: the catalog Job authenticates with the same Secret and never without a password
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.catalog.enabled: true
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    template: templates/starrocks-catalog-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sr-fe-password
                key: password
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: ': "\$\{FE_PASSWORD:\?'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'FE_PASSWORD:\+'

  - it: the storage-volume Job authenticates with the same Secret and never without a password
    set:
      analytics.starrocks.enabled: true
      analytics.starrocks.profile: sharedData
      analytics.starrocks.sharedData.secretName: sr-object-store
      analytics.starrocks.sharedData.objectStorageBucket: sr-analytics-bucket
      analytics.starrocks.catalog.fePasswordSecretName: sr-fe-password
    template: templates/starrocks-storage-volume-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sr-fe-password
                key: password
          count: 1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: ': "\$\{FE_PASSWORD:\?'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'FE_PASSWORD:\+'

  - it: renders without the Secret when StarRocks analytics is disabled
    set:
      analytics.starrocks.enabled: false
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SERVICERADAR_STARROCKS_PASSWORD

  - it: renders no analytics config when StarRocks analytics is disabled
    set:
      analytics.starrocks.enabled: false
    template: templates/starrocks-analytics-config.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: the demo overlay names the Frontend password Secret
    values:
      - ../values-demo.yaml
    template: templates/core.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_STARROCKS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: serviceradar-starrocks-fe
                key: password
          count: 1
