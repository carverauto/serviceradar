# The in-chart counterpart of //k8s/dgraph/tests:dgraph_endpoint_contract_test.
# Clients dial the Alpha Service name. The chart puts that same name on the
# serving certificate it stores in the Secret the subchart mounts. The SAN
# bytes are inside the certificate, so this suite checks the Secret name and
# the dialed host; a render check reads the SANs.
suite: dgraph product endpoint agrees with the issued certificate
release:
  name: serviceradar
  namespace: serviceradar-test
templates:
  - templates/core.yaml
  - templates/web.yaml
  - templates/dgraph-certificates.yaml
  - templates/dgraph-schema-job.yaml
  - templates/dgraph-migrator-job.yaml
tests:
  - it: every client dials the name the Alpha certificate carries
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DGRAPH_HOST
            value: serviceradar-dgraph-alpha.serviceradar-test.svc.cluster.local
        template: templates/core.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DGRAPH_HOST
            value: serviceradar-dgraph-alpha.serviceradar-test.svc.cluster.local
        template: templates/web.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
        template: templates/dgraph-certificates.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
      - equal:
          path: type
          value: kubernetes.io/tls
        template: templates/dgraph-certificates.yaml
        documentSelector:
          path: metadata.name
          value: serviceradar-dgraph-alpha-tls-secret
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DGRAPH_URL")].value
          pattern: '@serviceradar-dgraph-alpha\.serviceradar-test\.svc\.cluster\.local:9080\?'
        template: templates/dgraph-schema-job.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DGRAPH_URL")].value
          pattern: '@serviceradar-dgraph-alpha\.serviceradar-test\.svc\.cluster\.local:9080\?'
        template: templates/dgraph-migrator-job.yaml
