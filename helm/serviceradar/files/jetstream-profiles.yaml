  large:
    maxFileStore: 500G
    persistenceSize: 500Gi
    sizes:
      datasvcKV: 2Gi
      datasvcObjects: 32Gi
      events: 32Gi
      flows: 192Gi
      plugins: 8Gi
      arancini: 64Gi
      metrics: 8Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      telemetry_edge_record_dlq_v1_bulk: 64Mi
      telemetry_edge_record_recovery_v1: 64Mi
      k8s_inventory: 8Gi
      analytics_predictions: 8Gi
      mtr_results: 8Gi
      scan_results: 2Gi
      notifications: 2Gi
      exposureTransitions: 8Gi
      exposureDimensions: 8Gi
      trivy_reports: 8Gi
      fieldsurvey: 8Gi
      threatIntel: 8Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
    singleServerSizes:
      datasvcKV: 2Gi
      datasvcObjects: 32Gi
      events: 32Gi
      flows: 160Gi
      plugins: 8Gi
      arancini: 64Gi
      metrics: 8Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      telemetry_edge_record_dlq_v1_bulk: 64Mi
      telemetry_edge_record_recovery_v1: 64Mi
      k8s_inventory: 8Gi
      analytics_predictions: 8Gi
      mtr_results: 8Gi
      scan_results: 2Gi
      notifications: 2Gi
      exposureTransitions: 8Gi
      exposureDimensions: 8Gi
      trivy_reports: 8Gi
      fieldsurvey: 8Gi
      threatIntel: 8Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
  # Hosted tenant plan with a 2G JetStream disk entitlement (limit 85% of
  # 2000000000 bytes = 1.58 GiB), sized for three NATS servers and the replica
  # counts values-tenant.yaml sets: KV, objects, events, plugins,
  # ARANCINI_CAUSAL, metrics, scan_results, NOTIFICATIONS,
  # TELEMETRY_EDGE_RECORD_V1_BULK, its audit, security-quarantine and
  # dead-letter streams and EXPOSURE_RECOVERY at R3 (full on every server),
  # flows and the remaining EventWriter streams at R1 (spread). Every fallback
  # stays at or below its collector size.
  #   full   = 32 + 384 + 256 + 128 + 128 + 64 + 32 + 32 + 28 + 4 + 8 + 8 + 4
  #            + 64 MiB = 1172 MiB (KV, objects, events, plugins,
  #            ARANCINI_CAUSAL, metrics, scan_results, NOTIFICATIONS,
  #            TELEMETRY_EDGE_RECORD_V1_BULK 28 MiB plus recovery 4 MiB, its audit and
  #            security-quarantine streams 8 MiB each, its dead-letter stream
  #            4 MiB, and the fixed 64 MiB EXPOSURE_RECOVERY reservation)
  #   spread = 256 + 32 + 32 + 32 + 32 + 32 + 32 + 64 + 64 MiB = 576 MiB,
  #            largest 256 MiB (flows)
  #   need   = 1172 MiB + ceil(576 MiB / 3) + 256 MiB = 1620 MiB
  #            = 1698693120 bytes (1.58 GiB), under the 1700000000-byte limit
  #   account = 1172 MiB * 3 + 576 MiB = 4092 MiB = 3.99609375 GiB
  #            (an un-tiered account limit counts max_bytes * replicas)
  tenant-2g:
    maxFileStore: 2G
    persistenceSize: 3Gi
    sizes:
      datasvcKV: 32Mi
      datasvcObjects: 384Mi
      events: 256Mi
      flows: 256Mi
      plugins: 128Mi
      arancini: 128Mi
      metrics: 64Mi
      telemetry_edge_record_v1_bulk: 28Mi
      telemetry_edge_record_audit_v1_bulk: 8Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 8Mi
      telemetry_edge_record_dlq_v1_bulk: 4Mi
      telemetry_edge_record_recovery_v1: 4Mi
      k8s_inventory: 32Mi
      analytics_predictions: 32Mi
      mtr_results: 32Mi
      scan_results: 32Mi
      notifications: 32Mi
      exposureTransitions: 32Mi
      exposureDimensions: 32Mi
      trivy_reports: 32Mi
      fieldsurvey: 64Mi
      threatIntel: 64Mi
      flowsFallback: 64Mi
      aranciniFallback: 64Mi
  # Minimal profile targeting a 10 Gi NATS PVC (max_file_store 9 G ≈ 8.38 GiB;
  # 85% per-server limit 7.13 GiB). For single-agent or pilot deployments on
  # constrained infrastructure. Flow analytics and large-scale ARANCINI
  # workloads should use the `small` profile or larger.
  compact:
    maxFileStore: 9G
    persistenceSize: 10Gi
    sizes:
      datasvcKV: 64Mi
      datasvcObjects: 512Mi
      events: 512Mi
      flows: 512Mi
      plugins: 256Mi
      arancini: 512Mi
      metrics: 256Mi
      telemetry_edge_record_v1_bulk: 512Mi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      telemetry_edge_record_dlq_v1_bulk: 32Mi
      telemetry_edge_record_recovery_v1: 64Mi
      k8s_inventory: 128Mi
      analytics_predictions: 128Mi
      mtr_results: 128Mi
      scan_results: 256Mi
      notifications: 256Mi
      exposureTransitions: 128Mi
      exposureDimensions: 128Mi
      trivy_reports: 128Mi
      fieldsurvey: 128Mi
      threatIntel: 128Mi
      flowsFallback: 256Mi
      aranciniFallback: 256Mi

# Replica count used when a stream's own replica value is unset. The same in
# every profile: a profile changes sizes, not the replication topology.
replicas:
  datasvcKV: 3
  datasvcObjects: 3
  events: 3
  flows: 3
  plugins: 3
  arancini: 1
  metrics: 3
  telemetry_edge_record_v1_bulk: 3
  telemetry_edge_record_audit_v1_bulk: 3
  telemetry_edge_record_security_quarantine_v1_bulk: 3
  telemetry_edge_record_dlq_v1_bulk: 3
  telemetry_edge_record_recovery_v1: 3
  k8s_inventory: 1
  analytics_predictions: 1
  mtr_results: 1
  scan_results: 3
  notifications: 3
  exposureTransitions: 1
  exposureDimensions: 1
  trivy_reports: 1
  fieldsurvey: 1
  threatIntel: 1
  flowsFallback: 1
  aranciniFallback: 1
