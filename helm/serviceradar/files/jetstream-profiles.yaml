# JetStream sizing profiles (openspec change update-jetstream-storage-budget,
# design D8). Chart data, not values: select one with nats.jetstream.profile and
# override any single size through its own value (the `source` a budget failure
# names).
#
# Sizes use the NATS quantity grammar: a bare number is bytes, G is 10^9 and
# Gi is 2^30. `persistenceSize` is the NATS PVC each profile targets; the chart
# never applies it (volumeClaimTemplates are immutable), it only rejects a
# max_file_store above 94% of nats.persistence.size. Moving a live install to a
# larger profile follows docs/nats-jetstream-profile-runbook.md.
#
# Two size tables per shipped profile, selected by nats.replicas:
#
# - `sizes` (nats.replicas >= 3): the D8 Helm table. R3 streams cost their size
#   on every server and the R1 streams spread, so flows can be larger.
# - `singleServerSizes` (nats.replicas 1 or 2): the D8 Compose table, the same
#   figures the Compose presets ship. On one server every stream counts in full,
#   so the budget is the plain sum. On two servers the R3 streams still land on
#   both servers; both tables fit `small`'s budget, but only the single-server
#   table gives Compose-compatible sizes (flows 3 GiB, not 8 GiB).
#
# A profile without `singleServerSizes` uses `sizes` for every server count.
#
# The fixed 64 MiB EXPOSURE_RECOVERY reservation is counted in addition to
# these configurable sizes, in every profile (including tenant-2g).
#
# Every shipped profile passes the render-time budget (need <= 85% of
# max_file_store) with flow-collector, bmp-collector and the trivy sidecar
# enabled; flows and ARANCINI_CAUSAL are always counted at the collector size.
#
#   profile   servers  need (GiB)                          limit (GiB)
#   small     3        19.6875 + 6/3 + 2 = 23.69           28.50
#   small     1        25.4375                             28.50
#   medium    3        57.6875 + 28/3 + 12 = 79.02         79.16
#   medium    1        77.6875                             79.16
#   large     3        279.1875 + 128/3 + 64 = 385.85      395.81
#   large     1        375.1875                            395.81
#   tenant-2g 3        1.140625 + 0.1875 + 0.25 = 1.58     1.58
#
# The edge-record audit and security-quarantine streams are reserved at R3 in
# every profile (64 MiB each; 8 MiB in tenant-2g), like the primary
# TELEMETRY_EDGE_RECORD_V1_BULK stream.
profiles:
  small:
    maxFileStore: 36G
    persistenceSize: 36Gi
    sizes:
      datasvcKV: 1Gi
      datasvcObjects: 4Gi
      events: 2Gi
      flows: 8Gi
      plugins: 2Gi
      arancini: 2Gi
      metrics: 1Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 512Mi
      analytics_predictions: 512Mi
      mtr_results: 512Mi
      scan_results: 256Mi
      notifications: 256Mi
      exposureTransitions: 512Mi
      exposureDimensions: 512Mi
      trivy_reports: 512Mi
      fieldsurvey: 512Mi
      threatIntel: 512Mi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
    singleServerSizes:
      datasvcKV: 1Gi
      datasvcObjects: 4Gi
      events: 2Gi
      flows: 3Gi
      plugins: 2Gi
      arancini: 2Gi
      metrics: 1Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 1Gi
      analytics_predictions: 1Gi
      mtr_results: 1Gi
      scan_results: 256Mi
      notifications: 1Gi
      exposureTransitions: 1Gi
      exposureDimensions: 1Gi
      trivy_reports: 1Gi
      fieldsurvey: 1Gi
      threatIntel: 1Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
  medium:
    maxFileStore: 100G
    persistenceSize: 100Gi
    sizes:
      datasvcKV: 1Gi
      datasvcObjects: 8Gi
      events: 8Gi
      flows: 32Gi
      plugins: 4Gi
      arancini: 12Gi
      metrics: 2Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 2Gi
      analytics_predictions: 2Gi
      mtr_results: 2Gi
      scan_results: 512Mi
      notifications: 1Gi
      exposureTransitions: 2Gi
      exposureDimensions: 2Gi
      trivy_reports: 2Gi
      fieldsurvey: 2Gi
      threatIntel: 2Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
    singleServerSizes:
      datasvcKV: 1Gi
      datasvcObjects: 8Gi
      events: 8Gi
      flows: 24Gi
      plugins: 4Gi
      arancini: 12Gi
      metrics: 2Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 2Gi
      analytics_predictions: 2Gi
      mtr_results: 2Gi
      scan_results: 512Mi
      notifications: 1Gi
      exposureTransitions: 2Gi
      exposureDimensions: 2Gi
      trivy_reports: 2Gi
      fieldsurvey: 2Gi
      threatIntel: 2Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
  large:
    maxFileStore: 500G
    persistenceSize: 500Gi
    sizes:
      datasvcKV: 2Gi
      datasvcObjects: 32Gi
      events: 32Gi
      flows: 192Gi
      plugins: 8Gi
      arancini: 64Gi
      metrics: 8Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 8Gi
      analytics_predictions: 8Gi
      mtr_results: 8Gi
      scan_results: 2Gi
      notifications: 2Gi
      exposureTransitions: 8Gi
      exposureDimensions: 8Gi
      trivy_reports: 8Gi
      fieldsurvey: 8Gi
      threatIntel: 8Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
    singleServerSizes:
      datasvcKV: 2Gi
      datasvcObjects: 32Gi
      events: 32Gi
      flows: 160Gi
      plugins: 8Gi
      arancini: 64Gi
      metrics: 8Gi
      telemetry_edge_record_v1_bulk: 1Gi
      telemetry_edge_record_audit_v1_bulk: 64Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 64Mi
      k8s_inventory: 8Gi
      analytics_predictions: 8Gi
      mtr_results: 8Gi
      scan_results: 2Gi
      notifications: 2Gi
      exposureTransitions: 8Gi
      exposureDimensions: 8Gi
      trivy_reports: 8Gi
      fieldsurvey: 8Gi
      threatIntel: 8Gi
      flowsFallback: 1Gi
      aranciniFallback: 1Gi
  # Hosted tenant plan with a 2G JetStream disk entitlement (limit 85% of
  # 2000000000 bytes = 1.58 GiB), sized for three NATS servers and the replica
  # counts values-tenant.yaml sets: KV, objects, events, plugins,
  # ARANCINI_CAUSAL, metrics, scan_results, NOTIFICATIONS,
  # TELEMETRY_EDGE_RECORD_V1_BULK, its audit and security-quarantine streams
  # and EXPOSURE_RECOVERY at R3 (full on every server), flows and the remaining
  # EventWriter streams at R1 (spread). Every fallback stays at or below its
  # collector size.
  #   full   = 32 + 384 + 256 + 128 + 128 + 64 + 32 + 32 + 32 + 8 + 8 + 64 MiB
  #            = 1168 MiB (KV, objects, events, plugins, ARANCINI_CAUSAL,
  #            metrics, scan_results, NOTIFICATIONS,
  #            TELEMETRY_EDGE_RECORD_V1_BULK 32 MiB, its audit and
  #            security-quarantine streams 8 MiB each, and the fixed 64 MiB
  #            EXPOSURE_RECOVERY reservation)
  #   spread = 256 + 32 + 32 + 32 + 32 + 32 + 32 + 64 + 64 MiB = 576 MiB,
  #            largest 256 MiB (flows)
  #   need   = 1168 MiB + ceil(576 MiB / 3) + 256 MiB = 1616 MiB
  #            = 1694498816 bytes (1.58 GiB), under the 1700000000-byte limit
  #   account = 1168 MiB * 3 + 576 MiB = 4080 MiB = 3.984375 GiB
  #            (an un-tiered account limit counts max_bytes * replicas)
  tenant-2g:
    maxFileStore: 2G
    persistenceSize: 3Gi
    sizes:
      datasvcKV: 32Mi
      datasvcObjects: 384Mi
      events: 256Mi
      flows: 256Mi
      plugins: 128Mi
      arancini: 128Mi
      metrics: 64Mi
      telemetry_edge_record_v1_bulk: 32Mi
      telemetry_edge_record_audit_v1_bulk: 8Mi
      telemetry_edge_record_security_quarantine_v1_bulk: 8Mi
      k8s_inventory: 32Mi
      analytics_predictions: 32Mi
      mtr_results: 32Mi
      scan_results: 32Mi
      notifications: 32Mi
      exposureTransitions: 32Mi
      exposureDimensions: 32Mi
      trivy_reports: 32Mi
      fieldsurvey: 64Mi
      threatIntel: 64Mi
      flowsFallback: 64Mi
      aranciniFallback: 64Mi

# Replica count used when a stream's own replica value is unset. The same in
# every profile: a profile changes sizes, not the replication topology.
replicas:
  datasvcKV: 3
  datasvcObjects: 3
  events: 3
  flows: 3
  plugins: 3
  arancini: 1
  metrics: 3
  telemetry_edge_record_v1_bulk: 3
  telemetry_edge_record_audit_v1_bulk: 3
  telemetry_edge_record_security_quarantine_v1_bulk: 3
  k8s_inventory: 1
  analytics_predictions: 1
  mtr_results: 1
  scan_results: 3
  notifications: 3
  exposureTransitions: 1
  exposureDimensions: 1
  trivy_reports: 1
  fieldsurvey: 1
  threatIntel: 1
  flowsFallback: 1
  aranciniFallback: 1
