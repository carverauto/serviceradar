apiVersion: v2
name: serviceradar
description: Helm chart for deploying the ServiceRadar 
type: application
version: 1.5.9
appVersion: "1.5.9"

# Dgraph chart 24.1.4, vendored unpacked in charts/dgraph with the pod dnsConfig
# patch. No repository, so `helm dependency build` uses that directory and never
# fetches the unpatched upstream archive. Images are overridden to the Harbor
# mirror in values.yaml.
# condition: dgraph.enabled so CI/demo can point at an external cluster instead.
dependencies:
  - name: dgraph
    version: "24.1.4"
    condition: dgraph.enabled
