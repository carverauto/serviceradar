{{- if .Values.flowCollector.enabled }}
{{- $data := default (dict) .Values.flowCollector.data -}}
{{- $dataEnabled := true -}}
{{- if hasKey $data "enabled" -}}
{{- $dataEnabled = $data.enabled -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceradar-flow-collector-config
data:
  flow-collector.json: |
    {{- include "serviceradar.flowCollectorConfigJSON" . | nindent 4 }}
---
{{- if and $dataEnabled (not $data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-flow-collector-data
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "1Gi" $data.size | quote }}
  {{- if $data.storageClassName }}
  storageClassName: {{ $data.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceradar-flow-collector
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/name: serviceradar-flow-collector
    app.kubernetes.io/component: flow-collector
spec:
  replicas: {{ .Values.flowCollector.replicaCount | default 1 }}
  # RollingUpdate is safe now that the events->flows cutover runs in the
  # pre-upgrade bootstrap Job: no pod performs a subject rehome, and every pod
  # derives its subject list from config alone, so concurrent stream ensures
  # converge rather than race. (Measured: 8 concurrent identical stream adds
  # all succeed; 2 divergent ones conflict.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: serviceradar-flow-collector
  template:
    metadata:
      labels:
        app: serviceradar-flow-collector
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
      {{- if .Values.global.forceRolloutOnUpgrade }}
        serviceradar.io/release-revision: {{ .Release.Revision | quote }}
      {{- end }}
    spec:
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-flow-collector") | nindent 6 }}
      {{- include "serviceradar.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ .Values.spire.flowCollectorServiceAccount | default "serviceradar-flow-collector" }}
      affinity:
        podAntiAffinity:
          # Soft, not required: spreading replicas across nodes is what makes
          # BGP/ECMP hand different exporters to different pods. Left soft so a
          # small cluster can still schedule every replica.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: serviceradar-flow-collector
      # Allow publisher retry-queue drain on SIGTERM (see main.rs shutdown_signal).
      terminationGracePeriodSeconds: {{ .Values.flowCollector.terminationGracePeriodSeconds | default 45 }}
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: flow-collector
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-flow-collector" "service" "flowCollector") }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.bindServiceContainerSecurityContext" . | nindent 8 }}
        ports:
        {{- if .Values.flowCollector.service.ports.netflow.enabled }}
        - name: netflow
          containerPort: {{ .Values.flowCollector.service.ports.netflow.targetPort | default 2055 }}
          protocol: {{ .Values.flowCollector.service.ports.netflow.protocol | default "UDP" }}
        {{- end }}
        {{- if .Values.flowCollector.service.ports.sflow.enabled }}
        - name: sflow
          containerPort: {{ .Values.flowCollector.service.ports.sflow.targetPort | default 6343 }}
          protocol: {{ .Values.flowCollector.service.ports.sflow.protocol | default "UDP" }}
        {{- end }}
        {{- if .Values.flowCollector.service.ports.ipfix.enabled }}
        - name: ipfix
          containerPort: {{ .Values.flowCollector.service.ports.ipfix.targetPort | default 4739 }}
          protocol: {{ .Values.flowCollector.service.ports.ipfix.protocol | default "UDP" }}
        {{- end }}
        {{- if .Values.flowCollector.service.ports.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.flowCollector.service.ports.metrics.targetPort | default 50046 }}
          protocol: {{ .Values.flowCollector.service.ports.metrics.protocol | default "TCP" }}
        {{- end }}
        args:
        - "--config"
        - "/etc/serviceradar/flow-collector.json"
        env:
        - name: RUST_LOG
          value: "info"
        - name: FLOW_COLLECTOR_READY_PATH
          value: {{ .Values.flowCollector.readyPath | default "/var/lib/serviceradar/flow-collector.ready" | quote }}
        - name: FLOW_COLLECTOR_REHOME_STATE_PATH
          value: {{ (.Values.flowCollector.config).rehome_state_path | default "/var/lib/serviceradar/flow-collector-rehome.json" | quote }}
        - name: TERMINATION_GRACE_PERIOD_SECONDS
          value: {{ .Values.flowCollector.terminationGracePeriodSeconds | default 45 | quote }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f flow-collector > /dev/null"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
        {{- if (.Values.flowCollector.config).metrics_addr }}
          # HTTP beats a bare ready-file exec check: it also fails a process
          # that is running but wedged (deadlocked accept loop), which
          # `test -f` cannot detect. /readyz (not /metrics) is what makes
          # this reflect true publisher readiness: /metrics answers 200 as
          # soon as the HTTP server binds, before the publisher has ever
          # connected to NATS -- run_prometheus_server is spawned
          # independently of the publisher (main.rs). /readyz instead
          # checks the same publisher-ready marker file the old exec probe
          # used (mark_publisher_ready/clear_publisher_ready), so a new pod
          # under maxUnavailable:0 is not considered Ready until it can
          # actually publish.
          httpGet:
            path: /readyz
            port: {{ .Values.flowCollector.service.ports.metrics.targetPort | default 50046 }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        {{- else }}
          exec:
            command:
            - /bin/sh
            - -c
            - "test -f {{ .Values.flowCollector.readyPath | default "/var/lib/serviceradar/flow-collector.ready" }}"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        {{- end }}
        resources:
          {{- toYaml .Values.flowCollector.resources | nindent 10 }}
        volumeMounts:
        - name: flow-collector-config
          mountPath: /etc/serviceradar
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        - name: nats-creds
          mountPath: /etc/serviceradar/creds
          readOnly: true
        - name: flow-collector-data
          mountPath: /var/lib/serviceradar
        - name: logs
          mountPath: /var/log/serviceradar
      initContainers:
      - name: wait-for-cert-files
        image: alpine:3.20
        {{- include "serviceradar.nonRootContainerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          for file in /etc/serviceradar/certs/flow-collector.pem /etc/serviceradar/certs/flow-collector-key.pem /etc/serviceradar/certs/root.pem; do
            i=0
            until [ -f "${file}" ]; do
              i=$((i+1))
              if [ "${i}" -ge 90 ]; then
                echo "Timed out waiting for ${file}" >&2
                exit 1
              fi
              sleep 2
            done
          done
        volumeMounts:
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
      - name: wait-for-nats-creds
        image: alpine:3.20
        {{- include "serviceradar.nonRootContainerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          i=0
          until [ -f /etc/serviceradar/creds/platform.creds ]; do
            i=$((i+1))
            if [ "${i}" -ge 90 ]; then
              echo "Timed out waiting for /etc/serviceradar/creds/platform.creds" >&2
              exit 1
            fi
            sleep 2
          done
        volumeMounts:
        - name: nats-creds
          mountPath: /etc/serviceradar/creds
          readOnly: true
      volumes:
      - name: flow-collector-config
        configMap:
          name: serviceradar-flow-collector-config
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "ca.crt" "flow-collector.pem" "flow-collector-key.pem") | indent 12 }}
      - name: nats-creds
        secret:
          secretName: serviceradar-nats-creds
      - name: flow-collector-data
        # Pod-local scratch, deliberately NOT the PVC. The ready marker and the
        # ownership inventory are per-pod and disposable; the durable cutover
        # markers belong to the bootstrap Job, which is the single writer.
        # Keeping the PVC here would also cap the Deployment at one replica,
        # since it is ReadWriteOnce.
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-flow-collector
  labels:
    app.kubernetes.io/part-of: serviceradar
  {{- with .Values.flowCollector.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.flowCollector.service.type | default "ClusterIP" }}
  {{- with .Values.flowCollector.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.flowCollector.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with .Values.flowCollector.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.flowCollector.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.flowCollector.service.loadBalancerIP | quote }}
  {{- end }}
  selector:
    app: serviceradar-flow-collector
  ports:
  {{- if .Values.flowCollector.service.ports.netflow.enabled }}
  - name: netflow
    port: {{ .Values.flowCollector.service.ports.netflow.port | default 2055 }}
    targetPort: {{ .Values.flowCollector.service.ports.netflow.targetPort | default 2055 }}
    protocol: {{ .Values.flowCollector.service.ports.netflow.protocol | default "UDP" }}
  {{- end }}
  {{- if .Values.flowCollector.service.ports.sflow.enabled }}
  - name: sflow
    port: {{ .Values.flowCollector.service.ports.sflow.port | default 6343 }}
    targetPort: {{ .Values.flowCollector.service.ports.sflow.targetPort | default 6343 }}
    protocol: {{ .Values.flowCollector.service.ports.sflow.protocol | default "UDP" }}
  {{- end }}
  {{- if .Values.flowCollector.service.ports.ipfix.enabled }}
  - name: ipfix
    port: {{ .Values.flowCollector.service.ports.ipfix.port | default 4739 }}
    targetPort: {{ .Values.flowCollector.service.ports.ipfix.targetPort | default 4739 }}
    protocol: {{ .Values.flowCollector.service.ports.ipfix.protocol | default "UDP" }}
  {{- end }}
  {{- if .Values.flowCollector.service.ports.metrics.enabled }}
  - name: metrics
    port: {{ .Values.flowCollector.service.ports.metrics.port | default 50046 }}
    targetPort: {{ .Values.flowCollector.service.ports.metrics.targetPort | default 50046 }}
    protocol: {{ .Values.flowCollector.service.ports.metrics.protocol | default "TCP" }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spire.flowCollectorServiceAccount | default "serviceradar-flow-collector" }}
  labels:
    app.kubernetes.io/part-of: serviceradar
{{- end }}
