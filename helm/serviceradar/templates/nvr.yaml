{{- $nvr := default (dict) .Values.nvr -}}
{{- if $nvr.enabled -}}
{{- $name := printf "%s-nvr" (include "serviceradar.fullname" .) -}}
{{- $storage := $nvr.storage -}}
{{- $class := required "nvr.storage.storageClassName must name a qualified node-loss-tolerant CSI class" $storage.storageClassName -}}
{{- $replicas := int $nvr.replicas -}}
{{- if lt $replicas 1 -}}{{- fail "nvr.replicas must be positive" -}}{{- end -}}
{{- $seen := dict -}}
{{- range $ordinal := until $replicas -}}
{{- $member := printf "%s-%d" $name $ordinal -}}
{{- $id := required (printf "nvr.storage.storageIds must provision %s" $member) (index $storage.storageIds $member) -}}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $id) -}}{{- fail "NVR storage identities must be canonical UUIDs" -}}{{- end -}}
{{- if hasKey $seen $id -}}{{- fail "NVR replicas must have distinct storage identities" -}}{{- end -}}
{{- $_ := set $seen $id true -}}
{{- end -}}
{{- if not $nvr.recovery.existingConfigMap -}}
{{- fail "nvr.recovery.existingConfigMap must name operator-owned recovery state" -}}
{{- end -}}
{{- include "serviceradar.validateNvrIngest" . -}}
{{- include "serviceradar.validateNvrRead" . -}}
{{- include "serviceradar.validateNvrAnalysisRead" . -}}
{{- include "serviceradar.validateVantageMediaWorkerNvrReadPort" . -}}
{{- $maxBlockFragments := int $nvr.maxBlockFragments -}}
{{- if or (lt $maxBlockFragments 8) (gt $maxBlockFragments 256) -}}{{- fail "nvr.maxBlockFragments must be from 8 through 256" -}}{{- end -}}
{{- $maxKeyframeIntervalMs := 15000 -}}
{{- if not (kindIs "invalid" $nvr.maxKeyframeIntervalMs) -}}
{{- $maxKeyframeIntervalMs = int $nvr.maxKeyframeIntervalMs -}}
{{- end -}}
{{- if or (lt $maxKeyframeIntervalMs 1000) (gt $maxKeyframeIntervalMs 60000) -}}{{- fail "nvr.maxKeyframeIntervalMs must be from 1000 through 60000" -}}{{- end -}}
{{- $maxKeyframeWaitMs := 35000 -}}
{{- if not (kindIs "invalid" $nvr.maxKeyframeWaitMs) -}}
{{- $maxKeyframeWaitMs = int $nvr.maxKeyframeWaitMs -}}
{{- end -}}
{{- if or (lt $maxKeyframeWaitMs 1000) (gt $maxKeyframeWaitMs 60000) -}}{{- fail "nvr.maxKeyframeWaitMs must be from 1000 through 60000" -}}{{- end -}}
{{- $ingest := default (dict) $nvr.ingest -}}
{{- $ingestEnabled := default false $ingest.enabled -}}
{{- $ingestPort := int (default 8443 $ingest.port) -}}
{{- $read := default (dict) $nvr.read -}}
{{- $readEnabled := default false $read.enabled -}}
{{- $readPort := int (default 8444 $read.port) -}}
{{- $analysisRead := default (dict) $nvr.analysisRead -}}
{{- $analysisReadEnabled := default false $analysisRead.enabled -}}
{{- $analysisReadPort := int (default 8445 $analysisRead.port) -}}
{{- $archive := default (dict) $nvr.archive -}}
{{- $vantageMediaWorker := default (dict) (default (dict) .Values.vantage).mediaWorker -}}
{{- $mediaWorkerRead := and (eq (include "serviceradar.vantageEnabled" .) "true") (eq (include "serviceradar.vantageMediaWorkerAllowNvrRead" .) "true") -}}
{{- $mediaWorkerReadPort := int (default 8445 $vantageMediaWorker.nvrReadPort) -}}
{{- $archiveEnabled := default false $archive.enabled -}}
{{- $podSecurity := include "serviceradar.elixirReleasePodSecurityContext" . -}}
{{- $nodeSelector := deepCopy (default (dict) $nvr.nodeSelector) -}}
{{- $archiveEgress := default (dict) $archive.providerEgress -}}
{{- $archiveCIDRs := default (list) $archiveEgress.cidrs -}}
{{- $archivePort := 0 -}}
{{- if $archiveEnabled -}}
{{- /* The archive request is served on the ingest listener with the ingest token. */ -}}
{{- if not $ingestEnabled -}}
{{- fail "nvr.archive.enabled requires nvr.ingest.enabled" -}}
{{- end -}}
{{- /* Same accepted profiles and path rule as mediaStorage.seccompProfile. */ -}}
{{- $seccomp := default (dict) $archive.seccompProfile -}}
{{- $seccompType := default "RuntimeDefault" $seccomp.type -}}
{{- $seccompPath := default "" $seccomp.localhostProfile -}}
{{- if not (has $seccompType (list "RuntimeDefault" "Localhost")) -}}
{{- fail "nvr.archive.seccompProfile.type must be RuntimeDefault or Localhost" -}}
{{- end -}}
{{- if eq $seccompType "Localhost" -}}
{{- if not (kindIs "string" $seccompPath) -}}
{{- fail "nvr.archive.seccompProfile.localhostProfile must be a non-empty relative path without dot or parent segments" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$" $seccompPath) -}}
{{- fail "nvr.archive.seccompProfile.localhostProfile must be a non-empty relative path without dot or parent segments" -}}
{{- end -}}
{{- /* Longshore's io_uring client also needs a raised locked-memory limit that only
the node can set; the node administrator labels a node once both are in place. */ -}}
{{- $_ := set $nodeSelector "serviceradar.io/media-storage-node-prepared" "true" -}}
{{- else if $seccompPath -}}
{{- fail "nvr.archive.seccompProfile.localhostProfile requires type Localhost" -}}
{{- end -}}
{{- $profile := dict "type" $seccompType -}}
{{- if eq $seccompType "Localhost" -}}
{{- $_ := set $profile "localhostProfile" $seccompPath -}}
{{- end -}}
{{- $podSecurityValues := fromYaml $podSecurity -}}
{{- $_ := set $podSecurityValues.securityContext "seccompProfile" $profile -}}
{{- $podSecurity = toYaml $podSecurityValues -}}
{{- /* Explicit provider addresses only: NetworkPolicy cannot match a hostname. */ -}}
{{- if not (kindIs "slice" $archiveCIDRs) -}}
{{- fail "nvr.archive.providerEgress.cidrs must list the provider endpoint CIDRs" -}}
{{- end -}}
{{- if eq (len $archiveCIDRs) 0 -}}
{{- fail "nvr.archive.providerEgress.cidrs must list the provider endpoint CIDRs" -}}
{{- end -}}
{{- range $cidr := $archiveCIDRs -}}
{{- $validCIDR := false -}}
{{- if kindIs "string" $cidr -}}
{{- $validCIDR = regexMatch `^((0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}(0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([1-9]|[12][0-9]|3[0-2])$` $cidr -}}
{{- $parts := splitList "/" $cidr -}}
{{- if and (not $validCIDR) (contains ":" $cidr) (eq (len $parts) 2) -}}
{{- $address := index $parts 0 -}}
{{- $compressed := splitList "::" $address -}}
{{- if and (regexMatch `^([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$` (index $parts 1)) (regexMatch `^[0-9A-Fa-f:]+$` $address) (not (contains ":::" $address)) (le (len $compressed) 2) -}}
{{- $groups := list -}}
{{- range $side := $compressed -}}
{{- if ne $side "" -}}
{{- $groups = concat $groups (splitList ":" $side) -}}
{{- end -}}
{{- end -}}
{{- $groupsValid := true -}}
{{- range $group := $groups -}}
{{- if not (regexMatch `^[0-9A-Fa-f]{1,4}$` $group) -}}
{{- $groupsValid = false -}}
{{- end -}}
{{- end -}}
{{- $validCIDR = and $groupsValid (ternary (lt (len $groups) 8) (eq (len $groups) 8) (eq (len $compressed) 2)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $validCIDR -}}
{{- fail (printf "nvr.archive.providerEgress.cidrs contains invalid or catch-all CIDR %v" $cidr) -}}
{{- end -}}
{{- end -}}
{{- if not (regexMatch `^[1-9][0-9]{0,4}$` (toString $archiveEgress.port)) -}}
{{- fail "nvr.archive.providerEgress.port must be in 1..65535" -}}
{{- end -}}
{{- $archivePort = int $archiveEgress.port -}}
{{- if gt $archivePort 65535 -}}
{{- fail "nvr.archive.providerEgress.port must be in 1..65535" -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  selector:
    app: serviceradar-nvr
  ports:
    - name: health
      port: 8095
      targetPort: health
    {{- if $ingestEnabled }}
    - name: ingest-https
      port: {{ $ingestPort }}
      targetPort: ingest-https
    {{- end }}
    {{- if $readEnabled }}
    - name: read-https
      port: {{ $readPort }}
      targetPort: read-https
    {{- end }}
    {{- if $analysisReadEnabled }}
    - name: analysis-https
      port: {{ $analysisReadPort }}
      targetPort: analysis-https
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  # Operator-coordinated updates until assignment drain/fencing is implemented.
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: serviceradar-nvr
  template:
    metadata:
      labels:
        app: serviceradar-nvr
    spec:
      {{- include "serviceradar.podDnsConfig" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- $podSecurity | nindent 6 }}
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: serviceradar-nvr
      {{- with $nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $nvr.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nvr
          image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "service" "nvr" "name" "serviceradar-nvr") | quote }}
          imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
          args: [start]
          ports:
            - name: health
              containerPort: 8095
            {{- if $ingestEnabled }}
            - name: ingest-https
              containerPort: {{ $ingestPort }}
            {{- end }}
            {{- if $readEnabled }}
            - name: read-https
              containerPort: {{ $readPort }}
            {{- end }}
            {{- if $analysisReadEnabled }}
            - name: analysis-https
              containerPort: {{ $analysisReadPort }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: RELEASE_TMP
              value: /tmp
            {{- include "serviceradar.nvrRecoveryEnv" . | nindent 12 }}
            - name: SERVICERADAR_NVR_MEMBER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICERADAR_NVR_STORAGE_IDS
              value: {{ toJson $storage.storageIds | quote }}
            - name: SERVICERADAR_NVR_SPOOL_ROOT
              value: /var/lib/serviceradar-nvr/spool
            - name: SERVICERADAR_NVR_MAX_SESSIONS
              value: {{ $nvr.maxSessions | quote }}
            - name: SERVICERADAR_NVR_MAX_DURATION_MS
              value: {{ $nvr.maxDurationMs | quote }}
            - name: SERVICERADAR_NVR_MAX_BLOCK_FRAGMENTS
              value: {{ printf "%d" $maxBlockFragments | quote }}
            - name: SERVICERADAR_NVR_MAX_KEYFRAME_INTERVAL_MS
              value: {{ printf "%d" $maxKeyframeIntervalMs | quote }}
            - name: SERVICERADAR_NVR_MAX_KEYFRAME_WAIT_MS
              value: {{ printf "%d" $maxKeyframeWaitMs | quote }}
            - name: SERVICERADAR_NVR_MAX_SPOOL_BYTES
              value: {{ printf "%d" (int64 $nvr.maxSpoolBytes) | quote }}
            - name: SERVICERADAR_NVR_RESERVE_BYTES
              value: {{ printf "%d" (int64 $nvr.reserveBytes) | quote }}
            {{- if $ingestEnabled }}
            - name: SERVICERADAR_NVR_INGEST_CONFIG_FILE
              value: /etc/serviceradar/nvr-ingest/config/config.json
            - name: SERVICERADAR_NVR_INGEST_TOKEN_FILE
              value: /etc/serviceradar/nvr-ingest/auth/ingest-token
            {{- end }}
            {{- if $readEnabled }}
            - name: SERVICERADAR_NVR_READ_CONFIG_FILE
              value: /etc/serviceradar/nvr-read/config/config.json
            - name: SERVICERADAR_NVR_READ_TOKEN_FILE
              value: /etc/serviceradar/nvr-read/auth/read-token
            - name: SERVICERADAR_NVR_PLAYBACK_READ_SLOTS
              value: {{ printf "%d" (int (default 8 $read.playbackReadSlots)) | quote }}
            {{- end }}
            {{- if $analysisReadEnabled }}
            - name: SERVICERADAR_NVR_ANALYSIS_READ_CONFIG_FILE
              value: /etc/serviceradar/nvr-analysis-read/config/config.json
            - name: SERVICERADAR_NVR_ANALYSIS_READ_TOKEN_FILE
              value: /etc/serviceradar/nvr-analysis-read/auth/analysis-read-token
            - name: SERVICERADAR_NVR_ANALYSIS_READ_SLOTS
              value: {{ printf "%d" (int (default 4 $analysisRead.analysisReadSlots)) | quote }}
            {{- end }}
          resources: {{ toYaml $nvr.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          volumeMounts:
            - name: recording
              mountPath: /var/lib/serviceradar-nvr
            - name: tmp
              mountPath: /tmp
            {{- include "serviceradar.nvrRecoveryMount" . | nindent 12 }}
            {{- if $ingestEnabled }}
            - name: ingest-config
              mountPath: /etc/serviceradar/nvr-ingest/config
              readOnly: true
            - name: ingest-auth
              mountPath: /etc/serviceradar/nvr-ingest/auth
              readOnly: true
            - name: ingest-tls
              mountPath: /etc/serviceradar/nvr-ingest/tls
              readOnly: true
            {{- end }}
            {{- if $readEnabled }}
            - name: read-config
              mountPath: /etc/serviceradar/nvr-read/config
              readOnly: true
            - name: read-auth
              mountPath: /etc/serviceradar/nvr-read/auth
              readOnly: true
            - name: read-tls
              mountPath: /etc/serviceradar/nvr-read/tls
              readOnly: true
            {{- end }}
            {{- if $analysisReadEnabled }}
            - name: analysis-read-config
              mountPath: /etc/serviceradar/nvr-analysis-read/config
              readOnly: true
            - name: analysis-read-auth
              mountPath: /etc/serviceradar/nvr-analysis-read/auth
              readOnly: true
            - name: analysis-read-tls
              mountPath: /etc/serviceradar/nvr-analysis-read/tls
              readOnly: true
            {{- end }}
      volumes:
        {{- include "serviceradar.nvrRecoveryVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $ingestEnabled }}
        - name: ingest-config
          secret:
            secretName: {{ $ingest.configSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: config.json, path: config.json}
        - name: ingest-auth
          secret:
            secretName: {{ $ingest.tokenSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: ingest-token, path: ingest-token}
        - name: ingest-tls
          secret:
            secretName: {{ $ingest.tlsSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
        {{- end }}
        {{- if $readEnabled }}
        - name: read-config
          secret:
            secretName: {{ $read.configSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: config.json, path: config.json}
        - name: read-auth
          secret:
            secretName: {{ $read.tokenSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: read-token, path: read-token}
        - name: read-tls
          secret:
            secretName: {{ $read.tlsSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
        {{- end }}
        {{- if $analysisReadEnabled }}
        - name: analysis-read-config
          secret:
            secretName: {{ $analysisRead.configSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: config.json, path: config.json}
        - name: analysis-read-auth
          secret:
            secretName: {{ $analysisRead.tokenSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: analysis-read-token, path: analysis-read-token}
        - name: analysis-read-tls
          secret:
            secretName: {{ $analysisRead.tlsSecretName | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: recording
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $class | quote }}
        resources:
          requests:
            storage: {{ $storage.size | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app: serviceradar-nvr
  policyTypes: [Ingress, Egress]
  {{- if or $ingestEnabled $readEnabled $mediaWorkerRead }}
  ingress:
    {{- if $ingestEnabled }}
    - from:
        - podSelector:
            matchLabels:
              app: serviceradar-core
      ports:
        - protocol: TCP
          port: {{ $ingestPort }}
    {{- end }}
    {{- if $readEnabled }}
    # Playback reads come from web-ng only, to the read port only.
    - from:
        - podSelector:
            matchLabels:
              app: serviceradar-web-ng
      ports:
        - protocol: TCP
          port: {{ $readPort }}
    {{- end }}
    {{- if $mediaWorkerRead }}
    {{- /* The Vantage addon's media worker reads local recordings here under a read
         grant (vantage.mediaWorker.allowNvrRead); the addon owns its egress rule. */}}
    - from:
        - podSelector:
            matchLabels:
              app: serviceradar-media-worker
      ports:
        - protocol: TCP
          port: {{ $mediaWorkerReadPort }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if $archiveEnabled }}
    - to:
        {{- range $archiveCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $archivePort }}
    {{- end }}
{{- end }}
