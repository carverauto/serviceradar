{{- if .Values.spire.enabled }}
{{- $ns := default .Release.Namespace .Values.spire.namespace }}
{{- $trustDomain := (include "serviceradar.trustDomain" .Values) }}
{{- $entries := list
  (dict "name" "serviceradar-core" "label" "serviceradar-core" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "core")) "admin" true)
  (dict "name" "serviceradar-web-ng" "label" "serviceradar-web-ng" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "webNg")))
  (dict "name" "serviceradar-datasvc" "label" "serviceradar-datasvc" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "datasvc")))
  (dict "name" "serviceradar-agent" "label" "serviceradar-agent" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "agent")))
  (dict "name" "serviceradar-log-collector" "label" "serviceradar-log-collector" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "logCollector")))
  (dict "name" "serviceradar-rperf-checker" "label" "serviceradar-rperf-client" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "rperfChecker")))
  (dict "name" "serviceradar-flow-collector" "label" "serviceradar-flow-collector" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "flowCollector")))
  (dict "name" "serviceradar-bmp-collector" "label" "serviceradar-bmp-collector" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "bmpCollector")))
  (dict "name" "serviceradar-trapd" "label" "serviceradar-trapd" "sa" (include "serviceradar.componentServiceAccount" (dict "values" .Values "component" "trapd")))
}}
{{- range $entries }}
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ printf "%s-%s" .name $ns }}
spec:
  spiffeIDTemplate: spiffe://{{ $trustDomain }}/ns/{{ $ns }}/sa/{{ .sa }}
{{- if .admin }}
  admin: true
{{- end }}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ $ns }}
  podSelector:
    matchLabels:
      app: {{ .label }}
{{- end }}
{{- end }}
