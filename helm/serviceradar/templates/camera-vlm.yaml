{{- $vlm := default (dict) .Values.cameraVlm -}}
{{- /* Validate booleans and externalUrl before the enabled gate so invalid values
     stored while cameraVlm is off fail immediately rather than on enablement. */ -}}
{{- $_ := include "serviceradar.cameraVlmNetworkPolicyEnabled" . -}}
{{- $_ := include "serviceradar.cameraVlmExternalUrl" . -}}
{{- $operatorManaged := eq (include "serviceradar.strictBool" (dict "name" "cameraVlm.networkPolicy.operatorManaged" "value" (default (dict) $vlm.networkPolicy).operatorManaged "default" false)) "true" -}}
{{- if eq (include "serviceradar.cameraVlmEnabled" .) "true" }}
{{- $npEnabled := eq (include "serviceradar.cameraVlmNetworkPolicyEnabled" .) "true" -}}
{{- if and (not $npEnabled) (not $operatorManaged) -}}
{{- fail "cameraVlm.networkPolicy.enabled false removes the camera VLM server's only egress restriction from this chart: keep it true, or set cameraVlm.networkPolicy.operatorManaged true to state that you supply and own its zero-egress isolation" -}}
{{- end -}}
{{- $runtime := default "crane" $vlm.runtime -}}
{{- if not (has $runtime (list "crane" "llama-server")) -}}
{{- fail (printf "cameraVlm.runtime must be crane or llama-server, got %q" (toString $runtime)) -}}
{{- end -}}
{{- $port := int (include "serviceradar.cameraVlmPort" .) -}}
{{- $replicas := int (include "serviceradar.wholeCount" (dict "name" "cameraVlm.replicas" "value" $vlm.replicas "default" 1)) -}}
{{- $gpuCount := int (include "serviceradar.wholeCount" (dict "name" "cameraVlm.gpuCount" "value" $vlm.gpuCount "default" 1)) -}}
{{- if lt $gpuCount 1 -}}
{{- fail "cameraVlm.gpuCount must be >= 1 when cameraVlm.enabled is true" -}}
{{- end -}}
{{- if not $vlm.runtimeClassName -}}
{{- fail "cameraVlm.runtimeClassName is required when cameraVlm.enabled is true (for example nvidia)" -}}
{{- end -}}
{{- $vlmImage := default (dict) $vlm.image -}}
{{- $imageRepo := "" -}}
{{- if kindIs "string" $vlmImage.repository -}}
{{- $imageRepo = trim $vlmImage.repository -}}
{{- end -}}
{{- if eq $imageRepo "" -}}
{{- fail "cameraVlm.image.repository is required when cameraVlm.enabled is true" -}}
{{- end -}}
{{- $imageTag := "" -}}
{{- if not (kindIs "invalid" $vlmImage.tag) -}}
{{- $imageTag = trim (toString $vlmImage.tag) -}}
{{- end -}}
{{- $imageDigest := "" -}}
{{- if kindIs "string" $vlmImage.digest -}}
{{- $imageDigest = trim $vlmImage.digest -}}
{{- end -}}
{{- if and $imageDigest (not (hasPrefix "@" $imageDigest)) -}}
{{- $imageDigest = printf "@%s" $imageDigest -}}
{{- end -}}
{{- if and (eq $imageTag "") (eq $imageDigest "") -}}
{{- fail (printf "cameraVlm.image.repository %s requires cameraVlm.image.tag or cameraVlm.image.digest" $imageRepo) -}}
{{- end -}}
{{- $imageRef := printf "%s%s%s" $imageRepo (ternary (printf ":%s" $imageTag) "" (ne $imageTag "")) $imageDigest -}}
{{- $models := default (dict) $vlm.models -}}
{{- $existingClaim := "" -}}
{{- if kindIs "string" $models.existingClaim -}}
{{- $existingClaim = trim $models.existingClaim -}}
{{- end -}}
{{- if eq $existingClaim "" -}}
{{- fail "cameraVlm.models.existingClaim is required when cameraVlm.enabled is true: weights must be loaded from local PVC storage with zero internet egress" -}}
{{- end -}}
{{- $modelsMountPath := default "/models" $models.mountPath -}}
{{- $modelsMountDir := trimSuffix "/" $modelsMountPath -}}
{{- $subPath := "" -}}
{{- if not (kindIs "invalid" $models.subPath) -}}
{{- if not (kindIs "string" $models.subPath) -}}
{{- fail "cameraVlm.models.subPath must be a string" -}}
{{- end -}}
{{- $subPath = trim $models.subPath -}}
{{- if and (ne $subPath "") (or (contains ".." $subPath) (contains "//" $subPath) (hasPrefix "/" $subPath) (hasSuffix "/" $subPath)) -}}
{{- fail (printf "cameraVlm.models.subPath %q must be a clean relative path without '..', '//', or leading/trailing '/'" $subPath) -}}
{{- end -}}
{{- end -}}
{{- $modelFile := "" -}}
{{- if not (kindIs "invalid" $models.modelFile) -}}
{{- if not (kindIs "string" $models.modelFile) -}}
{{- fail "cameraVlm.models.modelFile must be a string" -}}
{{- end -}}
{{- $modelFile = trim $models.modelFile -}}
{{- if and (ne $modelFile "") (or (contains ".." $modelFile) (contains "//" $modelFile) (hasPrefix "/" $modelFile) (hasSuffix "/" $modelFile)) -}}
{{- fail (printf "cameraVlm.models.modelFile %q must be a clean relative path inside cameraVlm.models.mountPath without '..', '//', or leading/trailing '/'" $modelFile) -}}
{{- end -}}
{{- end -}}
{{- $mmprojFile := "" -}}
{{- if not (kindIs "invalid" $models.mmprojFile) -}}
{{- if not (kindIs "string" $models.mmprojFile) -}}
{{- fail "cameraVlm.models.mmprojFile must be a string" -}}
{{- end -}}
{{- $mmprojFile = trim $models.mmprojFile -}}
{{- if and (ne $mmprojFile "") (or (contains ".." $mmprojFile) (contains "//" $mmprojFile) (hasPrefix "/" $mmprojFile) (hasSuffix "/" $mmprojFile)) -}}
{{- fail (printf "cameraVlm.models.mmprojFile %q must be a clean relative path inside cameraVlm.models.mountPath without '..', '//', or leading/trailing '/'" $mmprojFile) -}}
{{- end -}}
{{- end -}}
{{- $modelSubPath := "" -}}
{{- if not (kindIs "invalid" $models.modelSubPath) -}}
{{- if not (kindIs "string" $models.modelSubPath) -}}
{{- fail "cameraVlm.models.modelSubPath must be a string" -}}
{{- end -}}
{{- $modelSubPath = trim $models.modelSubPath -}}
{{- if and (ne $modelSubPath "") (or (contains ".." $modelSubPath) (contains "//" $modelSubPath) (hasPrefix "/" $modelSubPath) (hasSuffix "/" $modelSubPath)) -}}
{{- fail (printf "cameraVlm.models.modelSubPath %q must be a clean relative path without '..', '//', or leading/trailing '/'" $modelSubPath) -}}
{{- end -}}
{{- end -}}
{{- $customArgs := default (list) $vlm.args -}}
{{- $extraArgs := default (list) $vlm.extraArgs -}}
{{- if and (eq $runtime "llama-server") (eq (len $customArgs) 0) (eq $modelFile "") -}}
{{- fail "cameraVlm.models.modelFile is required when cameraVlm.runtime is llama-server (unless cameraVlm.args is provided explicitly)" -}}
{{- end -}}
{{- $ctxSize := int (include "serviceradar.wholeCount" (dict "name" "cameraVlm.ctxSize" "value" $vlm.ctxSize "default" 4096)) -}}
{{- if lt $ctxSize 1 -}}
{{- fail "cameraVlm.ctxSize must be >= 1" -}}
{{- end -}}
{{- $parallel := int (include "serviceradar.wholeCount" (dict "name" "cameraVlm.parallel" "value" $vlm.parallel "default" 1)) -}}
{{- if lt $parallel 1 -}}
{{- fail "cameraVlm.parallel must be >= 1" -}}
{{- end -}}
{{- $defaultHealthPath := ternary "/v1/models" "/health" (eq $runtime "crane") -}}
{{- $healthPath := default $defaultHealthPath $vlm.healthPath -}}
{{- if not (hasPrefix "/" $healthPath) -}}
{{- fail (printf "cameraVlm.healthPath must start with '/', got %q" $healthPath) -}}
{{- end -}}
{{- $effectiveArgs := list -}}
{{- if gt (len $customArgs) 0 -}}
{{- $effectiveArgs = $customArgs -}}
{{- else if eq $runtime "llama-server" -}}
{{- $effectiveArgs = concat $effectiveArgs (list "--model" (printf "%s/%s" $modelsMountDir $modelFile)) -}}
{{- if ne $mmprojFile "" -}}
{{- $effectiveArgs = concat $effectiveArgs (list "--mmproj" (printf "%s/%s" $modelsMountDir $mmprojFile)) -}}
{{- end -}}
{{- $effectiveArgs = concat $effectiveArgs (list "--ctx-size" (toString $ctxSize) "--parallel" (toString $parallel) "--host" "0.0.0.0" "--port" (toString $port)) -}}
{{- else -}}
{{- $craneModelPath := $modelsMountDir -}}
{{- if ne $modelSubPath "" -}}
{{- $craneModelPath = printf "%s/%s" $modelsMountDir $modelSubPath -}}
{{- end -}}
{{- $effectiveArgs = concat $effectiveArgs (list "--model-path" $craneModelPath "--host" "0.0.0.0" "--port" (toString $port)) -}}
{{- end -}}
{{- if gt (len $extraArgs) 0 -}}
{{- $effectiveArgs = concat $effectiveArgs $extraArgs -}}
{{- end -}}
{{- $cudaCache := default (dict) $vlm.cudaCache -}}
{{- $cudaCachePath := "/var/cache/serviceradar-camera-vlm/cuda" -}}
{{- $baseResources := deepCopy (default (dict) $vlm.resources) -}}
{{- $requests := deepCopy (default (dict) $baseResources.requests) -}}
{{- $limits := deepCopy (default (dict) $baseResources.limits) -}}
{{- $gpuResourceName := default "nvidia.com/gpu" $vlm.gpuResourceName -}}
{{- $_ := set $requests $gpuResourceName $gpuCount -}}
{{- $_ := set $limits $gpuResourceName $gpuCount -}}
{{- $_ := set $baseResources "requests" $requests -}}
{{- $_ := set $baseResources "limits" $limits -}}
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-camera-vlm
  labels:
    app.kubernetes.io/name: serviceradar-camera-vlm
    app.kubernetes.io/component: camera-vlm
    app.kubernetes.io/part-of: serviceradar-media
spec:
  type: ClusterIP
  selector:
    app: serviceradar-camera-vlm
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceradar-camera-vlm
  labels:
    app: serviceradar-camera-vlm
    app.kubernetes.io/name: serviceradar-camera-vlm
    app.kubernetes.io/component: camera-vlm
    app.kubernetes.io/part-of: serviceradar-media
spec:
  replicas: {{ $replicas }}
  {{- /* A GPU pod holds its GPU until it exits, so on a pool with no spare GPU a
       surge pod can never schedule. maxSurge: 0 with maxUnavailable: 1 rolls one
       GPU replica at a time for replicas > 1 and cleanly replaces replicas == 1
       without requiring a spare GPU. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: serviceradar-camera-vlm
  template:
    metadata:
      labels:
        app: serviceradar-camera-vlm
        app.kubernetes.io/name: serviceradar-camera-vlm
        app.kubernetes.io/component: camera-vlm
        app.kubernetes.io/part-of: serviceradar-media
      annotations:
        serviceradar.io/camera-vlm-runtime: {{ $runtime | quote }}
        {{- if (default (dict) .Values.global).forceRolloutOnUpgrade }}
        serviceradar.io/release-revision: {{ .Release.Revision | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "serviceradar.podDnsConfig" . | nindent 6 }}
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      {{- if $vlm.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $vlm.topologySpreadConstraints | nindent 8 }}
      {{- else if (default (dict) .Values.topologySpread).enabled }}
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-camera-vlm") | nindent 6 }}
      {{- else if gt $replicas 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: serviceradar-camera-vlm
      {{- end }}
      runtimeClassName: {{ $vlm.runtimeClassName | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with $vlm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vlm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vlm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: camera-vlm
          image: {{ $imageRef }}
          imagePullPolicy: {{ default (include "serviceradar.imagePullPolicy" .) $vlmImage.pullPolicy }}
          {{- with $vlm.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- range $arg := $effectiveArgs }}
            - {{ $arg | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: CUDA_CACHE_PATH
              value: {{ $cudaCachePath | quote }}
            - name: TMPDIR
              value: /tmp
            {{- with $vlm.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ $healthPath | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ $healthPath | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $healthPath | quote }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $baseResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cuda-cache
              mountPath: {{ $cudaCachePath | quote }}
            {{- if and (eq $runtime "llama-server") (ne $modelFile "") (eq $subPath "") }}
            - name: models
              mountPath: {{ printf "%s/%s" $modelsMountDir $modelFile | quote }}
              subPath: {{ $modelFile | quote }}
              readOnly: true
            {{- if ne $mmprojFile "" }}
            - name: models
              mountPath: {{ printf "%s/%s" $modelsMountDir $mmprojFile | quote }}
              subPath: {{ $mmprojFile | quote }}
              readOnly: true
            {{- end }}
            {{- else }}
            - name: models
              mountPath: {{ $modelsMountDir | quote }}
              {{- if ne $subPath "" }}
              subPath: {{ $subPath | quote }}
              {{- end }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cuda-cache
          {{- if $cudaCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $cudaCache.existingClaim | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ default "1Gi" $cudaCache.sizeLimit | quote }}
          {{- end }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ $existingClaim | quote }}
            readOnly: true
{{- if $npEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serviceradar-camera-vlm
  labels:
    app.kubernetes.io/name: serviceradar-camera-vlm
    app.kubernetes.io/component: camera-vlm
    app.kubernetes.io/part-of: serviceradar-media
spec:
  podSelector:
    matchLabels:
      app: serviceradar-camera-vlm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: serviceradar-core
        - podSelector:
            matchLabels:
              app: serviceradar-web-ng
        - podSelector:
            matchLabels:
              app: serviceradar-media-worker
      ports:
        - protocol: TCP
          port: {{ $port }}
  egress: []
{{- end }}
{{- end }}
