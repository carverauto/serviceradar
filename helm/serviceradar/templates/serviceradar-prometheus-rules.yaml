{{- $obs := default (dict) .Values.observability -}}
{{- $prom := default (dict) (get $obs "prometheus") -}}
{{- $rules := default (dict) (get $prom "rules") -}}
{{- $obsEnabled := false -}}
{{- if hasKey $obs "enabled" -}}
{{- $obsEnabled = $obs.enabled -}}
{{- end -}}
{{- $rulesEnabled := true -}}
{{- if hasKey $rules "enabled" -}}
{{- $rulesEnabled = $rules.enabled -}}
{{- end -}}
{{- $pgbouncer := default (dict) (get $rules "pgbouncer") -}}
{{- $webNg := default (dict) (get $rules "webNg") -}}
{{- $core := default (dict) (get $rules "core") -}}
{{- $agentGateway := default (dict) (get $rules "agentGateway") -}}
{{- if and $obsEnabled $rulesEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: serviceradar-platform-rules
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: observability
    {{- with $rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: serviceradar.scrape
      rules:
        - alert: ServiceRadarWebNgMetricsTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", service="serviceradar-web-ng"} == 0
          for: {{ default "5m" $webNg.scrapeDownFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar web-ng metrics target is down"
            description: "Prometheus cannot scrape web-ng /metrics in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarCoreMetricsTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", service="serviceradar-core"} == 0
          for: {{ default "5m" $core.scrapeDownFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar core metrics target is down"
            description: "Prometheus cannot scrape core-elx /metrics in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarAgentGatewayMetricsTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", service="serviceradar-agent-gateway-metrics"} == 0
          for: {{ default "5m" $agentGateway.scrapeDownFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar agent-gateway metrics target is down"
            description: "Prometheus cannot scrape agent-gateway /metrics in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarAgentGatewayResultsBufferDropped
          expr: sum(increase(serviceradar_agent_gateway_results_buffer_dropped_count{namespace="{{ .Release.Namespace }}"}[{{ default "5m" $agentGateway.resultsBufferDroppedWindow }}])) > 0
          for: {{ default "1m" $agentGateway.resultsBufferDroppedFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar agent-gateway dropped buffered statuses"
            description: "The agent-gateway results buffer dropped one or more statuses in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarAgentGatewayPubAckErrors
          expr: sum(increase(serviceradar_agent_gateway_jetstream_puback_error_count{namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar agent-gateway JetStream PubAck errors"
            description: "The agent-gateway durable edge publisher received PubAck errors in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarEdgeRecordConsumerLag
          expr: max(serviceradar_event_writer_consumer_lag_messages_value{namespace="{{ .Release.Namespace }}", subject_class=~"edge_record|edge_record_audit|edge_record_recovery"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar EDGE_RECORD consumer lag"
            description: "The EventWriter EDGE_RECORD durable has pending or unacked messages in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarEdgeRecordBacklogPressure
          expr: max by (subject_class) (serviceradar_event_writer_consumer_stream_byte_utilization_ratio{namespace="{{ .Release.Namespace }}", subject_class=~"edge_record|edge_record_audit"}) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar edge-record backlog is nearly full"
            description: "The {{`{{ $labels.subject_class }}`}} edge-record source stream is above 80% of its MaxBytes in namespace {{ .Release.Namespace }}. The streams hold only unwritten records, so the owning durable is stuck; DiscardNew refuses new records when full, which leaves those agent spool sequences unresolved. Fix the consumer before the backlog fills."
        - alert: ServiceRadarEventWriterMessagesExpiredBeforeDelivery
          expr: max by (stream, durable) (serviceradar_event_writer_consumer_expired_before_delivery_value{namespace="{{ .Release.Namespace }}"}) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar EventWriter is losing messages before delivery"
            description: "The EventWriter durable {{`{{ $labels.durable }}`}} on stream {{`{{ $labels.stream }}`}} trails the stream's first retained sequence while messages are pending for it in namespace {{ .Release.Namespace }}: the stream discarded messages it never delivered. The durable is not being pulled; check that consumer's EventWriter pipeline and producer health."
        - alert: ServiceRadarEdgeRecordSecurityQuarantine
          expr: max(serviceradar_event_writer_consumer_stream_bytes_value{namespace="{{ .Release.Namespace }}", subject_class="edge_record_quarantine"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar edge records are held in security quarantine"
            description: "The edge-record security-quarantine stream holds records signed by a compromise-revoked key in namespace {{ .Release.Namespace }}. The EventWriter log line 'Edge record held in security quarantine' names each record's stream sequence; see docs/edge-record-quarantine-runbook.md."
        - alert: ServiceRadarEdgeRecordSecurityQuarantineFull
          expr: max(serviceradar_event_writer_consumer_stream_byte_utilization_ratio{namespace="{{ .Release.Namespace }}", subject_class="edge_record_quarantine"}) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar edge-record security quarantine is nearly full"
            description: "The edge-record security-quarantine stream is above 80% of its MaxBytes in namespace {{ .Release.Namespace }}. It refuses new records when full, which leaves those agent spool sequences unresolved."
        - alert: ServiceRadarEdgeRecordDeadLettered
          expr: sum by (contract, reason_class) ((increase(serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="stored"}[15m]) > 0) or (serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="stored"} unless serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="stored"} offset 15m)) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar edge records were dead-lettered"
            description: "EventWriter dead-lettered {{`{{ $labels.contract }}`}} edge records ({{`{{ $labels.reason_class }}`}}) in namespace {{ .Release.Namespace }} after their projection kept failing. They are held in TELEMETRY_EDGE_RECORD_DLQ_V1_BULK; fix the cause, then replay them (docs/edge-record-dead-letter-runbook.md)."
        - alert: ServiceRadarEdgeRecordDeadLetterPublishFailed
          expr: sum((increase(serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="failed"}[5m]) > 0) or (serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="failed"} unless serviceradar_event_writer_edge_record_dead_letter_count{namespace="{{ .Release.Namespace }}", result="failed"} offset 5m)) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar cannot dead-letter failing edge records"
            description: "EventWriter could not store a failing edge record in its dead-letter stream in namespace {{ .Release.Namespace }}. The record stays on the edge-record stream and keeps retrying (source streams have no MaxAge); check the dead-letter stream exists and has room."
        - alert: ServiceRadarEdgeRecordDeadLetterFull
          expr: max(serviceradar_event_writer_consumer_stream_byte_utilization_ratio{namespace="{{ .Release.Namespace }}", subject_class="edge_record_dlq"}) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar edge-record dead-letter stream is nearly full"
            description: "The edge-record dead-letter stream is above 80% of its MaxBytes in namespace {{ .Release.Namespace }}. It refuses new dead-letters when full, which leaves failing records retrying on the edge-record stream; replay or delete resolved records."
        - alert: ServiceRadarAgentEdgeSpoolUnresolvedAge
          expr: max(agent_edge_spool_oldest_unresolved_age_seconds) > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar agent edge spool has an old unresolved record"
            description: "An agent edge spool still holds an unresolved record older than 15 minutes."
        - alert: ServiceRadarAgentEdgeSpoolBytes
          expr: max(agent_edge_spool_unresolved_bytes) > 1073741824
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar agent edge spool unresolved bytes are high"
            description: "An agent edge spool is holding more than 1 GiB of unresolved records."
        - alert: ServiceRadarAdmissionLaneNotAccepted
          expr: sum by (lane) (increase(serviceradar_admission_lane_completion_count{namespace="{{ .Release.Namespace }}", outcome="not_accepted"}[{{ default "5m" $core.admissionLaneNotAcceptedWindow }}])) > {{ default 0 $core.admissionLaneNotAcceptedMax }}
          for: {{ default "1m" $core.admissionLaneNotAcceptedFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar admission lane recorded non-accepted completions"
            description: "One or more core admission lanes recorded non-accepted completion outcomes in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarSyncIncompleteRun
          expr: sum by (lane) (increase(serviceradar_admission_lane_incomplete_run_count{namespace="{{ .Release.Namespace }}"}[{{ default "15m" $core.syncIncompleteRunWindow }}])) > {{ default 0 $core.syncIncompleteRunMax }}
          for: {{ default "1m" $core.syncIncompleteRunFor }}
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar sync ingestion detected an incomplete sync run"
            description: "Sync ingestion recorded an incomplete sync run and skipped snapshot finalization in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarCNPGMetricsTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", job=~".*/cnpg"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar CNPG metrics target is down"
            description: "CloudNativePG metrics are unavailable for at least one CNPG pod in namespace {{ .Release.Namespace }}."
        {{- if and .Values.cnpg .Values.cnpg.pooler .Values.cnpg.pooler.enabled }}
        - alert: ServiceRadarPgBouncerMetricsTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", job=~".*pgbouncer.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceRadar PgBouncer metrics target is down"
            description: "Prometheus cannot scrape at least one ServiceRadar PgBouncer Pooler pod in namespace {{ .Release.Namespace }}."
        {{- end }}
    - name: serviceradar.database
      rules:
        {{- if and .Values.cnpg .Values.cnpg.pooler .Values.cnpg.pooler.enabled }}
        - alert: ServiceRadarPgBouncerClientsWaiting
          expr: sum(cnpg_pgbouncer_pools_cl_waiting{namespace="{{ .Release.Namespace }}"}) > {{ default 1 $pgbouncer.clientsWaitingWarning }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar PgBouncer clients waiting"
            description: "PgBouncer has clients waiting for server connections in namespace {{ .Release.Namespace }}."
        - alert: ServiceRadarPgBouncerMaxWaitHigh
          expr: max(cnpg_pgbouncer_pools_maxwait{namespace="{{ .Release.Namespace }}"}) > {{ default 5 $pgbouncer.maxWaitSecondsWarning }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar PgBouncer maxwait is elevated"
            description: "PgBouncer max client wait has exceeded the configured threshold in namespace {{ .Release.Namespace }}."
        {{- end }}
        - alert: ServiceRadarWebNgRestarts
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", pod=~"serviceradar-web-ng-.*"}[{{ default "15m" $webNg.restartWindow }}])) > {{ default 1 $webNg.restartWarning }}
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ServiceRadar web-ng pods are restarting"
            description: "web-ng restarted more than the configured threshold in namespace {{ .Release.Namespace }}."
{{- end }}
