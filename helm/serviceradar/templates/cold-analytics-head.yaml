{{- /*
Analytics query head for the tiered telemetry cold storage path
(OpenSpec add-tiered-telemetry-offload, tasks 1.5/1.6).

A small, single-instance CNPG cluster running the dedicated
serviceradar-cnpg-analytics image (PostgreSQL 18 + pg_duckdb, no
TimescaleDB). It owns all DuckDB execution: chunk exports, Parquet reads,
and hot-vs-cold stitched views. Renders NOTHING unless
coldTier.analyticsHead.enabled is set by deployment values.

DuckDB posture (design D12): execution memory/threads are capped
per-connection, spill is size-capped, and the resource request is derived
from poolSize x maxMemoryMb because per-connection DuckDB memory lives
outside PostgreSQL's own accounting.
*/ -}}
{{- $cold := default (dict) .Values.coldTier -}}
{{- $head := default (dict) $cold.analyticsHead -}}
{{- if default false $head.enabled }}
{{- $ns := .Release.Namespace -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $storageClass := default "" $head.storageClass -}}
{{- if and (eq $storageClass "") (not $allowInsecureStorage) -}}
  {{- $storageClass = $encryptedStorageClass -}}
{{- end -}}
{{- $imageName := default "" $head.imageName -}}
{{- if eq $imageName "" -}}
  {{- fail "coldTier.analyticsHead.imageName is required when the analytics head is enabled (serviceradar-cnpg-analytics image)" -}}
{{- end -}}
{{- $clusterName := default "cnpg-analytics" $head.clusterName -}}
{{- $duck := default (dict) $head.duckdb -}}
{{- $maxMemoryMb := int (default 1536 $duck.maxMemoryMb) -}}
{{- $threads := int (default 2 $duck.threads) -}}
{{- $maxTemp := default "10GB" $duck.maxTempDirectorySize -}}
{{- $poolSize := int (default 4 $head.poolSize) -}}
{{- $overheadMb := int (default 1536 $head.overheadMb) -}}
{{- $memRequestMb := add (mul $poolSize $maxMemoryMb) $overheadMb -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: serviceradar
    app.kubernetes.io/component: cold-analytics-head
spec:
  instances: {{ int (default 1 $head.instances) }}
  imageName: {{ $imageName | quote }}
  bootstrap:
    initdb:
      database: serviceradar
      owner: serviceradar
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_duckdb;
        - CREATE EXTENSION IF NOT EXISTS postgres_fdw;
        - CREATE SCHEMA IF NOT EXISTS platform AUTHORIZATION serviceradar;
        - ALTER ROLE serviceradar SET search_path TO platform, public;
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
    parameters:
      max_connections: "30"
      shared_buffers: 256MB
      work_mem: 16MB
      duckdb.max_memory: {{ printf "%dMB" $maxMemoryMb | quote }}
      duckdb.threads: {{ $threads | quote }}
      duckdb.max_temp_directory_size: {{ $maxTemp | quote }}
      duckdb.autoinstall_known_extensions: "false"
      duckdb.autoload_known_extensions: "true"
      duckdb.allow_community_extensions: "false"
      {{- range $key, $value := default (dict) $head.postgresqlParameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  storage:
    size: {{ default "20Gi" $head.storageSize }}
    {{- if ne $storageClass "" }}
    storageClass: {{ $storageClass }}
    {{- end }}
  resources:
    {{- if $head.resources }}
{{ toYaml $head.resources | indent 4 }}
    {{- else }}
    requests:
      cpu: 500m
      memory: {{ printf "%dMi" $memRequestMb }}
    limits:
      memory: {{ printf "%dMi" $memRequestMb }}
    {{- end }}
  monitoring:
    enablePodMonitor: false
{{- end }}
