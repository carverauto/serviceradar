{{- /*
Analytics query head (OpenSpec add-analytics-store-drivers).
Renders when analyticsStore.driver is pg_duckdb, or when the legacy
coldTier.analyticsHead.enabled flag is set. Timescale-only installs
get no Cluster.
*/ -}}
{{- if eq (include "serviceradar.analyticsHeadEnabled" .) "true" }}
{{- $cold := default (dict) .Values.coldTier -}}
{{- $head := default (dict) $cold.analyticsHead -}}
{{- $store := default (dict) .Values.analyticsStore -}}
{{- $pg := default (dict) $store.pgDuckdb -}}
{{- $ns := .Release.Namespace -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $storageClass := default (default "" $head.storageClass) $pg.storageClass -}}
{{- if and (eq $storageClass "") (not $allowInsecureStorage) -}}
  {{- $storageClass = $encryptedStorageClass -}}
{{- end -}}
{{- $affinity := default (default (dict) $head.affinity) $store.affinity -}}
{{- $imageName := include "serviceradar.analyticsImageName" . -}}
{{- $clusterName := include "serviceradar.analyticsHeadClusterName" . -}}
{{- $duck := default (dict) $head.duckdb -}}
{{- $maxMemoryMb := int (default (default 1536 $pg.memoryLimitMb) $duck.maxMemoryMb) -}}
{{- $threads := int (default (default 2 $pg.threads) $duck.threads) -}}
{{- $maxTemp := default "10GB" $duck.maxTempDirectorySize -}}
{{- $poolSize := int (default (default 4 $pg.poolSize) $head.poolSize) -}}
{{- $overheadMb := int (default (default 1536 $pg.overheadMb) $head.overheadMb) -}}
{{- $storageMode := default "s3" $pg.storage -}}
{{- $spill := default (dict) $pg.spill -}}
{{- $spillEmptyDir := true -}}
{{- if hasKey $spill "emptyDir" -}}
{{- $spillEmptyDir = $spill.emptyDir -}}
{{- end -}}
{{- $spillSize := default "50Gi" $spill.sizeLimit -}}
{{- $memRequestMb := add (mul $poolSize $maxMemoryMb) $overheadMb -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: serviceradar
    app.kubernetes.io/component: cold-analytics-head
spec:
  instances: {{ int (default 1 $head.instances) }}
  imageName: {{ $imageName | quote }}
  {{- /* The analytics image is the CNPG PostgreSQL 18 base (UID/GID 26) plus
         pg_duckdb. Explicit so a stale values file that still says 999 fails
         in an obvious way instead of dying at initdb. */}}
  postgresUID: {{ int (default 26 $head.postgresUID) }}
  postgresGID: {{ int (default 26 $head.postgresGID) }}
  {{- /* The analytics image is published to the same private registry as the
         primary; without this it sits in ImagePullBackOff. */}}
  {{- $pullSecret := default .Values.image.registryPullSecret $head.registryPullSecret }}
  {{- if $pullSecret }}
  imagePullSecrets:
    - name: {{ $pullSecret | quote }}
  {{- end }}
  bootstrap:
    initdb:
      database: serviceradar
      owner: serviceradar
      # C collation is REQUIRED (spike 0.6): the primary CNPG initdb's are
      # C-collated (operator default), and DuckDB execution always sorts in
      # binary/codepoint order regardless of the database collation — a
      # non-C head diverges from the primary AND from its own DuckDB-executed
      # queries. The stock pgduckdb image defaults to en_US.utf8; never rely
      # on image defaults here.
      encoding: UTF8
      localeCollate: C
      localeCType: C
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_duckdb;
        - GRANT USAGE ON FOREIGN DATA WRAPPER duckdb TO serviceradar;
        - CREATE SCHEMA IF NOT EXISTS platform AUTHORIZATION serviceradar;
        - ALTER ROLE serviceradar SET search_path TO platform, public;
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
    parameters:
      max_connections: {{ default 60 $pg.maxConnections | quote }}
      shared_buffers: 256MB
      work_mem: 16MB
      duckdb.max_memory: {{ printf "%dMB" $maxMemoryMb | quote }}
      duckdb.threads: {{ $threads | quote }}
      duckdb.max_temp_directory_size: {{ $maxTemp | quote }}
      duckdb.autoinstall_known_extensions: "false"
      duckdb.autoload_known_extensions: "true"
      duckdb.allow_community_extensions: "false"
      # Non-superusers may only execute DuckDB when granted this role
      # (verified: without it they get "DuckDB execution is not allowed…").
      # The cold-tier app role connects as the cluster owner, so this names
      # the owner unless a deployment supplies its own analytics role.
      duckdb.postgres_role: {{ default "serviceradar" $head.duckdbRole | quote }}
      {{- if ne $storageMode "filesystem" }}
      # S3 mode: block LocalFileSystem so DuckDB cannot write the instance disk.
      # Filesystem mode omits this so COPY TO the data dir works.
      duckdb.disabled_filesystems: "LocalFileSystem"
      {{- end }}
      {{- if $spillEmptyDir }}
      # CNPG mounts scratch-data emptyDir at /run (and /controller). Size cap
      # is spec.ephemeralVolumesSizeLimit.temporaryData below.
      duckdb.temporary_directory: /run/pg_duckdb
      {{- else }}
      duckdb.temporary_directory: /var/lib/postgresql/data/pg_duckdb/temp
      {{- end }}
      {{- range $key, $value := default (dict) $head.postgresqlParameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  {{- if $affinity }}
  affinity:
    {{- if hasKey $affinity "enablePodAntiAffinity" }}
    enablePodAntiAffinity: {{ $affinity.enablePodAntiAffinity }}
    {{- end }}
    {{- with $affinity.topologyKey }}
    topologyKey: {{ . | quote }}
    {{- end }}
    {{- with $affinity.podAntiAffinityType }}
    podAntiAffinityType: {{ . | quote }}
    {{- end }}
    {{- with $affinity.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $affinity.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ default "20Gi" $head.storageSize }}
    {{- if ne $storageClass "" }}
    storageClass: {{ $storageClass }}
    {{- end }}
  {{- if $spillEmptyDir }}
  ephemeralVolumesSizeLimit:
    temporaryData: {{ $spillSize | quote }}
  {{- end }}
  resources:
    {{- if $head.resources }}
{{ toYaml $head.resources | indent 4 }}
    {{- else }}
    requests:
      cpu: 500m
      memory: {{ printf "%dMi" $memRequestMb }}
    limits:
      memory: {{ printf "%dMi" $memRequestMb }}
    {{- end }}
  monitoring:
    enablePodMonitor: false
{{- end }}
