{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `core.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate6 := default (dict) .Values.core -}}
{{- if or (not (hasKey $gate6 "enabled")) $gate6.enabled }}
{{- $cnpg := include "serviceradar.effectiveCNPG" . | fromYaml -}}
{{- $cnpgClusterName := include "serviceradar.cnpgClusterName" . -}}
{{- $coreVals := default (dict) .Values.core -}}
{{- $migrationVals := default (dict) $coreVals.migrations -}}
{{- $observabilityRetention := default (dict) $coreVals.observabilityRetention -}}
{{- $migrationsEnabled := include "serviceradar.boolDefaultTrue" (list $migrationVals "enabled") | eq "true" -}}
{{- $webNg := default (dict) .Values.webNg -}}
{{- $pluginStorage := default (dict) $webNg.pluginStorage -}}
{{- $secrets := default "serviceradar-secrets" .Values.secrets.existingSecretName -}}
{{- if $migrationsEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: serviceradar-core-migrations
  annotations:
    # On a fresh install (.Release.IsInstall / not .Release.IsUpgrade), this Job
    # MUST be a regular (non-hook) resource rather than a post-install hook (#6345):
    # `helm install --wait` waits for all non-hook resources (including web-ng)
    # to become Ready before starting post-install hooks, while web-ng and core
    # block in their `wait-migrations` initContainers waiting for this Job.
    # Instead, this Job starts alongside the CNPG Cluster and waits in its own
    # `wait-for-cnpg` initContainer until the CNPG primary accepts connections.
    #
    # On an upgrade (.Release.IsUpgrade), pre-upgrade remains right: the CNPG
    # Cluster already exists and the schema is migrated before new pods roll out.
    {{- if .Release.IsUpgrade }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- else }}
    "argocd.argoproj.io/hook": Sync
    "argocd.argoproj.io/sync-wave": "-1"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    {{- end }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: serviceradar-core-migrations
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
      {{- with $migrationVals.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      {{- include "serviceradar.elixirReleasePodSecurityContext" . | nindent 6 }}
      initContainers:
      - name: wait-for-cnpg
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-tools" "service" "tools") }}
        imagePullPolicy: {{ default (include "serviceradar.imagePullPolicy" .) $migrationVals.imagePullPolicy }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-c"]
        env:
        - name: CNPG_HOST
          value: {{ include "serviceradar.cnpgDirectHost" . | quote }}
        - name: CNPG_PORT
          value: {{ default 5432 $cnpg.port | quote }}
        - name: CNPG_DATABASE
          value: {{ default "serviceradar" $cnpg.database | quote }}
        - name: CNPG_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: username
        - name: CNPG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: password
        - name: CNPG_SSL_MODE
          value: {{ default "verify-full" $cnpg.sslmode | quote }}
        - name: CNPG_CA_FILE
          value: {{ default "/etc/serviceradar/cnpg/ca.crt" $cnpg.caFile | quote }}
        {{- if $cnpg.requireClientCert }}
        - name: CNPG_CERT_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client.pem" $cnpg.clientCertName) | quote }}
        - name: CNPG_KEY_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client-key.pem" $cnpg.clientKeyName) | quote }}
        {{- end }}
        args:
        - |
          set -eu
          export PGPASSWORD="${CNPG_PASSWORD}"
          export PGSSLMODE="${CNPG_SSL_MODE:-disable}"
          if [ -n "${CNPG_CA_FILE:-}" ]; then
            export PGSSLROOTCERT="${CNPG_CA_FILE}"
          fi
          if [ -n "${CNPG_CERT_FILE:-}" ] && [ -n "${CNPG_KEY_FILE:-}" ]; then
            export PGSSLCERT="${CNPG_CERT_FILE}"
            export PGSSLKEY="${CNPG_KEY_FILE}"
          fi
          echo "Waiting for CNPG cluster at ${CNPG_HOST}:${CNPG_PORT:-5432}/${CNPG_DATABASE}..."
          for i in $(seq 1 120); do
            if [ "${PGSSLMODE}" = "verify-full" ] || [ "${PGSSLMODE}" = "verify-ca" ]; then
              if [ -n "${CNPG_CA_FILE:-}" ] && [ ! -s "${CNPG_CA_FILE}" ]; then
                echo "Waiting for CNPG CA certificate at ${CNPG_CA_FILE}... ($i/120)"
                sleep 2
                continue
              fi
            fi
            if psql -h "${CNPG_HOST}" -p "${CNPG_PORT:-5432}" -U "${CNPG_USERNAME}" -d "${CNPG_DATABASE}" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "CNPG cluster is ready."
              exit 0
            fi
            echo "Waiting for CNPG cluster... ($i/120)"
            sleep 2
          done
          echo "Timed out waiting for CNPG cluster at ${CNPG_HOST}:${CNPG_PORT:-5432}/${CNPG_DATABASE}." >&2
          exit 1
        volumeMounts:
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        - name: {{ $cnpgClusterName }}-ca
          mountPath: /etc/serviceradar/cnpg
          readOnly: true
      containers:
      - name: core-migrations
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-core-elx" "service" "core") }}
        imagePullPolicy: {{ default (include "serviceradar.imagePullPolicy" .) $migrationVals.imagePullPolicy }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-c"]
        env:
        - name: LANG
          value: "C.UTF-8"
        - name: LC_ALL
          value: "C.UTF-8"
        - name: ELIXIR_ERL_OPTIONS
          value: "+fnu"
        - name: CLUSTER_ENABLED
          value: "false"
        - name: SERVICERADAR_CLUSTER_COORDINATOR
          value: "false"
        - name: SERVICERADAR_CORE_REPO_ENABLED
          value: "true"
        - name: SERVICERADAR_CORE_OBAN_ENABLED
          value: "false"
        - name: SERVICERADAR_ASH_OBAN_SCHEDULER_ENABLED
          value: "false"
        - name: SERVICERADAR_CORE_REGISTRIES_ENABLED
          value: "false"
        - name: SERVICERADAR_CORE_VAULT_ENABLED
          value: "false"
        - name: SERVICE_HEARTBEAT_ENABLED
          value: "false"
        - name: STATUS_HANDLER_ENABLED
          value: "false"
        - name: DATASVC_ENABLED
          value: "false"
        - name: HEALTH_CHECK_RUNNER_ENABLED
          value: "false"
        - name: HEALTH_CHECK_REGISTRAR_ENABLED
          value: "false"
        - name: EVENT_WRITER_ENABLED
          value: "false"
        - name: SERVICERADAR_CORE_RUN_MIGRATIONS
          value: "true"
        - name: SERVICERADAR_MIGRATION_ONLY
          value: "true"
        - name: MTR_RETENTION_DAYS
          value: {{ default 30 $coreVals.mtrRetentionDays | quote }}
        - name: SERVICERADAR_OTEL_TRACES_RETENTION_DAYS
          value: {{ default 3 $observabilityRetention.otelTracesDays | quote }}
        - name: SERVICERADAR_LOGS_RETENTION_DAYS
          value: {{ default 30 $observabilityRetention.logsDays | quote }}
        - name: SERVICERADAR_OCSF_NETWORK_ACTIVITY_RETENTION_DAYS
          value: {{ default 90 $observabilityRetention.ocsfNetworkActivityDays | quote }}
        - name: SERVICERADAR_OTEL_TRACES_CHUNK_INTERVAL_HOURS
          value: {{ default 6 $observabilityRetention.otelTracesChunkIntervalHours | quote }}
        - name: SERVICERADAR_LOGS_CHUNK_INTERVAL_HOURS
          value: {{ default 24 $observabilityRetention.logsChunkIntervalHours | quote }}
        - name: SERVICERADAR_OCSF_NETWORK_ACTIVITY_CHUNK_INTERVAL_HOURS
          value: {{ default 24 $observabilityRetention.ocsfNetworkActivityChunkIntervalHours | quote }}
        - name: SERVICERADAR_OTEL_METRICS_RETENTION_DAYS
          value: {{ default 30 $observabilityRetention.otelMetricsDays | quote }}
        - name: SERVICERADAR_OTEL_METRICS_CHUNK_INTERVAL_HOURS
          value: {{ default 24 $observabilityRetention.otelMetricsChunkIntervalHours | quote }}
        - name: SERVICERADAR_OTEL_METRIC_POINTS_RETENTION_DAYS
          value: {{ default 30 $observabilityRetention.otelMetricPointsDays | quote }}
        - name: SERVICERADAR_OTEL_METRIC_POINTS_CHUNK_INTERVAL_HOURS
          value: {{ default 6 $observabilityRetention.otelMetricPointsChunkIntervalHours | quote }}
        - name: SERVICERADAR_OCSF_EVENTS_RETENTION_DAYS
          value: {{ default 14 $observabilityRetention.ocsfEventsDays | quote }}
        - name: SERVICERADAR_OCSF_EVENTS_CHUNK_INTERVAL_HOURS
          value: {{ default 6 $observabilityRetention.ocsfEventsChunkIntervalHours | quote }}
        - name: SERVICERADAR_RAW_METRICS_RETENTION_DAYS
          value: {{ default 7 $observabilityRetention.rawMetricsDays | quote }}
        - name: SERVICERADAR_RAW_METRICS_CHUNK_INTERVAL_HOURS
          value: {{ default 24 $observabilityRetention.rawMetricsChunkIntervalHours | quote }}
        - name: SERVICERADAR_CAPACITY_FORECASTS_RETENTION_DAYS
          value: {{ default 395 $observabilityRetention.capacityForecastsDays | quote }}
        - name: SERVICERADAR_CAPACITY_FORECASTS_CHUNK_INTERVAL_HOURS
          value: {{ default 24 $observabilityRetention.capacityForecastsChunkIntervalHours | quote }}
        - name: CNPG_HOST
          value: {{ include "serviceradar.cnpgDirectHost" . | quote }}
        - name: CNPG_PORT
          value: {{ default 5432 $cnpg.port | quote }}
        - name: CNPG_DATABASE
          value: {{ default "serviceradar" $cnpg.database | quote }}
        - name: CNPG_APP_USER
          valueFrom:
            secretKeyRef:
              name: {{ default "serviceradar-db-credentials" $cnpg.credentialsSecret | quote }}
              key: username
        - name: CNPG_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default "serviceradar-db-credentials" $cnpg.credentialsSecret | quote }}
              key: password
        - name: CNPG_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: username
        - name: CNPG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: password
        - name: CNPG_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: username
        - name: CNPG_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default "cnpg-superuser" $cnpg.superuserSecret | quote }}
              key: password
        - name: CNPG_SSL_MODE
          value: {{ default "verify-full" $cnpg.sslmode | quote }}
        - name: CNPG_CA_FILE
          value: {{ default "/etc/serviceradar/cnpg/ca.crt" $cnpg.caFile | quote }}
        {{- if $cnpg.requireClientCert }}
        - name: CNPG_CERT_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client.pem" $cnpg.clientCertName) | quote }}
        - name: CNPG_KEY_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client-key.pem" $cnpg.clientKeyName) | quote }}
        {{- end }}
        - name: CLOAK_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $secrets | quote }}
              key: cloak-key
        - name: SPIFFE_CERT_DIR
          value: "/etc/serviceradar/certs"
        args:
        - |
          set -eu
          exec /app/bin/serviceradar_core_elx start
        volumeMounts:
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        - name: {{ $cnpgClusterName }}-ca
          mountPath: /etc/serviceradar/cnpg
          readOnly: true
      volumes:
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "core.pem" "core-key.pem" "cnpg-client.pem" "cnpg-client-key.pem") | indent 12 }}
      - name: {{ $cnpgClusterName }}-ca
        secret:
          secretName: {{ $cnpgClusterName }}-ca
          # Do not block pod startup if the CA is not present yet. Without this
          # the pod sits in ContainerCreating with
          #   MountVolume.SetUp failed ... secret "cnpg-ca" not found
          # which surfaces as an opaque Helm timeout rather than a clear error.
          optional: true
{{- end }}
{{- end }}
