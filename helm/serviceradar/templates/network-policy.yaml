metadata:
  name: {{ include "serviceradar.fullname" . }}-bmp-collector-gateway
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  podSelector:
    matchLabels:
      app: serviceradar-bmp-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gatewayApiBmpCollectorEnvoyNamespace | quote }}
      ports:
{{- include "serviceradar.networkPolicyPorts" $bmpCollectorExternalPorts | trim | nindent 8 }}
{{- end }}
{{- if and $gobgpEnabled $gobgpExternalEnabled $hasGobgpExternalCIDRs }}
