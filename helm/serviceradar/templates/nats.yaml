{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `nats.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate9 := default (dict) .Values.nats -}}
{{- if or (not (hasKey $gate9 "enabled")) $gate9.enabled }}
{{- $nats := default (dict) .Values.nats -}}
{{- $persistence := default (dict) $nats.persistence -}}
{{- $jetstream := default (dict) $nats.jetstream -}}
{{- $replicas := int (default 1 $nats.replicas) -}}
{{- $leafnodes := default (dict) $nats.leafnodes -}}
{{- $leafnodesEnabled := default false $leafnodes.enabled -}}
{{- $leafnodesPort := int (default 7422 $leafnodes.port) -}}
{{- $clusterName := default "serviceradar" $nats.clusterName -}}
{{- $kvBucket := default "serviceradar-datasvc" .Values.kv.bucket -}}
{{- $flowCollector := default (dict) .Values.flowCollector -}}
{{- $datasvc := default (dict) .Values.datasvc -}}
{{- $objectBucket := default "serviceradar-objects" $datasvc.objectBucket -}}
{{- $webNg := default (dict) .Values.webNg -}}
{{- $webNgPluginStorage := default (dict) $webNg.pluginStorage -}}
{{- $pluginBucket := default "serviceradar_plugins" $webNgPluginStorage.jetstreamBucket -}}
{{- $fieldSurveyStore := default (dict) $webNg.fieldSurveyArtifactStore -}}
{{- $fieldSurveyBucket := default "serviceradar_fieldsurvey" $fieldSurveyStore.jetstreamBucket -}}
{{- $k8sInventory := default (dict) .Values.k8sInventory -}}
{{- $k8sInventoryNats := default (dict) $k8sInventory.nats -}}
{{- $k8sInventoryNodes := default (dict) $k8sInventory.nodes -}}
{{- $k8sInventoryNatsEnabled := and (default false $k8sInventory.enabled) (eq (default "nats" $k8sInventory.publishMode) "nats") -}}
{{- $k8sInventoryNodesEnabled := or (not (hasKey $k8sInventoryNodes "enabled")) $k8sInventoryNodes.enabled -}}
{{- $k8sInventorySubject := default "inventory.k8s.public_endpoints" $k8sInventoryNats.subject -}}
{{- $k8sInventoryStream := default "k8s_inventory" $k8sInventoryNats.stream -}}
{{- if $k8sInventoryNatsEnabled -}}
{{- if not (regexMatch `^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$` $k8sInventorySubject) -}}
  {{- fail (printf "k8sInventory.nats.subject %q must be a concrete NATS subject without wildcards" $k8sInventorySubject) -}}
{{- end -}}
{{- if not (regexMatch `^[A-Za-z0-9_-]+$` $k8sInventoryStream) -}}
  {{- fail (printf "k8sInventory.nats.stream %q must contain only letters, digits, underscores, or hyphens" $k8sInventoryStream) -}}
{{- end -}}
{{- end -}}
{{- /*
B-5 sub-issue 2: partition_id is the per-deployment scoping anchor used
to render the core/datasvc/agent NATS ACL blocks below. The chart's
top-level `.Values.partitionId` is the source of truth; agent.partitionId
is honored as a fallback for backwards compatibility with releases that
only set it under .agent. This MUST match SERVICERADAR_OTX_PARTITION on
the core-elx runtime config.
*/}}
{{- $partitionId := coalesce .Values.partitionId (default (dict) .Values.agent).partitionId "default" -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $natsStorageClass := default "" $persistence.storageClassName -}}
{{- if and (eq $natsStorageClass "") (not $allowInsecureStorage) -}}
  {{- $natsStorageClass = $encryptedStorageClass -}}
{{- end -}}
{{- if and (eq $natsStorageClass "") (not $allowInsecureStorage) -}}
  {{- fail "nats.persistence.storageClassName or global.storage.encryptedStorageClassName is required unless global.storage.allowInsecureStorage=true" -}}
{{- end -}}
{{- /* JetStream storage budget: max_file_store in exact bytes from the sizing profile
     or nats.jetstream.maxFileStore, and the render-time reservation and disk checks
     (serviceradar.jetstreamBudget in _helpers.tpl). */ -}}
{{- $jsBudget := include "serviceradar.jetstreamBudget" . | fromJson -}}
{{- include "serviceradar.validateJetStreamBudget" (list . $jsBudget) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-nats
spec:
  selector:
    app: serviceradar-nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: monitoring
    port: 8222
    targetPort: monitoring
  - name: cluster
    port: 6222
    targetPort: cluster
  {{- if $leafnodesEnabled }}
  - name: leafnodes
    port: {{ $leafnodesPort }}
    targetPort: leafnodes
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-nats-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: serviceradar-nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: monitoring
    port: 8222
    targetPort: monitoring
  - name: cluster
    port: 6222
    targetPort: cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: serviceradar-nats
spec:
  serviceName: serviceradar-nats-headless
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: serviceradar-nats
  template:
    metadata:
      labels:
        app: serviceradar-nats
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
    spec:
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-nats") | nindent 6 }}
      containers:
      - name: nats
        image: nats:{{ .Values.image.tags.nats | default "latest" }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          {{- if gt $replicas 1 }}
          ROUTES_BLOCK=""
          for i in $(seq 0 $((NATS_REPLICAS - 1))); do
            peer="serviceradar-nats-${i}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local"
            if [ "${peer}" != "${POD_NAME}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local" ]; then
              ROUTES_BLOCK="${ROUTES_BLOCK}        nats://${peer}:6222,\n"
            fi
          done
          {{- end }}

          cat >/tmp/nats-server.conf <<EOF
          server_name: ${POD_NAME}
          listen: 0.0.0.0:4222
          http: 0.0.0.0:8222

          jetstream {
            store_dir: /data/jetstream
            max_memory_store: {{ default "1G" $jetstream.maxMemoryStore }}
            max_file_store: {{ $jsBudget.maxFileStore }}
          }

          tls {
            cert_file: "/etc/serviceradar/certs/nats.pem"
            key_file: "/etc/serviceradar/certs/nats-key.pem"
            ca_file: "/etc/serviceradar/certs/root.pem"
            verify: true
            verify_and_map: true
          }
          {{- if $leafnodesEnabled }}

          # Edge-site leaf servers. TLS terminates here (a Gateway API route,
          # when enabled, passes raw TCP). verify_and_map requires a client
          # certificate from the internal CA and binds only certificates that
          # carry the partition leaf role URI SAN to the platform account.
          leafnodes {
            port: {{ $leafnodesPort }}
            tls {
              cert_file: "/etc/serviceradar/certs/nats.pem"
              key_file: "/etc/serviceradar/certs/nats-key.pem"
              ca_file: "/etc/serviceradar/certs/root.pem"
              verify_and_map: true
              timeout: 5
            }
            authorization {
              users: [
                { user: "spiffe://serviceradar.local/nats-leaf/{{ $partitionId }}", account: SERVICERADAR }
              ]
            }
          }
          {{- end }}

          {{- if gt $replicas 1 }}
          cluster {
            name: {{ $clusterName | quote }}
            listen: 0.0.0.0:6222
            advertise: ${POD_NAME}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local:6222
            tls {
              cert_file: "/etc/serviceradar/certs/nats.pem"
              key_file: "/etc/serviceradar/certs/nats-key.pem"
              ca_file: "/etc/serviceradar/certs/root.pem"
              verify: true
            }
            routes: [
          $(printf "%b" "${ROUTES_BLOCK}")      ]
          }

          {{- end }}
          accounts {
            SYS: {
              users: []
            }

            SERVICERADAR: {
              jetstream: enabled
              users: [
              {
                user: "CN=serviceradar-tools,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: [">"]
                  }
                  subscribe: {
                    allow: [">"]
                  }
                }
              },
              # Web-NG owns browser/API-facing object-store workflows such as
              # plugin WASM/dashboard package imports and FieldSurvey artifacts,
              # and it publishes the internal logs, OCSF events, and analytics
              # signals that core code in this release emits. It does not
              # publish the notifications.* firehose. Do not reuse the core
              # identity for this user.
              {
                user: "CN=serviceradar-web-ng,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: [
                      "\$O.{{ $pluginBucket }}.>",
                      "\$JS.FC.OBJ_{{ $pluginBucket }}.>",
                      "\$O.{{ $fieldSurveyBucket }}.>",
                      "\$JS.FC.OBJ_{{ $fieldSurveyBucket }}.>",
                      # Internal audit/onboarding logs, OCSF events and analytics
                      # signals that core code running inside the web-ng release
                      # publishes (AuditWriter from UI actions, inventory events,
                      # ObanFailureEventReporter, SignalPublisher). Without these
                      # the broker rejects the publish with a Permissions
                      # Violation and DurablePublishWorker retries it.
                      "logs.internal.>",
                      "events.internal.>",
                      "signals.analytics.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                  subscribe: {
                    allow: [
                      "\$O.{{ $pluginBucket }}.>",
                      "\$O.{{ $fieldSurveyBucket }}.>",
                      # Notification firehose (design D10): web-ng consumes it
                      # with a durable cursor so a reconnecting subscriber
                      # replays what it missed. Subscribe only - web-ng is not a
                      # firehose publisher.
                      "notifications.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                }
              },
              # Core platform service: manages JetStream streams/consumers,
              # publishes normalized platform subjects, and uses request/reply
              # inboxes. Flow attribution observations go out on
              # flows.attribution.observations; nothing reads back through
              # flow.attributed.*.
              {
                user: "CN=serviceradar-core,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: [
                      "flow.raw.>",
                      "flows.raw.>",
                      "flows.*.processed",
                      "logs.>",
                      # Live tail copies of logs.internal.* (health/audit/jobs).
                      # web-ng is subscribe-only; core is the publisher.
                      "live.logs.>",
                      "pdns.ocsf",
                      "pdns.ocsf.>",
                      "signals.analytics.>",
                      "events.>",
                      "config.>",
                      # Notification firehose (design D10). Core is the only
                      # publisher; web-ng subscribes. New subject namespaces are
                      # denied by default, so omitting this does not surface as
                      # an error - every notification on the firehose is simply
                      # dropped.
                      "notifications.>",
                      # Ad-hoc scan results (AdhocScanResultHandler). Core
                      # republishes each row here and EventWriter persists it
                      # from the scan_results stream. Without this entry the
                      # plain publish is denied by the server and every result
                      # is dropped with no error on the publisher side.
                      "scans.results.>",
                      # MTR trace results (MtrResultPublisher). Core publishes;
                      # EventWriter persists them from the mtr_results stream.
                      # The publish waits for a PubAck, so a missing entry here
                      # fails loudly rather than dropping traces.
                      "mtr.results.>",
                      # Flow process attribution observations
                      # (FlowAttribution.Observations). Core publishes them on
                      # the flows stream; EventWriter loads them into the
                      # warehouse. The publish waits for a PubAck, so a missing
                      # entry fails the admitted batch instead of dropping it.
                      "flows.attribution.observations",
                      # Flow attribution correlator health
                      # (FlowAttribution.PassMetrics), a metric envelope that
                      # EventWriter persists from the metrics stream.
                      "metrics.flow_attribution",
                      # Bounded ingestion lane envelopes from core.
                      # EventWriter owns persistence from the METRICS stream.
                      "metrics.ingestion_lanes",
                      # Warehouse load-failure counters
                      # (Analytics.StarRocks.LoadHealth). The publish waits for
                      # a PubAck, so a missing entry denies every sample and
                      # the broker logs a permissions violation.
                      "metrics.event_writer.warehouse",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                  subscribe: {
                    allow: [
                      "flow.raw.>",
                      "flows.raw.>",
                      "flows.*.processed",
                      "logs.>",
                      "metrics.>",
                      "pdns.ocsf",
                      "pdns.ocsf.>",
                      "signals.analytics.>",
                      "events.>",
                      "config.>",
                      "inventory.k8s.>",
                      "trivy.report.>",
                      "falco.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                }
              },
              # Agent gateway is the authenticated edge ingress for agent
              # gRPC telemetry: sysmon/SNMP status metrics and relayed OTLP
              # chunks. It is not a general NATS producer and cannot publish
              # flow attribution, trap/syslog logs, or events.
              # metrics.agent_gateway carries the gateway's own core-call latency
              # and status-buffer depth (RuntimeMetrics). It waits for a PubAck,
              # so without this entry every sample is denied and times out.
              {
                user: "CN=serviceradar-agent-gateway,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["metrics.sysmon.>", "metrics.snmp.>", "metrics.icmp.>", "metrics.mtr.>", "metrics.rperf.>", "metrics.sweep.>", "metrics.timeseries.>", "metrics.agent_gateway", "otel.traces.raw", "otel.metrics.raw", "otel.metrics.derived", "logs.otel", "\$JS.API.>"]
                    deny: ["\$SYS.>", "flow.attributed.>", "events.>", "logs.syslog", "logs.syslog.>", "logs.snmp", "logs.snmp.>"]
                  }
                  subscribe: {
                    allow: []
                    deny: ["\$SYS.>", "flow.attributed.>", "flow.host-slice.>"]
                  }
                }
              },
              # Datasvc query-side service: reads catalog events/config and
              # object/KV state. Attributed flows are queried from CNPG, not a
              # flow.attributed.* NATS read-back stream.
              {
                user: "CN=serviceradar-datasvc,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: [
                      "events.>",
                      "config.>",
                      "\$KV.{{ $kvBucket }}.>",
                      "\$O.{{ $objectBucket }}.>",
                      "\$JS.FC.OBJ_{{ $objectBucket }}.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                  subscribe: {
                    allow: [
                      "events.>",
                      "config.>",
                      "\$KV.{{ $kvBucket }}.>",
                      "\$O.{{ $objectBucket }}.>",
                      "\$JS.FC.OBJ_{{ $objectBucket }}.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>"]
                  }
                }
              },
              # Agent (B-5 subject-scoping): emits sweep/discovery events
              # and consumes config for its partition. Denied from
              # flow.attributed.> (attribution is core's responsibility)
              # and $SYS.>.
              {
                user: "CN=serviceradar-agent,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: [
                      "events.>",
                      "logs.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>", "flow.attributed.>"]
                  }
                  subscribe: {
                    allow: [
                      "config.agent.>",
                      "config.{{ $partitionId }}.>",
                      "\$JS.API.>",
                      "\$JS.ACK.>",
                      "_INBOX.>"
                    ]
                    deny: ["\$SYS.>", "flow.attributed.>", "flow.host-slice.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-log-collector,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["logs.syslog", "otel.>", "logs.otel", "\$JS.API.STREAM.INFO.events", "\$JS.API.STREAM.CREATE.events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-flowgger,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["logs.syslog", "\$JS.API.STREAM.INFO.events", "\$JS.API.STREAM.CREATE.events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-otel,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["otel.>", "logs.otel", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-trapd,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["logs.snmp", "\$JS.API.STREAM.INFO.events", "\$JS.API.STREAM.CREATE.events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-flow-collector,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["flows.raw.>", "flow.host-slice.>", "\$JS.API.STREAM.INFO.events", "\$JS.API.STREAM.CREATE.events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-netflow-collector,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["flows.raw.>", "\$JS.API.STREAM.INFO.events", "\$JS.API.STREAM.CREATE.events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-bmp-collector,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["arancini.updates", "arancini.updates.>", "\$JS.API.STREAM.INFO.ARANCINI_CAUSAL", "\$JS.API.STREAM.CREATE.ARANCINI_CAUSAL", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-falcosidekick,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["falco.>", "\$JS.API.STREAM.INFO.falco_events", "\$JS.API.STREAM.CREATE.falco_events", "\$JS.API.>"]
                  }
                  subscribe: {
                    allow: ["\$JS.API.>", "_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-trivy-sidecar,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    allow: ["trivy.report.>", "\$JS.API.STREAM.INFO.trivy_reports", "\$JS.API.STREAM.CREATE.trivy_reports", "\$JS.API.STREAM.UPDATE.trivy_reports"]
                  }
                  subscribe: {
                    allow: ["_INBOX.>"]
                  }
                }
              },
              {
                user: "CN=serviceradar-k8s-inventory,OU=Kubernetes,O=ServiceRadar,L=San Francisco,ST=CA,C=US"
                permissions: {
                  publish: {
                    {{- if $k8sInventoryNatsEnabled }}
                    allow: [{{ $k8sInventorySubject | quote }}{{ if $k8sInventoryNodesEnabled }}, "inventory.k8s.nodes"{{ end }}, {{ printf "\"\\$JS.API.STREAM.INFO.%s\"" $k8sInventoryStream }}, {{ printf "\"\\$JS.API.STREAM.CREATE.%s\"" $k8sInventoryStream }}, {{ printf "\"\\$JS.API.STREAM.UPDATE.%s\"" $k8sInventoryStream }}]
                    {{- else }}
                    allow: []
                    {{- end }}
                  }
                  subscribe: {
                    {{- if $k8sInventoryNatsEnabled }}
                    allow: ["_INBOX.>"]
                    {{- else }}
                    allow: []
                    {{- end }}
                  }
                }
              },
              {
                user: "O=ServiceRadar"
                permissions: {
                  publish: {
                    allow: [">"]
                  }
                  subscribe: {
                    allow: [">"]
                  }
                }
              }
              ]
            }
          }

          system_account: SYS
          debug: true
          trace: false
          EOF

          exec nats-server --config /tmp/nats-server.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NATS_REPLICAS
          value: {{ $replicas | quote }}
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitoring
        - containerPort: 6222
          name: cluster
        {{- if $leafnodesEnabled }}
        - containerPort: {{ $leafnodesPort }}
          name: leafnodes
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nats-data
          mountPath: /data
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "100m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "nats.pem" "nats-key.pem") | indent 12 }}
  volumeClaimTemplates:
  - metadata:
      name: nats-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ default "36Gi" $persistence.size }}
      {{- if $natsStorageClass }}
      storageClassName: {{ $natsStorageClass | quote }}
      {{- end }}
{{- end }}
