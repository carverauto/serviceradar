{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `nats.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate9 := default (dict) .Values.nats -}}
{{- if or (not (hasKey $gate9 "enabled")) $gate9.enabled }}
{{- $nats := default (dict) .Values.nats -}}
{{- $natsResources := default (dict) $nats.resources -}}
{{- $natsResourceLimits := default (dict) $natsResources.limits -}}
{{- $natsResourceRequests := default (dict) $natsResources.requests -}}
{{- $persistence := default (dict) $nats.persistence -}}
{{- $jetstream := default (dict) $nats.jetstream -}}
{{- $replicas := int (default 1 $nats.replicas) -}}
{{- $leafnodes := default (dict) $nats.leafnodes -}}
{{- $leafnodesEnabled := default false $leafnodes.enabled -}}
{{- $leafnodesPort := int (default 7422 $leafnodes.port) -}}
{{- $clusterName := default "serviceradar" $nats.clusterName -}}
{{- /* Server debug/trace logging (issue #5635). Off by default: debug makes every
     server write [DBG] RAFT and ping-timer lines continuously. Rendered as a strict
     boolean so a stray string cannot reach the server config. */ -}}
{{- $natsDebug := ternary "true" "false" (eq (toString (default false $nats.debug)) "true") -}}
{{- $natsTrace := ternary "true" "false" (eq (toString (default false $nats.trace)) "true") -}}
{{- $k8sInventory := default (dict) .Values.k8sInventory -}}
{{- $k8sInventoryNats := default (dict) $k8sInventory.nats -}}
{{- $k8sInventoryNatsEnabled := and (default false $k8sInventory.enabled) (eq (default "nats" $k8sInventory.publishMode) "nats") -}}
{{- $k8sInventorySubject := default "inventory.k8s.public_endpoints" $k8sInventoryNats.subject -}}
{{- $k8sInventoryStream := default "k8s_inventory" $k8sInventoryNats.stream -}}
{{- if $k8sInventoryNatsEnabled -}}
{{- if not (regexMatch `^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$` $k8sInventorySubject) -}}
  {{- fail (printf "k8sInventory.nats.subject %q must be a concrete NATS subject without wildcards" $k8sInventorySubject) -}}
{{- end -}}
{{- if not (regexMatch `^[A-Za-z0-9_-]+$` $k8sInventoryStream) -}}
  {{- fail (printf "k8sInventory.nats.stream %q must contain only letters, digits, underscores, or hyphens" $k8sInventoryStream) -}}
{{- end -}}
{{- end -}}
{{- $flowCollector := default (dict) .Values.flowCollector -}}
{{- $flowCollectorConfig := default (dict) $flowCollector.config -}}
{{- $flowCollectorEnabled := default false $flowCollector.enabled -}}
{{- $flowCollectorStream := default "flows" $flowCollectorConfig.stream_name -}}
{{- if and $flowCollectorEnabled (not (regexMatch `^[A-Za-z0-9_-]+$` $flowCollectorStream)) -}}
  {{- fail (printf "flowCollector.config.stream_name %q must contain only letters, digits, underscores, or hyphens" $flowCollectorStream) -}}
{{- end -}}
{{- /* Every built-in client identity and its permissions, shared with the
     certificate authorization callout (templates/_nats_static_users.tpl). */ -}}
{{- $staticUsers := include "serviceradar.natsStaticUsers" . | fromYamlArray -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $natsStorageClass := default "" $persistence.storageClassName -}}
{{- if and (eq $natsStorageClass "") (not $allowInsecureStorage) -}}
  {{- $natsStorageClass = $encryptedStorageClass -}}
{{- end -}}
{{- if and (eq $natsStorageClass "") (not $allowInsecureStorage) -}}
  {{- fail "nats.persistence.storageClassName or global.storage.encryptedStorageClassName is required unless global.storage.allowInsecureStorage=true" -}}
{{- end -}}
{{- /* JetStream storage budget: max_file_store in exact bytes from the sizing profile
     or nats.jetstream.maxFileStore, and the render-time reservation and disk checks
     (serviceradar.jetstreamBudget in _helpers.tpl). */ -}}
{{- $jsBudget := include "serviceradar.jetstreamBudget" . | fromJson -}}
{{- include "serviceradar.validateJetStreamBudget" (list . $jsBudget) -}}
{{- /* Callout stays off unless an operator has already stored explicit grants
     for existing infrastructure clients. The chart cannot see that inventory. */ -}}
{{- $certAuth := default (dict) $nats.certificateAuthorization -}}
{{- $certAuthEnabled := eq (toString (default false $certAuth.enabled)) "true" -}}
{{- $certAuthIssuer := default "" $certAuth.issuerPublicKey -}}
{{- $certAuthUser := default "" $certAuth.authUserPublicKey -}}
{{- $certAuthSystem := default "" $certAuth.systemUserPublicKey -}}
{{- if $certAuthEnabled -}}
{{- if ne (toString (default false $certAuth.infrastructureAdopted)) "true" -}}
  {{- fail "nats.certificateAuthorization.enabled requires infrastructureAdopted true after existing clients have explicit grants" -}}
{{- end -}}
{{- if not (regexMatch `^A[A-Z2-7]{55}$` $certAuthIssuer) -}}
  {{- fail "nats.certificateAuthorization.issuerPublicKey must be an account public nkey" -}}
{{- end -}}
{{- if not (regexMatch `^U[A-Z2-7]{55}$` $certAuthUser) -}}
  {{- fail "nats.certificateAuthorization.authUserPublicKey must be a user public nkey" -}}
{{- end -}}
{{- if not (regexMatch `^U[A-Z2-7]{55}$` $certAuthSystem) -}}
  {{- fail "nats.certificateAuthorization.systemUserPublicKey must be a user public nkey" -}}
{{- end -}}
{{- end -}}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-nats
spec:
  selector:
    app: serviceradar-nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: monitoring
    port: 8222
    targetPort: monitoring
  - name: cluster
    port: 6222
    targetPort: cluster
  {{- if $leafnodesEnabled }}
  - name: leafnodes
    port: {{ $leafnodesPort }}
    targetPort: leafnodes
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-nats-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: serviceradar-nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: monitoring
    port: 8222
    targetPort: monitoring
  - name: cluster
    port: 6222
    targetPort: cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: serviceradar-nats
spec:
  serviceName: serviceradar-nats-headless
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: serviceradar-nats
  template:
    metadata:
      labels:
        app: serviceradar-nats
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
    spec:
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-nats") | nindent 6 }}
      containers:
      - name: nats
        image: nats:{{ .Values.image.tags.nats | default "latest" }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          {{- if gt $replicas 1 }}
          ROUTES_BLOCK=""
          for i in $(seq 0 $((NATS_REPLICAS - 1))); do
            peer="serviceradar-nats-${i}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local"
            if [ "${peer}" != "${POD_NAME}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local" ]; then
              ROUTES_BLOCK="${ROUTES_BLOCK}        nats://${peer}:6222,\n"
            fi
          done
          {{- end }}

          cat >/tmp/nats-server.conf <<EOF
          server_name: ${POD_NAME}
          listen: 0.0.0.0:4222
          http: 0.0.0.0:8222

          jetstream {
            store_dir: /data/jetstream
            max_memory_store: {{ default "1G" $jetstream.maxMemoryStore }}
            max_file_store: {{ $jsBudget.maxFileStore }}
          }

          tls {
            cert_file: "/etc/serviceradar/certs/nats.pem"
            key_file: "/etc/serviceradar/certs/nats-key.pem"
            ca_file: "/etc/serviceradar/certs/root.pem"
            verify: true
            verify_and_map: true
          }
          {{- if $certAuthEnabled }}
          authorization: {auth_callout: {issuer: {{ $certAuthIssuer | quote }}, account: AUTH, auth_users: [{{ $certAuthUser | quote }}, {{ $certAuthSystem | quote }}]}}
          {{- end }}
          {{- if and $leafnodesEnabled $certAuthEnabled }}

          # Edge-site leaf servers. TLS terminates here (a Gateway API route,
          # when enabled, passes raw TCP). The presented certificate is an
          # ordinary PKIX certificate checked against the internal CA. NATS
          # 2.14 places a leaf with no authorization block in the global
          # account, so this listener exists only with the callout above.
          leafnodes {
            port: {{ $leafnodesPort }}
            tls {
              cert_file: "/etc/serviceradar/certs/nats.pem"
              key_file: "/etc/serviceradar/certs/nats-key.pem"
              ca_file: "/etc/serviceradar/certs/root.pem"
              verify: true
              timeout: 5
            }
          }
          {{- end }}

          {{- if gt $replicas 1 }}
          cluster {
            name: {{ $clusterName | quote }}
            listen: 0.0.0.0:6222
            advertise: ${POD_NAME}.serviceradar-nats-headless.${POD_NAMESPACE}.svc.cluster.local:6222
            tls {
              cert_file: "/etc/serviceradar/certs/nats.pem"
              key_file: "/etc/serviceradar/certs/nats-key.pem"
              ca_file: "/etc/serviceradar/certs/root.pem"
              verify: true
            }
            routes: [
          $(printf "%b" "${ROUTES_BLOCK}")      ]
          }

          {{- end }}
          accounts {
            {{- if $certAuthEnabled }}
            SYS: {
              users: [
                {nkey: {{ $certAuthSystem | quote }}, permissions: {publish: {allow: ["\$SYS.REQ.SERVER.*.CONNZ", "\$SYS.REQ.SERVER.*.KICK"]}, subscribe: {allow: ["_INBOX.>"]}}}
              ]
            }
            AUTH: {
              users: [
                {nkey: {{ $certAuthUser | quote }}, permissions: {subscribe: ["\$SYS.REQ.USER.AUTH"], publish: ["\$SYS._INBOX.>"]}}
              ]
            }
            {{- else }}
            SYS: {
              users: []
            }
            {{- end }}

            SERVICERADAR: {
              jetstream: enabled
              users: [
              {{- range $user := $staticUsers }}
              {
                user: {{ $user.user | quote }}
                permissions: {
                  {{- range $direction := list "publish" "subscribe" }}
                  {{- $block := index $user $direction }}
                  {{ $direction }}: {
                    allow: {{ include "serviceradar.natsSubjectArray" (default (list) $block.allow) }}
                    {{- if $block.deny }}
                    deny: {{ include "serviceradar.natsSubjectArray" $block.deny }}
                    {{- end }}
                  }
                  {{- end }}
                }
              }
              {{- end }}
              ]
            }
          }

          system_account: SYS
          debug: {{ $natsDebug }}
          trace: {{ $natsTrace }}
          EOF

          exec nats-server --config /tmp/nats-server.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NATS_REPLICAS
          value: {{ $replicas | quote }}
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitoring
        - containerPort: 6222
          name: cluster
        {{- if $leafnodesEnabled }}
        - containerPort: {{ $leafnodesPort }}
          name: leafnodes
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nats-data
          mountPath: /data
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        resources:
          limits:
            {{- with $natsResourceLimits.cpu }}
            cpu: {{ . | quote }}
            {{- end }}
            memory: {{ default "4Gi" $natsResourceLimits.memory | quote }}
          requests:
            cpu: {{ default "500m" $natsResourceRequests.cpu | quote }}
            memory: {{ default "1Gi" $natsResourceRequests.memory | quote }}
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "nats.pem" "nats-key.pem") | indent 12 }}
  volumeClaimTemplates:
  - metadata:
      name: nats-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ default "36Gi" $persistence.size }}
      {{- if $natsStorageClass }}
      storageClassName: {{ $natsStorageClass | quote }}
      {{- end }}
---
# The built-in identities rendered into the broker configuration above. Core's
# certificate authorization callout reads this list, so an adopted
# infrastructure certificate is granted exactly its static block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceradar-nats-static-users
data:
  static-users.yaml: |
{{ toYaml $staticUsers | indent 4 }}
{{- end }}
