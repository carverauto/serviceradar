{{- $reader := .Values.argocdImageUpdater.pullSecretReader | default dict -}}
{{- if $reader.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-pullsecret-reader
  labels:
    app.kubernetes.io/part-of: serviceradar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.image.registryPullSecret | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-pullsecret-reader
  labels:
    app.kubernetes.io/part-of: serviceradar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-image-updater-pullsecret-reader
subjects:
  - kind: ServiceAccount
    name: {{ $reader.serviceAccountName | quote }}
    namespace: {{ $reader.namespace | quote }}
{{- end }}
