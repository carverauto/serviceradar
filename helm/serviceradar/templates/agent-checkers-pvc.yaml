{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `agent.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate3 := default (dict) .Values.agent -}}
{{- if or (not (hasKey $gate3 "enabled")) $gate3.enabled }}
{{- $agentVals := default (dict) .Values.agent -}}
{{- $agentStorage := default (dict) (get $agentVals "checkersStorage") -}}
{{- $agentCacheStorage := default (dict) (get $agentVals "cacheStorage") -}}
{{- $agentRuntimeStorage := default (dict) (get $agentVals "runtimeStorage") -}}
{{- if and ($agentStorage.enabled) (not $agentStorage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-agent-checkers
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "2Gi" $agentStorage.size | quote }}
  {{- if $agentStorage.storageClassName }}
  storageClassName: {{ $agentStorage.storageClassName | quote }}
  {{- end }}
{{- end }}
{{- if and ($agentCacheStorage.enabled) (not $agentCacheStorage.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-agent-cache
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "1Gi" $agentCacheStorage.size | quote }}
  {{- if $agentCacheStorage.storageClassName }}
  storageClassName: {{ $agentCacheStorage.storageClassName | quote }}
  {{- end }}
{{- end }}
{{- if and ($agentRuntimeStorage.enabled) (not $agentRuntimeStorage.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-agent-runtime
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "5Gi" $agentRuntimeStorage.size | quote }}
  {{- if $agentRuntimeStorage.storageClassName }}
  storageClassName: {{ $agentRuntimeStorage.storageClassName | quote }}
  {{- end }}
{{- end }}
{{- end }}
