{{- /*
Least-privilege network posture for the analytics head
(OpenSpec add-analytics-store-drivers). Renders with the head Cluster.
S3 egress CIDRs are optional: NetworkPolicy cannot match FQDNs.
*/ -}}
{{- if eq (include "serviceradar.analyticsHeadEnabled" .) "true" }}
{{- $cold := default (dict) .Values.coldTier -}}
{{- $store := default (dict) .Values.analyticsStore -}}
{{- $pg := default (dict) $store.pgDuckdb -}}
{{- $s3 := default (dict) $pg.s3 -}}
{{- $clusterName := include "serviceradar.analyticsHeadClusterName" . -}}
{{- $networkPolicy := default (dict) .Values.networkPolicy -}}
{{- $ingress := default (dict) $networkPolicy.ingress -}}
{{- $cnpgOperator := default (dict) $ingress.cnpgOperator -}}
{{- $cnpgOperatorNamespace := default "cnpg-system" $cnpgOperator.namespace -}}
{{- $cnpgOperatorPort := default 8000 $cnpgOperator.port -}}
{{- $objectStore := default (dict) $cold.objectStore -}}
{{- $egressCidrs := default (default (list) $objectStore.egressCidrs) $s3.egressCidrs -}}
{{- $storageMode := default "s3" $pg.storage -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-cold-analytics-head" (include "serviceradar.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: cold-analytics-head
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $clusterName | quote }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $cnpgOperatorNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $cnpgOperatorPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if and (eq $storageMode "s3") $egressCidrs }}
    # One rule per CIDR so IPv4 and IPv6 are not mixed in a single `to`
    # list (some CNIs drop the whole rule when families are combined).
    {{- range $cidr := $egressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ default (default 443 $objectStore.port) $s3.port }}
    {{- end }}
    {{- end }}
{{- $calico := default (dict) $networkPolicy.calicoLogDenied -}}
{{- if and (eq $storageMode "s3") $egressCidrs (default false $calico.enabled) }}
---
# Calico ordered final-Deny (order 1000, selector all()) is stronger than
# Kubernetes additive allow. Insert this Allow immediately before that deny.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-cold-analytics-head-s3-calico" (include "serviceradar.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: cold-analytics-head
spec:
  order: {{ subf (default 1000 $calico.order) 1 }}
  selector: {{ printf "cnpg.io/cluster == '%s'" $clusterName | quote }}
  types:
    - Egress
  egress:
    {{- $cidrsV4 := list -}}
    {{- $cidrsV6 := list -}}
    {{- range $cidr := $egressCidrs -}}
      {{- if contains ":" $cidr -}}
        {{- $cidrsV6 = append $cidrsV6 $cidr -}}
      {{- else -}}
        {{- $cidrsV4 = append $cidrsV4 $cidr -}}
      {{- end -}}
    {{- end }}
    {{- $s3Port := int (default (default 443 $objectStore.port) $s3.port) }}
    {{- if gt (len $cidrsV4) 0 }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          {{- range $cidr := $cidrsV4 }}
          - {{ $cidr | quote }}
          {{- end }}
        ports:
          - {{ $s3Port }}
    {{- end }}
    {{- if gt (len $cidrsV6) 0 }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          {{- range $cidr := $cidrsV6 }}
          - {{ $cidr | quote }}
          {{- end }}
        ports:
          - {{ $s3Port }}
    {{- end }}
{{- end }}
{{- end }}
