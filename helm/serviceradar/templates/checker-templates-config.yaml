{{- if .Values.checkerTemplates.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceradar-checker-templates
data:
  # Note: sysmon is now embedded directly in the agent - no separate checker config needed
  snmp.json: |
    {
      "node_address": "{{`{{AGENT_ADDRESS}}`}}",
      "listen_addr": ":50054",
      "security": {
        "mode": "mtls",
        "role": "checker",
        "cert_dir": "/etc/serviceradar/certs",
        "trust_domain": "{{`{{TRUST_DOMAIN}}`}}"
      },
      "timeout": "30s",
      "logger": {
        "level": "{{`{{LOG_LEVEL}}`}}",
        "debug": false,
        "output": "stdout"
      },
      "targets": []
    }
  dusk.json: |
    {
      "name": "dusk",
      "type": "grpc",
      "node_address": "{{`{{AGENT_ADDRESS}}`}}",
      "listen_addr": ":50082",
      "timeout": "5m",
      "security": {
        "mode": "mtls",
        "role": "checker",
        "cert_dir": "/etc/serviceradar/certs",
        "trust_domain": "{{`{{TRUST_DOMAIN}}`}}"
      }
    }
{{- end }}
