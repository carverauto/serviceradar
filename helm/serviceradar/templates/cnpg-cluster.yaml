{{- $cnpg := default (dict) .Values.cnpg -}}
{{- $spire := default (dict) .Values.spire -}}
{{- $spirePg := default (dict) $spire.postgres -}}
{{- $spiffeCnpgManaged := and (default false $spire.enabled) (default false $spirePg.enabled) -}}
{{- if and (default true $cnpg.enabled) (not $spiffeCnpgManaged) }}
{{- $ns := .Release.Namespace -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $backup := default (dict) $cnpg.backup -}}
{{- $barman := default (dict) $backup.barmanObjectStore -}}
{{- $s3Credentials := default (dict) $barman.s3Credentials -}}
{{- $barmanWal := deepCopy (default (dict) $barman.wal) -}}
{{- if not $barmanWal.encryption -}}
{{- $_ := unset $barmanWal "encryption" -}}
{{- end -}}
{{- $barmanData := deepCopy (default (dict) $barman.data) -}}
{{- if not $barmanData.encryption -}}
{{- $_ := unset $barmanData "encryption" -}}
{{- end -}}
{{- $scheduledBackup := default (dict) $backup.scheduledBackup -}}
{{- $backupEnabled := false -}}
{{- if hasKey $backup "enabled" -}}
  {{- $backupEnabled = $backup.enabled -}}
{{- end -}}
{{- $scheduledBackupEnabled := true -}}
{{- if hasKey $scheduledBackup "enabled" -}}
  {{- $scheduledBackupEnabled = $scheduledBackup.enabled -}}
{{- end -}}
{{- $scheduledBackupImmediate := true -}}
{{- if hasKey $scheduledBackup "immediate" -}}
  {{- $scheduledBackupImmediate = $scheduledBackup.immediate -}}
{{- end -}}
{{- $scheduledBackupSuspend := false -}}
{{- if hasKey $scheduledBackup "suspend" -}}
  {{- $scheduledBackupSuspend = $scheduledBackup.suspend -}}
{{- end -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $cnpgStorageClass := default "" $cnpg.storageClass -}}
{{- if and (eq $cnpgStorageClass "") (not $allowInsecureStorage) -}}
  {{- $cnpgStorageClass = $encryptedStorageClass -}}
{{- end -}}
{{- if and (eq $cnpgStorageClass "") (not $allowInsecureStorage) -}}
  {{- fail "cnpg.storageClass or global.storage.encryptedStorageClassName is required unless global.storage.allowInsecureStorage=true" -}}
{{- end -}}
{{- $clusterName := include "serviceradar.cnpgClusterName" . -}}
{{- /* WAL safety cap: never leave max_slot_wal_keep_size unbounded (-1) — a stuck or
       lagging replication slot would otherwise retain WAL until the data volume fills
       and the primary crashes (the 2026-06-17 demo CNPG outage). Default to ~30% of the
       declared storage (min 10GB); override with cnpg.maxSlotWalKeepSize, or set it
       directly in cnpg.postgresqlParameters. PostgreSQL accepts GB/TB units here, not
       Kubernetes-style Gi/Ti resource units. */ -}}
{{- $walCap := default "" $cnpg.maxSlotWalKeepSize -}}
{{- if eq $walCap "" -}}
  {{- $storeNum := int (regexReplaceAll "[^0-9]" (default "100Gi" $cnpg.storageSize) "") -}}
  {{- $derived := div (mul $storeNum 30) 100 -}}
  {{- if lt $derived 10 -}}{{- $derived = 10 -}}{{- end -}}
  {{- $walCap = printf "%dGB" $derived -}}
{{- end -}}
{{- $appSecretName := default "serviceradar-db-credentials" $cnpg.credentialsSecret -}}
{{- $superSecretName := default "cnpg-superuser" $cnpg.superuserSecret -}}
{{- $existingAppCreds := (lookup "v1" "Secret" $ns $appSecretName) -}}
{{- $existingSuper := (lookup "v1" "Secret" $ns $superSecretName) -}}
{{- $appUser := default "serviceradar" $cnpg.username -}}
{{- $appPass := default "" $cnpg.password -}}
{{- if and $existingAppCreds $existingAppCreds.data.password }}
  {{- $appPass = (b64dec $existingAppCreds.data.password) }}
{{- end }}
{{- if eq $appPass "" }}
  {{- $appPass = randAlphaNum 32 }}
{{- end }}
{{- $superUser := default "postgres" $cnpg.superuserUsername -}}
{{- $superPass := default "" $cnpg.superuserPassword -}}
{{- if and $existingSuper $existingSuper.data.password }}
  {{- $superPass = (b64dec $existingSuper.data.password) }}
{{- end }}
{{- if eq $superPass "" }}
  {{- $superPass = randAlphaNum 32 }}
{{- end }}
{{- $defaultExtensionsSQL := list
      "CREATE EXTENSION IF NOT EXISTS timescaledb;"
      "CREATE EXTENSION IF NOT EXISTS age;"
      "CREATE EXTENSION IF NOT EXISTS postgis;"
      "CREATE EXTENSION IF NOT EXISTS vector;"
      (printf "GRANT USAGE ON SCHEMA ag_catalog TO \"%s\";" $appUser)
      (printf "GRANT ALL ON ALL TABLES IN SCHEMA ag_catalog TO \"%s\";" $appUser)
      (printf "GRANT ALL ON ALL SEQUENCES IN SCHEMA ag_catalog TO \"%s\";" $appUser)
      (printf "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA ag_catalog TO \"%s\";" $appUser)
  -}}
{{- $extensionsSQL := default $defaultExtensionsSQL $cnpg.extensionsSQL -}}
{{- $clientCASecret := default "" $cnpg.clientCASecret -}}
{{- if and (not $clientCASecret) $cnpg.requireClientCert }}
  {{- $clientCASecret = "serviceradar-cnpg-client-ca" }}
{{- end }}
{{- $cnpgAffinity := default (dict) $cnpg.affinity -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $superSecretName }}
  namespace: {{ $ns }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  username: {{ $superUser | quote }}
  password: {{ $superPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  namespace: {{ $ns }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  username: {{ $appUser | quote }}
  password: {{ $appPass | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  annotations:
    "helm.sh/resource-policy": "keep"
spec:
  imageName: {{ include "serviceradar.cnpgImageName" (dict "Values" .Values "cnpg" $cnpg) }}
  instances: {{ default 3 $cnpg.instances }}
  {{- with $cnpg.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cnpg.envFrom }}
  envFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.image.registryPullSecret }}
  imagePullSecrets:
    - name: {{ .Values.image.registryPullSecret | quote }}
  {{- end }}
  {{- if $cnpgAffinity }}
  affinity:
    {{- if hasKey $cnpgAffinity "enablePodAntiAffinity" }}
    enablePodAntiAffinity: {{ $cnpgAffinity.enablePodAntiAffinity }}
    {{- end }}
    {{- with $cnpgAffinity.topologyKey }}
    topologyKey: {{ . | quote }}
    {{- end }}
    {{- with $cnpgAffinity.podAntiAffinityType }}
    podAntiAffinityType: {{ . | quote }}
    {{- end }}
    {{- with $cnpgAffinity.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cnpgAffinity.nodeAffinity }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cnpgAffinity.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ default "100Gi" $cnpg.storageSize }}
    {{- if $cnpgStorageClass }}
    storageClass: {{ $cnpgStorageClass | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ default "serviceradar" $cnpg.database }}
      owner: {{ $appUser | quote }}
      secret:
        name: {{ $appSecretName | quote }}
      {{- with $extensionsSQL }}
      postInitApplicationSQL:
        {{- range $stmt := . }}
        - {{ $stmt | quote }}
        {{- end }}
      {{- end }}
  postgresql:
    parameters:
      {{- range $k, $v := (default dict $cnpg.postgresqlParameters) }}
      {{ $k | quote }}: {{ $v | quote }}
      {{- end }}
      {{- if not (hasKey (default dict $cnpg.postgresqlParameters) "max_slot_wal_keep_size") }}
      "max_slot_wal_keep_size": {{ $walCap | quote }}
      {{- end }}
    {{- with $cnpg.sharedPreloadLibraries }}
    shared_preload_libraries:
      {{- range $lib := . }}
      - {{ $lib | quote }}
      {{- end }}
    {{- end }}
    {{- if $cnpg.requireClientCert }}
    pg_hba:
      - "hostnossl all all all reject"
      - "hostssl all all all scram-sha-256 clientcert=verify-ca"
    {{- else }}
    pg_hba:
      - "hostnossl all all all reject"
      - "hostssl all all all scram-sha-256"
    {{- end }}
  {{- if $clientCASecret }}
  certificates:
    clientCASecret: {{ $clientCASecret | quote }}
  {{- end }}
  {{- if $backupEnabled }}
  backup:
    {{- with $backup.retentionPolicy }}
    retentionPolicy: {{ . | quote }}
    {{- end }}
    {{- with $backup.target }}
    target: {{ . | quote }}
    {{- end }}
    barmanObjectStore:
      destinationPath: {{ required "cnpg.backup.barmanObjectStore.destinationPath is required when cnpg.backup.enabled=true" $barman.destinationPath | quote }}
      {{- with $barman.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      {{- with $barman.serverName }}
      serverName: {{ . | quote }}
      {{- end }}
      {{- if and $barman.endpointCA $barman.endpointCA.name }}
      endpointCA:
        name: {{ $barman.endpointCA.name | quote }}
        key: {{ default "ca.crt" $barman.endpointCA.key | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ required "cnpg.backup.barmanObjectStore.s3Credentials.secretName is required when cnpg.backup.enabled=true" $s3Credentials.secretName | quote }}
          key: {{ default "ACCESS_KEY_ID" $s3Credentials.accessKeyIdKey | quote }}
        secretAccessKey:
          name: {{ required "cnpg.backup.barmanObjectStore.s3Credentials.secretName is required when cnpg.backup.enabled=true" $s3Credentials.secretName | quote }}
          key: {{ default "ACCESS_SECRET_KEY" $s3Credentials.secretAccessKeyKey | quote }}
        {{- with $s3Credentials.sessionTokenKey }}
        sessionToken:
          name: {{ required "cnpg.backup.barmanObjectStore.s3Credentials.secretName is required when cnpg.backup.enabled=true" $s3Credentials.secretName | quote }}
          key: {{ . | quote }}
        {{- end }}
      {{- with $barmanWal }}
      wal:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $barmanData }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  managed:
    roles:
      - name: {{ $appUser | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ $appSecretName | quote }}
  monitoring:
    enablePodMonitor: true
  enableSuperuserAccess: true
  failoverDelay: 0
{{- if and $backupEnabled $scheduledBackupEnabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ default (printf "%s-base-backup" $clusterName) $scheduledBackup.name }}
  namespace: {{ $ns }}
spec:
  schedule: {{ required "cnpg.backup.scheduledBackup.schedule is required when scheduled backup is enabled" $scheduledBackup.schedule | quote }}
  immediate: {{ $scheduledBackupImmediate }}
  suspend: {{ $scheduledBackupSuspend }}
  backupOwnerReference: {{ default "cluster" $scheduledBackup.backupOwnerReference | quote }}
  {{- with $scheduledBackup.method }}
  method: {{ . | quote }}
  {{- end }}
  cluster:
    name: {{ $clusterName | quote }}
{{- end }}
{{- end }}
