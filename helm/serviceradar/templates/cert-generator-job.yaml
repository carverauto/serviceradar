{{- if eq "true" (include "serviceradar.runtimeCertGeneratorOwned" .) }}
{{- $certJobImage := include "serviceradar.cnpgImageName" (dict "Values" .Values "Chart" .Chart "cnpg" .Values.cnpg) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceradar-runtime-cert-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: runtime-cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: serviceradar-runtime-cert-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: runtime-cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: serviceradar-runtime-cert-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: runtime-cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serviceradar-runtime-cert-generator
subjects:
- kind: ServiceAccount
  name: serviceradar-runtime-cert-generator
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: serviceradar-runtime-cert-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: runtime-cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: serviceradar-runtime-cert-generator
        app.kubernetes.io/part-of: serviceradar
        app.kubernetes.io/component: runtime-cert-generator
    spec:
      {{- include "serviceradar.podDnsConfig" . | nindent 6 }}
      serviceAccountName: serviceradar-runtime-cert-generator
      restartPolicy: Never
      {{- include "serviceradar.podSecurityContext" . | nindent 6 }}
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: runtime-cert-generator
        image: {{ $certJobImage | quote }}
        imagePullPolicy: IfNotPresent
        {{- include "serviceradar.nonRootContainerSecurityContext" . | nindent 8 }}
        env:
        - name: SECRET_NAME
          value: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
        - name: CERT_DIR
          value: "/tmp/certs"
        - name: DEFAULT_PARTITION_ID
          # B-5 partition_id coalesce chain — keep in sync with _nats_static_users.tpl
          value: {{ coalesce .Values.partitionId (default (dict) .Values.agent).partitionId "default" | quote }}
        - name: DEFAULT_AGENT_COMPONENT_ID
          value: {{ default "k8s-agent" (default (dict) .Values.agent).agentId | quote }}
        - name: RUNTIME_CERT_LAYOUT_VERSION
          value: {{ default "1" (default (dict) .Values.certs).runtimeLayoutVersion | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          # The NATS authorization callout signing set (three seeds and two
          # public broker fragments). It is provisioned here only when this job
          # owns the Secret the seeds belong in; otherwise the Secret's supplier
          # provides all five entries and this job leaves them alone. It never
          # decides whether the job regenerates certificates.
          signing_changed=0
          provision_signing() {
{{- if eq "true" (include "serviceradar.natsCalloutSigningGeneratorOwned" .) }}
            local status=0
            python3 - "${CERT_DIR}" <<'CALLOUT_SIGNING' || status=$?
{{ required "files/nats-callout-signing.py is required" (.Files.Get "files/nats-callout-signing.py") | indent 10 }}
          CALLOUT_SIGNING
            case "${status}" in
              0) ;;
              10) signing_changed=1 ;;
              *) exit 1 ;;
            esac
{{- else }}
            :
{{- end }}
          }

          upload_secret() {
            python3 <<'UPLOAD_SECRET'
          import base64
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          secret_name = os.environ["SECRET_NAME"]
          cert_dir = os.environ["CERT_DIR"]
          serviceaccount = "/var/run/secrets/kubernetes.io/serviceaccount"
          token = open(os.path.join(serviceaccount, "token"), encoding="utf-8").read().strip()
          namespace = open(os.path.join(serviceaccount, "namespace"), encoding="utf-8").read().strip()
          cafile = os.path.join(serviceaccount, "ca.crt")
          context = ssl.create_default_context(cafile=cafile)

          data = {}
          for root, _, files in os.walk(cert_dir):
            for entry in sorted(files):
              path = os.path.join(root, entry)
              key = os.path.basename(path)
              with open(path, "rb") as handle:
                data[key] = base64.b64encode(handle.read()).decode("ascii")

          payload = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
              "name": secret_name,
              "labels": {
                "app.kubernetes.io/part-of": "serviceradar",
                "app.kubernetes.io/component": "runtime-certs",
              },
            },
            "type": "Opaque",
            "data": data,
          }

          base_url = f"https://kubernetes.default.svc.cluster.local/api/v1/namespaces/{namespace}/secrets"
          secret_url = f"{base_url}/{secret_name}"
          headers = {"Authorization": f"Bearer {token}"}

          try:
            request = urllib.request.Request(secret_url, headers=headers, method="GET")
            urllib.request.urlopen(request, context=context).read()
            method = "PATCH"
            url = secret_url
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/merge-patch+json"
            action = "Reconciled"
          except urllib.error.HTTPError as exc:
            if exc.code != 404:
              raise
            method = "POST"
            url = base_url
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"
            action = "Created"

          request = urllib.request.Request(url, data=body, headers=headers, method=method)
          urllib.request.urlopen(request, context=context).read()
          print(f"{action} Secret {secret_name}")
          UPLOAD_SECRET
          }

          cat >/tmp/generate-certs.sh.b64 <<'EOF_SCRIPT_B64'
{{ tpl (.Files.Get "files/generate-certs.sh") . | b64enc | indent 12 }}
          EOF_SCRIPT_B64
          tr -d '[:space:]' </tmp/generate-certs.sh.b64 | base64 -d >/tmp/generate-certs.sh
          chmod +x /tmp/generate-certs.sh
          # Names each reissued certificate with the one it replaced, so core
          # records it on the adopted component before workloads roll onto it
          # (ServiceRadar.Edge.RuntimeCertificateRotation).
          cat >/tmp/runtime-cert-rotation.py.b64 <<'EOF_ROTATION_B64'
{{ .Files.Get "files/runtime-cert-rotation.py" | b64enc | indent 12 }}
          EOF_ROTATION_B64
          tr -d '[:space:]' </tmp/runtime-cert-rotation.py.b64 | base64 -d >/tmp/runtime-cert-rotation.py

          # Certificates that are being kept still follow the chart's names: one
          # that lacks a name it is now asked to carry (a leaf host name added
          # to the broker certificate, for example) is reissued alone, from the
          # same root CA, and named in the rotation record like any reissue.
          # Every other certificate keeps its fingerprint.
          names_changed=0
          reissue_for_names() {
            : > /tmp/runtime-cert-reissued
            python3 /tmp/runtime-cert-rotation.py snapshot "${CERT_DIR}" /tmp/runtime-cert-snapshot.json
            NAMES_ONLY=true REISSUED_LIST=/tmp/runtime-cert-reissued bash /tmp/generate-certs.sh
            if [ -s /tmp/runtime-cert-reissued ]; then
              python3 /tmp/runtime-cert-rotation.py manifest "${CERT_DIR}" /tmp/runtime-cert-snapshot.json
              names_changed=1
            fi
          }

          fetch_status=0
          python3 <<'PY' || fetch_status=$?
          import os
          import base64
          import json
          import ssl
          import sys
          import urllib.error
          import urllib.request

          secret_name = os.environ["SECRET_NAME"]
          cert_dir = os.environ["CERT_DIR"]
          serviceaccount = "/var/run/secrets/kubernetes.io/serviceaccount"
          token = open(os.path.join(serviceaccount, "token"), encoding="utf-8").read().strip()
          namespace = open(os.path.join(serviceaccount, "namespace"), encoding="utf-8").read().strip()
          cafile = os.path.join(serviceaccount, "ca.crt")
          context = ssl.create_default_context(cafile=cafile)
          secret_url = f"https://kubernetes.default.svc.cluster.local/api/v1/namespaces/{namespace}/secrets/{secret_name}"
          headers = {"Authorization": f"Bearer {token}"}

          try:
            request = urllib.request.Request(secret_url, headers=headers, method="GET")
            payload = json.loads(urllib.request.urlopen(request, context=context).read().decode("utf-8"))
            if (
              not isinstance(payload, dict)
              or payload.get("kind") != "Secret"
              or not isinstance(payload.get("metadata"), dict)
              or payload["metadata"].get("name") != secret_name
              or (payload.get("data") is not None and not isinstance(payload.get("data"), dict))
            ):
              raise ValueError("unexpected Secret response payload")
            os.makedirs(cert_dir, exist_ok=True)

            for name, encoded in (payload.get("data") or {}).items():
              path = os.path.join(cert_dir, name)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as handle:
                handle.write(base64.b64decode(encoded, validate=True))
          except urllib.error.HTTPError as exc:
            if exc.code == 404:
              sys.exit(44)
            print(f"Failed to fetch Secret {secret_name}: HTTP {exc.code} {exc.reason}", file=sys.stderr)
            sys.exit(1)
          except Exception as exc:
            print(f"Failed to fetch Secret {secret_name}: {exc}", file=sys.stderr)
            sys.exit(1)
          PY

          case "${fetch_status}" in
            0)
              provision_signing
              if python3 - "${CERT_DIR}" "${RUNTIME_CERT_LAYOUT_VERSION}" "$@" <<'CHECK_CERTS'
{{ required "files/check-runtime-certs.py is required" (.Files.Get "files/check-runtime-certs.py") | indent 10 }}
          CHECK_CERTS
              then
                # The certificates are kept. The Secret is written only when the
                # signing step added or repaired an entry, or a certificate was
                # reissued to carry a new name.
                reissue_for_names
                if [ "${signing_changed}" = "1" ] || [ "${names_changed}" = "1" ]; then
                  upload_secret
                fi
                exit 0
              fi
              ;;
            44)
              mkdir -p "${CERT_DIR}"
              provision_signing
              ;;
            *)
              echo "Failed to fetch Secret ${SECRET_NAME} (exit ${fetch_status}); aborting without generating or uploading." >&2
              exit 1
              ;;
          esac

          mkdir -p "${CERT_DIR}"
          python3 /tmp/runtime-cert-rotation.py snapshot "${CERT_DIR}" /tmp/runtime-cert-snapshot.json
          export FORCE_REGENERATE=true
          bash /tmp/generate-certs.sh
          printf '%s' "${RUNTIME_CERT_LAYOUT_VERSION}" > "${CERT_DIR}/runtime-cert-layout-version"
          python3 /tmp/runtime-cert-rotation.py manifest "${CERT_DIR}" /tmp/runtime-cert-snapshot.json

          upload_secret
        - runtime-cert-generator
        args:
        - root.pem
        - root-key.pem
        - tools-key.pem
        - falcosidekick-key.pem
        - trivy-sidecar-key.pem
        - k8s-inventory-key.pem
        - runtime-cert-layout-version
        - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-chain.pem"
        - "$(DEFAULT_AGENT_COMPONENT_ID)-$(DEFAULT_PARTITION_ID)-key.pem"
        {{- $baselineCerts := list "tools.pem" "falcosidekick.pem" "trivy-sidecar.pem" "k8s-inventory.pem" }}
        {{- /* The worker mounts its certificate and key from this Secret, so both are
             required while it is enabled, whether or not core projects the inventory. */}}
        {{- if eq (include "serviceradar.vantageEnabled" .) "true" }}
        {{- $baselineCerts = concat $baselineCerts (list "media-worker.pem" "media-worker-key.pem") }}
        {{- end }}
        {{- $projectedCerts := list }}
        {{- if eq "true" (include "serviceradar.coreProjectsFixedNatsInventory" .) }}
        {{- range (include "serviceradar.natsChartIdentities" . | fromYamlArray) }}
        {{- $projectedCerts = append $projectedCerts .file }}
        {{- end }}
        {{- end }}
        {{- range concat $projectedCerts $baselineCerts | uniq }}
        - {{ . | quote }}
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
