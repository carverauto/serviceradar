{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `webNg.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate0 := default (dict) .Values.webNg -}}
{{- if or (not (hasKey $gate0 "enabled")) $gate0.enabled }}
{{- $cnpg := default (dict) .Values.cnpg -}}
{{- $cnpgClusterName := include "serviceradar.cnpgClusterName" . -}}
{{- $cnpgPooler := default (dict) $cnpg.pooler -}}
{{- $cnpgPoolerRoute := default (dict) $cnpgPooler.route -}}
{{- $webNg := default (dict) .Values.webNg -}}
{{- $webNgDatabase := default (dict) $webNg.database -}}
{{- $webNgObanQueues := default (dict) $webNg.obanQueues -}}
{{- $webNgGodView := default (dict) $webNg.godView -}}
{{- $webNgFirstPartyImport := default (dict) $webNg.firstPartyPluginImport -}}
{{- $webNgNativeAddonImport := default (dict) $webNg.nativeAddonImport -}}
{{- $controlPlaneRuntime := default (dict) $webNg.controlPlaneRuntime -}}
{{- $controlPlaneRuntimeEnabled := default false $controlPlaneRuntime.enabled -}}
{{- $controlPlaneRuntimePort := default 4001 $controlPlaneRuntime.port -}}
{{- $controlPlaneRuntimeSecretName := default "serviceradar-control-plane-runtime-access" $controlPlaneRuntime.existingSecretName -}}
{{- $controlPlaneRuntimeSecretKey := default "token" $controlPlaneRuntime.tokenSecretKey -}}
{{- $runtimeGraphAutoRefresh := true -}}
{{- if hasKey $webNgGodView "runtimeGraphAutoRefresh" -}}
{{- $runtimeGraphAutoRefresh = get $webNgGodView "runtimeGraphAutoRefresh" -}}
{{- end -}}
{{- $webNgObanQueueDefault := 2 -}}
{{- if hasKey $webNgObanQueues "default" -}}{{- $webNgObanQueueDefault = get $webNgObanQueues "default" -}}{{- end -}}
{{- $webNgObanQueueAlerts := 1 -}}
{{- if hasKey $webNgObanQueues "alerts" -}}{{- $webNgObanQueueAlerts = get $webNgObanQueues "alerts" -}}{{- end -}}
{{- $webNgObanQueueServiceChecks := 1 -}}
{{- if hasKey $webNgObanQueues "serviceChecks" -}}{{- $webNgObanQueueServiceChecks = get $webNgObanQueues "serviceChecks" -}}{{- end -}}
{{- $webNgObanQueueNotifications := 1 -}}
{{- if hasKey $webNgObanQueues "notifications" -}}{{- $webNgObanQueueNotifications = get $webNgObanQueues "notifications" -}}{{- end -}}
{{- $webNgObanQueueOnboarding := 1 -}}
{{- if hasKey $webNgObanQueues "onboarding" -}}{{- $webNgObanQueueOnboarding = get $webNgObanQueues "onboarding" -}}{{- end -}}
{{- $webNgObanQueueEvents := 1 -}}
{{- if hasKey $webNgObanQueues "events" -}}{{- $webNgObanQueueEvents = get $webNgObanQueues "events" -}}{{- end -}}
{{- $webNgObanQueueSweeps := 1 -}}
{{- if hasKey $webNgObanQueues "sweeps" -}}{{- $webNgObanQueueSweeps = get $webNgObanQueues "sweeps" -}}{{- end -}}
{{- $webNgObanQueueEdge := 1 -}}
{{- if hasKey $webNgObanQueues "edge" -}}{{- $webNgObanQueueEdge = get $webNgObanQueues "edge" -}}{{- end -}}
{{- $webNgObanQueueIntegrations := 1 -}}
{{- if hasKey $webNgObanQueues "integrations" -}}{{- $webNgObanQueueIntegrations = get $webNgObanQueues "integrations" -}}{{- end -}}
{{- $webNgObanQueueMaintenance := 0 -}}
{{- if hasKey $webNgObanQueues "maintenance" -}}{{- $webNgObanQueueMaintenance = get $webNgObanQueues "maintenance" -}}{{- end -}}
{{- $webNgObanQueueWebMaintenance := 2 -}}
{{- if hasKey $webNgObanQueues "webMaintenance" -}}{{- $webNgObanQueueWebMaintenance = get $webNgObanQueues "webMaintenance" -}}{{- end -}}
{{- $webNgPublicUrl := include "serviceradar.webNgPublicUrl" . -}}
{{- $gatewayApi := default (dict) .Values.gatewayApi -}}
{{- $webHost := coalesce $webNg.host .Values.ingress.host $gatewayApi.host "serviceradar-web-ng" -}}
{{- if $webNgPublicUrl -}}
{{- $parsedPublicUrl := urlParse $webNgPublicUrl -}}
{{- $publicUrlHost := default "" (get $parsedPublicUrl "host") -}}
{{- $webHost = trimSuffix ":443" $publicUrlHost -}}
{{- end -}}
{{- $pluginStorage := default (dict) $webNg.pluginStorage -}}
{{- $gateway := default (dict) .Values.agentGateway -}}
{{- $gatewayService := default (dict) $gateway.service -}}
{{- $gatewayArtifactPublicUrl := "" -}}
{{- if $gateway.publicHostname -}}
{{- $gatewayArtifactPublicUrl = printf "https://%s:%v" $gateway.publicHostname (default 50053 $gatewayService.artifactPort) -}}
{{- end -}}
{{- $agentArtifactPublicUrl := default $webNgPublicUrl $gatewayArtifactPublicUrl -}}
{{- $pluginStorageBackend := lower (default "file" $pluginStorage.backend) -}}
{{- $pluginStorageFileBackend := and $pluginStorage.enabled (eq $pluginStorageBackend "file") -}}
{{- $objectStoreRetention := default (dict) .Values.objectStoreRetention -}}
{{- $objectStoreRetentionEnabled := true -}}
{{- if hasKey $objectStoreRetention "enabled" -}}{{- $objectStoreRetentionEnabled = get $objectStoreRetention "enabled" -}}{{- end -}}
{{- $objectStoreRetentionDryRun := false -}}
{{- if hasKey $objectStoreRetention "dryRun" -}}{{- $objectStoreRetentionDryRun = get $objectStoreRetention "dryRun" -}}{{- end -}}
{{- $agentReleasePublicKey := default "" $webNg.agentReleasePublicKey -}}
{{- $adminEmail := default "root@localhost" $webNg.adminEmail -}}
{{- $geoipMmdb := default (dict) .Values.geoipMmdb -}}
{{- $secrets := default "serviceradar-secrets" .Values.secrets.existingSecretName -}}
{{- $automationCallbacks := default (dict) .Values.automationCallbacks -}}
{{- include "serviceradar.validateAutomationCallbacks" . -}}
{{- $automationCallbacksEnabled := false -}}
{{- if hasKey $automationCallbacks "enabled" -}}{{- $automationCallbacksEnabled = get $automationCallbacks "enabled" -}}{{- end -}}
{{- $automationCallbackResponsePolicy := default (dict) $automationCallbacks.responsePolicy -}}
{{- $automationCallbackOrigin := default $webNgPublicUrl $automationCallbacks.canonicalOrigin -}}
{{- $remoteAccess := default (dict) .Values.remoteAccess -}}
{{- $remoteAccessDesktop := default (dict) $remoteAccess.desktop -}}
{{- $remoteAccessDesktopRdp := default (dict) $remoteAccessDesktop.rdp -}}
{{- $remoteAccessDesktopRdpEnabled := false -}}
{{- if hasKey $remoteAccessDesktopRdp "enabled" -}}{{- $remoteAccessDesktopRdpEnabled = get $remoteAccessDesktopRdp "enabled" -}}{{- end -}}
{{- $remoteAccessDesktopWebRTC := default (dict) $remoteAccessDesktopRdp.webRTC -}}
{{- $remoteAccessDesktopIceServers := default (list) $remoteAccessDesktopWebRTC.iceServers -}}
{{- $remoteAccessDesktopIceServersJSON := toJson $remoteAccessDesktopIceServers -}}
{{- $remoteAccessDesktopTurnConfigured := and $remoteAccessDesktopRdpEnabled (regexMatch "(?i)\"turns?:" $remoteAccessDesktopIceServersJSON) -}}
{{- $remoteAccessDesktopTurn := default (dict) $remoteAccessDesktopWebRTC.turn -}}
{{- include "serviceradar.validateRemoteAccessDesktopWebRTC" . -}}
{{- $remoteAccessSsh := default (dict) $remoteAccess.ssh -}}
{{- $remoteAccessSshEnabled := false -}}
{{- if hasKey $remoteAccessSsh "enabled" -}}{{- $remoteAccessSshEnabled = get $remoteAccessSsh "enabled" -}}{{- end -}}
{{- $remoteAccessSshBrowserKeyRemember := default (dict) $remoteAccessSsh.browserKeyRemember -}}
{{- $remoteAccessSshBrowserKeyRememberEnabled := false -}}
{{- if hasKey $remoteAccessSshBrowserKeyRemember "enabled" -}}{{- $remoteAccessSshBrowserKeyRememberEnabled = get $remoteAccessSshBrowserKeyRemember "enabled" -}}{{- end -}}
{{- $sshCertificatePolicy := default (dict) $remoteAccess.sshCertificatePolicy -}}
{{- include "serviceradar.validateRemoteAccessSSHCertificatePolicy" . -}}
{{- $sshCertificatePolicyEnabled := false -}}
{{- if hasKey $sshCertificatePolicy "enabled" -}}{{- $sshCertificatePolicyEnabled = get $sshCertificatePolicy "enabled" -}}{{- end -}}
{{- $sshCertificatePolicyWorkloads := default (dict) $sshCertificatePolicy.workloads -}}
{{- $sshCertificatePolicyWeb := true -}}
{{- if hasKey $sshCertificatePolicyWorkloads "web" -}}{{- $sshCertificatePolicyWeb = get $sshCertificatePolicyWorkloads "web" -}}{{- end -}}
{{- $sshCertificatePolicyWebEnabled := and $sshCertificatePolicyEnabled $sshCertificatePolicyWeb -}}
{{- $sshCaSigner := default (dict) $remoteAccess.sshCaSigner -}}
{{- include "serviceradar.validateRemoteAccessSSHCaSigner" . -}}
{{- $sshCaSignerEnabled := false -}}
{{- if hasKey $sshCaSigner "enabled" -}}{{- $sshCaSignerEnabled = get $sshCaSigner "enabled" -}}{{- end -}}
{{- $sshCaSignerWorkloads := default (dict) $sshCaSigner.workloads -}}
{{- $sshCaSignerWeb := true -}}
{{- if hasKey $sshCaSignerWorkloads "web" -}}{{- $sshCaSignerWeb = get $sshCaSignerWorkloads "web" -}}{{- end -}}
{{- $sshCaSignerWebEnabled := and $sshCaSignerEnabled $sshCaSignerWeb -}}
{{- $trustDomain := .Values.spire.trustDomain | default "carverauto.dev" -}}
{{- $spireBundle := default "spire-bundle" .Values.spire.bundleConfigMap -}}
{{- $datasvc := default (dict) $webNg.datasvc -}}
{{- $datasvcHost := default "serviceradar-datasvc" $datasvc.host -}}
{{- $datasvcPort := default 50057 $datasvc.port -}}
{{- $datasvcSecMode := default "mtls" $datasvc.secMode -}}
{{- $datasvcSecModeLower := lower $datasvcSecMode -}}
{{- $datasvcTLS := ternary "true" "false" (ne $datasvcSecModeLower "plaintext") -}}
{{- $datasvcCertDir := default "/etc/serviceradar/certs" $datasvc.certDir -}}
{{- $datasvcCertName := default "web" $datasvc.certName -}}
{{- $datasvcServerName := default "datasvc.serviceradar" $datasvc.serverName -}}
{{- $webNgSA := default "serviceradar-web-ng" .Values.spire.webNgServiceAccount -}}
{{- $coreVals := default (dict) .Values.core -}}
{{- $deviceEnrichment := default (dict) $coreVals.deviceEnrichment -}}
{{- $deviceEnrichmentRulesDir := default "/var/lib/serviceradar/rules/device-enrichment" $deviceEnrichment.rulesDir -}}
{{- $deviceEnrichmentFsOverrides := default (dict) $deviceEnrichment.filesystemOverrides -}}
{{- $deviceEnrichmentFsEnabled := default false $deviceEnrichmentFsOverrides.enabled -}}
{{- $deviceEnrichmentFsConfigMap := default "" $deviceEnrichmentFsOverrides.existingConfigMap -}}
{{- $deviceEnrichmentFsSecret := default "" $deviceEnrichmentFsOverrides.existingSecret -}}
{{- $deviceEnrichmentFsClaim := default "" $deviceEnrichmentFsOverrides.existingClaim -}}
{{- $migrationVals := default (dict) $coreVals.migrations -}}
{{- $migrationsEnabled := default true $migrationVals.enabled -}}
{{- $coreClusterNodeBasename := default "serviceradar_core" $coreVals.kubernetesNodeBasename -}}
{{- $gatewayVals := default (dict) .Values.agentGateway -}}
{{- $gatewayServiceName := "serviceradar-agent-gateway" -}}
{{- $gatewayServicePort := default 50052 $gatewayVals.service.port -}}
{{- $gatewayAddress := "" -}}
{{- if $webNg.gatewayAddress -}}
{{- $gatewayAddress = $webNg.gatewayAddress -}}
{{- else if $webHost -}}
{{- $gatewayAddress = printf "%s:%v" $webHost $gatewayServicePort -}}
{{- else -}}
{{- $gatewayAddress = printf "%s:%v" $gatewayServiceName $gatewayServicePort -}}
{{- end -}}
{{- $natsUrl := default "tls://serviceradar-nats:4222" $webNg.natsUrl -}}
{{- $coreAddress := default (include "serviceradar.coreAddress" .) $webNg.coreAddress -}}
{{- $gatewayClusterNodeBasename := default "serviceradar_agent_gateway" $gatewayVals.kubernetesNodeBasename -}}
{{- $webClusterNodeBasename := default "serviceradar_web_ng" $webNg.kubernetesNodeBasename -}}
{{- $webClusterStrategy := default "dns" $webNg.clusterStrategy -}}
{{- $webClusterDnsQuery := default (printf "serviceradar-web-ng-headless.%s.svc.cluster.local" .Release.Namespace) $webNg.clusterDnsQuery -}}
{{- $coreClusterDnsQuery := default (printf "serviceradar-core-elx-headless.%s.svc.cluster.local" .Release.Namespace) $webNg.clusterCoreDnsQuery -}}
{{- $gatewayClusterDnsQuery := default (printf "serviceradar-agent-gateway-headless.%s.svc.cluster.local" .Release.Namespace) $webNg.clusterGatewayDnsQuery -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $webNgSA }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceradar-web-ng
spec:
  replicas: {{ default 1 $webNg.replicas }}
  selector:
    matchLabels:
      app: serviceradar-web-ng
  template:
    metadata:
      labels:
        app: serviceradar-web-ng
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
        checksum/db-credentials: {{ include "serviceradar.dbCredentialsChecksum" . }}
        {{- if .Values.global.forceRolloutOnUpgrade }}
        serviceradar.io/release-revision: {{ .Release.Revision | quote }}
        {{- end }}
    spec:
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-web-ng") | nindent 6 }}
      serviceAccountName: {{ $webNgSA }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if or $pluginStorageFileBackend $migrationsEnabled }}
      initContainers:
      {{- if $pluginStorageFileBackend }}
      - name: init-plugin-storage
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          STORAGE_PATH={{ default "/var/lib/serviceradar/plugin-packages" $pluginStorage.basePath | quote }}
          mkdir -p "${STORAGE_PATH}/plugins"
        volumeMounts:
        - name: plugin-packages
          mountPath: {{ default "/var/lib/serviceradar/plugin-packages" $pluginStorage.basePath | quote }}
      {{- end }}
      {{- if $migrationsEnabled }}
      - name: wait-migrations
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-tools" "service" "tools") }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-c"]
        env:
        - name: MIGRATIONS_EXPECTED_VERSION
          value: {{ default "" $migrationVals.expectedVersion | quote }}
        - name: CNPG_HOST
          value: {{ include "serviceradar.cnpgDirectHost" . | quote }}
        - name: CNPG_PORT
          value: {{ default 5432 $cnpg.port | quote }}
        - name: CNPG_DATABASE
          value: {{ default "serviceradar" $cnpg.database | quote }}
        - name: CNPG_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ default "serviceradar-db-credentials" $cnpg.credentialsSecret | quote }}
              key: username
        - name: CNPG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default "serviceradar-db-credentials" $cnpg.credentialsSecret | quote }}
              key: password
        - name: CNPG_SSL_MODE
          value: {{ default "verify-full" $cnpg.sslmode | quote }}
        - name: CNPG_CA_FILE
          value: {{ default "/etc/serviceradar/cnpg/ca.crt" $cnpg.caFile | quote }}
        {{- if $cnpg.requireClientCert }}
        - name: CNPG_CERT_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client.pem" $cnpg.clientCertName) | quote }}
        - name: CNPG_KEY_FILE
          value: {{ printf "%s/%s" (default "/etc/serviceradar/certs" $cnpg.certDir) (default "cnpg-client-key.pem" $cnpg.clientKeyName) | quote }}
        {{- end }}
        args:
        - |
          set -eu
          export PGPASSWORD="${CNPG_PASSWORD}"
          export PGSSLMODE="${CNPG_SSL_MODE:-disable}"
          if [ -n "${CNPG_CA_FILE:-}" ]; then
            export PGSSLROOTCERT="${CNPG_CA_FILE}"
          fi
          if [ -n "${CNPG_CERT_FILE:-}" ] && [ -n "${CNPG_KEY_FILE:-}" ]; then
            export PGSSLCERT="${CNPG_CERT_FILE}"
            export PGSSLKEY="${CNPG_KEY_FILE}"
          fi
          # An existence check on platform.schema_migrations only proves the
          # table is there, not that it is CURRENT -- a schema left behind by a
          # skipped migration hook (helm upgrade --no-hooks) passes it happily
          # and web-ng then boots against tables its release expects but the
          # database does not have. Compare the applied high-water mark against
          # the newest migration this chart revision ships instead.
          EXPECTED="${MIGRATIONS_EXPECTED_VERSION:-}"
          if [ -n "${EXPECTED}" ]; then
            echo "Waiting for platform schema migrations (expecting >= ${EXPECTED})..."
            # Postgres does the comparison: version is a bigint and these are
            # 14-digit timestamps, which is not something to hand to `test -ge`
            # in whatever /bin/sh the tools image ships.
            PROBE="SELECT COALESCE(MAX(version), 0), (COALESCE(MAX(version), 0) >= ${EXPECTED}) FROM platform.schema_migrations"
          else
            echo "Waiting for platform schema migrations (version check disabled)..."
            PROBE="SELECT COALESCE(MAX(version), 0), TRUE FROM platform.schema_migrations"
          fi
          APPLIED=""
          for i in $(seq 1 120); do
            # Unset on a failed probe so a mid-loop outage cannot leave a stale
            # value in the timeout message below.
            RESULT=""
            RESULT=$(psql -h "${CNPG_HOST}" -U "${CNPG_USERNAME}" -d "${CNPG_DATABASE}" -tAc "${PROBE}" 2>/dev/null) || true
            case "${RESULT}" in
              *"|t")
                echo "Migrations current (applied=${RESULT%%|*}, expected=${EXPECTED:-any})."
                exit 0
                ;;
              *"|f")
                APPLIED="${RESULT%%|*}"
                echo "Schema is behind: applied=${APPLIED}, expected=${EXPECTED} ($i/120)"
                ;;
              *)
                echo "Waiting for migrations... ($i/120)"
                ;;
            esac
            sleep 2
          done
          if [ -n "${APPLIED}" ]; then
            echo "Timed out: schema is stale (applied=${APPLIED}, expected=${EXPECTED}). The" >&2
            echo "serviceradar-core-migrations Job did not run or did not finish -- a" >&2
            echo "'helm upgrade --no-hooks' skips it, since it is a pre-upgrade hook." >&2
          else
            echo "Timed out waiting for migrations: platform.schema_migrations unreadable." >&2
          fi
          exit 1
        volumeMounts:
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        - name: {{ $cnpgClusterName }}-ca
          mountPath: /etc/serviceradar/cnpg
          readOnly: true
      {{- end }}
      {{- end }}
      containers:
      - name: web-ng
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-web-ng" "service" "webNg") }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: 4000
          name: http
        {{- if $controlPlaneRuntimeEnabled }}
        # Pod-only machine endpoint. It is intentionally omitted from both
        # web-ng Services and every Gateway route.
        - containerPort: {{ $controlPlaneRuntimePort }}
          name: control-runtime
        {{- end }}
        - containerPort: 4369
          name: epmd
        - containerPort: 9100
          name: dist
        env:
        - name: PORT
          value: "4000"
        - name: TMPDIR
          value: "/tmp"
        - name: ELIXIR_ERL_OPTIONS
          value: "+fnu"
        - name: ERL_FLAGS
          value: "-kernel inet_dist_listen_min 9100 -kernel inet_dist_listen_max 9155"
        - name: PHX_SERVER
          value: "true"
        # The ServiceRadar RELEASE this deployment corresponds to -- not the
        # container image tag. web-ng uses it to fetch plugin and native add-on
        # assets from the matching GitHub release, and to show a version in the
        # product status UI (`deployed_release_version/0` strips the `v`).
        #
        # These were the same value until now, which only worked when deploying
        # by `v1.4.x` tags. The documented demo/production path pins
        # `global.imageTag=sha-<gitsha>` for immutability, and no release is ever
        # named `sha-...`, so NativeAddonSyncWorker and FirstPartySyncWorker both
        # discarded permanently with `Release tag sha-... was not found` and the
        # status UI displayed a 40-character sha as the version.
        #
        # Defaults to the chart's appVersion, which is what `scripts/cut-release.sh`
        # keeps in step with `VERSION` and the published `v<semver>` release.
        - name: SERVICERADAR_RELEASE_VERSION
          value: {{ .Values.global.releaseVersion | default (printf "v%s" .Chart.AppVersion) | quote }}
        - name: PHX_HOST
          value: {{ $webHost | quote }}
        {{- if $webNgPublicUrl }}
        # ActionLinks and Discord/Slack embeds use this as the origin for
        # /alerts/<id> deep links. Without it, pages go out with no way back
        # into ServiceRadar.
        - name: SERVICERADAR_NOTIFICATION_ACTION_BASE_URL
          value: {{ $webNgPublicUrl | quote }}
        {{- end }}
        - name: PHX_CHECK_ORIGIN
          value: {{ default "true" $webNg.checkOrigin | quote }}
        - name: SERVICERADAR_GOD_VIEW_ENABLED
          value: {{ default "true" $webNg.godViewEnabled | quote }}
        {{/* First-class flags. extraEnv cannot shadow SERVICERADAR_MCP_*. */}}
        - name: SERVICERADAR_MCP_ENABLED
          value: {{ default "false" $webNg.mcpEnabled | quote }}
        - name: SERVICERADAR_MCP_CLIENT_CREDENTIALS_ENABLED
          value: {{ default "true" $webNg.mcpClientCredentialsEnabled | quote }}
        - name: SERVICERADAR_MCP_REFRESH_TTL_SECONDS
          value: {{ default "28800" $webNg.mcpRefreshTtlSeconds | quote }}
        - name: SERVICERADAR_DEV_ROUTES
          value: {{ default "false" $webNg.devRoutes | quote }}
        {{- if not (hasKey (default (dict) $webNg.extraEnv) "SERVICERADAR_LOCAL_MAILER") }}
        - name: SERVICERADAR_LOCAL_MAILER
          value: {{ default "false" $webNg.localMailer | quote }}
        {{- end }}
        {{- if $controlPlaneRuntimeEnabled }}
        - name: SERVICERADAR_CONTROL_PLANE_RUNTIME_PORT
          value: {{ $controlPlaneRuntimePort | quote }}
        - name: SERVICERADAR_CONTROL_PLANE_RUNTIME_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ $controlPlaneRuntimeSecretName | quote }}
              key: {{ $controlPlaneRuntimeSecretKey | quote }}
        {{- end }}
        {{- if $agentReleasePublicKey }}
        - name: SERVICERADAR_AGENT_RELEASE_PUBLIC_KEY
          value: {{ $agentReleasePublicKey | quote }}
        {{- end }}
        - name: SERVICERADAR_ADMIN_EMAIL
          value: {{ $adminEmail | quote }}
        - name: SERVICERADAR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secrets | quote }}
              key: admin-password
        {{- if default false $webNg.adminPasswordForceSync }}
        - name: SERVICERADAR_ADMIN_PASSWORD_FORCE_SYNC
          # Treat the secret as authoritative — when the secret is rotated
          # while the database persists, the next bootstrap resets the stored
          # hash to match instead of silently locking the operator out.
          value: "true"
        {{- end }}
        {{- if (default (dict) $webNg.auth).forceLocalLogin }}
        - name: SERVICERADAR_AUTH_FORCE_LOCAL_LOGIN
          # Break-glass: permit local password login regardless of SSO
          # enforcement (server-side LoginPolicy). A valid password is still
          # required — this is the recover-from-broken-AuthSettings hatch, not a
          # bypass. Disable once normal SSO access is restored.
          value: "true"
        {{- end }}
        {{- if (default (dict) $webNg.auth).disableSso }}
        - name: SERVICERADAR_AUTH_DISABLE_SSO
          value: "true"
        {{- end }}
        - name: SERVICERADAR_GATEWAY_ADDR
          value: {{ $gatewayAddress | quote }}
        - name: NATS_URL
          value: {{ $natsUrl | quote }}
        {{- if or .Values.natsCreds.platform .Values.natsCreds.autoGenerate }}
        - name: NATS_ENABLED
          value: "true"
        - name: NATS_TLS
          value: "true"
        - name: NATS_SERVER_NAME
          value: {{ default "serviceradar-nats" $webNg.natsServerName | quote }}
