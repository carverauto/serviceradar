{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `datasvc.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate7 := default (dict) .Values.datasvc -}}
{{- if or (not (hasKey $gate7 "enabled")) $gate7.enabled }}
{{- $datasvcSA := .Values.spire.datasvcServiceAccount | default "serviceradar-datasvc" -}}
{{- $datasvc := default (dict) .Values.datasvc -}}
{{- $datasvcData := default (dict) (get $datasvc "data") -}}
{{- $datasvcDataEnabled := ne false (get $datasvcData "enabled") -}}
{{- $globalStorage := default (dict) .Values.global.storage -}}
{{- $encryptedStorageClass := default "encrypted" $globalStorage.encryptedStorageClassName -}}
{{- $allowInsecureStorage := default false $globalStorage.allowInsecureStorage -}}
{{- $datasvcStorageClass := default "" (get $datasvcData "storageClassName") -}}
{{- if and $datasvcDataEnabled (eq $datasvcStorageClass "") (not $allowInsecureStorage) -}}
  {{- $datasvcStorageClass = $encryptedStorageClass -}}
{{- end -}}
{{- if and $datasvcDataEnabled (eq $datasvcStorageClass "") (not $allowInsecureStorage) -}}
  {{- fail "datasvc.data.storageClassName or global.storage.encryptedStorageClassName is required unless global.storage.allowInsecureStorage=true" -}}
{{- end -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $datasvcSA }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceradar-datasvc
spec:
  replicas: {{ get $datasvc "replicaCount" | default 1 }}
  selector:
    matchLabels:
      app: serviceradar-datasvc
  template:
    metadata:
      labels:
        app: serviceradar-datasvc
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
      {{- if .Values.global.forceRolloutOnUpgrade }}
        serviceradar.io/release-revision: {{ .Release.Revision | quote }}
      {{- end }}
    spec:
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-datasvc") | nindent 6 }}
      serviceAccountName: {{ $datasvcSA }}
      {{- include "serviceradar.elixirReleasePodSecurityContext" . | nindent 6 }}
      containers:
      - name: datasvc
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-datasvc" "service" "datasvc") }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: 50057
          name: grpc
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: serviceradar-config
          mountPath: /etc/serviceradar
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        {{- if or .Values.natsCreds.platform .Values.natsCreds.system .Values.natsCreds.autoGenerate }}
        - name: nats-creds
          mountPath: /etc/serviceradar/creds
          readOnly: true
        {{- end }}
        - name: datasvc-data
          mountPath: /var/lib/serviceradar
        {{- if .Values.spire.enabled }}
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        {{- end }}
        env:
        - name: CONFIG_PATH
          value: "/etc/serviceradar/datasvc.json"
        - name: WAIT_FOR_NATS
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        # Partition identity for this deployment. MUST match the value
        # rendered into the NATS authorization block (templates/nats.yaml)
        # so runtime services share one deployment partition context.
        - name: SERVICERADAR_OTX_PARTITION
          value: {{ coalesce .Values.partitionId (default (dict) .Values.agent).partitionId "default" | quote }}
        {{- if .Values.spire.enabled }}
        - name: SPIFFE_ENDPOINT_SOCKET
          value: "unix:/run/spire/sockets/agent.sock"
        {{- end }}
        - name: NATS_OPERATOR_SEED
          valueFrom:
            secretKeyRef:
              name: serviceradar-nats-creds
              key: operator.seed
              optional: true
        - name: NATS_SYSTEM_ACCOUNT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: serviceradar-nats-creds
              key: system_account.pub
              optional: true
        - name: NATS_SYSTEM_ACCOUNT_CREDS_FILE
          value: "/etc/serviceradar/creds/system.creds"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: serviceradar-config
        configMap:
          name: serviceradar-config
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "kv.pem" "kv-key.pem") | indent 12 }}
      {{- if or .Values.natsCreds.platform .Values.natsCreds.system .Values.natsCreds.autoGenerate }}
      - name: nats-creds
        secret:
          secretName: serviceradar-nats-creds
          optional: true
      {{- end }}
      - name: datasvc-data
        {{- if $datasvcDataEnabled }}
        persistentVolumeClaim:
          claimName: serviceradar-datasvc-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.spire.enabled }}
      - name: spire-agent-socket
        hostPath:
          path: {{ include "serviceradar.spireSocketHostPath" . | quote }}
          type: DirectoryOrCreate
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-datasvc
spec:
  selector:
    app: serviceradar-datasvc
  ports:
  - name: grpc
    port: 50057
    targetPort: grpc
{{- if $datasvcDataEnabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-datasvc-data
spec:
  accessModes:
{{ toYaml (default (list "ReadWriteOnce") (get $datasvcData "accessModes")) | indent 4 }}
  resources:
    requests:
      storage: {{ get $datasvcData "size" | default "5Gi" | quote }}
  {{- if $datasvcStorageClass }}
  storageClassName: {{ $datasvcStorageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
