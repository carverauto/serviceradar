{{- $cnpg := default (dict) .Values.cnpg -}}
{{- $applicationAccess := default (dict) $cnpg.applicationAccess -}}
{{- $applicationAccessEnabled := true -}}
{{- if hasKey $applicationAccess "enabled" -}}
  {{- $applicationAccessEnabled = $applicationAccess.enabled -}}
{{- end -}}
{{- if and (default true $cnpg.enabled) $applicationAccessEnabled }}
{{- $clusterName := include "serviceradar.cnpgClusterName" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ default (printf "%s-cnpg-app-postgres" (include "serviceradar.fullname" .)) $applicationAccess.policyName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: serviceradar
    app.kubernetes.io/component: cnpg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $clusterName | quote }}
      cnpg.io/instanceRole: primary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
