{{- /* Component gate (issue #3859). ABSENT MEANS ENABLED: hasKey is used rather than a
     truthiness test so that a chart or values file which never mentions `enabled`
     renders exactly as before, and only an explicit `logCollector.enabled: false` removes
     this component. `default true` cannot be used here -- Helm treats false as empty,
     so it would resurrect anything explicitly disabled. */ -}}
{{- $gate13 := default (dict) .Values.logCollector -}}
{{- if or (not (hasKey $gate13 "enabled")) $gate13.enabled }}
{{- $logCollectorProbes := .Values.logCollector.probes | default dict -}}
{{- $logCollectorLiveness := $logCollectorProbes.liveness | default dict -}}
{{- $logCollectorReadiness := $logCollectorProbes.readiness | default dict -}}
{{- $logCollectorData := .Values.logCollector.data | default dict -}}
{{- $otlpAuth := default (dict) (default (dict) .Values.logCollector.otlp).auth -}}
{{- $otlpAuthKey := default "ingestion-key" $otlpAuth.secretKey -}}
{{- $logCollectorDataEnabled := true -}}
{{- if hasKey $logCollectorData "enabled" -}}
{{- $logCollectorDataEnabled = $logCollectorData.enabled -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceradar-log-collector-config
data:
  log-collector.toml: |
    [flowgger]
    enabled = true
    config_file = "/etc/serviceradar/flowgger.toml"

    [otel]
    enabled = true
    config_file = "/etc/serviceradar/otel.toml"

    [health]
    listen_addr = "0.0.0.0:50044"

  flowgger.toml: |
    [input]
    type = "udp"
    listen = "0.0.0.0:514"
    format = "auto"

    [output]
    type = "nats"
    format = "gelf"
    framing = "noop"
    partition = "default"
    nats_url = "tls://serviceradar-nats:4222"
    nats_subject = "logs.syslog"
    nats_stream = "events"
    nats_stream_replicas = {{ default 1 .Values.logCollector.streamReplicas }}
    nats_timeout = 30000
    nats_connect_attempts = 10
    nats_connect_initial_backoff_ms = 500
    nats_connect_max_backoff_ms = 30000
    nats_tls_ca_file = "/etc/serviceradar/certs/root.pem"
    nats_tls_cert = "/etc/serviceradar/certs/log-collector.pem"
    nats_tls_key = "/etc/serviceradar/certs/log-collector-key.pem"
    nats_tls_skip_verify = false
{{- if or .Values.natsCreds.platform .Values.natsCreds.autoGenerate }}
    nats_creds_file = "/etc/serviceradar/creds/platform.creds"
{{- end }}

    # gRPC health is handled by the log-collector unified health server.
    # Flowgger's built-in gRPC server is not needed here.

    [logging]
    level = "info"
    format = "json"

  otel.toml: |
    [server]
    bind_address = "0.0.0.0"
    port = 4317

{{- $otlpListenerHttp := default (dict) (default (dict) .Values.logCollector.otlp).http }}
{{- $otlpHttpTlsEnabled := true }}
{{- if hasKey $otlpListenerHttp "tlsEnabled" }}
{{- $otlpHttpTlsEnabled = $otlpListenerHttp.tlsEnabled }}
{{- end }}
    # OTLP/HTTP listener. tls_enabled=true (default) reuses the [grpc_tls]
    # server certificate; false serves plaintext HTTP for deployments where a
    # TLS-terminating gateway (logCollector.otlp.gateway) fronts the listener.
    [server.http]
    enabled = true
    bind_address = "0.0.0.0"
    port = 4318
    tls_enabled = {{ ternary "true" "false" $otlpHttpTlsEnabled }}
{{- if $otlpAuth.enabled }}

    # SigNoz-style ingestion-key auth (logCollector.otlp.auth): every export
    # on 4317/4318 must present the key from Secret
    # {{ required "logCollector.otlp.auth.secretName is required when logCollector.otlp.auth.enabled=true" $otlpAuth.secretName }}/{{ $otlpAuthKey }}
    # via 'x-serviceradar-ingestion-key: <key>' or 'authorization: Bearer
    # <key>'. The secret key name is the sender identity stamped on
    # published messages (Sr-Ingest-Identity).
    [auth]
    enabled = true

    [[auth.tokens]]
    identity = {{ $otlpAuthKey | quote }}
    token_file = "/etc/serviceradar/ingest-auth/{{ $otlpAuthKey }}"
{{- end }}

    [nats]
    url = "tls://serviceradar-nats:4222"
    subject = "otel"
    logs_subject = "logs.otel"
    stream = "events"
    timeout_secs = 30
    max_bytes = {{ printf "%d" (int64 (default 2147483648 .Values.logCollector.streamMaxBytes)) }}
    max_age_secs = 1800
    stream_replicas = {{ default 1 .Values.logCollector.streamReplicas }}
{{- if or .Values.natsCreds.platform .Values.natsCreds.autoGenerate }}
    creds_file = "/etc/serviceradar/creds/platform.creds"
{{- end }}

    [nats.tls]
    cert_file = "/etc/serviceradar/certs/log-collector.pem"
    key_file = "/etc/serviceradar/certs/log-collector-key.pem"
    ca_file = "/etc/serviceradar/certs/root.pem"

    [grpc_tls]
    cert_file = "/etc/serviceradar/certs/log-collector.pem"
    key_file = "/etc/serviceradar/certs/log-collector-key.pem"
{{- if and $logCollectorDataEnabled (not $logCollectorData.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serviceradar-log-collector-data
spec:
  accessModes:
{{ toYaml (default (list "ReadWriteOnce") $logCollectorData.accessModes) | indent 4 }}
  resources:
    requests:
      storage: {{ default "1Gi" $logCollectorData.size | quote }}
  {{- if $logCollectorData.storageClassName }}
  storageClassName: {{ $logCollectorData.storageClassName | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceradar-log-collector
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  replicas: {{ .Values.logCollector.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: serviceradar-log-collector
  template:
    metadata:
      labels:
        app: serviceradar-log-collector
        app.kubernetes.io/part-of: serviceradar
      annotations:
        {{- include "serviceradar.runtimeCertRollAnnotations" . | nindent 8 }}
      {{- if .Values.global.forceRolloutOnUpgrade }}
        serviceradar.io/release-revision: {{ .Release.Revision | quote }}
      {{- end }}
    spec:
      {{- include "serviceradar.topologySpread" (dict "root" . "app" "serviceradar-log-collector") | nindent 6 }}
      {{- include "serviceradar.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ .Values.spire.logCollectorServiceAccount | default "serviceradar-log-collector" }}
      {{- include "serviceradar.imagePullSecrets" . | nindent 6 }}
      initContainers:
      - name: wait-for-cert-files
        image: alpine:3.20
        {{- include "serviceradar.nonRootContainerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          for file in /etc/serviceradar/certs/log-collector.pem /etc/serviceradar/certs/log-collector-key.pem /etc/serviceradar/certs/root.pem; do
            i=0
            until [ -f "${file}" ]; do
              i=$((i+1))
              if [ "${i}" -ge 90 ]; then
                echo "Timed out waiting for ${file}" >&2
                exit 1
              fi
              sleep 2
            done
          done
        volumeMounts:
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
      {{- if or .Values.natsCreds.platform .Values.natsCreds.autoGenerate }}
      - name: wait-for-nats-creds
        image: alpine:3.20
        {{- include "serviceradar.nonRootContainerSecurityContext" . | nindent 8 }}
        command: ["/bin/sh", "-ec"]
        args:
        - |
          i=0
          until [ -f /etc/serviceradar/creds/platform.creds ]; do
            i=$((i+1))
            if [ "${i}" -ge 90 ]; then
              echo "Timed out waiting for /etc/serviceradar/creds/platform.creds" >&2
              exit 1
            fi
            sleep 2
          done
        volumeMounts:
        - name: nats-creds
          mountPath: /etc/serviceradar/creds
          readOnly: true
      {{- end }}
      containers:
      - name: log-collector
        image: {{ include "serviceradar.imageRef" (dict "Values" .Values "Chart" .Chart "name" "serviceradar-log-collector" "service" "logCollector") }}
        imagePullPolicy: {{ include "serviceradar.imagePullPolicy" . }}
        {{- include "serviceradar.bindServiceContainerSecurityContext" . | nindent 8 }}
        ports:
        - name: syslog
          containerPort: 514
          protocol: UDP
        - name: otel-grpc
          containerPort: 4317
          protocol: TCP
        - name: grpc
          containerPort: 50044
          protocol: TCP
        env:
{{ include "serviceradar.kvEnv" . | indent 8 }}
        - name: CONFIG_PATH
          value: "/etc/serviceradar/log-collector.toml"
        - name: RUST_LOG
          value: "info"
        {{- include "serviceradar.configSyncEnv" (dict "cfg" (default (dict) .Values.configSync.logCollector)) | nindent 8 }}
        livenessProbe:
          grpc:
            port: 50044
          initialDelaySeconds: {{ default 30 $logCollectorLiveness.initialDelaySeconds }}
          periodSeconds: {{ default 30 $logCollectorLiveness.periodSeconds }}
          timeoutSeconds: {{ default 5 $logCollectorLiveness.timeoutSeconds }}
          failureThreshold: {{ default 3 $logCollectorLiveness.failureThreshold }}
        readinessProbe:
          grpc:
            port: 50044
          initialDelaySeconds: {{ default 10 $logCollectorReadiness.initialDelaySeconds }}
          periodSeconds: {{ default 10 $logCollectorReadiness.periodSeconds }}
          timeoutSeconds: {{ default 5 $logCollectorReadiness.timeoutSeconds }}
          failureThreshold: {{ default 3 $logCollectorReadiness.failureThreshold }}
        resources:
          {{- toYaml .Values.logCollector.resources | nindent 10 }}
        volumeMounts:
        - name: log-collector-config
          mountPath: /etc/serviceradar
        - name: cert-data
          mountPath: /etc/serviceradar/certs
          readOnly: true
        {{- if or .Values.natsCreds.platform .Values.natsCreds.system .Values.natsCreds.autoGenerate }}
        - name: nats-creds
          mountPath: /etc/serviceradar/creds
          readOnly: true
        {{- end }}
        {{- if $otlpAuth.enabled }}
        - name: otlp-ingest-auth
          mountPath: /etc/serviceradar/ingest-auth
          readOnly: true
        {{- end }}
        - name: log-collector-data
          mountPath: /var/lib/serviceradar
        - name: logs
          mountPath: /var/log/serviceradar
        {{- if .Values.spire.enabled }}
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        {{- end }}
      volumes:
      - name: log-collector-config
        configMap:
          name: serviceradar-log-collector-config
      - name: cert-data
        secret:
          secretName: {{ include "serviceradar.runtimeCertsSecretName" . | quote }}
          items:
{{ include "serviceradar.runtimeCertItems" (list "root.pem" "log-collector.pem" "log-collector-key.pem") | indent 12 }}
      {{- if or .Values.natsCreds.platform .Values.natsCreds.system .Values.natsCreds.autoGenerate }}
      - name: nats-creds
        secret:
          secretName: serviceradar-nats-creds
      {{- end }}
      {{- if $otlpAuth.enabled }}
      - name: otlp-ingest-auth
        secret:
          secretName: {{ required "logCollector.otlp.auth.secretName is required when logCollector.otlp.auth.enabled=true" $otlpAuth.secretName | quote }}
          items:
            - key: {{ $otlpAuthKey | quote }}
              path: {{ $otlpAuthKey | quote }}
      {{- end }}
      - name: log-collector-data
        {{- if $logCollectorData.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ $logCollectorData.existingClaim | quote }}
        {{- else if $logCollectorDataEnabled }}
        persistentVolumeClaim:
          claimName: serviceradar-log-collector-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: logs
        emptyDir: {}
      {{- if .Values.spire.enabled }}
      - name: spire-agent-socket
        hostPath:
          path: {{ include "serviceradar.spireSocketHostPath" . | quote }}
          type: DirectoryOrCreate
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-log-collector
  labels:
    app.kubernetes.io/part-of: serviceradar
spec:
  selector:
    app: serviceradar-log-collector
  ports:
  - name: syslog
    port: 514
    targetPort: 514
    protocol: UDP
  - name: otel-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: grpc
    port: 50044
    targetPort: 50044
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spire.logCollectorServiceAccount | default "serviceradar-log-collector" }}
  labels:
    app.kubernetes.io/part-of: serviceradar
{{- if (default (dict) .Values.logCollector).externalService }}
{{- if .Values.logCollector.externalService.enabled }}
---
# External LoadBalancer service for syslog ingestion from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: serviceradar-log-collector-external
  labels:
    app.kubernetes.io/part-of: serviceradar
  {{- with .Values.logCollector.externalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.logCollector.externalService.type | default "LoadBalancer" }}
  {{- with .Values.logCollector.externalService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- if .Values.logCollector.externalService.loadBalancerIP }}
  loadBalancerIP: {{ .Values.logCollector.externalService.loadBalancerIP }}
  {{- end }}
  selector:
    app: serviceradar-log-collector
    app.kubernetes.io/part-of: serviceradar
  ports:
  {{- if (default (dict) .Values.logCollector.externalService.ports).syslog }}
  {{- if .Values.logCollector.externalService.ports.syslog.enabled }}
  - name: syslog
    port: {{ .Values.logCollector.externalService.ports.syslog.port | default 514 }}
    targetPort: {{ .Values.logCollector.externalService.ports.syslog.targetPort | default 514 }}
    protocol: {{ .Values.logCollector.externalService.ports.syslog.protocol | default "UDP" }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
