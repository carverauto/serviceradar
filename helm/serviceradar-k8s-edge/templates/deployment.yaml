{{- if or .Values.agent.enabled .Values.k8sInventory.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sr-edge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sr-edge.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sr-edge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: k8s-edge
  template:
    metadata:
      labels:
        {{- include "sr-edge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: k8s-edge
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/agent-config: {{ include (print $.Template.BasePath "/configmap-agent.yaml") . | sha256sum }}
        {{- with .Values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Inventory needs the inventory SA for kube API; agent uses agent SA.
           When both run in one pod, Kubernetes allows only one serviceAccountName.
           Prefer inventory SA when inventory is enabled (agent does not need kube RBAC).
           Agent mTLS identity comes from mounted enrollment Secret, not the SA. */}}
      serviceAccountName: {{ if .Values.k8sInventory.enabled }}{{ include "sr-edge.inventoryServiceAccountName" . }}{{ else }}{{ include "sr-edge.agentServiceAccountName" . }}{{ end }}
      automountServiceAccountToken: {{ .Values.k8sInventory.enabled }}
      {{- with .Values.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- if .Values.k8sInventory.enabled }}
        - name: k8s-inventory
          image: {{ include "sr-edge.image" (dict "Values" .Values "name" "serviceradar-k8s-inventory") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["run"]
          env:
            - name: CLUSTER_ID
              value: {{ include "sr-edge.clusterId" . | quote }}
            - name: PUBLISH_MODE
              value: {{ .Values.k8sInventory.publishMode | quote }}
            - name: K8S_INVENTORY_SPOOL_DIR
              value: {{ include "sr-edge.k8sInventorySpoolDir" . | quote }}
            - name: K8S_INVENTORY_METRICS_ADDR
              value: {{ .Values.k8sInventory.metrics.addr | quote }}
            - name: K8S_INVENTORY_RESYNC
              value: {{ .Values.k8sInventory.resync.period | quote }}
            - name: K8S_INVENTORY_DEBOUNCE
              value: {{ .Values.k8sInventory.resync.debounce | quote }}
            - name: K8S_INVENTORY_GATEWAY_API
              value: {{ .Values.k8sInventory.gatewayAPI.enabled | quote }}
            {{- if .Values.k8sInventory.namespaces }}
            - name: K8S_INVENTORY_NAMESPACES
              value: {{ join "," .Values.k8sInventory.namespaces | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.k8sInventory.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.k8sInventory.resources | nindent 12 }}
          volumeMounts:
            - name: k8s-inventory-spool
              mountPath: {{ include "sr-edge.k8sInventorySpoolDir" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- if .Values.agent.enabled }}
        - name: agent
          image: {{ include "sr-edge.image" (dict "Values" .Values "name" "serviceradar-agent") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Prefer seed entrypoint when present; image may expose agent binary directly.
          command: ["/usr/local/lib/serviceradar/agent/serviceradar-agent-seed"]
          args: ["-config", "/etc/serviceradar/agent.json"]
          env:
            - name: CONFIG_PATH
              value: "/etc/serviceradar/agent.json"
            - name: LOG_LEVEL
              value: "info"
            - name: K8S_INVENTORY_SPOOL_DIR
              value: {{ include "sr-edge.k8sInventorySpoolDir" . | quote }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: agent-config
              mountPath: /etc/serviceradar
            - name: agent-tls
              mountPath: /etc/serviceradar/certs
              readOnly: true
            - name: k8s-inventory-spool
              mountPath: {{ include "sr-edge.k8sInventorySpoolDir" . | quote }}
            - name: agent-tmp
              mountPath: /tmp
            - name: agent-checkers
              mountPath: /var/lib/serviceradar/checkers
            - name: agent-runtime
              mountPath: /var/lib/serviceradar/agent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      volumes:
        - name: k8s-inventory-spool
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.agent.enabled }}
        - name: agent-config
          configMap:
            name: {{ include "sr-edge.fullname" . }}-agent-config
        - name: agent-tls
          secret:
            secretName: {{ .Values.agent.existingTlsSecret | quote }}
        - name: agent-tmp
          emptyDir: {}
        - name: agent-checkers
          emptyDir: {}
        - name: agent-runtime
          emptyDir: {}
        {{- end }}
{{- end }}
