[package]
name = "srql-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Integration tests live in a dedicated root-level subtree: they wire heavy,
# cross-cutting dependencies (here, the CNPG Postgres OCI image with AGE +
# TimescaleDB) that must NOT leak into //rust/... unit-test targets. Keep the
# wiring here and nowhere else.

[lib]
# Test-only crate: an empty lib so cargo has a target to hang tests/ off.
path = "src/lib.rs"

[dev-dependencies]
srql = { path = "../../rust/srql" }
anyhow = "1.0.89"
axum = { version = "0.7.5", features = ["macros"] }
http = "1.1.0"
pretty_assertions = "1.4.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
serial_test = "3.2"
tokio = { version = "1.41.0", features = ["full"] }
tokio-postgres = "0.7.15"
tower = "0.5.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
