[package]
name = "srql-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Integration tests live in a dedicated root-level subtree: they wire heavy,
# cross-cutting dependencies (here, the CNPG Postgres OCI image with AGE +
# TimescaleDB) that must NOT leak into //rust/... unit-test targets. Keep the
# wiring here and nowhere else.

[lib]
# Test-only crate: an empty lib so cargo has a target to hang tests/ off.
path = "src/lib.rs"

[dev-dependencies]
# The fixture's typed coordinates: host, port, roles, TLS posture and the per-run
# database name, all from SERVICERADAR_ENV rather than parsed back out of a DSN.
serviceradar-integration-db = { path = "../../rust/integration-db" }
# Bazel's reference runfiles lookup; replaces a hand-rolled search that guessed repo names.
runfiles = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
http = { workspace = true }
pretty_assertions = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serial_test = { workspace = true }
srql = { path = "../../rust/srql" }
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
