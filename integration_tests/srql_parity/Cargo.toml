[package]
name = "srql-parity"
version = "0.1.0"
edition = "2024"
publish = false

# SRQL dialect parity harness (openspec change extend-starrocks-to-all-telemetry, tasks 1.4
# and 1.5). It lives beside //integration_tests/srql for the same reason that crate does: it
# wires database clients that must not leak into //rust/... -- here a MySQL-protocol client
# for StarRocks, which nothing that ships depends on.
#
# Everything is library code so `bazel build //...` compiles all of it. The database-free half
# (inventory model, dashboard coverage, synthetic row generator, result comparison) is unit
# tested in the normal `make test` tier; tests/parity.rs only calls `runner::run()` against live
# backends and is gated like every other shared-fixture test (see BUILD.bazel).

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
mysql_async = { workspace = true }
runfiles = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
srql = { path = "../../rust/srql" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
