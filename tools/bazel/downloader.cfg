# Bazel downloader URL rewrites. Wired in via --downloader_config in //.bazelrc.
#
# A URL matching ANY rewrite is replaced by that rule's output -- the original is NOT kept
# automatically. The identity line after each mirror is what preserves the origin as a
# fallback, and it is load-bearing. Measured, on an empty repository cache and a fresh
# output base:
#
#   mirror only          -> fetches from the mirror, integrity check passes
#   bogus mirror only    -> fails, and the error names the REWRITTEN url
#   bogus + identity     -> mirror 404s, falls through to the origin, succeeds
#
# musl: hermetic-llvm's extension declares exactly one URL (musl.libc.org), and that host
# times out from CI often enough to fail a run outright:
#
#     ERROR: no such package '@@llvm++musl+musl_libc//': java.io.IOException:
#     Error downloading [https://musl.libc.org/releases/musl-1.2.6.tar.gz]: Connect timed out
#
# It is declared inside a dependency's module extension, so no override in //MODULE.bazel can
# add a URL to it -- rewriting the download is the only lever we have. sources.buildroot.net
# serves the byte-identical tarball (sha256 d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a,
# matching the extension's own integrity attribute, which still checks whichever mirror
# answers). A musl bump that buildroot has not mirrored yet 404s and falls through.
rewrite musl\.libc\.org/releases/(.*) sources.buildroot.net/musl/$1
rewrite musl\.libc\.org/releases/(.*) musl.libc.org/releases/$1
