[workspace]
resolver = "2"
members = [
    "rust/kvutil",
    "rust/config-bootstrap",
    "rust/edge-onboarding",
    "rust/bmp-collector",
    "rust/flowgger",
    "rust/trapd",
    "rust/otel",
    "rust/log-collector",
    "rust/netprobe",
    "rust/workload-identity",
    "rust/powerdns",
    "rust/rperf-client",
    "third_party/rust_patches/reqsign-azure-storage-1.0.0",
    "third_party/rust_patches/reqsign-google-1.0.0",
    "third_party/rust_patches/rperf-0.1.25",
    "rust/flow-collector",
    "rust/srql",
    "integration_tests/srql",
    "rust/correlation-engine",
    "rust/metric-proto",
    "rust/fieldsurvey-sidekick",
    "rust/rdp-adapter",
    "rust/addon-sdk",
    "rust/otel-addon",
    "rust/metrics-delta-writer",
    "rust/anomaly-core",
    "rust/anomaly-addon",
    "rust/anomaly-disposition",
    "rust/causal-model",
    "rust/causal-ports",
    "rust/causal-config",
    "rust/causal-context",
    "rust/causal-ingest",
    "rust/causal-causaloids",
    "rust/causal-reasoning",
    "rust/causal-mitigation",
    "rust/causal-emit",
    "rust/causal-engine",
]

exclude = [
    "elixir/serviceradar_core_elx/deps/ex_sctp/native/ex_sctp",
    "rust/netprobe/ebpf",
]

[workspace.package]
edition = "2024"
rust-version = "1.93.0"


[workspace.dependencies]

async-trait = "0.1"
anyhow = "1.0"
clap = { version = "4",  default-features = false}

deep_causality_core = "0.11"
deep_causality_data_structures = "0.10.14"

env_logger = "0.11"
flate2 = "1"
thiserror = "2"
base64 = "0.22"
rcgen = "0.12"
sha2 = "0.11"
hex = "0.4"

hyper-util = "0.1"

prost = "0.13"

rustls = {version = "0.23" , default-features = false}
rustls-pemfile = "2"

serde = { version = "1", default-features = false}
serde_json = "1.0"

tokio  = "1"
tokio-stream = "0.1"
tonic-health = "0.12"
tokio-rustls = { version = "0.26", default-features = false }

tonic = { version = "0.12", default-features = false }
tonic-build = "0.12"
tonic-reflection = "0.12"

tempfile = "3.0"

tower = "0.5"

[patch.crates-io]
reqsign-azure-storage = { path = "third_party/rust_patches/reqsign-azure-storage-1.0.0" }
reqsign-google = { path = "third_party/rust_patches/reqsign-google-1.0.0" }
# TEMPORARY, remove once arancini-lib > 0.7.2 is published with this fix.
# Published arancini-lib takes bgpkit-parser with default features, whose "rustls"
# feature pulls oneio (bgpkit's remote-fetch layer) and with it reqwest, hyper-rustls,
# rust-s3, aws-creds and rust-ini -- 34 packages arancini never calls, since it only
# decodes in-memory BMP frames. Features unify across the graph, so this can only be
# fixed at the arancini declaration. Fork adds default-features = false.
# Upstream: https://github.com/carverauto/arancini
arancini-lib = { git = "https://github.com/marvin-hansen/arancini.git", branch = "main" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
panic = "abort"
