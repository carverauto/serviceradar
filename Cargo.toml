[workspace]
resolver = "2"
members = [
    "rust/kvutil",
    "rust/config-bootstrap",
    "rust/edge-onboarding",
    "rust/bmp-collector",
    "rust/flowgger",
    "rust/trapd",
    "rust/otel",
    "rust/log-collector",
    "rust/netprobe",
    "rust/workload-identity",
    "rust/powerdns",
    "rust/rperf-client",
    "third_party/rust_patches/reqsign-azure-storage-1.0.0",
    "third_party/rust_patches/reqsign-google-1.0.0",
    "third_party/rust_patches/rperf-0.1.25",
    "rust/flow-collector",
    "rust/srql",
    "rust/correlation-engine",
    "rust/metric-proto",
    "rust/fieldsurvey-sidekick",
    "rust/rdp-adapter",
    "rust/addon-sdk",
    "rust/otel-addon",
    "rust/metrics-delta-writer",
    "rust/anomaly-core",
    "rust/anomaly-addon",
    "rust/anomaly-disposition",
    "rust/causal-model",
    "rust/causal-ports",
    "rust/causal-config",
    "rust/causal-context",
    "rust/causal-ingest",
    "rust/causal-causaloids",
    "rust/causal-reasoning",
    "rust/causal-mitigation",
    "rust/causal-emit",
    "rust/causal-engine",
]

exclude = [
    "elixir/serviceradar_core_elx/deps/ex_sctp/native/ex_sctp",
    "rust/netprobe/ebpf",
]

[workspace.dependencies]
tonic = { version = "0.12", features = ["tls", "gzip", "zstd"] }
prost = "0.13"
tonic-build = "0.12"
tokio = { version = "1" }
tokio-stream = "0.1"
tonic-health = "0.12"
tonic-reflection = "0.12"

[patch.crates-io]
reqsign-azure-storage = { path = "third_party/rust_patches/reqsign-azure-storage-1.0.0" }
reqsign-google = { path = "third_party/rust_patches/reqsign-google-1.0.0" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
panic = "abort"
