[workspace]
resolver = "2"
members = [
    "rust/kvutil",
    "rust/config-bootstrap",
    "rust/edge-onboarding",
    "rust/bmp-collector",
    "rust/flowgger",
    "rust/trapd",
    "rust/otel",
    "rust/log-collector",
    "rust/netprobe",
    "rust/netprobe/ebpf",
    "rust/consumers/zen",
    "rust/rperf-client",
    "third_party/rust_patches/reqsign-azure-storage-1.0.0",
    "third_party/rust_patches/reqsign-google-1.0.0",
    "third_party/rust_patches/rperf-0.1.25",
    "rust/flow-collector",
    "rust/srql",
    "rust/causal-engine",
    "rust/fieldsurvey-sidekick",
    "rust/rdp-adapter",
    "rust/addon-sdk",
]
exclude = [
    "elixir/serviceradar_core_elx/deps/ex_sctp/native/ex_sctp",
]

[workspace.dependencies]
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
tokio = { version = "1" }
tokio-stream = "0.1"
tonic-health = "0.12"
tonic-reflection = "0.12"

[patch.crates-io]
reqsign-azure-storage = { path = "third_party/rust_patches/reqsign-azure-storage-1.0.0" }
reqsign-google = { path = "third_party/rust_patches/reqsign-google-1.0.0" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
panic = "abort"
