[package]
edition = "2021"
rust-version = "1.88"
name = "spiffe"
version = "0.16.0"
authors = ["Max Lambrecht <maxlambrecht@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core SPIFFE identity types and Workload API sources"
documentation = "https://docs.rs/spiffe"
readme = "README.md"
keywords = [
    "spiffe",
    "spire",
    "identity",
    "x509",
    "jwt",
]
categories = [
    "authentication",
    "network-programming",
]
license = "Apache-2.0"
repository = "https://github.com/maxlambrecht/rust-spiffe"

[package.metadata.docs.rs]
no-default-features = true
features = [
    "x509-source",
    "jwt-source",
    "jwt-verify-rust-crypto",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = []
jwt = [
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:base64ct",
    "dep:zeroize",
]
jwt-source = ["workload-api-jwt"]
jwt-verify-aws-lc-rs = [
    "jwt",
    "dep:jsonwebtoken",
    "jsonwebtoken/aws_lc_rs",
]
jwt-verify-rust-crypto = [
    "jwt",
    "dep:jsonwebtoken",
    "jsonwebtoken/rust_crypto",
]
logging = ["dep:log"]
tracing = [
    "dep:tracing",
    "logging",
]
transport = ["dep:url"]
transport-grpc = [
    "transport",
    "dep:tokio",
    "dep:tonic",
    "dep:tower",
    "dep:hyper-util",
]
workload-api = [
    "workload-api-x509",
    "workload-api-jwt",
]
workload-api-core = [
    "transport-grpc",
    "dep:futures",
    "dep:tokio",
    "dep:tokio-util",
    "dep:arc-swap",
    "dep:fastrand",
    "dep:tonic-prost",
    "dep:prost",
    "dep:prost-types",
]
workload-api-jwt = [
    "workload-api-core",
    "jwt",
]
workload-api-x509 = [
    "workload-api-core",
    "x509",
]
x509 = [
    "dep:x509-parser",
    "dep:pkcs8",
    "dep:zeroize",
]
x509-source = ["workload-api-x509"]

[lib]
name = "spiffe"
path = "src/lib.rs"

[[test]]
name = "jwt_source"
path = "tests/jwt_source.rs"

[[test]]
name = "workload_api_client"
path = "tests/workload_api_client.rs"

[[test]]
name = "x509_bundle"
path = "tests/x509_bundle.rs"

[[test]]
name = "x509_source"
path = "tests/x509_source.rs"

[[test]]
name = "x509_svid"
path = "tests/x509_svid.rs"

[dependencies.arc-swap]
version = "1"
optional = true

[dependencies.base64ct]
version = "1.8"
features = ["alloc"]
optional = true

[dependencies.fastrand]
version = "2"
optional = true

[dependencies.futures]
version = "0.3"
optional = true
default-features = false

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]
optional = true

[dependencies.jsonwebtoken]
version = "10"
optional = true
default-features = false

[dependencies.log]
version = "0.4"
optional = true

[dependencies.pkcs8]
version = "0.10"
optional = true

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.prost-types]
version = "0.14"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.time]
version = ">=0.3.47, <0.4"
optional = true

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "net",
    "time",
    "sync",
]
optional = true
default-features = false

[dependencies.tokio-util]
version = "0.7"
optional = true

[dependencies.tonic]
version = "0.14"
features = [
    "transport",
    "codegen",
]
optional = true
default-features = false

[dependencies.tonic-prost]
version = "0.14"
optional = true

[dependencies.tower]
version = "0.5"
features = ["util"]
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.url]
version = "2"
optional = true

[dependencies.x509-parser]
version = "0.18"
optional = true

[dependencies.zeroize]
version = "1"
features = ["zeroize_derive"]
optional = true

[dev-dependencies.base64ct]
version = "1"

[dev-dependencies.openssl]
version = "0.10"
features = ["vendored"]

[dev-dependencies.p256]
version = "0.13"
features = ["pkcs8"]

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
]

