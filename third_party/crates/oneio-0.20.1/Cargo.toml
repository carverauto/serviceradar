[package]
edition = "2021"
name = "oneio"
version = "0.20.1"
authors = ["Mingwei Zhang <mingwei@bgpkit.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "oneio"
description = """
OneIO is a Rust library that provides unified simple IO interface for
reading and writing to and from data files from different sources and compressions.
"""
documentation = "https://docs.rs/oneio"
readme = "README.md"
keywords = [
    "io",
    "util",
    "s3",
    "ftp",
]
license = "MIT"
repository = "https://github.com/bgpkit/oneio"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

[features]
any_gz = []
async = [
    "tokio",
    "tokio-util",
    "async-compression",
    "futures",
]
bz = ["bzip2"]
cli = [
    "clap",
    "tracing",
    "gz",
    "bz",
    "lz",
    "xz",
    "http",
    "s3",
    "digest",
]
default = [
    "gz",
    "bz",
    "https",
]
digest = [
    "ring",
    "hex",
]
ftp = [
    "https",
    "suppaftp",
]
gz = ["gz-zlib-rs"]
gz-miniz = [
    "any_gz",
    "flate2/miniz_oxide",
]
gz-zlib-cloudflare = [
    "any_gz",
    "flate2/cloudflare_zlib",
]
gz-zlib-ng = [
    "any_gz",
    "flate2/zlib-ng",
]
gz-zlib-rs = [
    "any_gz",
    "flate2/zlib-rs",
]
http = ["reqwest"]
https = [
    "http",
    "rustls",
]
json = [
    "serde",
    "serde_json",
]
lib-core = [
    "http",
    "ftp",
    "gz",
    "bz",
    "lz",
    "xz",
    "zstd",
    "json",
]
lz = ["lz4"]
native-tls = [
    "reqwest?/native-tls",
    "suppaftp?/native-tls",
    "rust-s3?/sync-native-tls",
]
rustls = [
    "dep:rustls_sys",
