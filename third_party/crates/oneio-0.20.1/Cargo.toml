    "suppaftp?/rustls",
    "rust-s3?/sync-rustls-tls",
]
s3 = ["rust-s3"]
xz = ["xz2"]
zstd = ["dep:zstd"]

[lib]
name = "oneio"
path = "src/lib.rs"

[[bin]]
name = "oneio"
path = "src/bin/oneio.rs"
required-features = ["cli"]

[[example]]
name = "async_read"
path = "examples/async_read.rs"
