[package]
edition = "2021"
name = "may"
version = "0.3.51"
authors = ["Xudong Huang <huangxu008@hotmail.com>"]
build = "build.rs"
exclude = [
    ".gitignore",
    ".travis.yml",
    "appveyor.yml",
    "benches/**/*",
    "docs/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust Stackful Coroutine Library"
homepage = "https://github.com/Xudong-Huang/may.git"
documentation = "https://docs.rs/may"
readme = "README.md"
keywords = [
    "coroutine",
    "async",
    "multi-thread",
]
categories = ["concurrency"]
license = "MIT/Apache-2.0"
repository = "https://github.com/Xudong-Huang/may.git"

[badges.appveyor]
repository = "Xudong-Huang/may"
service = "github"

[badges.travis-ci]
repository = "Xudong-Huang/may"

[features]
crossbeam_queue_steal = ["work_steal"]
default = [
    "io_cancel",
    "io_timeout",
    "work_steal",
]
io_cancel = []
io_timeout = []
rand_work_steal = [
    "work_steal",
    "dep:fastrand",
]
work_steal = []

[lib]
name = "may"
path = "src/lib.rs"

[[example]]
