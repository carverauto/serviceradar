[dev-dependencies.serde_derive]
version = "1.0"

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.tungstenite]
version = "0.26"

[build-dependencies.rustversion]
version = "1.0"

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(unix)".dependencies.nix]
version = "0.30"
