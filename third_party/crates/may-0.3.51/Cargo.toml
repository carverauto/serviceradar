path = "examples/general_io.rs"

[[example]]
name = "http"
path = "examples/http.rs"

[[example]]
name = "https"
path = "examples/https.rs"

[[example]]
name = "loop_select"
path = "examples/loop_select.rs"

[[example]]
name = "scoped"
path = "examples/scoped.rs"

[[example]]
name = "select"
path = "examples/select.rs"

[[example]]
