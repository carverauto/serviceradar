[package]
name = "causal_reasoner_nif"
version = "0.1.0"
edition = "2024"

[lib]
name = "causal_reasoner_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
# The detector core (Welford stats, sliding window, signal evaluation, and the
# DeepCausality flow) lives in the shared crate so the edge anomaly add-on
# computes identical verdicts. The `rustler` feature re-adds the NifMap derives
# on the boundary types. deep_causality_core / deep_causality_data_structures are
# now pulled in transitively through this crate.
serviceradar-anomaly-core = { path = "../../../../rust/anomaly-core", features = ["rustler"] }

[workspace]
